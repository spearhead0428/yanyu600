<script>
const INLINE_YANYU_QUESTIONS = [{"id":1,"chapter":1,"num":1,"source":"2023国考","type":"逻辑填空","stem":"竞争与创新总是________。平台反垄断最终要在抑制垄断与鼓励创新之间达到平衡。一方面，要加快健全市场准入制度、公平竞争审查机制，预防和________滥用行政权力限制竞争，充分________市场竞争机制的强大动能；另一方面，要引导和激励平台企业把更多精力用在创新上。唯有如此，平台经济方能为全社会注入持久的创新活力。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"如影随形   约束   调控","B":"互为表里   杜绝   挖掘","C":"相辅相成   打击   激发","D":"息息相关   制止   释放"},"answer":"D","page":5},{"id":2,"chapter":1,"num":2,"source":"2025 湖南三支","type":"逻辑填空","stem":"领导力本质上就是一种执行力，是运用自己的影响力将目标内化为组织内部每个成员自我实现、自觉达成目标的能力。因此，一个好的领导不仅应当是科学的决策者，更应当是一个能推动决策________加以落实的坚定执行者。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"原封不动","B":"不折不扣","C":"一如既往","D":"按部就班"},"answer":"B","page":5},{"id":3,"chapter":1,"num":3,"source":"2022事业联考","type":"逻辑填空","stem":"污水处理厂的建设必须________，充分结合地方的污水处理需求和成本消化能力。如果明知道后期运营负担重却还是“先建了再说”，这就是赤裸裸的形式主义和形象工程，不仅不能发挥应有的环保作用，反倒会加大地方负担和资源浪费。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"未雨绸缪","B":"精打细算","C":"循序渐进","D":"量力而行"},"answer":"D","page":5},{"id":4,"chapter":1,"num":4,"source":"2023山东","type":"逻辑填空","stem":"自“安史之乱”之后，盛极一时的唐王朝________。当时的衣冠贵胄目睹国运的________衰退，在政治上无法施展抱负，只能够在文化领域当中寻找实现的机会，许多文人为了逃避现实又像魏晋时期的“竹林七贤”一样，从酒、音乐、文学、宗教、哲学中寻求解脱，但与“竹林七贤”不同的是，他们可以用绘画来表达个人的情感和意念。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"轰然崩塌   日渐","B":"风光不再   逐步","C":"一蹶不振   日益","D":"大厦将倾   逐渐"},"answer":"C","page":5},{"id":5,"chapter":1,"num":5,"source":"2022国考","type":"逻辑填空","stem":"稳就业之“稳”，既要着眼于________存量，让大家把“饭碗”端稳，更要着眼于扩大增量，拓宽就业空间。一方面需要不断优化营商环境，让新增市场主体成为解决就业的________；另一方面还要充分利用新技术衍生的新业态，引导入们转变观念，实现更宽更广的就业。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"维持   星星之火","B":"夯实   不二法门","C":"强化   中流砥柱","D":"巩固   源头活水"},"answer":"D","page":6},{"id":6,"chapter":1,"num":6,"source":"2020事业联考","type":"逻辑填空","stem":"随着互联网的发明和应用，世界从工业化时代迈入信息化时代，由于科技创新方向的错误及创新政策的________，日本的主要创新单元，或在已有的领地上打转，或一次又一次爬错了科技树，从而使日本错过了互联网和移动互联网带来的新一轮巨变机遇，这才导致日本的经济奇迹________0","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"滞后   半途而废","B":"缺位   偃旗息鼓","C":"僵化   昙花一现","D":"保守   戛然而止"},"answer":"D","page":6},{"id":7,"chapter":1,"num":7,"source":"2024 黑龙江专项","type":"逻辑填空","stem":"梵高远离了传统审美的藩篱，以空阔的气势和才力俯瞰当代、脾睨千秋，从而一扫艺术界的平庸浅薄和乡愿惰性。他有着崭新的、________的、前所未有的艺术感觉，有着颤栗着的、流动着的、闪耀着的绚烂光彩。这种画风一旦________，美术史就必须重写，色彩学乃至美学就必须修正，这正是梵高撒向人间的、永恒的、不易解的谜。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"惊世骇俗   问世","B":"妙不可言   显现","C":"妙趣横生   改造","D":"不可名状   形成"},"answer":"A","page":6},{"id":8,"chapter":1,"num":8,"source":"2021安徽事业","type":"逻辑填空","stem":"芯片行业和其他行业一样，任何产品的推出，都要有应用与之对应。抛开应用，一切创新都是________。为此，有关部门还应逐步为芯片行业培植市场环境，而不是一味上马项目。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"纸上谈兵","B":"画饼充饥","C":"无稽之谈","D":"空中楼阁"},"answer":"A","page":6},{"id":9,"chapter":1,"num":9,"source":"2024山东","type":"逻辑填空","stem":"虽然“鸟生”有长有短，但生而为鸟，不外乎要经历出生、成长、成熟、衰老、死亡的过程。生存、运动、觅食、交流、玩要、求偶和育幼等行为贯穿于它们的生命历程。这些行为看似简单明白，背后却________着生命的玄机。鸟类的行为复杂而独特，呈现出极高的________，哪怕是我们身边最为普通的麻雀、乌鸦和喜鹊，也可能做出让你意想不到的行为。鸟类的世界就是这样纷繁和迷人。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"暗含   科学性","B":"蕴藏   异质性","C":"孕育   神秘性","D":"隐伏   特殊性"},"answer":"B","page":7},{"id":10,"chapter":1,"num":10,"source":"2020联考","type":"逻辑填空","stem":"饮食在中国文化传承中是较稳定的领域，国有盛衰，代有兴亡，用筷子吃饭数千年不变，与宴饮相关的某些礼仪程式也很少变化，盛行在西周的乡饮酒礼，上可溯至三代遗风，下传至清道光年间，其敬老、尊长、议政的古风________，连酒会程序——谋宾、迎宾、旅酬和送宾等礼仪也________0","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"如出一辙   毫无二致","B":"一脉相承   大同小异","C":"一脉相通   相差无几","D":"衣钵相传   半斤八两"},"answer":"B","page":7},{"id":11,"chapter":1,"num":11,"source":"2019 联考","type":"逻辑填空","stem":"生活水平节节攀升，带来精神文化需求________，旅游散心成为不少人的生活常态，________成为人们追求美好生活的生动注脚，文明旅游也日益成为共识，但文明不是喊出来的，而要体现在举手投足之中，折枝、攀爬、踩踏等行为屡禁不止，原因就是一些游客自以为________，忽视了对自身行为举止的约束。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"与日俱增   不负韶华   无足挂齿","B":"水涨船高   不负春光   无伤大雅","C":"水涨船高   不负光阴   无足轻重","D":"与日俱增   不负日月   无关紧要"},"answer":"B","page":7},{"id":12,"chapter":1,"num":12,"source":"2024山西纪委","type":"逻辑填空","stem":"“围炉煮茶”火热兴起在意料之外又在情理之中。很长一段时间内，喝茶似乎是中老年人的专利，而“围炉煮茶”的主力却是年轻人，这形成了某种________。人们不禁联想到前一段时间，在年轻人群体中流行的露营、骑行、飞盘等运动，正是因为这些运动________了城市人亲近大自然的诉求，而在冬季，“围炉煮茶”似乎能满足他们宅在家里暖洋洋过冬的心境。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"差异性   迎合","B":"冲突性   符合","C":"违和感   契合","D":"疏离感   贴合"},"answer":"C","page":7},{"id":13,"chapter":1,"num":13,"source":"2020 浙江事业","type":"逻辑填空","stem":"大多数时候，面对孩子的成长，我们只是旁观者。我们所能做的是抚养与教育、陪伴与关爱、扶持与鼓励，既不能放纵不管，也不能________，更不能________0对于成长中的孩子，我们只是助力者。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"大包大揽   听之任之","B":"越俎代疱   苗助长","C":"耳提面命   溺爱不明","D":"疾言厉色   娇生惯养"},"answer":"B","page":8},{"id":14,"chapter":1,"num":14,"source":"2022事业联考","type":"逻辑填空","stem":"虽然未来百年人类大概率也不会目睹到一颗直径超过140米的小行星撞向地球，但正如同第二只靴子终将落下，毁天灭地的小行星________在某一天大驾光临。如果在此之前，人类还没有因为环境污染、全球变暖、大流行疾病、能源短缺、自相残杀等等而灭绝的话，届时，但愿我们可以________地应对这颗来势汹汹的天外访客。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"兴许   泰然自若","B":"终将   心平气和","C":"或许   气定神闲","D":"必将   从容不迫"},"answer":"D","page":8},{"id":15,"chapter":1,"num":15,"source":"2024四川三支","type":"逻辑填空","stem":"谁不想要一个可完全承担家务的机器人呢？这也是人们对机器人技术发展的一大梦想。虽然机器人专家已经能够让机器人在实验室做一些像跑酷这样令人________的事情，但这都是在严格控制的环境中精心规划展开的。而在现实中由于房屋设计各有不同，房间布置、物品摆放更是________，真要让机器人在家中自主工作，多少还是让人不太放心。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"惊喜不已   天壤之别","B":"印象深刻   千差万别","C":"震撼人心   迥然不同","D":"感触颇深   云泥之别"},"answer":"B","page":8},{"id":16,"chapter":1,"num":16,"source":"2021事业联考","type":"逻辑填空","stem":"减轻义务教育阶段学生作业负担和校外培训负担，被称为“双减”。与以往的减负措施相比，“双减”的最大亮点在于务实，不再________强调校内减负，而是追求整体减负。而“双减”能否起到减负的________，也取决于能否将务实进行到底。","prompt":"填入横线处的词语最恰当的一项是：","options":{"A":"片面   实效","B":"一味   目的","C":"单纯   意图","D":"盲目   作用"},"answer":"A","page":8},{"id":17,"chapter":1,"num":17,"source":"2022事业联考","type":"逻辑填空","stem":"为什么会出现过度包装问题？无论是________的礼盒包装，还是包裹过于严实的快递物品，背后都绕不开商家趋利避害的心理。对于商家来说，面对生产、销售趋向________，市场竞争日益激烈，与其花费大量时间精力提升产品质量，不如在包装上下功夫来得“性价比高”。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"精美绝伦   大众化","B":"华而不实   同质化","C":"美轮美奂   标准化","D":"表里不一   个性化"},"answer":"B","page":9},{"id":18,"chapter":1,"num":18,"source":"2019 青海法检","type":"逻辑填空","stem":"她是大清重臣之后，生长在________之家，她的外祖父曾为挽救大清危局，弹精竭虑,________，虽未成功，但值得敬佩。","prompt":"依次填入画横线部分最恰当的词语是：","options":{"A":"花天酒地   苦心经营","B":"钟鸣鼎食   惨淡经营","C":"鼎鼎有名   费尽心机","D":"鲜衣美食   挖空心思"},"answer":"B","page":9},{"id":19,"chapter":1,"num":19,"source":"2020 国考","type":"逻辑填空","stem":"中国正处于经济结构转型升级和世界新一轮技术革命的交汇时期，创新驱动高质量发展渐成共识。没有管理创新、市场创新的商业创新模式________，有真实需求场景的教育、医疗健康、信息消费、消费升级等模式创新领域，将会进发出新的投资机会。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"举步维艰","B":"日薄西山","C":"难以为继","D":"岌岌可危"},"answer":"C","page":9},{"id":20,"chapter":1,"num":20,"source":"2019四川选调","type":"逻辑填空","stem":"在产品广告和自媒体营销号中，我们经常看到对“防癌食品”“抗癌保健品”的________。许多营销文案还能列出一篇篇的科学文献，动不动就说“某著名大学发现”“某权威医学期刊证实”等，显得“很有科学依据”的样子。其实，科学领域说的“致癌”和“防癌”，跟广大公众心中所想的“致癌”“防癌”________。","prompt":"依次填入画横线部分最恰当的词语是：","options":{"A":"鼓吹   相去甚远","B":"宣传   毫不相干","C":"炒作   南辕北辙","D":"正名   判若云泥"},"answer":"A","page":9},{"id":21,"chapter":1,"num":21,"source":"2019 河南选调","type":"中心理解","stem":"现在经常听到一种说法，智商不敌情商。一个人能走到哪里，取得什么成就，关键在于情商，这种“情商决定论”甚嚣尘上，令人生疑。在我们身边，无论是生活中，还是工作中，只要一个人的事情没做好，都会跟情商不高挂起钩来。事实上，我们都夸大了情商的作用，忽视了智商、实力、勤奋，以为只要玩转情商就能步步高升，其实不然。人在职场，情商固然重要，但决定性因素还是智商和才华，玩情商可以让你八面玲珑，但毕竟玩不出实际业绩，也玩不出科研成果来。一个人有真才实学，本领过硬，工作勤奋，那么情商其实就是锦上添花的事情了。","prompt":"这段文字，作者意在说明：","options":{"A":"在职场中，智商比情商更加重要","B":"情商只是锦上添花，智商方能决定成败","C":"“情商决定论”并不正确，情商的作用不应夸大","D":"成功靠的是真才实学，过硬本领，而不是玩转情商"},"answer":"C","page":10},{"id":22,"chapter":1,"num":22,"source":"2026 山东事业","type":"中心理解","stem":"兵棋推演是世界主要军队指挥训练的重要手段，可把思维层面上抽象的指挥决策对抗转化为具体直观的作战行动对抗，根据对抗双方的决心方案和交战规则，不断形成并提供动态的、连续的战场态势，使过去只能通过文字表述的战场场景具象化呈现在受训者面前，为指挥训练提供逼真战场环境，有效培养和锤炼各级指挥员谋略水平及战术素养。兵棋推演运用概率和随机的方法，模拟战争不确定性和偶然性，充分体现“战胜不复”的战争规律，使推演双方的对抗更加激烈真实，有助于受训者加深对战场上各种不确定性因素的认识。根据每个回合的战场态势，双方指挥人员在规定时间内临机处置突发情况，最大限度发挥指挥对抗张力，围绕侦察情报、指挥控制和后装保障等要素进行全面深入的指挥对抗训练，提高处置战场复杂情况的灵活性和应变能力。","prompt":"根据上文，兵棋推演主要用于：","options":{"A":"支撑指挥训练","B":"提高应变能力","C":"预测战场态势","D":"转化抽象决策"},"answer":"A","page":10},{"id":23,"chapter":1,"num":23,"source":"2025广东","type":"中心理解","stem":"只要代表人民的利益、为社会发展作出贡献的人都能成为戏曲作品的主要人物，如革命英雄、卓有贡献的科学家、劳动道德模范及普罗大众。就艺术创作而言，为了使戏曲人物形象更富有艺术典型性，即便是取自历史事实或当代现实中的人物，也必须进行艺术创造，而不能把人物的现实生活轨迹完全照搬到舞台上。毕竟戏曲艺术创作就是“美的发现和美的创造”，即把现实美转化为更具有吸引力的艺术美。","prompt":"上述文段主要说的是：","options":{"A":"戏曲作品创作要以实现艺术美为目的","B":"戏曲作品中的现实性和艺术性的平衡","C":"戏曲作品塑造主要人物应遵循的原则","D":"现实人物是戏曲作品创作的主要来源"},"answer":"C","page":10},{"id":24,"chapter":1,"num":24,"source":"2021福建事业","type":"中心理解","stem":"笑气能够很容易地穿过血脑屏障进入脑部，具有镇静和抗焦虑的作用，经肺部进入血液循环，随血液进入大脑，激活中间神经元的兴奋性。人体吸入笑气后，会引起“快乐激素”一一内啡肽的释放。肺内泡的内啡肽让笑气进入血液，输送到身体各部位，并进入大脑，让人不由自主地开怀大笑。一旦“快乐”的劲头过去，剧烈的头痛感会排山倒海而来，引来神智错乱。免费学习资料库加微信：Sasm19","prompt":"上述文字重在说明：","options":{"A":"笑气为什么会让人发笑","B":"笑气具有镇静和抗焦虑的作用","C":"笑气会引起头痛感和神经错乱","D":"笑气的主要功能是引起内啡肽的释放"},"answer":"A","page":11},{"id":25,"chapter":1,"num":25,"source":"2023山东","type":"细节判断","stem":"从不知真假的相关证据材料到必然为真的证据事实之间，存在着一种认知性推论的空间。在此空间里，认知者求真的欲望、动机、认知能力和法律规定等因素都在发挥着影响。法律上为事实认定设计了特定的程序结构，将事实认定分成若干审查判断阶段，每个阶段针对证据评价设置了不同规则，以确保证据材料具有可采性，就是为了保证这种认识论推论的准确性：通过审查和筛选排除伪证，从而确保作为定案根据之证据事实的真。","prompt":"下列哪一种说法无法从原文中得到支持？","options":{"A":"证据必须经过查证属实","B":"事实认定由评价规则决定","C":"证据需要认知性推论支撑","D":"主观因素会影响证据的真实性"},"answer":"B","page":11},{"id":26,"chapter":1,"num":26,"source":"2024福建事业","type":"细节判断","stem":"最新研究表明，烹饪排放物中所含的脂肪酸非常稳定，不易在大气中分解。这意味着，当它们遇到固体表面时，比如窗户玻璃，会随着时间推移逐渐形成一层自组织薄膜，并且只有在大气中其他化学物质的作用下才会非常缓慢地分解。在这个过程中，薄膜会变得粗糙，并从空气中吸收更多水分。此外，有毒的污染物会被包裹在这层坚固的外壳下，从而避免在大气中分解。研究人员说：“这些薄膜中的脂肪酸本身并不特别有害，但由于它们无法被分解，因此能够有效保护可能被困在下面的任何其他污染物。”","prompt":"根据这段文字，下列说法正确的是：","options":{"A":"固体脂肪酸有毒且藏污纳垢","B":"脏窗户可能隐藏有毒污染物","C":"脂肪酸会主动保护有毒物质","D":"烹饪排放物会形成有害薄膜"},"answer":"B","page":11},{"id":27,"chapter":1,"num":27,"source":"2025 联考","type":"细节判断","stem":"绝大部分孤独症儿童会有心理问题，如认知、情绪和行为问题。研究发现，大约 46%的孤独症儿童拥有平均值或平均值以上的智商，但也有研究显示，60%的孤独症儿童伴有不同水准的智力发育落后，孤独症儿童个体差异很大，小部分表现出“孤岛智慧”，在绘画、乐器、音乐、色彩、计算、机械记忆、方位辨别等方面有特别突出的表现，如果能加以合理引导与培养转化，将对其职业开发有积极意义。","prompt":"关于孤独症，这段文字未提及的是：","options":{"A":"患者的临床表现","B":"患者的个体差异","C":"患者的心理问题","D":"患者的智力发育"},"answer":"A","page":12},{"id":28,"chapter":1,"num":28,"source":"2023 贵州事业","type":"标题填入","stem":"教育数字化当以人的发展而非以技术为中心，应在教育教学中创设新的应用场景和教学场景，让技术在促进入的发展过程中发挥优势。教育教学与技术融合，构建了生态化的学习环境，让教师能够施展高效的教学方法，让学习者能够获得适宜的个性化学习服务和美好的发展体验。数字化技术丰富了智能教室、自适应学习、学情智能诊断、智慧课堂评价等场景应用，推动线上线下融合互动，帮助改善教学方法，增强教学过程的创造性、体验性和启发性。","prompt":"最适合做这段文字标题的是：","options":{"A":"数字化催化教育场景应用创新","B":"数字化展现教育体系变革愿景","C":"以数字化赋能教育高质量发展","D":"数字化助推教育资源优质共享"},"answer":"A","page":12},{"id":29,"chapter":1,"num":29,"source":"2023 联考","type":"标题填入","stem":"截至2021年，化石燃料的燃烧正式改变了北半球空气中碳同位素的组成，甚至足以抵消核武器试验发出的信号。而这可能会给有价值的碳年代测定技术带来问题。专家发现，从放射性碳年代测定法来看，现代物品看起来就像是20世纪早期的物品。专家表示，这种趋势“可能很快就会让人很难分辨一件东西是1000年前的还是现代的”。","prompt":"最适合做这段文字标题的是：","options":{"A":"化石燃料燃烧带来的影响","B":"放射性碳年代测定的原理","C":"如何分辨物品的年代属性","D":"碳年代测定技术可能不再准确"},"answer":"D","page":12},{"id":30,"chapter":1,"num":30,"source":"2024甘肃事业","type":"中心理解","stem":"当前，以智能化技术为核心的无人化作战正在急剧演化之中。然而，距离真正的无人化作战的成型与成熟，还面临巨大的技术障碍。这些技术的障碍不仅体现在无人作战平台的研制、无人作战平台的战术试验等环节，而且必将体现在演示验证和战场使用环节；不仅有技术本身的缺陷问题，还有无人作战平台适应战场环境时可能出现的稳定性和可靠性问题。任何把技术想得过于可靠或完美的构想都失之于思想浪漫，可能导致灾难性战场后果。","prompt":"根据上述文字，作者的观点是：","options":{"A":"无人化作战的核心技术尚未成熟","B":"成熟可靠的技术比新技术更重要","C":"切忌把无人化作战技术想得太可靠","D":"无人作战平台之间的协同还需磨合"},"answer":"C","page":13},{"id":31,"chapter":1,"num":31,"source":"2024深圳","type":"中心理解","stem":"这方面的逸事较多，有两则小典故至今读来仍有强烈的警示意义。一则是《宋人轶事汇编》记载：钱傲进宝犀带（注释：犀带，指饰有犀角的宝带），太祖曰：“朕有三条带，与此不同。”傲请宣示，上笑曰：“汴河一条，惠民河一条，五丈河一条。”大惭服。另一则是《南村辍耕录·缠足》记载：李后主嫔妃窄娘纤丽善舞，后主令窄娘以帛绕脚，素袜舞云中，回旋有凌云之态。“由是人皆效之，以纤弓为妙。以不为者为耻也”。这两则典故一正一反，给出了有力印证。","prompt":"对上文第一句中“这方面”理解最贴切的是：","options":{"A":"领导干部的生活作风具有“上行下效”的示范效应","B":"严惩腐败是管党治党、赢得民心的“徙木立信”之举","C":"“见善则迁，有过则改”可提高个人道德修养","D":"“水能载舟，亦能覆舟”是必须牢记的大道理"},"answer":"A","page":13},{"id":32,"chapter":1,"num":32,"source":"2022事业联考","type":"中心理解","stem":"服装，作为显著的社会符号和标志，具备划清性别的界限的功能，唐代盛行的女着男装打破了这一界限，这是历史各朝代都不曾有过的大规模易装，颠覆了社会基本的礼法规则。而服饰在性别上所刻画出的分界线，又绝不仅是两性在外观上的区别，它更意味着表象之下的价值与能力，以及在社会中承担的角色。这一时期女着男装盛行除了对外来文化的尝鲜，也有女子地位上升、针对女子的礼教束缚被逐渐打破的原因在。","prompt":"这段文字意在:","options":{"A":"剖析唐代盛行女着男装的意义","B":"强调服装作为社会符号的功能","C":"对比古代不同时期的服装特点","D":"揭示服装文化背后的礼法规则"},"answer":"A","page":13},{"id":33,"chapter":1,"num":33,"source":"2023联考","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①2016年，“二十四节气”被正式列入联合国教科文组织人类非物质文化遗产代表作名录\n②据专家介绍，早在春秋以前，人们已用土圭测日影的方法，测定了春分、秋分、夏至、冬至四大节气\n③《尚书·尧典》是有关测定春分、夏至、秋分、冬至时间的最早文献\n④《淮南子》中有关于二十四节气的完整记载\n⑤战国时期，二十四节气已经出现，只是个别名称位置不同\n⑥二十四节气主要形成于黄河流域，以观察该区域的天象、气温、降水和物候的时序变化为基准，作为农耕社会生产生活的时间指南，逐步为全国各地所采用，并为多民族所共享","prompt":"","options":{"A":"①⑥②⑤③④","B":"②③⑤④⑥①","C":"①③②④⑤⑥","D":"⑥②③⑤④①"},"answer":"D","page":14},{"id":34,"chapter":1,"num":34,"source":"2023事业联考","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①在文章中堂而皇之地大段“洗稿”，全无自己的思想和见解；声称原创，却与别人的文章观点、故事、逻辑全都雷同，只不过改了人名、调了语序\n②当下的自媒体平台上鱼龙混杂，乱象频出，许多所谓的“流量大号”早已没了规矩\n③其实早在网络媒体兴起之初，就有一大批人将别人的报道、评论或文学作品直接照搬过来\n④于是一部分无良媒体人想出移花接木的法子，将别人的原创调整语序，换几个近义词，草草一改，标上自己的“原创”，这就是俗称的“洗稿”\n⑤这些换汤不换药的表面功夫，实难“洗”掉抄袭的本质\n⑥如今，互联网平台版权保护措施初见成效，这种低级的全面抄袭已经难以过关","prompt":"","options":{"A":"①②⑤④③⑥","B":"②③⑥④①⑤","C":"①③④⑤②⑥","D":"②⑥③①④⑤"},"answer":"B","page":14},{"id":35,"chapter":1,"num":35,"source":"2026河南事业","type":"语句填空","stem":"近年来一个重要的趋势是，________。以专家为主体、面向大众开展的艺术导赏，以及形式各样的演后谈、映后谈，搭建起了普及和提升大众艺术素养的桥梁；社交平台上风生水起的艺术自媒体中，既有资深专家“下场”演示，也有“十级爱好者”倾情品评，多种视角、多种审美趣味沟通互鉴。这样的生态是文艺的幸事，从中也可看到文艺评论的更多可能。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"大众艺术素养的提升速度远超以往，成为文艺发展的核心动力","B":"文艺创作的受众群体不断扩大，创作与接受的边界日益模糊","C":"文艺评论的传播渠道逐渐从专业期刊转向多元化社交平台","D":"专家和大众之间有了越来越多的互动"},"answer":"D","page":14},{"id":36,"chapter":1,"num":36,"source":"2023重庆事业","type":"中心理解","stem":"一个多世纪以来，伴随着考古发掘和文物出土，出土文献成为学术研究的基本史料，渐有与传世文献分庭抗礼之势，成为另一重要研究方向，然而，面对数量巨大，不断增长的石刻资料，全面准确地掌握相关信息，查阅历代著录及相关研究成果，成为学界推进研究，公众提高认知的一大阻碍。因此，内容完整、使用便利、实时更新的石刻目录，成为文史领域研究者和爱好者的迫切需要，石刻资料数字化，使得这些需求的满足成为可能。","prompt":"这段文字意在强调：","options":{"A":"考古成果助力文史领域的学术研究","B":"石刻数据库是适应时代需求的成果","C":"出土文献对学术研究具有重要价值","D":"历代存留下来的石刻资源亟需整理"},"answer":"B","page":15},{"id":37,"chapter":1,"num":37,"source":"2024 四川事业","type":"中心理解","stem":"永定河上的卢沟桥修建于公元1189～1192年间，桥长265米，由11个半圆形的石拱组成，每个拱长度不一，自16米至21.6米。桥宽约8米，路面平坦，几乎与河面平行。每两个石拱之间有石砌桥墩，把11个石拱连成一个整体。由于各拱相连，所以这种桥也叫连拱石桥。","prompt":"最能准确复述这段文字主要意思的是：","options":{"A":"卢沟桥修建年代并不久远","B":"卢沟桥长度很长","C":"介绍了卢沟桥的桥体构造","D":"卢沟桥是各拱相连的连拱石桥"},"answer":"C","page":15},{"id":38,"chapter":1,"num":38,"source":"2025联考","type":"逻辑填空","stem":"从事实际活动的现实的人，是马克思主义的出发点。实现人的自由全面发展是马克思主义的最高价值追求。要坚持以人民为中心，坚持人民主体地位，将人民作为改革与发展的实践主体和核心动力，将实现、维护和发展最广大人民根本利益、________、促进入的自由全面发展作为改革与发展的根本目的和最高价值，激发人民的历史主动性和创造性，促进社会公正，增进民生福祉，不断实现人民对美好生活的向往，使人民群众有更多的获得感、幸福感、安全感。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"大力发展教育培训","B":"尊重人民各项权利","C":"完善各项法律法规","D":"推动人民参与治理"},"answer":"B","page":15},{"id":39,"chapter":1,"num":39,"source":"2024山东","type":"中心理解","stem":"自由的工作状态、个性价值的实现、潜在的巨大机遇··数字新职业备受年轻人喜爱。关键在于，如何让大学生满足数字新职业的就业要求，更好地在数字经济时代实现价值创造。不断拓展数字经济就业创业空间，打通结构性失衡这个关键堵点，这样既能解决高校毕业生就业难问题，更能为中国经济发展注入强大动力。","prompt":"这段文字最适合由哪一观点引出？","options":{"A":"人才是数字经济发展的核心驱动力","B":"数字新职业将成为我国稳就业的重要支撑","C":"加强高校毕业生数字化技能的培养尤为迫切","D":"数字新职业可以为大学生就业创业提供更多选择"},"answer":"D","page":16},{"id":40,"chapter":1,"num":40,"source":"2024河北事业","type":"接语选择","stem":"一幅花鸟作品，如果能够做到形神兼备，应该可以算是上品了。但宋代画家的追求不止于此，在他们的心中还有一个“理”字。苏轼在《净因院画记》中说：“余尝论画，以为人禽宫室器用，皆有常形。至于山石竹木，水波烟云，虽无常形而有常理·….常形之失，止于所失，而不能病其全，若常理之不当，则举废之矣。”文同更进一步说：“于形既不可失，而理更当知，生死、新老、烟云、风雨，必曲尽真态，合于天造，厌于人意，而形理两全，然后可言晓画。”苏轼和文同所强调的“理”到底是什么，对于“晓画”和创作如此重要？对此，普遍的解释认为，苏轼和文同所指的“理”，与宋代理学的兴起与盛行有关。该学说认为，万物的背后，必有一“理”。其中的“理”，接近于我们通常所理解的“道理”和“原理”，或者“客观规律”。","prompt":"作者接下来最可能介绍：","options":{"A":"后世画家对宋画风格、技艺和精神的传承","B":"在宋代花鸟画中，画理的具体体现","C":"宋代花鸟画相关绘画理论","D":"宋代花鸟画的艺术成就"},"answer":"B","page":16},{"id":41,"chapter":2,"num":1,"source":"2024河北事业","type":"逻辑填空","stem":"中华优秀传统文化日益成为年轻人追捧的风尚，“国潮”正在成为这代年轻人生活的一部分。《唐宫夜宴》《只此青绿》《洛神水赋》用创意古典舞________了时代的审美脉搏，把中华优秀传统文化的张力发挥得________0","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"契合   完美无缺","B":"切中   淋漓尽致","C":"触摸   异彩纷呈","D":"号准   尽善尽美"},"answer":"B","page":17},{"id":42,"chapter":2,"num":2,"source":"2020事业联考","type":"逻辑填空","stem":"国学教育要“随风潜入夜，润物细无声”，________，久久为功，才能有所感悟、有所收获。满足于“快充式”培训所得的________、一知半解，对于个人的国学水平提高作用不大。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"潜移默化   沧海一粟","B":"持之以恒   一鳞半爪","C":"按部就班   一孔之见","D":"日积月累   浮光掠影"},"answer":"B","page":17},{"id":43,"chapter":2,"num":3,"source":"2018四川三支","type":"逻辑填空","stem":"中国古代的四大发明火药、指南针、造纸术和印刷术，通过丝绸之路传播到了全世界。中国政府________古代经验，助推肩负“新四大发明”的中国企业进军海外。不过，要想席卷全球，它们不仅要像在中国国内一样具备________，还要符合世界各地的风俗习惯。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"总结   通用性","B":"借鉴   便利性","C":"发挥   实用性","D":"积累   趣味性"},"answer":"B","page":17},{"id":44,"chapter":2,"num":4,"source":"2022事业联考","type":"逻辑填空","stem":"诗歌是一门语言艺术，它的材料就是语言，而任何一种语言系统都有巨大的________，诗歌语言也不例外，诗人生活在特定的语言环境中，要表达任何审美意识，都不得不运用________的语言，即广义的“陈言”，因为从理论上讲，前人从未使用过的崭新语言是无法进行交流的。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"严密性   相沿成习","B":"稳定性   循规蹈矩","C":"严谨性   陈陈相因","D":"稳固性   约定俗成"},"answer":"D","page":17},{"id":45,"chapter":2,"num":5,"source":"2020国考","type":"逻辑填空","stem":"具有“边缘型状态”的人往往缺乏________的自我认知，没有相对明确的自我形象。有时候他们觉得自己充满力量，非常自信，似乎是全能的存在；有时候却又觉得自己好像虚弱无力，________，非常自卑。在“边缘型状态”的人身上，这种转变往往是突然而________的。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"全面   弱不禁风   深刻","B":"稳定   一无是处   剧烈","C":"清醒   无所作为   离奇","D":"完整   无足轻重   彻底"},"answer":"B","page":18},{"id":46,"chapter":2,"num":6,"source":"2020事业联考","type":"逻辑填空","stem":"在人类与病毒的斗争中，病毒本身也在发生变化，以确保自身的繁衍。科学家必须不断研发新的疫苗，________。由此，便不难理解，为何新的疫病或寄生物变体出现时，我们会“全民皆兵”了。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"未雨绸缪","B":"见招拆招","C":"亡羊补牢","D":"兵来将挡"},"answer":"B","page":18},{"id":47,"chapter":2,"num":7,"source":"2021国考","type":"逻辑填空","stem":"“人民城市人民建”。搭建民意“直通车”、公众“议事厅”，有事好商量，大家来出力，很多工作就能做到________。比如上海能在短短一年内迅速形成垃圾分类的新风尚，靠的就是人民群众的主动性、积极性与创造性。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"立竿见影","B":"事半功倍","C":"万无一失","D":"尽善尽美"},"answer":"B","page":18},{"id":48,"chapter":2,"num":8,"source":"2021广东","type":"逻辑填空","stem":"正是广大基层干部群众以无比巨大的热情投入改革，以只争朝夕的劲头________改革,以一往无前的勇气探路改革,才令改革开放的大潮澎湃不息,蔚为壮观,________出令世界惊叹的成就。","prompt":"依次填入横线处的词语最恰当的一项是：","options":{"A":"推动   创建","B":"参与   创造","C":"推进   构建","D":"参加   制造"},"answer":"B","page":18},{"id":49,"chapter":2,"num":9,"source":"2026事业联考","type":"逻辑填空","stem":"作为整个科学体系的________，基础研究的重要性不言而喻。基础研究难度大、花费高、周期长，离不开长期稳定的经费支持。党的十八大以来，我国对基础研究高度重视，财政投入持续增长。国家统计局数据显示，2024年，我国基础研究经费支出为 2497亿元，同比增长10.5%；占整体研发经费比重为6.91%，延续了逐年________的好势头。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"圭泉   递增","B":"标杆   突破","C":"根基   爆发","D":"源头   攀升"},"answer":"D","page":18},{"id":50,"chapter":2,"num":10,"source":"2019四川选调","type":"逻辑填空","stem":"互联网发展初期，传统媒体出于新闻传播和培育新渠道的目的________网络媒体进行转载，“拿来主义”成为各大平台的“潜规则”。但过去一年来，这个定律似乎正在被打破。网络媒体迎来内容创业的风潮，付费社区、音频问答、在线课程等知识付费产品表现抢眼，互联网内容付费________o","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"支持   蔚然成风","B":"允许   方兴未艾","C":"默许   悄然兴起","D":"同意   深入人心"},"answer":"C","page":19},{"id":51,"chapter":2,"num":11,"source":"2024 湖北选调","type":"逻辑填空","stem":"在古城中，一座座院落和古色古香的房屋散落在缓坡上，有主有次、错落有致,形成有层次有深度的建筑空间,呈现出一种陕北传统文化所追求的整体美和________美。米脂密洞古城的建筑设计巧妙而丰富，在这里，没有相同的街道，没有一样的巷子。每个巷子里有三五十个大门，每个大门的________不一样，大门里面的窑洞布局和构造也不一样。对一位摄影师来说，用照片来表现窑洞古城，仿佛在演奏一部音乐作品，影像的节奏感和________特别强烈。","prompt":"依次填入画横线部分正确的一项是：","options":{"A":"系统   格局   韵律感","B":"深邃   造型   律动感","C":"个体   样式   动态感","D":"差异   形态   节律感"},"answer":"B","page":19},{"id":52,"chapter":2,"num":12,"source":"2019 河北事业","type":"逻辑填空","stem":"历史学家的技艺，就在于用有限的史料________无限的历史，无论是“知其然”的场景复原，还是“知其所以然”的现象________，史料都是历史研究的源头。尤其是百年来陆续现世的出土文献，虽是________，却映射出整个中古世界的诸相。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"研究   描写   沧海一粟","B":"探究   解释   吉光片羽","C":"追溯   阐释   寥若晨星","D":"回望   描述   凤毛麟角"},"answer":"B","page":19},{"id":53,"chapter":2,"num":13,"source":"2020山东","type":"逻辑填空","stem":"新技术的商业价值是________的，往往是针对某种具体应用场景而言的。所以，技术的商业价值，需要以某种形式将其商业化之后，才能________地体现出来。而技术商业化的核心，是设计有效的商业模式。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"具体   厚积薄发","B":"潜在   淋漓尽致","C":"无形   顺理成章","D":"巨大   具体而微"},"answer":"B","page":19},{"id":54,"chapter":2,"num":14,"source":"2021事业联考","type":"逻辑填空","stem":"40多年来，不论从什么角度看，中国的发展都堪称奇迹。但每向前走一步都不________，都是不断突围的结果，因为在不同时期，都会遇到未曾遇到的________，不经由改革突围就会停滞、反复甚至倒退。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"平坦   课题","B":"顺利   障碍","C":"容易   麻烦","D":"轻松   阻力"},"answer":"D","page":20},{"id":55,"chapter":2,"num":15,"source":"2022联考","type":"逻辑填空","stem":"过去一百年，党向人民、向历史交出了一份优异的答卷。现在，党团结带领中国人民又踏上了实现第二个百年奋斗目标新的赶考之路。让我们更加紧密地团结在以习近平同志为核心的党中央周围，全面贯彻习近平新时代中国特色社会主义思想，坚定理想信念，牢记初心使命，力同心、攻坚克难、勇毅前行，以________的执着奋力实现既定目标，以________的清醒不懈推进中华民族伟大复兴！","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"任尔东西南北风   长风破浪会有时","B":"不破楼兰终不还   风物长宜放眼量","C":"粉身碎骨浑不怕   万里长征第一步","D":"咬定青山不放松   行百里者半九十"},"answer":"D","page":20},{"id":56,"chapter":2,"num":16,"source":"2025海南三支","type":"逻辑填空","stem":"明朝廷实施“移民就宽乡”重大政策，于贵州广置卫所，开展军屯，彼时的贵州逐渐变成了一个“大屯堡”。大量中原和两江地区将士及眷属、农民、商贾、工匠________至贵州，在漫长的岁月中生生不息、如缕不绝，与当地各民族________，形成了“活化石”般的屯堡文化。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"迁移   水乳交融","B":"定居   和睦相处","C":"迁徙   不分域","D":"移居   相得益彰"},"answer":"A","page":20},{"id":57,"chapter":2,"num":17,"source":"2022 国考","type":"逻辑填空","stem":"安装监控补光灯的目的在于更好地识别车辆信息，从而提高执法效率，存留违法车辆的有效证据。然而，交通执法的根本目的在于维护道路交通安全，如果执法手段本身对交通安全构成了隐患，甚至不幸导致事故，那么无疑是________0","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"本末倒置","B":"得不偿失","C":"背道而驰","D":"因小失大"},"answer":"A","page":20},{"id":58,"chapter":2,"num":18,"source":"2019 四川选调","type":"逻辑填空","stem":"20多年过去，原始创新，集成创新，引进消化吸收再创新，中国迅速缩短了同发达国家的信息化差距，成为拥有近8亿网民的网络大国。一大批颇具竞争力的网信企业________，一大批市场需求旺盛的新应用_________，引领着经济的转型升级，也倒逼着治理体系体制机制的改革创新。免费学习资料库加微信：Sasm19","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"如鱼得水   屡见不鲜","B":"异军突起   层出不穷","C":"崭露头角   比比皆是","D":"雨后春笋   数不胜数"},"answer":"B","page":21},{"id":59,"chapter":2,"num":19,"source":"2024深圳","type":"逻辑填空","stem":"每一位党员干部都应该有刀刃向内的勇气，正视自己的缺点和错误并加以改正，不________，不文过饰非。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"隐恶扬善","B":"掩耳盗铃","C":"沽名钓誉","D":"掩人耳目"},"answer":"B","page":21},{"id":60,"chapter":2,"num":20,"source":"2024重庆三支","type":"逻辑填空","stem":"把马克思主义世界观和方法论贯穿到新时代文化建设当中，提出对待中华优秀传统文化的基本立场、方针、态度和方法，把中国共产党人对中华优秀传统文化的认识提到新的高度。这就是要坚持________、辩证取舍、推陈出新,有辨别地加以对待,有________地予以继承，摒弃那些过时的、带有剥削阶级意识形态的消极思想，弘扬那些超越时空、具有普遍价值、对当代发展有推动作用的积极思想，努力以文化人、以文育人。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"以今律古   区别","B":"以史为鉴   选择","C":"古为今用   扬弃","D":"援古证今   取舍"},"answer":"C","page":21},{"id":61,"chapter":2,"num":21,"source":"2018联考","type":"中心理解","stem":"近年来，味精这种家庭必备的产品，不断地受到人们的“质疑”。不断地有人提出在烹饪过程中添加味精对人体有着很大的危害作用，如味精饮食过多会导致掉头发，视力减退，缺锌，甚至有人提出可能还会导致癌症或者其他内脏疾病。但据研究，味精可以增进入们的食欲，提高人体对其他各种食物的吸收能力，对人体有一定的滋补作用。","prompt":"这段文字意在表明：","options":{"A":"在烹饪过程中添加味精可能对人体有着很大的危害作用","B":"味精可能会导致癌症或者其他内脏疾病","C":"味精可以增进入们的食欲，对人体有一定的滋补作用","D":"味精是安全的，可以放心食用"},"answer":"C","page":21},{"id":62,"chapter":2,"num":22,"source":"2019联考","type":"中心理解","stem":"“刷脸”都可以办什么？在一些酒店，忘记携带身份证件的顾客，输入身份证号，刷脸识别成功后就可以办理入住；在大型会议展览，几秒钟即可完成刷脸并签到入场;在部分银行，使用自动取款机进行刷脸识别，无需带卡，按程序输入密码便可办理存取业务·.·．此外，通过人脸识别技术的推广，“刷脸政务”也正在各地广泛应用。\n这段文字重在说明","prompt":"","options":{"A":"“刷脸”技术具有无限广阔的应用前景","B":"“刷脸”技术是一项划时代的科技创新","C":"“刷脸”技术在服务领域得到广泛应用","D":"“刷脸”技术使政府公共服务更加便民"},"answer":"C","page":22},{"id":63,"chapter":2,"num":23,"source":"2018联考","type":"中心理解","stem":"基础科学的精神在于穷理。基础科学研究需要经过刻苦训练、需要有深度的看法，才会有新的结果、好的创意。因此，基础科学研究不经过旷日持久的付出，很难有成功的机会。有些人因而认为，与其如此辛苦，不如等别人做好基础科学研究后拿过来用。但持此观点的人忘记了一点：只有自己体悟出来的理论，才最了解其长短，才能掌握其中的精髓，应用起来才能得心应手。树立穷理的精神，也需要哲学的滋养。毕竟，科学家也是有血有肉的人，有哲学精神和素养的支撑，才能塑造科学家的气质和意志。","prompt":"这段文字意在说明：","options":{"A":"基础科学研究意义重大","B":"基础科学研究需要奉献精神","C":"基础科学的本质是穷理","D":"基础科学研究需要哲学滋养"},"answer":"D","page":22},{"id":64,"chapter":2,"num":24,"source":"2025 河南事业","type":"中心理解","stem":"萤火虫在其发光器的部位，存在着一种含磷的发光质与一种催化酵素。萤火虫在发光器上有一些气孔，由气孔引入空气后，发光质就会通过酵素的催化与氧进行氧化作用。萤火虫通过这样的作用来发出光芒。而这样发出来的光，由于大部分的能量都转为光能，只有少部分化为热能，所以称之为冷光。因为发光质与光能的转换相当有效率，所以萤火虫可以发光相当长的一段时间。萤火虫本身也可以控制进不进行这样的作用来控制发不发光。","prompt":"这段文字的核心观点是：","options":{"A":"萤火虫为什么会发光","B":"萤火虫本身可控制发不发光","C":"萤火虫发光是为了转换为热能","D":"发光器的构造使得萤火虫的发光更亮"},"answer":"A","page":22},{"id":65,"chapter":2,"num":25,"source":"2023 江苏","type":"细节判断","stem":"人工智能应该以与人类智能相同的方式工作，在逻辑上是没有道理的，这也是用形容词“人工”的一个原因。然而，这些由电子电路体现的数学结构，和神经科学家开发的大脑认知模型有一些相似之处。因此，在人工智能和认知科学之间出现了一个创造性的反馈回路，它们彼此借鉴对方的思路。有时候在某种程度上，我们的大脑和人造大脑似乎是利用相似的结构原理来工作的。然而，从构成的材料和信号处理过程的方式来看，它们的差别当然是非常大的。","prompt":"下列说法与文意不符的是：","options":{"A":"人工智能和人类大脑认知模式有类似之处","B":"人工智能与人类大脑利用相近的原理工作","C":"人工智能借鉴了认知科学的有关研究成果","D":"人工智能信号处理方式与人脑有很大差别"},"answer":"B","page":23},{"id":66,"chapter":2,"num":26,"source":"2022事业联考","type":"细节判断","stem":"就像地球上的地震仪一样，“洞察”号火星探测器通过研究火星核心和火星地慢之间的深边界反射的地震波，来测量火星地核的大小。有了足够多的深层传播信息，科学家们就能计算出火星核心至地慢边界的深度。从而计算出火星核心的大小。地震数据还表明，在火星地表以下 700-800公里的上地幅中，有一层增厚的物质，在这层物质中，地震能量传播较慢。","prompt":"根据文意，下列说法错误的一项是：","options":{"A":"火星的体积可以用地震波的特性来探测","B":"火星探测的方法和地球探测的方法并不相同","C":"火星也存在类似地球地震一样的地质活动现象","D":"火星地慢能减弱地震波能量的传播"},"answer":"B","page":23},{"id":67,"chapter":2,"num":27,"source":"2026联考","type":"细节判断","stem":"地球大气和海洋中的氧气，从几乎为零逐步增长至接近现代水平，是地球宜居环境形成和生命演化的重要基础。如何准确重建地质历史时期海洋与大气的氧气含量，是地球科学前沿课题之一。钼作为一种对氧化还原条件敏感的元素，其同位素组成被广泛用于追溯古海洋的氧化还原历史。然而，要准确解读这一“地球化学密码”，必须首先厘清现代海洋中钼的来源、去向及其同位素平衡机制。","prompt":"这段文字未提及：","options":{"A":"氧气增长对宜居环境形成的作用","B":"钼同位素在古海洋研究中的价值","C":"古海洋时期钼与其同位素的关系","D":"厘清现代海洋中钼来源的必要性"},"answer":"C","page":23},{"id":68,"chapter":2,"num":28,"source":"2025 福建事业","type":"标题填入","stem":"近年来育种芯片的研发成为种质资源创新的重要赛道。一堆种子摆在面前，哪种长出来的植株更高？哪种产量高？哪种不容易生病虫害？这些信息在育种芯片里都能找到答案。育种芯片是生物物种基因检测的重要工具，在畜禽和农作物遗传改良与育种研究中发挥着重要作用。通过育种芯片可了解种子的大部分特性，从而指导品种培育工作。目前，育种芯片在小麦和玉米等农作物中应用较为广泛，但在油菜上的相关研究和应用则较少，且主要依靠固相育种芯片来提供检测数据。某科研团队历时8年研发出首款油菜液相育种芯片，这项研究成果对开展油菜基因组设计育种、提高我国油菜生物育种水平具有重要意义。","prompt":"最适合做这段文字标题的是：","options":{"A":"首款油菜液相育种芯片问世","B":"育种芯片在品种培育中的应用","C":"育种芯片是种质资源的创新","D":"育种芯片对育种研究不可或缺"},"answer":"A","page":24},{"id":69,"chapter":2,"num":29,"source":"2019 浙江","type":"标题填入","stem":"研究人员发现，与现生树木相比，古老的枝蕨类植物的茎干结构和生长方式明显不同。现生常见树木中，起到支撑和运输作用的组织维管束往往呈一个单一的整体。它通过不断的次生生长，让树木茎干加粗，并产生年轮。而在泥盆纪的枝蕨类植物中，至少存在数十个互相独立、交织成网状的维管束系统。它们总体呈圆柱形，与其他疏导组织构成立体化的网格系统，在这套维管束构成的网格系统中，每个单一的维管束均可以加粗生长，产生生长轮，同时又通过彼此分裂、增生，不断扩大维管束系统，从而实现植物整体的加粗。","prompt":"最适合做这段文字标题的是：","options":{"A":"揭秘古老植物如何生长","B":"树木的漫长进化过程","C":"教你如何看年轮知树龄","D":"一眼识别枝蕨类植物"},"answer":"A","page":24},{"id":70,"chapter":2,"num":30,"source":"2017安徽三支","type":"中心理解","stem":"对垄断实行自由放任政策的论据是垄断企业规模大，可以进行更多的积累，可以组织大规模的技术创新，而且垄断企业也能具有高效率。其实，这些并不都是由垄断带来的，如果没有市场竞争的作用，垄断企业便不会积极地进行积累和技术创新。如果对垄断实行自由放任的政策，社会就会以效率损失和技术创新与积累的滞缓为代价。","prompt":"这段文字的主要观点是：","options":{"A":"垄断与竞争是市场经济的两个方面","B":"垄断不可能带来技术创新和高效率","C":"不能对垄断实行自由放任政策","D":"放任垄断会造成效率损失和技术创新与积累的滞缓"},"answer":"C","page":24},{"id":71,"chapter":2,"num":31,"source":"2024黑龙江专项","type":"中心理解","stem":"“形人而我无形”是中国古代军事家转化敌我兵力强弱办法的关键之一，意思是：用假象掩盖已方兵力的真实状态，不露任何痕迹。这种隐真示假的策略，如果运用巧妙，就会赢得“我专而敌分”的优势，即：己方部队在种种假象的掩盖下悄悄集中，变成一个“拳头”；敌方部队在种种假象诱骗下分散，变成10根“指头”，进而形成敌寡我众的有利态势。","prompt":"文段中“拳头”“指头”分别指:","options":{"A":"由优转劣   由劣转优","B":"沉重打击   各个击破","C":"实力增强   实力减弱","D":"兵力集中   兵力分散"},"answer":"D","page":25},{"id":72,"chapter":2,"num":32,"source":"2022事业联考","type":"中心理解","stem":"东数西算作为一项重要战略工程，对于经济社会发展会产生深刻影响，各级政府自然会高度重视。但是，在数字化领域，市场力量也是非常关键的。地方政府只有找准自身的角色定位，正确处理政府作用和市场驱动的关系，在政策指引下，更好地发挥市场在资源配置、应用创新、需求牵引中的关键作用，才能保障算力行业健康发展；同时，面对全社会各行业对算力的巨大需求，地方政府一定要保持冷静头脑，以满足算力应用需求为导向，推动东数西算事业沿着正确的方向不断前进，并在实践中创造新的辉煌。","prompt":"这段文字意在强调：","options":{"A":"东数西算工程是对经济社会发展产生深刻影响的战略工程","B":"东数西算工程需要政府作用与市场力量实现有机统一结合","C":"地方政府要适当利用政策指引市场更好地发挥其关键作用","D":"地方政府要以满足算力应用需求为导向推动数字化工程前进"},"answer":"B","page":25},{"id":73,"chapter":2,"num":33,"source":"2022联考","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①但它可以成为专家和工程师的强大工具\n②网络和数据安全的未来，无论是否基于区块链作为重要工具\n③区块链虽然不是修复所有互联网问题的灵丹妙药\n④传统风险不断，新的威胁一直出现\n⑤开发出变革性的安全应用，赋予互联网更丰富的价值和更美好的未来\n⑥都必须拥有整体安全理念","prompt":"","options":{"A":"④③①⑤②⑥","B":"③①⑤②⑥④","C":"③①⑤⑥②④","D":"④②⑥③①⑤"},"answer":"D","page":25},{"id":74,"chapter":2,"num":34,"source":"2023联考","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①由于亮度与光的强度成正比，因此行星看起来比恒星更亮\n②当我们仰望星空时，或许能分辨出哪一颗是恒星，哪一颗是行星——闪烁的是恒星，不闪烁的是行星\n③有趣的是，行星并不发光，而是反射恒星的光，但是从地球上看时，行星显得比恒星更亮\n④而我们看得到的行星距离地球相对较近，折射较少\n⑤这主要与行星和恒星到达地球的视距离有关，因为行星离地球较近，所以我们的眼晴感知行星的光的强度比离地球较远的恒星要高得多\n⑥这是因为绝大多数恒星离地球非常远，来自恒星的光经历多次折射，光速不断变化，因此产生了这种效果","prompt":"","options":{"A":"②⑥④③⑤①","B":"②④⑥③①⑤","C":"③⑤①②⑥④","D":"③①⑤②④⑥"},"answer":"A","page":26},{"id":75,"chapter":2,"num":35,"source":"2026广东","type":"逻辑填空","stem":"服务群众，用“家常话”将政策解释清楚只是第一步，更需要读懂群众“家常话”背后的喜怒哀乐。“家常话”里，有群众的关切点，也有推动政策落地的发力点，在这里，“社会救助”不是抽象名词，而是张大爷的医药费有着落；“产业振兴”不只是报告里的概念，而是李大姐柑橘园里的累累硕果。________，服务群众才会更加精准、更有实效。","prompt":"填入上文画横线处的语句，最恰当的一句是：","options":{"A":"找准大家的关切事","B":"将群众的需求装心里","C":"多下笨功夫、多啃硬骨头","D":"常进老乡门、常聊家里事"},"answer":"A","page":26},{"id":76,"chapter":2,"num":36,"source":"2018 联考","type":"中心理解","stem":"从对技术与知识关系的梳理以及互联网技术自主性的趋向来看，未来新闻传播学科重构中应该注意一个核心问题：如何平衡人与技术的关系问题，使研究者从沉浸其中的技术系统中跳脱出来，以一种批判的眼光对待技术体系，避免成为因互联网自主性导致社会失序的推手。对此，唐·伊德指出，“正是因为太熟悉，我们不仅忽视了由技术系统进行批判性反思的需要，而且也忽视了从这种批判性反思中获得的结果”。因此需要从一个超越的角度来对待围困我们的技术社会。","prompt":"这段文字意在强调：","options":{"A":"新闻传播学重构有技术与知识双重困难","B":"新闻传播学重构必须正确对待技术体系","C":"新闻传播学重构要梳理人与技术的关系","D":"新闻传播学重构要重视互联网的自主性"},"answer":"C","page":27},{"id":77,"chapter":2,"num":37,"source":"2023 河北事业","type":"中心理解","stem":"人口规模的存量开发非常重要，但更为重要的是提高生育水平的增量，因为人口负增长、人口老龄化、家庭规模缩减等现象都是由低生育率引发。人口生育率下降越快，这些人口变动就更为急剧。所以当前人口战略的制定中，要明确应对低生育率政策的基础性地位。虽然目前的低生育率水平主要受到经济、社会、教育、城市化等发展因素综合影响，是现代化过程的一个必然结果，难以大幅度回升。但是，可以在一定程度上、一定时间内延缓生育率的持续下降，稳定生育水平。","prompt":"这段文字意在强调：","options":{"A":"稳定生育水平需要统筹经济、社会、教育、城市化等因素","B":"要减少人口问题给社会经济发展带来的负面影响","C":"提高生育水平的增量比人口规模的存量开发更重要","D":"要明确应对低生育率在人口战略中的基础性地位"},"answer":"D","page":27},{"id":78,"chapter":2,"num":38,"source":"2024江苏","type":"逻辑填空","stem":"丝草只能攀附寄生在其他植物上。它们的生长永远成不了规模，也不能长久，一般是第一年生机勃勃，第二、第三年就会枯萎而死。原因何在？主要是它们将寄生植物体上的营养成分吸走了太多，导致被寄生的植物生命力和抵抗力迅速下降，进而抵御不了虫害和自然灾害的攻击，最后枯死。________？所寄生的植物死了，丝草也就活不长了，枯死也就在所难免。","prompt":"填入画横线处最恰当的一项是：","options":{"A":"皮之不存，毛将焉附","B":"覆巢之下，安有完卵","C":"茂树之下，岂有丰草","D":"城门失火，殃及池鱼"},"answer":"A","page":27},{"id":79,"chapter":2,"num":39,"source":"2023 河南事业","type":"接语选择","stem":"历史学的一个重要社会功能就是为人们的实践活动提供历史经验。人们在认识和改造客观世界的过程中，有的获得成功，有的惨遭失败，有的成败参半。无论成功与失败，都积累了一定的经验教训。这些经验教训对于后来者都是宝贵的财富，他们可以根据自己的需要，从中取得借鉴，作为行动的参考。善于吸取前人的成功经验和失败教训，是今人之所以胜过古人的一个重要原因。","prompt":"这段话接下来最有可能叙述的是：","options":{"A":"我国古代一些高明的统治者善于总结历史经验的例子","B":"今人善于吸取前人的成功经验和失败教训的例子","C":"人们在认识和改造客观世界的过程中取得成功经验的例子","D":"今人在吸取前人的成功经验和失败教训方面胜过古人的例子"},"answer":"B","page":28},{"id":80,"chapter":2,"num":40,"source":"2025事业联考","type":"接语选择","stem":"文化育人是人与文化的双向构建活动，旨在用先进文化教育人、引导人、鼓舞人、塑造人，贯穿于学校办学治校特别是人才培养的全过程和各方面。文化育人不仅重要而且紧要，是落实立德树人根本任务、培养担当民族复兴大任的时代新人的要求，是继续推动文化繁荣、建设文化强国、建设中华民族现代文明的迫切需要，是提升国家文化软实力、以中国式现代化全面推进中华民族伟大复兴的强大精神力量。","prompt":"这段文字接下来最可能介绍：","options":{"A":"推进文化育人的工作方向","B":"构建文化育人体系的必要性","C":"文化育人对落实立德树人的基本要求","D":"中华优秀传统文化对文化育人的作用"},"answer":"A","page":28},{"id":81,"chapter":3,"num":1,"source":"2026广东事业","type":"逻辑填空","stem":"十年树木，百年树人，干部培养也有客观的周期规律。________、现抓现用，破解不了“用人荒”的根本难题，只会让可选的空间越来越小。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"鱼目混珠","B":"江心补漏","C":"临渴掘井","D":"拔苗助长"},"answer":"C","page":29},{"id":82,"chapter":3,"num":2,"source":"2024重庆三支","type":"逻辑填空","stem":"文化不仅可以浸润人的心灵，还能________-一座城市的文明。在深圳，开放多元、兼容并蓄、创新创意、现代时尚的城市文化特质非常________0","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"涵养   鲜明","B":"滋养   立体","C":"构建   突出","D":"孵化   醒目"},"answer":"A","page":29},{"id":83,"chapter":3,"num":3,"source":"2022四川","type":"逻辑填空","stem":"梳理百年党史让人留下深刻记忆：一个主题贯穿全程，那就是实现中华民族伟大复兴；一个关系牢不可破，那就是党与人民休戚与共、生死相依；一个宗旨.________，那就是全心全意为人民服务。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"始终不渝","B":"坚持不懈","C":"持之以恒","D":"一如既往"},"answer":"A","page":29},{"id":84,"chapter":3,"num":4,"source":"2019联考","type":"逻辑填空","stem":"随着贯彻落实中央八项规定精神向纵深推进，旅游式的开会、聚餐式的调研、游玩式的走访等，有所________。但内容重复的会议、填写表格的落实、层层转发的部署等，依然使许多实际工作难有进展，依然使许多计划流于漂亮文案。有人指出，形式主义与官僚主义________，并非偶然。这两种“主义”都是典型的官场病，________，相互联系，是同一个问题的两个方面。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"遏制   对举   互为表里","B":"节制   对应   互相标榜","C":"收敛   对仗   互为因果","D":"约束   对衬   互剥痛疮"},"answer":"A","page":29},{"id":85,"chapter":3,"num":5,"source":"2019 河北事业","type":"逻辑填空","stem":"古往今来，中华民族之所以在世界上有地位，有影响，不是靠________，不是靠对外扩张，而是靠中华文化的强大感召力和吸引力，我们的先人早就认识到‘远人不服，则修文德以来之”的道理。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"偃武修文","B":"顺天应命","C":"穷兵默武","D":"远交近攻"},"answer":"C","page":29},{"id":86,"chapter":3,"num":6,"source":"2024联考","type":"逻辑填空","stem":"土壤中的蚯蚓、蚂蚁等动物和真菌、细菌等微生物被称为土壤生物，这些生物在土壤中并不是________，而是通过“吃”与“被吃”的关系建成一张食物网，在这一过程中,生物种类、数量和所占比例保持在相对稳定的状态,从而维持了土壤中的生物________0","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"各行其是   稳定性","B":"杂乱无章   多样性","C":"相安无事   安全性","D":"盘根错节   复杂性"},"answer":"B","page":30},{"id":87,"chapter":3,"num":7,"source":"2025海南三支","type":"逻辑填空","stem":"为适应高原低温，干旱、土壤贫瘠以及大风等极端生存环境，不少长江源区植物呈现密集排列和贴地生长的外貌特征，犹如“________”。这种低矮的形态特征不仅增强了植物对极端的气候和养分条件的适应力，而且能够增强植物抗倒伏的能力。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"铜墙铁壁","B":"抱团取暖","C":"撼树","D":"星罗棋布"},"answer":"B","page":30},{"id":88,"chapter":3,"num":8,"source":"2021福建事业","type":"逻辑填空","stem":"如今被官方通报打脸，他们________，摸着吃饱的肚皮，全当什么事情都没发生。他们不在乎，他们只在乎下一个热点在哪里，如何以同样的套路和手法，继续收割流量。那么，我们要坐视这种“一边打脸，一边脸皮厚”的信息传播模式继续吗？我想，总该总结些什么，采取一些规范措施，同时也希望，那些唯流量至上的信息编织者________，对照自检，认识到脑补，虚构剧情的危害和风险。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"若寒蝉   反躬自省","B":"默不作声   扪心自问","C":"哑口无言   闭门思过","D":"理屈词穷   反求诸己"},"answer":"B","page":30},{"id":89,"chapter":3,"num":9,"source":"2025山东","type":"逻辑填空","stem":"伴随着新质生产力概念的提出，一个在文化领域的具体质态——文化新质生产力________。文化新质生产力将成为新时代建设中华民族现代文明的新________。进一步解放和发展文化新质生产力，需要激活文化在社会发展中的作用，形成推动中华民族现代文明建设的强大动力。","prompt":"依次填入画横部分最贴切的一项是：","options":{"A":"呼之欲出   引擎","B":"异军突起   动能","C":"横空出世   趋势","D":"应运而生   业态"},"answer":"A","page":30},{"id":90,"chapter":3,"num":10,"source":"2026 四川","type":"逻辑填空","stem":"人才振兴是乡村全面振兴的________，加强乡村人才队伍建设是推进乡村全面振兴的题中应有之义。要聚焦“引、留、育”关键环节，在“引贤、留才、育苗”上________发力，凝聚人才扎根美丽乡村，高效培育融入乡村全面振兴，激活动能赋能乡村全面振兴，让现代化人才在乡村全面振兴的________中建功立业。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"标杆   集中   温床","B":"源头   精准   蓝图","C":"核心   切实   画卷","D":"基础   持续   沃土"},"answer":"D","page":31},{"id":91,"chapter":3,"num":11,"source":"2025河北三支","type":"逻辑填空","stem":"1924年，孙中山先生致信美国“汽车大王”亨利福特，邀请其来华投资，推动中国现代工业发展，但遗憾遭拒绝。2023年，福特公司为发展电动汽车，主动与宁德时代合作，获取电池技术授权及运营支持。两个故事，穿越百年，令人感慨。从邀请投资被拒，到对方主动上门寻求合作，中国汽车制造完成了从________到享誉全球的巨大飞跃。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"一贫如洗","B":"一无所有","C":"一干二净","D":"一穷二白"},"answer":"D","page":31},{"id":92,"chapter":3,"num":12,"source":"2022事业联考","type":"逻辑填空","stem":"包括健身在内的大众体育的兴起，首先依托于消费社会的________，闲暇时间与消费能力的过剩使得普通人也有机会从事体育、旅游等文化休闲活动。而在公众选择休闲活动的过程中，大众传媒的引导起到了________的作用，其中健康、美丽、快乐无疑是出现最多的用语。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"繁荣   潜移默化","B":"兴起   耳濡目染","C":"发展   推波助澜","D":"诞生   穿针引线"},"answer":"A","page":31},{"id":93,"chapter":3,"num":13,"source":"2019贵州选调","type":"逻辑填空","stem":"费孝通先生在《乡土中国》里有_________的阐释：中国乡村秩序是从血缘关系和地缘关系开始的。此后时空流转，纵使百转千回，讨生活也好、讨理想也罢，走出去的中国人，还是会被故土的浓烈情思所牵绊。从这个意义上说，过年回家，大概是三件事:一是省亲，________思念之苦；二是乡愁，归于故土之亲；三是仪式，________精神传承。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"恰如其分   消除   感悟","B":"一针见血   慰藉   濡染","C":"高屋建领   抚平   感服","D":"鞭辟入里   解除   渲染"},"answer":"B","page":31},{"id":94,"chapter":3,"num":14,"source":"2022重庆选调","type":"逻辑填空","stem":"市场经济环境中，作品成了产品，要到市场上销售，出品方需要锦上添花的广告，所以，出品方不仅生产作品，也生产有利于销售产品的评论，评论的评判功能慢慢向商品广告的功能转化，评论的环境发生了变化，评论的________也受到影响，评论家说真话就有了难度，好处说好容易，坏处说坏不易，这是客观存在的，这也是________、绕来绕去不做判断之文风形成的原因之一。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"专业性   瞻前顾后","B":"独立性   吞吞吐吐","C":"创造性   含含糊糊","D":"及时性   闪烁其词"},"answer":"B","page":32},{"id":95,"chapter":3,"num":15,"source":"2019联考","type":"逻辑填空","stem":"1964年，约翰·贝尔提出了一种可以区分量子力学与局域实在论敦对敦错的测试方法，即贝尔不等式。随后的几十年，大量的实验都证实了量子力学关于贝尔不等式的________，但是这些实验或多或少地存在一些________，导致人们依然无法对这一争论进行最终判定。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"预言   漏洞","B":"定论   瑕疵","C":"判断   偏颇","D":"假设   错误"},"answer":"A","page":32},{"id":96,"chapter":3,"num":16,"source":"2019 湖北事业","type":"逻辑填空","stem":"社会上对功能牙膏添加化学成分的________由来已久，其内容既包括添加化学成分是否合适，还包括其他许多方面。在添加成分方面，尽管添加氨甲环酸等化学成分似乎于法有据，但这些依据具有怎样的________，却是一个有待廓清的问题。","prompt":"依次填入横线处正确的一项是：","options":{"A":"置疑   效力","B":"置疑   效果","C":"质疑   效果","D":"质疑   效力"},"answer":"D","page":32},{"id":97,"chapter":3,"num":17,"source":"2019江西法检","type":"逻辑填空","stem":"渺小是通到新英雄主义的一个起点。渺小是自大、狂妄、野心、残害的消毒药，渺小是把人________成人，是叫人看集体重于个人。当一个人为了群众，为了民族和国家，发挥了自己最大可能的力量，他便成为人民的英雄—新的英雄，这种英雄，不是为了自己，而是牺牲了自己，他头顶的光圈，是从人格和鲜血中________出来的。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"还原   放射","B":"当作   照射","C":"复原   照耀","D":"放大   闪耀"},"answer":"A","page":32},{"id":98,"chapter":3,"num":18,"source":"2020浙江","type":"逻辑填空","stem":"徽州的一景一物，较之粗犷的西北，是________的。那马头墙、小青瓦透出的人文气息，浓郁得似乎连游客都成了诗的一部分。粉墙黛瓦，青山绿水，全然一派水墨丹青的________o","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"大相径庭   韵味","B":"截然不同   氛围","C":"别具一格   风格","D":"无可比拟   意境"},"answer":"A","page":33},{"id":99,"chapter":3,"num":19,"source":"2021事业联考","type":"逻辑填空","stem":"在医药行业的广告投放统计中，风湿骨病药物曾一度占据首位，大街小巷的小诊所广告也随处可见。在各种广告长年累月、________的洗脑下，很多人只要腿疼、手脚腕疼、关节僵硬，都以“风湿”二字________。无数人因为得不到________的治疗，在残疾和疼痛中度过余生。","prompt":"填入横线处的词语最恰当的一项是：","options":{"A":"积非成是   一视同仁   规范","B":"以讹传讹   混为一谈   及时","C":"潜移默化   一言蔽之   有效","D":"无孔不人   一概而论   正确"},"answer":"D","page":33},{"id":100,"chapter":3,"num":20,"source":"2025 四川三支","type":"逻辑填空","stem":"和谐共处、手足相亲、守望相助始终是我国民族关系的主流，各民族亲密无间的兄弟情谊留下了许多历史佳话。特别是在抵御外侮、防止分裂、维护统一的进程中，各族人民空前团结、________，书写了中华民族艰苦卓绝、气壮山河的伟大史诗。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"同甘共苦","B":"同仇敌气","C":"同舟共济","D":"力同心"},"answer":"B","page":33},{"id":101,"chapter":3,"num":21,"source":"2020天津事业","type":"中心理解","stem":"是谁说，自然景观和心灵景观是互相对应的。不曾珍藏、神往山清水秀云淡风轻鸟语花香的心灵，想必一定是苍白的干涸的荒芜的，一定缺失爱和美的滋养润泽。旅行能催人思考。我们眼前的景观同我们脑子里可能产生的想法之间往往存在某种奇妙的联系：宏阔的思考常常需要有壮阔的景观，而新的观点往往也产生于陌生的所在。","prompt":"这段文字意在说明：","options":{"A":"旅行能使人开阔眼界","B":"旅行者的角色能使人增加入生体验","C":"人的思维角度会受到所处环境的影响","D":"旅途中的景观常能引起思考"},"answer":"D","page":33},{"id":102,"chapter":3,"num":22,"source":"2018 浙江选调","type":"中心理解","stem":"员工家庭福利政策的长期缺失，虽然给企业带来了成本降低、产量提高等显而易见的优势，但对员工而言，抛弃年幼的孩子和年迈的父母，显然不是合理的职业规划。一些经济学家认为，家庭福利政策的匮乏实际上反映了美国经济中企业和员工之间权利不平衡的状态。经济产出流入公司利润的份额在飙升，而员工的薪酬却停滞不前，这必然会导致美国陷入人才流失的困境。","prompt":"这段文字意在:","options":{"A":"揭示个人职业规划和现状之间的矛盾","B":"指出美国企业和员工权利不对等的问题","C":"揭示美国人才流失的深层次原因","D":"强调美国家庭福利政策缺失的不利影响"},"answer":"D","page":34},{"id":103,"chapter":3,"num":23,"source":"2026浙江","type":"中心理解","stem":"中国传统的造纸方法是先用水疏散植物纤维，同时施胶（主要用杨桃藤等植物胶）以改善纸抗水性，然后抄纸再加压，榨出纸膜中的水分，最后烘（晾、晒）干形成纸张。而传统古籍修复也是用浆水（小麦粉制成）使纸纤维疏松膨胀，将古籍原纸和修复纸两纸纤维黏合，最后晾干水分，恢复纸张平整。因此用传统方法修复对古籍的损害最小。","prompt":"文中将造纸与修复技术对比，主要目的是：","options":{"A":"说明古籍修复技术的历史渊源","B":"揭示古代造纸与修复技术的传承关系","C":"论证传统修复方法对古籍损害小的原因","D":"比较植物纤维在不同工艺中的应用差异"},"answer":"C","page":34},{"id":104,"chapter":3,"num":24,"source":"2019 四川选调","type":"中心理解","stem":"科学研究起源于哲学，而哲学研究所建立的逻辑化正是科学方法的一个关键内容。在使用哲学的逻辑化开展科学研究的过程中，定量化是必不可少的。没有定量化，就无法通过归纳建立模型，也无法通过对模型的演绎做出预言，并被进一步的观测或者实验检验。数学研究所建立的各种计算方法和工具，使得科学研究和现在一般意义上的哲学研究分道扬，而科学研究的定量化又使得科学研究的成果能够得到实际应用，这是科学和哲学彻底分离的最显著标志。","prompt":"这段文字意在强调：","options":{"A":"科学与哲学的渊源及区别","B":"定量化在科学研究中的意义","C":"开展科学研究的基本方法","D":"哲学和数学对科学研究的贡献"},"answer":"B","page":34},{"id":105,"chapter":3,"num":25,"source":"2024山西纪委","type":"细节判断","stem":"最早的身份证是在隋代开始出现的，不过真正意义上的身份证，是唐代贞观年间给官员们发放的“鱼符”。鱼符由木头或金属精制而成，形状像鱼，分左右两片，上凿小孔，以便系佩，里面刻有官员的姓名、任职衙门、官阶、俸禄以及出行待遇等。鱼符的主要用途是证明官员的身份，便于应召出入宫门验证时所用。鱼符的制作材料与官员的官阶有直接联系。当时，凡亲王和三品以上官员所用的鱼符均用黄金铸制，五品以上官员的鱼符为银质，六品以下为铜质。五品以上官员还备有存放鱼符的专用袋子，称为“鱼袋”","prompt":"关于鱼符，这段文字没有提及的是：","options":{"A":"形状材质","B":"产生背景","C":"主要功能","D":"佩戴方法"},"answer":"B","page":35},{"id":106,"chapter":3,"num":26,"source":"2024重庆事业","type":"细节判断","stem":"在人们肉眼看来，大陵五只是秋季东北方向天空中一个遥远的亮点，像是一颗星星。但实际上，它是由大陵五 Aal、大陵五 Aa2 和大陵五 Ab 三颗恒星组成的系统。这三颗恒星被引力“束缚”在一起，共同组成大陵五这个三合星系统。系统之中三颗星的相对位置还会发生变化，并影响到大陵五的亮度。天文学上把这种亮度时常变化的恒星或恒星系统称作变星。","prompt":"根据这段文字，下列说法错误的是：","options":{"A":"大陵五是一个恒星系统","B":"大陵五是由三颗恒星组成","C":"大陵五的亮度时常发生变化","D":"大陵五在天空中的位置会发生变化"},"answer":"D","page":35},{"id":107,"chapter":3,"num":27,"source":"2023 联考","type":"细节判断","stem":"人体组织是由细胞构成的，而细胞膜的主要成分就是磷脂——磷酸与某些有机化合物中的羟基形成的酯。例如，甘油含有3个羟基，如果2个与脂肪酸成酯，1个与磷酸成酯，这就是甘油磷酸酯。磷脂与其他的酯类化合物一样，往往一头是长的碳链，另一头含磷原子。碳链的一头亲油（疏水），而含磷的那一头则亲水（疏油），形成两性分子。有的磷脂能够整整齐齐排列起来，亲水的靠在一起，亲油的靠在一起，形成一层膜。两层这样的膜紧紧地靠在一起，每一层膜中间又夹杂着蛋白质、糖脂、胆固醇等，就形成了细胞膜。","prompt":"根据这段文字，下列判断错误的是：","options":{"A":"磷酸和羟基是形成细胞膜的要素","B":"细胞膜形成与磷脂两性分子有关","C":"磷脂与其他酯类化合物存在共性","D":"磷元素在细胞中往往是整齐排列"},"answer":"D","page":35},{"id":108,"chapter":3,"num":28,"source":"2024甘肃事业","type":"标题填入","stem":"所谓“深度造假”技术，是一种利用AI将现有图像、音频或视频中的人物替换成他人的技术。一些经过操纵的图像、视频和音频等“深度造假”内容，曾经需要专业人士才能完成，但在生成式AI的加持下，现在很多人都能更容易地创建出来。“深度造假”使别有用心之人窃取或盗用他人的声音，将其嵌入图像或视频中，或者以无法检测的方式操纵或更改数字内容。随着“深度造假”的制作变得越来越简单，社交媒体可随时向大众传播此类内容。这些“深度造假”内容在社交媒体平台上不受限制、不受管理地传播，将导致一场虚假信息运动，以影响、说服和误导他人或特定受众。","prompt":"最适合做这段文字标题的是：","options":{"A":"生成式AI逐渐“来指”社交平台","B":"社交媒体平台的“内容认证”标准尚在制订中","C":"生成式 AI 或致虚假信息野蛮生长","D":"“深度造假”技术正在侵蚀人们对网络的信任"},"answer":"C","page":36},{"id":109,"chapter":3,"num":29,"source":"2020事业联考","type":"标题填入","stem":"人们一直梦想着重塑火星气候，使其适合人类居住，科学家提出了各种方法，但都不能实现。现在，来自美国和英国的研究人员提出了一种在局部进行的新方法：在火星表面区域添加一层薄薄的二氧化硅气凝胶。通过建模和实验，研究人员证明，一块2一3厘米厚的二氧化硅气凝胶就可以传输足够的可见光用于光合作用，阻挡有害的紫外线辐射，并将其下的温度永久地升高到水的熔点之上，且实现所有这些都不需要任何内部热源。有专家表示，这种使火星宜居的区域方法比改变火星整个大气更容易实现，而且使用的都是现有的材料和技术。","prompt":"最适合做这段文字标题的是：","options":{"A":"让火星宜居转化为现实还要走多远","B":"人类提高火星整体温度的全新尝试","C":"二氧化硅气凝胶或让火星变得宜居","D":"火星的局部地区性改造需要新思路"},"answer":"C","page":36},{"id":110,"chapter":3,"num":30,"source":"2021事业联考","type":"中心理解","stem":"成绩要求相对较低，导致部分考生视艺考为进入高等学府的“绿色通道”或迅速成名的捷径，于是扎堆报考、突击报考等现象也就随之出现。另外，由于高中教学与艺考不能有效衔接，一个巨大的艺考培训市场应运而生，但市场内部存在行业垄断、恶性竞争、干扰院校招考正常秩序等乱象，破坏了艺术类专业招生和培养的健康生态。对此，教育部门应针对时弊，对艺术类专业招生加强规范，严格入校管理，进一步完善优化招录程序。","prompt":"这段文字意在说明：","options":{"A":"“艺考”不等于“易考”","B":"艺术类专业招生亟待规范","C":"艺术人才更需提升文化素养","D":"教育部门应多举措促进艺考公平"},"answer":"B","page":36},{"id":111,"chapter":3,"num":31,"source":"2025 江苏","type":"中心理解","stem":"当滑雪者因雪崩被困在厚厚的雪层之下，由于雪很轻，他可以将双手交叉，形成一个气囊用于呼吸，但沙洞坍塌时的情况就有所不同。在沙洞坍塌事故中救人往往非常困难，因为沙子沉重且极其不稳定。当救援人员走沙子，并试图解救被困者时，救援人员的重力作用会导致沙洞继续塌陷，并重新填满空隙。因此，消防员等专业人员从坍塌的沙洞救人时，通常会在洞口横放一些木板。这样，他们就可以使用工具移除沙子，而不会将任何重量直接压在洞口边缘。","prompt":"根据文意，“因此”中的“此”是指：","options":{"A":"沙洞坍塌与雪崩的情形不同","B":"沙洞坍塌救援时需将洞口沙子移除","C":"沙洞坍塌救人具有不可控性","D":"沙洞坍塌救援时可能带来新的坍塌"},"answer":"D","page":37},{"id":112,"chapter":3,"num":32,"source":"2026广东事业","type":"中心理解","stem":"近年来，国家大力推进高标准农田建设，通过土地平整、灌溉设施完善、土壤改良等措施，使“低产田”变“高产田”。此外，盐碱地等边际土地的改良利用也是耕地建设的重要方向。通过耐盐碱作物育种等技术，曾经的“不毛之地”也能变为“新粮仓”。当然，耕地建设也必须遵循耕地和作物生态系统的自然规律，以保证粮食生产的可持续性。","prompt":"这段文字主要讲了：","options":{"A":"高标准农田建设的综合成效","B":"耕地保护与建设的常态化措施","C":"粮食生产提质增效的关键因素","D":"高质量推进耕地建设的途径"},"answer":"D","page":37},{"id":113,"chapter":3,"num":33,"source":"2026广东","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①中国倡导平等有序的世界多极化和普惠包容的经济全球化，这两大主张有着极强的现实针对性和战略指导性。\n②世界多极化是历史发展的大势，也是历史进步的方向。\n③这两大主张契合大多数国家和各国民众的普遍诉求，为国际社会从变乱交织走向长治久安指明了方向，为推动构建人类命运共同体注入源源不断的动力。\n④经济全球化是生产力发展的客观要求，也是人类社会前进的必由之路。\n⑤平等有序的世界多极化强调坚持大小国家一律平等，并确保多极化进程总体稳定和具有建设性，为推动构建更加公正合理的全球治理体系提供了重要路径。\n⑥普惠包容的经济全球化强调解决好资源全球配置造成的国家间和各国内部发展失衡问题，并支持各国走出符合自身国情的发展道路，携手推进全人类的共同发展。","prompt":"","options":{"A":"①④⑥②③⑤","B":"①③②⑤④⑥","C":"①③⑤⑥②④","D":"①②⑤④⑥③"},"answer":"D","page":37},{"id":114,"chapter":3,"num":34,"source":"2023重庆选调","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①水的颜色来源于水对太阳光的散射、反射和吸收，由于波长不同，水对不同光波的吸收率也不一样。\n②蓝光难以被水吸收，最容易被散射和反射，可以在深不见底的海洋中传播很远，这样就形成了海水的蓝色\n③如果我们的视线像鸟儿一样升上高空，俯瞰地球，会发现这是一颗充满水的星球\n④海洋、河流、湖泊散布各处，海洋的碧蓝色构成了地球的主色调\n⑤当白色的太阳光射入海中，其中的红光、黄光、绿光容易被水吸收，逐渐消失不见\n⑥在人们的印象里，海洋是蓝色的，然而，当我们从中留起一瓢海水，却是无色透明的液体，这究竟是为什么呢？","prompt":"","options":{"A":"①②⑥⑤③④","B":"②③⑥⑤①④","C":"③④⑥①⑤②","D":"④③⑤⑥②①"},"answer":"C","page":38},{"id":115,"chapter":3,"num":35,"source":"2022重庆选调","type":"语句填空","stem":"释放消费，不仅涉及居民收入等需求端，也涉及消费供给等供给端。“国际化”意味着面向全球消费者，需拥有运营全球人流、物流、资金流的集散能力。要达到“国际”标准，需要显著提升资源要素配置效率，推动产品和服务规则、规范、标准、管理的国际化。为此,________。这是推动国际消费中心城市建设的基础性制度安排。在这方面的突破，将为全国提供重要的先行先试经验与探索。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"必须实现居民消费水平和消费结构的不断提升和优化","B":"应在壮大新型消费模式的同时强化新消费模式的监管","C":"要立足社会消费品零售总额上的先行优势和协同效应","D":"要在市场化改革和高水平开放上有更加实质性的进展"},"answer":"D","page":38},{"id":116,"chapter":3,"num":36,"source":"2020四川下","type":"中心理解","stem":"在老少冲突中，一类观点被年轻人所欢迎：年轻人早出晚归不容易，老人应该给他们腾出空间。这种说法所对应的逻辑是：一般认为年轻人利用资源是投入社会生产的，例如在公交车享有座位能够让他们更好地休息，从而提高工作效率。老人利用资源更多用于满足个人生活和享受性需求，是纯粹的消耗，而年轻人占有资源后最终会创造新的社会资源。这种功利化的伦理逻辑不乏市场，甚至为部分老年人所赞同。但是，正如那句“人人都有老去的一天”所说的，在老年人和年轻人之间分配资源，不能只盯着眼前的功利。","prompt":"这段文字意在强调：","options":{"A":"应尊重老年人享受社会资源的权利","B":"舆论在公共资源分配问题上反映强烈","C":"不同的社会资源分配方案对应着不同的逻辑","D":"功利的算计不应成为当代社会崇尚的价值理念"},"answer":"A","page":39},{"id":117,"chapter":3,"num":37,"source":"2025 四川三支","type":"中心理解","stem":"面对朋友倾诉，很多人会急于给出建议，从而避免继续共情和倾听，阻止对方将情绪投射到自己身上。相比之下，心理咨询最重要的功能之一就是“容纳”，而不是急于表明立场。但如今每个人都有太多的情绪与事务要处理，往往无力承载他人的情感诉求。在这样的语境下，心理咨询不再仅仅是精神疾病的辅助治疗途径，而是日益变成“情感劳动的外包”：当个体出现情绪问题、不能自解且身边的人也不能承载时，心理咨询室就成了唯一可以充分、安全表达的地方。而当人们走进咨询室的脚步受阻于时间、金钱或心理门槛，AI聊天机器人又成了替代性出口。","prompt":"这段文字意在分析：","options":{"A":"人们找 AI做心理咨询的原因","B":"向朋友诉苦与心理咨询的区别","C":"心理咨询对精神疾病治疗的作用","D":"AI 聊天机器人作为辅助治疗的前景"},"answer":"A","page":39},{"id":118,"chapter":3,"num":38,"source":"2026 国考","type":"语句填空","stem":"液晶显示器是一种光偏振调制的显示器件。当白光光源射入显示器时，通过入射偏振片，自然光被转换为线偏振光。未施加外来电场时，入射偏振光会顺着液晶分子的排列旋转前进，在正常黑色操作模式下，偏振光被出射偏振片阻挡并吸收，显示器画面呈现暗态；当施加电压时，液晶分子倾向平行于施加电场的方向，线偏振光直接到达出射偏振片，由于入射偏振光的偏振状态不受此液晶分子的影响，并保持与出射偏振片穿透轴方向一致，故能通过出射偏振片形成亮态。所以________0","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"电场不够强时显示器呈半透明的中间灰度状态","B":"利用适当驱动电压即可得到明暗对比的显示效果","C":"液晶分子的旋转作用可以有效控制光线的穿透","D":"站在不同视角看显示屏时显示效果会有很大差异"},"answer":"B","page":39},{"id":119,"chapter":3,"num":39,"source":"2024事业联考","type":"接语选择","stem":"在实验室里，电子天平可以精确称量一粒食盐的质量，大约2~3毫克，甚至可以测出一厘米长度头发的质量（约0.1毫克）。实验室最高精度的电子天平可以精确到10 微克质量的变化，但任何风吹草动都会严重影响称量结果。再高精度的就得是热天平了，目前国际上最高灵敏度的热天平精度可到0.1微克。但是，面对一个重仅3~4 纳克的人体细胞，它已无能为力。这时就要请石英晶振微天平出场了，它理论上的分辨率可以达到皮克量级，不仅可以测细胞质量还能测量细胞生长过程中质量的微弱变化，测个细菌也不在话下，这也几乎是人类检测限的天花板了。","prompt":"这段文字接下来最可能会介绍：","options":{"A":"启用新的国际单位制的意义","B":"中国古代测量工具的发展史","C":"对高精度测量仪器的新需求","D":"石英晶振微天平的制作原理"},"answer":"C","page":40},{"id":120,"chapter":3,"num":40,"source":"2026国考","type":"接语选择","stem":"随着人工智能时代的到来，“未来人”和“远方的陌生人”问题逐渐进入人类的伦理视界。传统伦理学是“近的伦理学”，强调人与人之间的直接交往，行为双方是熟悉的、共同在场的，道德时空是近距离的。科技深度介入使人类的道德空间和行为性质发生改变，一些新的对象（如人工智能）逐渐进入我们为之负责和道德关切的领域。人工智能作为新科技，给人类的伦理世界和道德空间带来了深刻变革，它以虚拟化和拟人化的方式与人类建立了新的交往关系，伦理关系从“人与人”“人与动物”“人与自然”扩展到“人与人工智能”。","prompt":"这段文字接下来最可能介绍：","options":{"A":"未来人工智能技术的发展趋势","B":"影响人类道德空间的技术因素","C":"人工智能时代人际交往模式的新变化","D":"人工智能带来的伦理挑战和道德困境"},"answer":"D","page":40},{"id":121,"chapter":4,"num":1,"source":"2022四川下","type":"逻辑填空","stem":"随着汉魏文人创作的极大繁荣，古人对于文学创作中的形式要素愈加重视，加之音韵学蜂起，反切和“四声”________，促使人们更加重视汉语的音节结构。六朝以后，研究诗歌韵律问题渐成风气，唐宋以后更加普遍，逮至明清更是________0","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"融会贯通   无出其右","B":"蔚然成风   独树一帜","C":"此消彼长   三足鼎立","D":"深入人心   盛极一时"},"answer":"D","page":41},{"id":122,"chapter":4,"num":2,"source":"2026 事业联考","type":"逻辑填空","stem":"当我们转向以数字产品为基础的阅读模式时，知识内化、类比推理和逻辑推论等重要的“深阅读”能力________。这不是一个简单的纸质书与电子书对立的问题，也不是“科技是把双刃剑”的老生常谈。在这个印刷文化与数字文化相互________的紧要时刻,社会必须正视这个问题。","prompt":"依次填入横线部分最恰当的一项是：","options":{"A":"化为乌有   切磋","B":"四面楚歌   肘","C":"不堪一击   较量","D":"岌岌可危   角力"},"answer":"D","page":41},{"id":123,"chapter":4,"num":3,"source":"2023天津","type":"逻辑填空","stem":"互联网时代的网民，不再是过去处于某一特定组织、相对具有整体性的“人民”。网络对社会成员进行了“再组织化”，各行各业的人群基于话题、诉求、兴趣爱好等重新组合，而且，互联网极大地推动了知识的大众化、民主化，使群众拥有了更多发言渠道，拥有了信息获取和自我强化的能力。这意味着观念和精神秩序的________0","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"重塑","B":"重构","C":"形塑","D":"建构"},"answer":"A","page":41},{"id":124,"chapter":4,"num":4,"source":"2026陕西事业","type":"逻辑填空","stem":"在新形势下，各种思潮和观点良不齐、________，如果缺乏敏锐的洞察力，政治判断力将无从谈起。党员干部要紧跟形势发展，加强政治理论学习，在学习中筑牢信仰之基、补足精神之钙、把稳思想之舵，不断增强“四个意识”、坚定“四个自信”、做到“两个维护”。要通过学透理论，在重大问题上想清楚弄明白，以清醒的政治头脑站稳政治立场，以过硬的政治判断力，确保在任何时候、任何情况下都________0","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"泥沙俱下   坚如磐石","B":"鱼龙混杂   稳如泰山","C":"滥竿充数   牢不可破","D":"鱼目混珠   根深蒂固"},"answer":"A","page":41},{"id":125,"chapter":4,"num":5,"source":"2022联考","type":"逻辑填空","stem":"《中华人民共和国海南自由贸易港法》第三十三条规定，海南自由贸易港推进国土空间规划体系建设，实行________的自然生态空间用途管制，严守生态保护________，构建以国家公园为主体的自然保护地体系，推进绿色城镇化、美丽乡村建设。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"差异化   底线","B":"差别化   红线","C":"个性化   底线","D":"人性化   红线"},"answer":"B","page":42},{"id":126,"chapter":4,"num":6,"source":"2022联考","type":"逻辑填空","stem":"音乐是什么？也许永远无法得出________的答案，但是这个问题本身就有不可忽视的哲学分量。也许“做音乐”回应了人类比创造更________的需求：交流。声音向另一个人证明了我们的存在，转变成人际互动的形式，就是歌唱。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"确切   深刻","B":"公认   普遍","C":"精确   基本","D":"公允   迫切"},"answer":"A","page":42},{"id":127,"chapter":4,"num":7,"source":"2020广东","type":"逻辑填空","stem":"伟大的成就与变革，往往是前所未有的，是________的，是惊心动魄的，却没有一个是________的，是信手拈来的，是一而就的。","prompt":"依次填入画横线部分最恰当的一组是：","options":{"A":"空前绝后   一帆风顺","B":"开天辟地   空中楼阁","C":"荡气回肠   轻而易举","D":"振聋发   日行千里"},"answer":"C","page":42},{"id":128,"chapter":4,"num":8,"source":"2021山东","type":"逻辑填空","stem":"所谓“做对的事情”，就是要把握________，清晰利，在做事之前要仔细考虑，分析判断，着眼于长远，理清_________，找出关键点。而“把事情做对”则将关注重点引向了________，强调做事情方法要正确，二者缺一不可。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"原则   是非曲直   源头","B":"方向   来龙去脉   过程","C":"规律   轻重缓急   结果","D":"趋势   千头万绪   目的"},"answer":"B","page":42},{"id":129,"chapter":4,"num":9,"source":"2021黑龙江紧缺","type":"逻辑填空","stem":"在一个选择多样化的年代，消费者的心理是非常脆弱的，对某一个品牌的情感_________相对比较弱，一旦企业________了消费者的基本利益，就很难挽回消费者的信心。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"依靠   侵害","B":"依附   损害","C":"依托   破坏","D":"依赖   伤害"},"answer":"B","page":42},{"id":130,"chapter":4,"num":10,"source":"2026陕西事业","type":"逻辑填空","stem":"学习运用‘千万工程”经验全面推进乡村振兴，不能仅盯着农业生产的数字，更要注重乡村风貌的________和乡风文明的________。要让广大农民物质富裕的同时，也能享受到精神层面的________0","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"改造   培育   富裕","B":"塑造   涵养   充盈","C":"建设   滋养   满足","D":"提升   传播   丰饶"},"answer":"B","page":43},{"id":131,"chapter":4,"num":11,"source":"2025 四川","type":"逻辑填空","stem":"一切器具都需要经历一个从原材料到终端器件的加工过程，其间材料会根据需要在不同物态间________。传统上，这些过程可能需要高温条件，并且依赖于_________的物理化学反应，操作起来十分繁琐。这样就引申出一个极为重要的技术概念一—常温制造。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"转换   纷繁复杂","B":"切换   不计其数","C":"变化   眼花缭乱","D":"转变   难以捉摸"},"answer":"A","page":43},{"id":132,"chapter":4,"num":12,"source":"2021联考","type":"逻辑填空","stem":"我国有很庞大的老年群体，但他们却因为科技的发展，在生活中有很多地方________。不是他们________，不想接触新事物，而是一辈子的习惯，不是说改就能改的。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"寸步难行   墨守成规","B":"步履艰难   画地为牢","C":"艰难跋涉   抱残守缺","D":"举步维艰   固步自封"},"answer":"D","page":43},{"id":133,"chapter":4,"num":13,"source":"2020事业联考","type":"逻辑填空","stem":"尽管被很多人批评为叶公好龙，但_________地说，对那些在丛林、草原和山地上讨生活的传统部族文化的喜爱，其实出自人类血管中翁动的本能，因为我们的祖先在长达二百万年间都过着这种石器时代的野蛮生活，跨人文明不过是近一万年的事情，因此适应原始生活而演化出来的本能与越发复杂的文明世界之间存在严重________，两者的不匹配构成了我们在现代城市生活里绝大多数苦闷与抑郁的________0","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"严格   分歧   基础","B":"坦白   争执   要素","C":"公正   错位   根源","D":"客观   失衡   结局"},"answer":"C","page":43},{"id":134,"chapter":4,"num":14,"source":"2026山东事业","type":"逻辑填空","stem":"服用任何药物，都有发生不良反应的风险，这是药物食用的过程中需面对的客观事实。我们既不能因为害怕罕见的不良反应而________，拒绝必要的治疗，也不能对药物的潜在风险________0","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"矫枉过正   淡然置之","B":"畏缩不前   不以为意","C":"因壹废食   掉以轻心","D":"因小失大   等闲视之"},"answer":"C","page":44},{"id":135,"chapter":4,"num":15,"source":"2018辽宁三支","type":"逻辑填空","stem":"春晚相声《新虎口遐想》的出现，其最现实的意义就在于它实现了相声本质的回归，讽刺分寸感好，对社会不良现象反思有力。只是_________春晚时间限制，结尾比较仓促，实在是美中不足的遗憾。但是________，它回归了本质，找回了初心。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"困于   毋庸置疑","B":"缘于   不言而喻","C":"由于   大醇小疵","D":"囿于   瑕不掩瑜"},"answer":"D","page":44},{"id":136,"chapter":4,"num":16,"source":"2022 江苏","type":"逻辑填空","stem":"面对国际金融危 ":"B","page":45},{"id":142,"chapter":4,"num":22,"source":"2023河北事业","type":"中心理解","stem":"“怎么培养人”不是一成不变的，不能被几十年前的西方教育理论限制和约束。教育工作者在思考、研究、设计和实施“怎么培养人”的时候，思想和身体要同时进入新时代，充分利用最新的科学和技术，不断探索和创新。在回答“怎么培养人”的问题的时候，贡献中国方案、展现中国智慧，引领全球教育，尤其是教育数字化的发展，这是建设教育强国的一个重要指标。","prompt":"这段文字意在强调：","options":{"A":"“怎么培养人”的问题不能被西方教育理论牵着鼻子走","B":"教育工作者应利用最新科技探索“怎么培养人”的问题","C":"教育价值观的问题比教育技术的问题更为重要","D":"回答“怎么培养人”的问题是教育工作的核心"},"answer":"B","page":46},{"id":143,"chapter":4,"num":23,"source":"2018联考","type":"中心理解","stem":"新西兰旅游局官网近日表示，新西兰每年吸引370万游客。2017年11月的一项调查结果显示，大约 23%的新西兰人认为游客数量过多，另有 23%认为过少，超过 40%的人担心旅游业发展带来的种种压力。调查对象中，大约92%的人认为国际旅游有益新西兰发展，87%的人欢迎国际游客。","prompt":"这段文字意在说明：","options":{"A":"新西兰旅游业特别兴旺发达","B":"新西兰的大多数民众欢迎国际游客","C":"新西兰的旅游市场前景广阔","D":"新西兰因游客多而喜忧参半"},"answer":"D","page":46},{"id":144,"chapter":4,"num":24,"source":"2023 河南事业","type":"中心理解","stem":"进入旅游者视角的山山水水，如果仅仅具有地理学或者地质学上的意义，那么它的美就变得十分有限，因为这种纯静态的自然景观迟早会让旅游者感到枯燥乏味。而当多姿多彩的旅游文化赋予这些静态的景观以人文美之后，一切便不同了，一山一水不再仅仅是一山一水，它或鳞突兀，状似困兽；或娜多姿，形如美人。无数的神话传说，历代文人骚客的吟咏，身临其间，眼前是如画美景，路边是亭台楼阁，耳边又萦绕着幽怨动人的传说、抑扬顿挫的千古名句；这边是“小桥流水人家”的玲珑剔透，那边是“古道西风瘦马”的悲凉沧桑，哪还会有“乏味”二字，这全赖于旅游文化作用的体现。","prompt":"这段文字意在说明：","options":{"A":"旅游活动中要多关注当地旅游文化","B":"缺少文化的旅游活动是没有意义的","C":"旅游文化具有丰富旅游活动的作用","D":"各旅游地要充分挖掘本地旅游文化"},"answer":"C","page":46},{"id":145,"chapter":4,"num":25,"source":"2024 四川","type":"中心理解","stem":"ABO 血型是最常见的红细胞血型系统。A型血的人红细胞表面有A抗原，血浆中有天然的抗 B抗体；B型血的人红细胞表面有 B抗原，血浆中有天然的抗 A抗体；O型血的人红细胞表面没有抗原，血浆中有天然的抗 A抗体和抗 B抗体；AB 型血的人红细胞表面有A抗原和B抗原，血浆中没有抗体。同一种抗原和抗体之间会“相互吸引”，发生凝集反应，例如，红细胞上有 A抗原，血清中有抗 A抗体，便会发生凝集，如果红细胞缺乏某一种抗原或血清中缺乏与之对应的抗体，就不发生凝集。因此，为了避免凝集反应，应该同型输血。由于〇型血的红细胞表面没有抗原，被称为“万能供血者”，AB 型血的血浆中没有抗体，被称为“万能受血者’。","prompt":"关于血型，这段文字没有涉及：","options":{"A":"同型输血的基本原理","B":"血型的分类标准","C":"发生血液凝集反应的原因","D":"红细胞的主要功能发生"},"answer":"D","page":47},{"id":146,"chapter":4,"num":26,"source":"2024 事业联考","type":"中心理解","stem":"基于地震波的预警系统有时候反应太慢，无法在大型地震发生的当下准确估算地震规模，为了解决这一问题，科学家想到了即时弹性重力信号。这一信号由岩体突然错动导致重力变化而产生，以光速传播，在震级较高的情况下是可监测的。科学家利用这种信号训练了一个深度学习模型，并利用回溯某次大型地震实时数据进行了测试，结果发现这一模型能准确计算地震方位、地震规模以及地震随时间的变化。重要的是，即时弹性重力信号能快速给出以上信息，在地震波到达前就作出判断，同时，只需微调就能在其他地区实时使用这一模型。","prompt":"根据以上文字可以知道：","options":{"A":"地震波预警系统的反应速度将会得到大幅度提升","B":"这一深度学习模型可实现对大型地震的早期监测","C":"即使震级很低，即时弹性重力信号也可以被捕捉","D":"即时弹性重力信号预警系统已经实现成功的预测"},"answer":"B","page":47},{"id":147,"chapter":4,"num":27,"source":"2025 深圳","type":"细节判断","stem":"资本在它产生的那一刻起就成为一个充满着矛盾的混合体。虽然它作为一种生产关系无法长久地驾驭它自己创造出来的生产力，虽然它带来了资本主义社会极端个人主义张扬和两极分化，虽然它开拓世界市场引起民族国家之间对立、世界霸权主义盛行和地缘战争频发等。但是，资本作为进步力量，将处于分散状态的生产资料、财产和人口集聚起来，创造出以往一切时代都难以比拟的生产力。资本作为现代经济发展的润滑剂、倍增器，促进了现代社会发展。我们要研究资本，要研究资本的积极方面。社会主义市场经济是一个伟大创造，社会主义市场经济中有各种形态的资本，要发挥资本作为生产要素的积极作用，同时有效控制其消极作用。","prompt":"下列说法与上文意思不相符的是：","options":{"A":"两极分化、霸权主义、地缘战争等问题可能因资本而起","B":"资本作为一种生产关系能使生产力实现前所未有的发展","C":"对资本的研究需要重点关注其作为进步力量的积极方面","D":"社会主义市场经济制度是有效发挥资本积极作用的产物"},"answer":"D","page":48},{"id":148,"chapter":4,"num":28,"source":"2023 福建事业","type":"标题填入","stem":"一项历时10年的研究结果表明：一直被视为单一物种的中国大至少由5个隐存物种组成。这一发现意味着本已危机四伏的中国大保护工作面临更大的挑战一一近年来，规模化养殖、野外放归等一系列“保护”行为，也许直接污染了大不同物种的基因独特性。“保护”直接导致的后果，很可能是基因同质化，也许其中一些隐存物种已经遭遇灭顶之灾。","prompt":"最适合做这段文字标题的是：","options":{"A":"大虽有隐存物种但仍濒临消失","B":"基因同质化让中国大遭遇危机","C":"新发现给保护大带来新的问题","D":"对大的“错爱”也许是一种伤害"},"answer":"D","page":48},{"id":149,"chapter":4,"num":29,"source":"2021黑龙江紧缺","type":"标题填入","stem":"不久前，一个收获颇丰的考古队发现了一个来自伦敦泰士河泥泞河岸的玩具骑士。据悉，它已有1300年左右的历史。这个玩具为我们展现了中世纪儿童童年的一些面貌。中世纪的人们和现在一样，有自己的文化。这个玩具骑士是使用模具批量生产而成。它可能流传于商人、店主、工匠、贵族和绅士家庭。","prompt":"最适合做这段文字标题的是：","options":{"A":"玩具是了解中世纪儿童童年的一扇窗户","B":"中世纪父母对孩子的爱传承到今天","C":"中世纪玩具的起源","D":"中世纪玩具的考古价值"},"answer":"D","page":48},{"id":150,"chapter":4,"num":30,"source":"2025 河北三支","type":"中心理解","stem":"返乡青年创业的领域主要集中在特色农业、乡村旅游、电商直播等新兴产业，形式丰富多样。他们或引入绿色种植技术、延伸农业产业链条，或有效盘活乡村闲置资源、开发农文旅融合项目，或利用媒体平台、数字技术推销乡村特色产品。青年人才的到来，带来了更为先进的技术、管理和理念，推动了乡村产业的多元化发展，提升了乡村经济的附加值，拓展了乡村的就业和增收空间。免费学习资料库加微信：Sasm19","prompt":"这段文字意在强调：","options":{"A":"青年返乡为乡村发展注入活力","B":"青年返乡带来城乡关系的结构性变化","C":"青年返乡推动了城乡融合发展","D":"青年返乡拓展了乡村经济空间"},"answer":"D","page":49},{"id":151,"chapter":4,"num":31,"source":"2024联考","type":"中心理解","stem":"“中华”一词始于胡汉的区分，却终于胡汉的融合。所以产生这样的结果，根本原因在于“中华”一词并不是一个狭义的“汉人”概念，而是一个较宽泛的文化概念，既不对胡族设限，胡族对其也无明显的抵触与排斥。特别是“中华”之“华”所具有的以“衣冠礼乐”来喻指文化的象征意义，给“中华”这一概念带来了极大的包容度。人唐以后，“中华”一词作为唐朝别称与中国名号被广泛使用的事实，清楚地告诉我们，“中华”概念的实质是“华夷融合”。从很大意义上说，这正是后来历史发展中被“中华”所称谓的人们共同体得以不断扩大的原因。","prompt":"根据这段文字，“中华”一词的特点是：","options":{"A":"文化性","B":"历时性","C":"模糊性","D":"开放性"},"answer":"D","page":49},{"id":152,"chapter":4,"num":32,"source":"2018 四川","type":"中心理解","stem":"高阶人工智能带来福祉还是挑战，是许多文学、电影作品不断探讨的主题。近年来大众传播对人工智能的关注，无形中也加重了人们对“人机关系”的焦虑。例如，人工智能用人脸识别技术与深度学习能力挑战人类记忆高手，“阿尔法狗”攻占人类智力游戏的高地·…·尤其是一些以“人机对战”为头的综艺节目，通过混淆人工智能的概念，人为渲染了一种人机之间紧张的对立气氛，既无必要，也缺乏科学性。事实上，现在所有人工智能仍属于在“图灵测试”概念下界定的“智能”，无论是根据神经网络算法的翻译程序，还是基于量子计算理论的各种模型，在未来很长时间内都将是从属于人类的工具。","prompt":"这段文字意在强调：","options":{"A":"人工智能的发展水平很难超越人类","B":"应理性看待人类与人工智能的关系","C":"媒体在宣传人工智能时应客观科学","D":"人工智能的发展应与科普宣传同步"},"answer":"B","page":49},{"id":153,"chapter":4,"num":33,"source":"2023事业联考","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①在地球上观测，我们看到月亮、太阳、行星等在星空背景上不断移动着位置，这其实是地、月、行星公转运动的反映。\n②苏东坡在《前赤壁赋》中描写月亮时提到“月出于东山之上，徘徊于斗牛之间”。\n③斗宿即现在人马座的南斗六星，牛宿位于斗宿的东边，相当于现在摩羯座的右角附近天区，它们之间相距 20 度左右。\n④在《前赤壁赋》中，当晚从月出到月落，月亮一共走过了差不多六七度，大致是斗宿、牛宿之间三分之一的距离。\n⑤若非苏子与客“饮酒乐甚，扣舷而歌”、洗盏更酌彻夜流连，恐怕还真不易察觉。\n6月亮大约27.3天绕地球公转一周，称为恒星月，因此我们差不多一个月能见到它在星空中走过一圈。","prompt":"","options":{"A":"①⑥②④⑤③","B":"②③①⑥④⑤","C":"③⑥④⑤②①","D":"⑥②⑤③①④"},"answer":"B","page":50},{"id":154,"chapter":4,"num":34,"source":"2023江苏","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①而纪录片恰恰可以充当人们走近非遗的“桥梁”\n②以期给观众带来人文精神和审美体验的双重享受\n③非物质文化遗产古老而传统，有些还有着较高的门槛，大众要深入了解并不容易\n④最初，田野考察中拍摄影像的目的，主要是做好非遗的记录和留存工作，侧重真实性、准确性\n⑤也因此被寄予了更多传播、普及非遗的期待\n⑥而面向大众的影视纪录作品，在真实记录非遗技艺的同时，还努力追求镜头美、语言美、叙事美","prompt":"","options":{"A":"④⑤③⑥②①","B":"③⑤⑥④①②","C":"③①④⑥②⑤","D":"④③⑤⑥②①"},"answer":"C","page":50},{"id":155,"chapter":4,"num":35,"source":"2026四川","type":"语句填空","stem":"一方面，________。习近平总书记指出：“必须充分尊重人民所表达的意愿、所创造的经验、所拥有的权利、所发挥的作用。”要通过落实新发展理念，激发人民的活力，鼓励基层群众先行先试，大胆探索新路子，调动各方面积极性、主动性、创造性，推动新技术、新产业、新业态加快发展。另一方面，要从人民群众中汲取智慧和力量。坚持问政于民、问需于民、问计于民，动员和依靠全体人民积极支持和参与，共同担负起推动发展的责任。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"要发挥人民的首创精神","B":"发展需人民的积极参与","C":"必须保持同人民的血肉联系","D":"落实新发展理念要依靠人民"},"answer":"A","page":51},{"id":156,"chapter":4,"num":36,"source":"2025 浙江事业","type":"中心理解","stem":"现代国家治理越来越成为一项追求精细与准确的超大规模复杂工程，以往通过向专家学者等外部智力支持进行决策咨询的知识调用模式，已难以满足动态且分散的决策需求；同时，各种治理难题也难以被化约为简单的技术方案。这需要各级干部基于自身知识储备特别是在长期任职中所形成的实践性知识，以“时间换空间”的责任感提出兼具操作性与科学性的治理思路。迅速发展的技术为国家治理提供了新方法，也对各级干部队伍能否与时俱进用好这些新工具提出了挑战。","prompt":"这段文字意在说明：","options":{"A":"专家、智库辅助支持国家治理的模式已经过时","B":"解决治理难题需要兼具操作性与科学性的方法","C":"现代国家治理对干部的知识结构提出了新要求","D":"能否利用数字技术是衡量干部的一项重要标准"},"answer":"C","page":51},{"id":157,"chapter":4,"num":37,"source":"2023联考","type":"中心理解","stem":"风力发电机，除了需要经常“喝西北风”，还要经常“晒日光浴”。白色不会吸收太多的紫外线辐射，并能够反射所有色光，以缓解机组内部发电机、变流器等电器设备的散热问题，同时也会降低一些风险，比如降低润滑油、润滑脂发生干燥、产生气泡等风险。","prompt":"这段文字解答了这样一个问题：","options":{"A":"风力发电机需要经常做哪两件事","B":"为什么风力发电机以白色为优选","C":"风力发电机“晒日光浴”有什么风险","D":"机身颜色对保护风力发电机有多重要"},"answer":"B","page":51},{"id":158,"chapter":4,"num":38,"source":"2022联考","type":"语句填空","stem":"热水和冷水混在一起会变成温水。但是，温水不会自发分成热水和冷水。热量只能从热的物体向冷的物体单向传递，这一原理称为“热力学第二定律”。如果用分子这一微观视角看这一定律，物质的温度取决于其中沿着随机方向运动的分子的速度。分子运动速度快就会变热，速度慢就会变冷。但是数量庞大的分子运动时，各个分子的运动速度不是固定的。说到底，温度只不过是以不同速度运动的分子的平均速度罢了。因此，如果能够从以各种速度运动的分子中，只筛选出运动速度快的分子,从理论上说,就应该能________0","prompt":"填入画横线处最恰当的句子是:","options":{"A":"从温水中单独提取出热水","B":"从温水中自发分出冷热水","C":"不使用能量就把冷水烧开","D":"不通过传递就把热水变温"},"answer":"A","page":52},{"id":159,"chapter":4,"num":39,"source":"2023 河北事业","type":"接语选择","stem":"失眠是最为常见的睡眠障碍。要判断是否患有失眠，首先要看入睡是否困难，若入睡潜伏期超过30 分钟，一整夜觉醒的次数大于等于2次，存在早醒和睡眠质量下降等情况，或者总睡眠时间少于6个小时，就意味着存在失眠问题。长期失眠会导致白天精力不足、思考困难、注意力难以集中或者情绪不稳定、焦虑、抑郁等。还会造成自身免疫系统功能下降，对疾病的抵抗力降低，增加糖尿病、肥胖、高脂血症的患病风险。","prompt":"文章接下来最有可能讨论的是:","options":{"A":"失眠对人体的危害","B":"导致失眠的原因","C":"缓解失眠的措施","D":"获得良好睡眠的建议"},"answer":"B","page":52},{"id":160,"chapter":4,"num":40,"source":"2024国考","type":"接语选择","stem":"过去“时事新闻”不受著作权法的保护，何谓“时事新闻”一直界定困难且存在争议。2020 年《关于修改<中华人民共和国著作权法>的决定》将不受法律保护的时事新闻压缩为“单纯事实消息”，这意味着除此以外的绝大多数新闻作品都有可能成为著作权法意义上的“作品”，此举不但厘清了新闻报道保护与不保护的界限，还遏制了洗稿、随意转载等侵权现象，加大了对新闻作品的保护力度。不过在全媒体时代新闻作品版权保护仍面临着诸多障碍，只有在有效版权保护的前提下做好内容传播，才能推动新闻出版更高质量发展。","prompt":"这段文字接下来最可能讲的是:","options":{"A":"明确时事新闻范围对版权保护的意义","B":"全媒体时代新闻作品版权保护的思路","C":"当前新闻作品版权保护面临的诸多困境","D":"我国新闻出版社更高质量发展的前提条件"},"answer":"B","page":52},{"id":161,"chapter":5,"num":1,"source":"2020事业联考","type":"逻辑填空","stem":"微博刷热搜、电影刷高分、餐馆刷好评、微信刷阅读量，这种“以银子换热度，以热度挣银子”的模式背后，________出“流量至上”“唯流量论”思维的流弊。网络留下的是时代的________，流量反映的是公众的心声，但掺水的数据、虚假的点击，并不能成为这个时代有说服力的________。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"反映   镜像   形象","B":"暴露   记忆   见证","C":"渗透   积淀   记载","D":"折射   烙印   注脚"},"answer":"D","page":53},{"id":162,"chapter":5,"num":2,"source":"2026河南事业","type":"逻辑填空","stem":"想要真正实现技术的向上向善，就必须将公平、准确、透明、可解释等价值原则嵌入技术的底层“座驾”中。互联网平台不该成为流量的角斗场、戾气的发酵池，而应该成为真实社情民意的________，记录每一个普通人真正关心什么、需要什么。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"里程碑","B":"风向标","C":"晴雨表","D":"试金石"},"answer":"C","page":53},{"id":163,"chapter":5,"num":3,"source":"2021浙江","type":"逻辑填空","stem":"水雷虽老，却依然是军舰的“________”。一方面，水雷威力巨大，即便是一些老式水雷也会对现代海军舰船构成相当威胁；另一方面，水雷研发难度低，制造成本也不高，因此平时可以大批量地制造、储备，战时可以大面积布设。所以，直到现在水雷依然是各国海军武器库的________o","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"噩梦   必备","B":"天敌   王牌","C":"仇家   底牌","D":"克星   主力"},"answer":"A","page":53},{"id":164,"chapter":5,"num":4,"source":"2021事业联考","type":"逻辑填空","stem":"电影是“文化名片”，生动地展示着一个国家的形象；也是“文化底片”，形象地显影着一个国家的________；电影是“文化芯片”，深刻地________着一个国家的精神密码。电影并不提供解决方案，但却让陌生的心灵相通，成为我们彼此贴近、________对方的“通行证”。","prompt":"依次填入画横线处最恰当的是：","options":{"A":"内涵   传递   理解","B":"底蕴   揭示   抵达","C":"神采   谱写   拥抱","D":"气质   建构   接纳"},"answer":"B","page":53},{"id":165,"chapter":5,"num":5,"source":"2020江苏事业","type":"逻辑填空","stem":"这对教授夫妇无疑都是极具创造力的学者，他们分别在各自________的科学领域内锐意进取、________，几十年如一日，至今都已著作等身，________；但他们依然坚持学术研究，不断开创新的学术天地。","prompt":"依次填入画横线处最恰当的一项：","options":{"A":"专擅   笔耕不辍   功成名就","B":"从事   孜孜不倦   大功告成","C":"钻研   披星戴月   如日中天","D":"擅长   苦心孤诣   声名鹊起"},"answer":"A","page":54},{"id":166,"chapter":5,"num":6,"source":"2020国考","type":"逻辑填空","stem":"过去，我国生产能力滞后，因而把工作重点放在扩大投资、提高生产能力上。现在，产能总体过剩，仍________靠扩大规模投资抬高速度，作用有限且边际效用递减。虽然短期内投资可以成为拉动经济增长的重要动力，但最终消费才是经济增长的________动力。在扩大有效投资、发挥投资关键作用的同时，必须更加有效地发挥消费对增长的________作用。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"一味   持久   基础","B":"片面   根本   决定","C":"盲目   核心   一般","D":"单纯   长期   实质"},"answer":"A","page":54},{"id":167,"chapter":5,"num":7,"source":"2024重庆三支","type":"逻辑填空","stem":"古典乐往往能塑造出影片的古典气质，但古典乐毕竟不是为电影配乐而作，大部分古典乐都免不了与电影有些________。更别提古典乐在发展部中，情绪不断变化游走，往往很难被________地嵌入电影场景中。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"格格不人   适逢其时","B":"削足适履   丝丝入扣","C":"若即若离   浑然天成","D":"貌合神离   恰如其分"},"answer":"D","page":54},{"id":168,"chapter":5,"num":8,"source":"2022江苏","type":"逻辑填空","stem":"中亚探险史，罗布泊是一个________的话题。我们所面对的“丝绸之路热”，是对罗布泊探险的接续。在一百多年的时间长河里，她绚丽的颜色一直没有褪去。当人们读到这本书的最后一页时，会为罗布荒原的大地早就面目全非而________，也会为作家从容穿越于时间壁垒间的气魄________o","prompt":"依次填入画横线处最恰当的一项是：","options":{"A":"历久弥新   痛心疾首   自愧弗如","B":"经久不衰   怅然若失   拍案叫绝","C":"讳莫如深   胃然长叹   击节赞叹","D":"众说纷纭   抱恨终天   赞不绝口"},"answer":"B","page":54},{"id":169,"chapter":5,"num":9,"source":"2021事业联考","type":"逻辑填空","stem":"近年来，随着外部环境和我国发展所具有的要素禀赋的变化，市场和资源两头在外的国际大循环动能明显减弱，而我国内需潜力不断释放，国内大循环活力日益强劲，客观上有着________的态势，对这个客观现象，理论界进行了很多讨论，可以继续深化研究，并提出________o","prompt":"依次填入画横线处最恰当的一项是：","options":{"A":"缺一不可   深谋远虑","B":"等量齐观   远见卓识","C":"取而代之   肺腑之言","D":"此消彼长   真知灼见"},"answer":"D","page":55},{"id":170,"chapter":5,"num":10,"source":"2023国考","type":"逻辑填空","stem":"随着技术发展，以数字手段为支撑的“沉浸式”“交互式”网上博物馆日益增多，提高了展览的________。但随着智能终端的普及，人们难免会对数字博物馆产生________。博物馆在利用数字技术的基础上，也不能忽视实物展览内涵的提升，使之兼备文化和教育功能，突出________的特点。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"科技性   排斥   润物无声","B":"便捷性   厌倦   触手可及","C":"趣味性   疲劳   寓教于乐","D":"交融性   失望   与时俱进"},"answer":"C","page":55},{"id":171,"chapter":5,"num":11,"source":"2023事业联考","type":"逻辑填空","stem":"海底地声参数是预报浅海声学现象的关键参数之一，但是直接采样测量比较困难，若能_________得到海底参数，在军事上会占有先机，特别是，利用海洋环境噪声这种在海洋中_________存在的背景声场获取地声参数，不需要发射信号，有利于作战的隐蔽。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"快速   普遍","B":"间接   客观","C":"轻松   原本","D":"稳定   天然"},"answer":"A","page":55},{"id":172,"chapter":5,"num":12,"source":"2021黑龙江机紧缺","type":"逻辑填空","stem":"当时的电影只是对原生态生活的_________，侧重的是电影的照相本性。这些“活动相机”带有________风格，最初的观众得以带着惊奇的目光从银幕上辨认出“自己”和日常生活世界，由此获得崭新的体验。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"描述   纪事","B":"描写   记录","C":"描摹   纪实","D":"描绘   纪事"},"answer":"C","page":55},{"id":173,"chapter":5,"num":13,"source":"2026重庆事业","type":"逻辑填空","stem":"科学研究表明，地球上海拔每升高1000米，气温就会下降大约6℃。正所谓“人间四月芳菲尽，山寺桃花始盛开”。古人以此来推断高不可测的月亮的温度，可谓________。现在我们知道，月球夜晚温度可降至零下170℃左右，但因为空气稀薄，昼夜温差可达300℃。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"画蛇添足","B":"弄巧成拙","C":"歪打正着","D":"误打误撞"},"answer":"C","page":55},{"id":174,"chapter":5,"num":14,"source":"2019 联考","type":"逻辑填空","stem":"给科研人员减负，更需要从基层做起。很多好政策之所以落地效果大打折扣，就是因为卡在了“最后一公里”。科研院所等单位是抓落实的最后环节，要进一步解放思想，________政策，________政策，________主体责任，________管理。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"理解   利用   发挥   强化","B":"学习   运用   强化   优化","C":"吃透   用好   担起   优化","D":"分析   用好   明确   强化"},"answer":"C","page":56},{"id":175,"chapter":5,"num":15,"source":"2022事业联考","type":"逻辑填空","stem":"国家网信办等四部门联合发文，规定了39 种常见类型移动互联网应用程序的必要个人信息范围。此次规定，通过对手机应用________、精准施策，开出必要个人信息的“正面清单”。这从源头上为移动互联网应用程序的个人信息保护明确了底线，让应用的运营商不跑偏，也为相关部门的后续监管设定了________0","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"分门别类   路标","B":"量体裁衣   节点","C":"抽丝剥茧   标尺","D":"条分缕析   基点"},"answer":"A","page":56},{"id":176,"chapter":5,"num":16,"source":"2026重庆事业","type":"逻辑填空","stem":"AI能否写诗？答案是肯定的。AI完全有可能写出________的诗。事实上，AI诗歌比其创作的日常语言更容易通过图灵测试（测试是否为人类语言）。因为后者必须考虑现实经验，而 AI没有身体，无法________人类的动作顺序，在叙述时难免露出破绽，“具身认知”是AI自然语言面临的难题，诗歌却可以回避这一点。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"以假乱真   掌握","B":"滥竿充数   模仿","C":"标新立异   复制","D":"名副其实   再现"},"answer":"A","page":56},{"id":177,"chapter":5,"num":17,"source":"2025国考","type":"逻辑填空","stem":"此前，司法机关获取救助线索主要靠人工摸排，这存在一定的________、被动性。为此，司法机关尝试运用大数据，主动发现救助线索，实现“应救尽救、应救即救”，同时衔接社会救助力量，构建多元帮扶机制，提供________救助，切实解决了一些困难群体急难愁盼问题。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"片面性   一揽子","B":"滞后性   全方位","C":"偶然性   一站式","D":"局限性   全天候"},"answer":"B","page":56},{"id":178,"chapter":5,"num":18,"source":"2019 联考","type":"逻辑填空","stem":"打开书本，一股久违了的墨香扑面而来；摩纸张，淡淡的凹凸感非常舒服。味觉、视觉、触觉顿时都活泛起来，连脑细胞也显得格外活跃。读累了，就闭眼歇一歇，顺便回味刚读过的情节，思考作者的________；看到精彩的描写和精辟的议论，就反复重读、吟咏再三，读到妙处更是________0","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"春秋笔法   弹冠相庆","B":"言外之意   低头折节","C":"弦外之音   额手称庆","D":"微言大义   击节赞叹"},"answer":"D","page":57},{"id":179,"chapter":5,"num":19,"source":"2026联考","type":"逻辑填空","stem":"奶皮子与糖葫芦的组合，精准________了年轻人“怀旧+猎奇”的双重心理，因此迅速风靡各地。对这些消费者而言，在快节奏的现代生活中，排队3小时的等待不再是________，而是为热爱付出的仪式感；为此花费数十元也不再是________的消费支出，而是劳自己的“小确幸”。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"契合   负累   轻率","B":"击中   煎熬   单纯","C":"捕捉   浪费   纯粹","D":"匹配   虚耗   奢侈"},"answer":"B","page":57},{"id":180,"chapter":5,"num":20,"source":"2022事业联考","type":"逻辑填空","stem":"年轻人常常面临成为生活“局外人”的风险，如何锚定生活的坐标、________意义的网络，这个过程需要不断地和他人的生活进行________。而纪录片则提供了一个参考系。优秀的纪录片带着年轻人去看他人的生活、看他人的时代，这正是成长所必需的自我对话和自我发现的过程。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"编织   比照","B":"构建   协商","C":"完善   融合","D":"定位   交流"},"answer":"A","page":57},{"id":181,"chapter":5,"num":21,"source":"2026天津事业","type":"中心理解","stem":"构建多元化食物供给体系，要从食物系统的角度审视中国的农产品供给。以大豆生产为例，大豆产量占四大粮食总产量的比重不到3%，单纯从数量角度考虑，要提高我国粮食总产量，直观来看，重点不应该是大豆。然而，若从系统观点视之，大豆压榨而成的豆粕是中国畜禽养殖业重要的蛋白饲料来源，水产养殖业发展也依赖豆粕。畜禽产品的消费带动了规模化养殖业的发展，带来了对饲料粮，尤其是蛋白饲料粮大豆的需求。并且，畜禽、水产养殖业发展关乎中国居民能否吃得营养。","prompt":"以上段落文字想要说明的是：","options":{"A":"构建多元化食物供给体系的重要性","B":"大豆对构建多元化食物供给体系至关重要","C":"大豆虽然在食物系统中有重要作用，但目前产量小","D":"大豆的总产量不足，限制了其成为多元化食物链中的一员"},"answer":"A","page":57},{"id":182,"chapter":5,"num":22,"source":"2024北海事业","type":"中心理解","stem":"音乐还是现场的好，因为现场的音乐是“活”的。以音乐会为例，那扑面而来的音浪直击心灵，让人陶醉、令人动容。有人说“就算全世界的音乐都能存进你的手机，也比不上听一场现场音乐会”。因为音乐会现场蕴含着无穷的可能性，它的美妙之处就在于，你永远不知道下一秒会是什么场景、会有什么声音，舞台上的音乐人、艺术家会碰撞出怎样的火花，会有怎样的灵感乍现。作为观众，随时可能成为现场音乐的一部分。同理，人们千里迢迢跨城观看演唱会、音乐节，无论是奔着歌手，还是奔着作品，都源于对“活”的音乐的憧憬与向往。","prompt":"以上文字可能在试图解释：","options":{"A":"相较往年，今年的音乐现场更加充满活力","B":"音乐现场演出市场如火如荼的原因","C":"为什么听音乐现场的感受好过用手机听音乐","D":"观众跨城观看演唱会，是一件利大于弊的事"},"answer":"C","page":58},{"id":183,"chapter":5,"num":23,"source":"2022浙江","type":"中心理解","stem":"目前，水和肥料都没有在农业中得到最佳使用，传统的植物栽培方法，使大部分水和化学物质，穿过土壤“溜过”根部，与地下水混合。为此，全球农业科技工作者都在寻找可以解决问题的新材料。某大学科研人员开发出一种聚合物水凝胶，该凝胶可作为土壤的“智能”添加剂，有助于避免土壤污染，显著减少用水量并改善植物对肥料的吸收。该研究员说，新研发的水凝胶能够在下雨或灌溉时储存大量水分，然后随着土壤变干缓慢释放。同时，这种水凝胶完全可以生物降解，也就是说，经过一段时间后，它们会“溶解”在土壤中，毫无踪迹。","prompt":"这段文字意在说明：","options":{"A":"根部肥料往往远离根部未发挥其肥料作用","B":"聚合物水凝胶可减少土地用水并避免污染","C":"大量使用化学肥料使土壤状况被破坏","D":"新研发的水凝胶在土壤中可完全降解"},"answer":"B","page":58},{"id":184,"chapter":5,"num":24,"source":"2024吉林","type":"中心理解","stem":"春季星空有划过天空的“春季大弧线”和众多的深空天体。秋季星空有“秋季四边形”，还可以看到北半球唯一一个可以肉眼看到的河外星系——仙女星座。仙女星座非常明亮，即使远在距地球 254万光年之外，在地球上的我们依然能仅凭肉眼就看到它灿烂的光辉。冬季星空亮星较多，有显著的“地标”一—“冬季大三角”，以及辨识度很高的猎户座，因此冬季也是观赏星空的好时机。夏季星空的最大亮点，便是璀璨的银河高挂天空，银河系的“银心”正位于人马座方向，人马座在夏夜空中逗留的时间最长一—此时的星空，正是“群星闪耀时”。","prompt":"对这段文字的主旨概括准确的是：","options":{"A":"四季星空，各美其美","B":"我约星辰，星约四季","C":"夏夜长空，星系闪耀","D":"星汉灿烂，扮美四季"},"answer":"A","page":59},{"id":185,"chapter":5,"num":25,"source":"2022广东","type":"中心理解","stem":"建设生态文明，要在形成支持绿色发展、循环发展、低碳发展的机制上下真功夫、下大气力；主动抓住新一轮科技革命和产业变革带来的新机遇，掌握革命性、关键性绿色核心技术，进而带动生态技术和生态产业交叉融合、群体跃进。换言之，从“生产力与生产关系矛盾运动规律”来看，如同“铁和犁”于农业文明、“纺纱机和蒸汽机”于工业文明一样，只有实现绿色生产力和绿色生产关系的根本性变革，生态文明才会成为真正引领人类文明的新形态。","prompt":"对上述文段理解最准确的是：","options":{"A":"生态文明是人类文明形态中的最高级阶段","B":"生产力和生产关系的辩证关系决定了生态文明的发展","C":"实现绿色生产关系变革的关键是取得绿色核心技术突破性进展","D":"形成支持绿色、循环和低碳发展的机制是生态文明建成的标志"},"answer":"B","page":59},{"id":186,"chapter":5,"num":26,"source":"2025联考","type":"细节判断","stem":"农作物中，粟是古人最早的主食之一，其俗名谷子，禾本科狗尾草属。新石器时期的黄河流域就栽培粟，夏商时期被学者称为“粟文化时代”。《孟子·尽心下》云：“有布缕之征，粟米之征，力役之征。”至秦汉时期，粟是种植最多的谷物。唐宋时期，中国南方也提倡种粟。古人食粟，曾使用“石炙法”一一将粟米磨碎后，放在石板上面，再用火烤熟后食用。随着生产力的发展，由陶、铜、铁等材料制作的各种炊具出现，如隔、颤等，人们把粟米放入炊具中加水煮，就成了不仅易消化，还具有生津益气功效的小米粥。","prompt":"下列说法不能从文中得出的是：","options":{"A":"先秦时期征收粟米已经成为一种税赋形式","B":"粟米的种植数量曾经超过水稻等其他谷物","C":"我国粟米的种植覆盖南北方已有千年历史","D":"在石板上用火烧烤是古人最早的食粟方式"},"answer":"D","page":60},{"id":187,"chapter":5,"num":27,"source":"2024四川","type":"中心理解","stem":"心脏病发展的最危险形式之一是所谓的心脏猝死现象，它可以在几分钟内发生。传统心电图只能记录心脏明显的变化，无法预测潜在的威胁。科研人员开发的早期诊断仪，可以更准确地测量心脏的电活动，监测心肌细胞的早期病理变化，以预防心脏猝死，而无需通过复杂的手术干预。这是研究人员首次找到早期心脏活动变化的无创诊断方法，无需心脏手术，也无需通过静脉插入电极。因为这种新设备不仅能实时提供超高分辨率心电图，而且还能记录0.3微伏以上的微电势，持续时间0.1微秒以上，而心电图仪无法做到这一点。","prompt":"根据这段文字，下列哪项不是早期诊断仪的优势？","options":{"A":"预测可能发生的心脏猝死","B":"辅助心肌梗塞患者的治疗","C":"实时提供超高分辨率的心电图","D":"诊断过程中不会给患者造成创伤"},"answer":"B","page":60},{"id":188,"chapter":5,"num":28,"source":"2026联考","type":"标题填入","stem":"当前，文化出海正迎来从“单品输出”向“生态构建”的转变。比如，有的文化产业公司将国内成熟的平台机制移植到海外，通过在地化运营，形成“内容付费一作者签约一读者互动”的完整生态链，同时借助IP授权、合作开发等，创新IP 海外开发推广模式。“生态化”，既要着力构建线上线下融合、实体数字并重的对外传播网络，把“单向传播”升级为“全球共创”；也要积极拓展国际文化“朋友圈”，聚合优质资源，构建多元协同的全球文化传播网络，开创文明对话新格局。","prompt":"最适合做这段文字标题的是：","options":{"A":"文化出海：以生态促共创","B":"文化出海：从输出到共创","C":"文化出海：生态构建新阶段","D":"文化出海：构建文明对话新格局"},"answer":"C","page":60},{"id":189,"chapter":5,"num":29,"source":"2023重庆事业","type":"标题填入","stem":"很多人认为街道绿化大面积喷洒消毒剂，出门才不怕有病毒侵袭，然而这样做其实是不对的，重视消毒很好，但也要注意科学合理，少量的病毒和细菌并不会对人体健康构成威胁，过度消毒会导致正常生活中的细菌明显减少，对人体免疫刺激不足，反而容易引起人体免疫失衡，出现免疫系统疾病，另外长期过度使用消毒剂会造成环境中致病微生物的耐药性，助力病原菌生长，从而减弱消毒剂的消毒效果，导致微生物环境失衡，引发超级细菌的产生。","prompt":"最适合做这段文字标题的是：","options":{"A":"消毒对免疫系统的影响","B":"经常进行消毒有必要吗?","C":"消毒对生态环境的影响","D":"消毒越干净就越安全吗?"},"answer":"D","page":61},{"id":190,"chapter":5,"num":30,"source":"2021福建事业","type":"中心理解","stem":"最近一项研究指出，火星上的液态卤水或许比之前认为的更常见，存在时间也更长。不过研究人员认为，这些卤水的性质和温度决定了它们并不适合地球上的微生物生存。由于火星大气太稀薄、温度太低，稳定的液态水无法在火星表面长时间维持。但是盐的存在能创造液态物质，比如卤水，这种物质可以在火星条件下保持一段时间的稳定。研究人员将一个经过实验验证的热力学模型和一个气候模型结合，借此研究火星的哪些位置可以形成卤水，以及卤水可以存在多长时间。他们发现 40%的火星表面—包括赤道在内的所有纬度都能存在稳定的卤水。","prompt":"这段文字意在说明：","options":{"A":"火星表面卤水很常见但不支持生命","B":"火星条件下的卤水不易改变其性能","C":"火星表面无法长时间维持稳定的液态水","D":"火星哪些位置可以形成卤水还有待发现"},"answer":"A","page":61},{"id":191,"chapter":5,"num":31,"source":"2024 黑龙江专项","type":"词语理解","stem":"病毒有上千万种，但无论哪一种病毒入侵机体的基本原理都是一样的。即其自身遗传物质（如DNA 等）会不可避免地被带入到宿主细胞中，继而导致机体针对这些外源遗传物质迅速做出强烈的免疫应答以清除病毒感染，甚至不惜以伤及自身为代价，这是病毒感染导致致死性炎症的主要原因。","prompt":"文段中画横线的“其”指代的是：","options":{"A":"机体","B":"病毒","C":"宿主","D":"细胞"},"answer":"B","page":62},{"id":192,"chapter":5,"num":32,"source":"2020江苏","type":"中心理解","stem":"在电影表现的技术层面，数字技术事实上已经代替了同源成像技术，出现了由电脑生产影像所构造的故事片。电脑生产的影像已经不再局限于单纯的特技效果，它们构成了影片全部蒙太奇中的镜头，主要角色都是完全或部分由电脑合成。在电影的发行和放映环节，具有质感的胶片卷，放映机吵闹的声音，抑或是影像剪辑表，还有流动于影院之间装胶片的金属盒，正在一个个地消失于我们的视线，成为历史。","prompt":"下列对文意的概括最恰当的是：","options":{"A":"数字技术已经颠覆了以往电影生产发行全过程","B":"当前电影艺术表现完全离不开数字技术的辅助","C":"数字合成技术取代了电影制作中各种拍摄手法","D":"同源成像技术在电影拍摄技术层面已成为历史"},"answer":"A","page":62},{"id":193,"chapter":5,"num":33,"source":"2025河南事业","type":"语句排序","stem":"将以下5个句子重新排列，语序正确的一项是：\n①四十年来我们见证了税收优惠、推介营销、产业园区、要素体系等几代招商模式。\n②“招商”是个传统的中式词汇，有的地方已改用“投促”“经发”等表述。\n③“产业基金”只是选项之一，且在诸多领域仍有待创新优化。\n④要理顺地方投促与产业基金的关系，应善于算大账、总账、长远账，结构化运用财政金融工具与政策套餐。\n⑤如果仍然沿袭“既要又要还要更要全部要”的老思路，那么绩效评价的结果必然是挂科。","prompt":"","options":{"A":"②①④③⑤","B":"③④①②⑤","C":"②①③⑤④","D":"③②①④⑤"},"answer":"C","page":62},{"id":194,"chapter":5,"num":34,"source":"2026江苏事业","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①在区域一体化发展的新形势下，片区公共文化服务已超出固有的行政区划边界\n②作为解决跨域问题的创新性思路，跨域治理便成为求解公共文化服务跨界供给的理论工具与制度安排\n③公共文化服务是一种国家回应民众文化诉求与权利主张的主要形式\n④这种趋势促使地方政府必须打破本位主义，超越行政区划阻隔，通过多元主体的协同合作，有效提升公共文化服务效能\n⑤也是一种引导民族精神方向、塑造共同理想、传播主流意识形态，继而构建国家认同的实践表达\n⑥传统的各自为政的供给模式已不能有效应对公共文化服务的跨域问题","prompt":"","options":{"A":"①⑥③⑤④②","B":"⑥②④③①⑤","C":"③⑤①⑥④②","D":"②⑥④①⑤③"},"answer":"C","page":62},{"id":195,"chapter":5,"num":35,"source":"2023河南事业","type":"语句填空","stem":"“________。”英雄的智慧来自人民，英雄的胆略也来自人民。在与困难作斗争的物质角力和精神对垒中，人民英雄的英雄力量、英雄行动和英雄精神，充分展现了生命至上举国同心、舍生忘死、尊重科学、命运与共的伟大抗疫精神，再次证明了中国共产党无比坚强的领导力、中国人民不屈不挠的意志力、中国特色社会主义制度的显著优势、新中国成立以来的坚实国力、社会主义核心价值观和中华优秀传统文化的强大精神动力、构建人类命运共同体的广泛感召力。在这个已经诞生并将继续诞生英雄的时代，人民的英雄和英雄的人民必将在新时代的新征程上创造新的历史伟业！","prompt":"填入画线部分最恰当的一句是:","options":{"A":"聪明秀出，谓之英；胆力过人，谓之雄","B":"时势造英雄，英雄亦造时势","C":"英雄不伏蛮夷死，更筑高台望故乡","D":"出师未捷身先死，长使英雄泪满襟"},"answer":"A","page":63},{"id":196,"chapter":5,"num":36,"source":"2022 国考","type":"中心理解","stem":"在传统基层治理中，缺乏社会组织、市场等各主体的共同参与、质询和监督，必然导致政府公共服务能力下降、权力垄断和滥用等问题，容易弱化公众信任程度，引发社会信任危机。区块链技术基于去中介信任机制、共识机制、协调共享机制，适用于多环节、多方协同参与且互不信任的场景。而信任是多元主体进行基层协同治理和互信规则建构的合作基础，区块链的算法信任机制与基层社会治理“公共性+信任”的价值追求相契合。借助区块链技术可以促进治理生态中双边信任向多边信任及社会公信的转变，突破传统国家治理体系所形成的认知固化和思维僵化。","prompt":"这段文字意在强调：","options":{"A":"健全信任机制是基层协同治理的条件","B":"区块链技术有助于推进基层治理改革","C":"区块链技术的应用能够提升政府公信力","D":"治理生态离不开多元社会主体间的协作"},"answer":"B","page":63},{"id":197,"chapter":5,"num":37,"source":"2024 安徽三支","type":"中心理解","stem":"越来越多证据表明，全球持续变暖，其影响范围和程度不断增加，由此引起的冰冻圈灾害在频率、强度和损失上都有增加趋势。我国冰冻圈的快速变化，对区域社会经济系统产生了广泛而深刻的负面影响，主要体现在对干旱区绿洲农业、寒区重大工程、寒区畜牧业、冰雪旅游业等产生综合影响。中国冰冻圈主要处在西部地区，经济水平较为落后，应对冰冻圈变化的能力有限。目前，适应仍然是应对冰冻圈变化的主要途径。冰冻圈变化对社会经济系统的综合影响分析是适应冰冻圈快速变化的基础，其适应性管理战略则是减轻冰冻圈快速变化不利影响、降低自然和社会经济系统损失，进而减缓其不利影响的最终目标。","prompt":"对这段文字的主旨概括最准确的是：","options":{"A":"积极探究适应冰冻圈变化路径的意义","B":"阐述冰冻圈变化对社会经济系统的影响","C":"适应是我国应对冰冻圈变化的唯一途径","D":"探究冰冻圈变化与社会经济系统的联系"},"answer":"A","page":64},{"id":198,"chapter":5,"num":38,"source":"2023 联考","type":"语句填空","stem":"近年来，以南海一号沉船博物馆、秦始皇帝陵博物院、安阳殷墟博物馆、海昏侯国遗址博物馆等为代表的考古遗址博物馆，在旅游网站推荐榜单中排名渐次上升。________。人们已不再单纯满足于简单的、传统的博物馆参观，而是产生了深入历史场景、触及历史语境的体验需求。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"这些变化反映了文化产品的不断更新换代","B":"新技术带来了文化消费场景的转换与创新","C":"这一新动态折射了文化消费的深化与转型","D":"这意味着新型博物馆成为旅游打卡的网红地"},"answer":"C","page":64},{"id":199,"chapter":5,"num":39,"source":"2024天津事业","type":"接语选择","stem":"河北白洋淀，古有“北地西湖”之称，今有“华北明珠”之誉，这里上承九河、下通渤海，是华北平原最大的湿地生态系统。白洋淀生态修复治理是河北雄安新区规划建设的重要内容，近年来，经过系统性生态治理，白洋淀“华北之肾”功能加快修复，水质稳定保持在Ⅲ类标准，“鸟类天堂”美景重现。位于白洋淀西部的府河河口湿地，是府河、漕河、瀑河三条河流交汇入淀的地方。治理前，这里是“人进水退”的农田和鱼塘，如今，当地采取“前置沉淀生态塘+潜流湿地+水生植物塘”的近自然水质净化工艺，就像在河口加装了“滤芯”，人淀水质净化程度明显提升。","prompt":"根据上述文字，接下来最有可能论述的是：","options":{"A":"白洋淀水质治理所呈现的良好效果","B":"白洋淀水质改善给该地带来的收益","C":"白洋淀实行水质治理的主要原因","D":"白洋淀水质治理所采取的具体举措"},"answer":"D","page":65},{"id":200,"chapter":5,"num":40,"source":"2022 湖北选调","type":"接语选择","stem":"通过气候灾害风险教育和灾种自救互救是提升基层民众在气候巨灾中的逃生技能、自救互救能力和风险防范意识的主要途径。随着自媒体的蓬勃发展，可非常方便地通过气候灾害风险教育和灾种自救互救能力提升来实现灾害的自救互救，但气候巨灾风险在网络平台中引发的“气候巨灾风险舆情”对灾害风险治理和社会稳定的影响也令人关注，尤其是“气候巨灾风险舆情”一旦偏离事实本质，往往会影响社会稳定、经济发展，甚至国家安全。","prompt":"根据上述文字，作者接下来最可能阐述的是：","options":{"A":"气候巨灾风险的人文防御能力分析","B":"气候巨灾风险的舆情影响因素分析","C":"气候巨灾风险设防能力的基础建设","D":"气候巨灾风险防御能力的网络建设"},"answer":"B","page":65},{"id":201,"chapter":6,"num":1,"source":"2025 联考","type":"逻辑填空","stem":"一些家长对孩子近视存在认识误区，认为近视可以逆转，不带孩子到正规医院眼科验光、配镜，而是给孩子尝试各种________。其实一旦孩子确诊为近视，就要及时在专业医师的指导下配镜，控制或________近视发展。专家呼吁，家长应帮助孩子养成良好的用眼习惯，________孩子过早接触电子产品，多带孩子参加户外活动。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"古方   缓解   防止","B":"疗法   遏止   预防","C":"秘方   减轻   提防","D":"偏方   延缓   避免"},"answer":"D","page":66},{"id":202,"chapter":6,"num":2,"source":"2018辽宁","type":"逻辑填空","stem":"近年来，各地高考、中考加分收紧，并公开加分考生，接受社会的监督，这显然是一种积极的态度，令人欣慰。这表明，一方面，以往那种________式的做法，已经越来越不适应时代和社会的要求，公开、透明、规范________0","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"黑箱操作   大势所趋","B":"暗箱操作   势在必行","C":"私下操作   势成骑虎","D":"假公济私   不可阻挡"},"answer":"B","page":66},{"id":203,"chapter":6,"num":3,"source":"2022联考","type":"逻辑填空","stem":"管理犹如治水，疏堵结合才能________。事实上,“堵”的手段强调严明纪律、形成震慑，操作起来也简单有效，但关键在于是否能够以条令法规为依据进行科学把握。若对待部队建设中带有倾向性、________的问题，动辄要求“全部清除”“一律禁止”，甚至“乱打板子”，不仅很难达到目的，还会导致问题累积、矛盾升级。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"一劳永逸   紧迫性","B":"标本兼治   普遍性","C":"防微杜渐   安全性","D":"事半功倍   关键性"},"answer":"B","page":66},{"id":204,"chapter":6,"num":4,"source":"2021联考","type":"逻辑填空","stem":"ADHD，也就是通常所说的“多动症”，在儿童时期常以多动、冲动、注意力缺陷等为主要表现，其中很多人的症状会,________到成年期。成人多动症患者更是一个被严重________的群体，我们给这个群体贴了很多标签，如“不靠谱”“拖延症”“低情商”“冲动狂”等。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"影响   歧视","B":"延迟   误解","C":"保留   排斥","D":"延续   忽视"},"answer":"D","page":66},{"id":205,"chapter":6,"num":5,"source":"2021事业联考","type":"逻辑填空","stem":"众文明自涌现之日起，就一直处在被各种人类活动________的过程中。其中最重要的就是农业，它以丰富的品种和产量提供了一部分食物，也使人类深入________了植物的特性。其中的一些植物因为可以用来提炼香料和直接提供气味，而立刻获得特别的________并从此奠定了不可动摇的地位。","prompt":"依次填入横线处的词语最恰当的一项是：","options":{"A":"支配   了解   关注","B":"影响   体察   重视","C":"塑造   掌握   青睐","D":"改变   学习   肯定"},"answer":"C","page":67},{"id":206,"chapter":6,"num":6,"source":"2021黑龙江紧缺","type":"逻辑填空","stem":"参加动漫节高峰论坛的专家________中国动漫发展的软肋：动画的本质特征就是丰富的想象力，但这在国产动画片中却很少能够看到。反而美国的《功夫熊猫》为我们提供了一个很好的例证。在多处巨大的反差中发挥丰富的想象，让故事情节________、精彩纷呈。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"一语中的   波涛起伏","B":"开门见山   跌宕起伏","C":"一语道破   一波三折","D":"一针见血   艰难曲折"},"answer":"C","page":67},{"id":207,"chapter":6,"num":7,"source":"2022辽宁事业","type":"逻辑填空","stem":"近年来，随着城市化进程加快，人民生活水平日益提升，“推窗可见绿、出门即入园”成为市民的普遍期盼。作为面向公众开放、形状多样、具有一定游憩功能的公园绿化活动场地，口袋公园因其小巧多样、环境友好和善、方便使用等特点，也被不少人称为“袖珍公园”。尽管“口袋”不大，但胜在________、绿意盎然，满足着人们对宜居宜业的要求，在车水马龙的城市中________出一片片休憩的空间。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"星罗棋布   勾勒","B":"盈盈欲滴   描述","C":"鳞次栉比   创造","D":"不计其数   建造"},"answer":"A","page":67},{"id":208,"chapter":6,"num":8,"source":"2025四川三支","type":"逻辑填空","stem":"一个________的事实是，近一个世纪以来，经济学不仅丝毫没有受到人文社会科学领域借用其他学科研究范式的影响，更谈不上被其他学科改造，反而大举入侵其他学科，________对其进行“殖民”。经济学的理想就是解释处于一切时空中的人类社会的一切现象。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"显而易见   肆意","B":"出人意料   妄图","C":"毋庸置疑   强迫","D":"不言自明   全力"},"answer":"A","page":67},{"id":209,"chapter":6,"num":9,"source":"2020 事业联考","type":"逻辑填空","stem":"随着数字技术、人工智能、可再生能源等一波波新技术浪潮的________，世界各国都意识到紧抓第四次科技革命机遇、实现产业和经济结构创新现代化的重大意义。作为欧洲乃至全球的经济大国和制造业强国，德国多年前就________捕捉到这一重大趋势变化并制定了相应政策体系。德国推进工业现代化的进展与反思，对于_________产业升级和经济结构现代化的其他国家和地区，有着重要参考价值。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"纷至沓来   敏锐   谋求","B":"炙手可热   明智   推进","C":"层出不穷   迅速   促使","D":"应运而生   准确   探索"},"answer":"A","page":68},{"id":210,"chapter":6,"num":10,"source":"2023 重庆选调","type":"逻辑填空","stem":"建设全国统一大市场的过程中用好产业发展的牵引作用，以加强产业协作，助力破除阻碍资源要素顺畅流动的各种________，使产业发展与统一市场建设________0","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"壁垒   各得其所","B":"落篱   相得益彰","C":"樊篱   相促相长","D":"桔   共生互利"},"answer":"C","page":68},{"id":211,"chapter":6,"num":11,"source":"2022 国考","type":"逻辑填空","stem":"在未来战争中，掌握算法优势的一方，能快速准确_________战场态势，创新最优作战方法，实现“未战而先胜”的战争目的。同时，智能科技将________到战争全要素全过程，物联网、智联网与脑联网成为战争的基础，从而使得战争全息透明，呈现战争控制“有人”、战场交锋“无人”的状态。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"预测   渗透","B":"主导   贯穿","C":"判断   投射","D":"反映   覆盖"},"answer":"A","page":68},{"id":212,"chapter":6,"num":12,"source":"2021山东","type":"逻辑填空","stem":"街头艺术是一座开放的城市重要的一部分。一方面，街头艺术是城市的品味和气质，它比鳞次栉比的高楼大厦更温润人心。另一方面，文艺应让所有人都能够________，街头也应该成为表现艺术的“基层”。我们的文化自信、主旋律和正能量，不仅仅表达在严谨的大舞台，亦可以展现在________的小天地。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"认同   自由","B":"欣赏   活泼","C":"理解   随意","D":"接触   温馨"},"answer":"B","page":68},{"id":213,"chapter":6,"num":13,"source":"2024甘肃事业","
