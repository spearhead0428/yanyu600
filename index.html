function showReportModal(deck, title) {
  let done = 0, ok = 0, totalSec = 0;
  const byType = {};
  const timedList = [];

  for (const q of deck) {
    const a = state.answers[q.id];
    const sec = state.qTimes[q.id] || 0;
    totalSec += sec;
    if (!byType[q.type]) byType[q.type] = { total: 0, done: 0, ok: 0, sec: 0 };
    byType[q.type].total++;
    byType[q.type].sec += sec;
    if (a) {
      done++;
      byType[q.type].done++;
      if (a === q.answer) { ok++; byType[q.type].ok++; }
    }
    if (sec > 0) timedList.push({ q, sec, ok: a === q.answer, a });
  }

  const acc = deck.length ? Math.round((ok / deck.length) * 100) : 0;
  const accAnswered = done ? Math.round((ok / done) * 100) : 0;
  const avgSec = done ? Math.round(totalSec / done) : 0;
  const C = 2 * Math.PI * 46;
  const offset = C * (1 - acc / 100);

  const typeRows = Object.entries(byType).map(([tp, d]) => {
    const p = d.done ? Math.round((d.ok / d.done) * 100) + "%" : "--";
    return `<tr><td><b>${tp}</b></td><td>${d.ok}/${d.total}</td><td>${p}</td><td>${fmtTime(d.sec)}</td></tr>`;
  }).join("");

  timedList.sort((a, b) => b.sec - a.sec);
  const slowHtml = timedList.slice(0, 5).map(item => `
    <span class="q-type-tag" style="margin-right:6px;margin-bottom:6px;display:inline-block;">
      第${item.q.num}题 · ${fmtTime(item.sec)} ${item.a ? (item.ok ? "✅" : "❌") : "⬜"}
    </span>
  `).join("") || `<span style="color:var(--text-3);font-size:13px;">暂无计时记录</span>`;

  const body = `
    <div class="report-hero">
      <div class="ring-wrap">
        <svg width="116" height="116">
          <circle cx="58" cy="58" r="46" fill="none" stroke="var(--border)" stroke-width="10"/>
          <circle cx="58" cy="58" r="46" fill="none" stroke="var(--primary)" stroke-width="10"
            stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${offset}"/>
        </svg>
        <div class="ring-center">
          <span class="ring-pct">${acc}%</span>
          <span class="ring-lbl">总得分率</span>
        </div>
      </div>
      <div class="report-kpis">
        <div class="kpi-box"><div class="k">答对 / 总题数</div><div class="v" style="color:var(--green);">${ok} / ${deck.length}</div></div>
        <div class="kpi-box"><div class="k">已做正确率</div><div class="v">${accAnswered}% <span style="font-size:12px;color:var(--text-3);">(${done}题)</span></div></div>
        <div class="kpi-box"><div class="k">本组总用时</div><div class="v">${fmtTime(totalSec)}</div></div>
        <div class="kpi-box"><div class="k">平均单题耗时</div><div class="v">${avgSec} 秒</div></div>
      </div>
    </div>
    <h4 style="margin:0 0 6px;font-size:14.5px;">题型正确率拆解</h4>
    <table class="type-table">
      <thead><tr><th>题型</th><th>答对/总数</th><th>正确率</th><th>累计耗时</th></tr></thead>
      <tbody>${typeRows}</tbody>
    </table>
    <h4 style="margin:16px 0 8px;font-size:14.5px;">耗时最长 Top 5</h4>
    <div>${slowHtml}</div>
  `;

  const wrongQs = deck.filter(q => state.answers[q.id] && state.answers[q.id] !== q.answer);
  const sameBankAndCh = deck.length > 0 && deck.every(q => q.chapter === deck[0].chapter && q.bankId === deck[0].bankId);
  const deckBankId = sameBankAndCh ? deck[0].bankId : (getActiveBank() || {}).id;
  const fullChCount = sameBankAndCh ? ((BANK_REGISTRY.get(deckBankId)?.questions || []).filter(q => q.chapter === deck[0].chapter).length) : 0;
  const chNum = (sameBankAndCh && deck.length === fullChCount) ? deck[0].chapter : null;
  const histList = chNum ? getChapterHistoryList(deckBankId, chNum) : [];
  const histHtml = histList.length ? `
    <h4 style="margin:16px 0 6px;font-size:14.5px;">📈 历次刷题记录（共 ${histList.length} 轮已归档）</h4>
    <table class="type-table">
      <thead><tr><th>轮次</th><th>时间</th><th>答对/已做</th><th>正确率</th><th>耗时</th></tr></thead>
      <tbody>${histList.map((h, i) => `<tr><td>第 ${i + 1} 刷</td><td style="color:var(--text-3);font-size:12.5px;">${escapeHtml(h.at)}</td><td>${h.ok}/${h.done}</td><td><b>${h.acc}%</b></td><td>${fmtTime(h.sec)}</td></tr>`).join("")}</tbody>
    </table>
  ` : "";

  const foot = `
    ${done > 0 ? `<button class="btn" id="btnRedoInReport">↺ 重做本套题</button>` : ""}
    ${wrongQs.length ? `<button class="btn btn-danger" id="btnDrillWrongInReport">只刷本组错题 (${wrongQs.length}题)</button>` : ""}
    <button class="btn btn-primary" id="btnCloseReport">继续复盘</button>
  `;
  openModal(`📊 评估报告 · ${title}`, body + histHtml, foot);
  $("btnCloseReport")?.addEventListener("click", closeModal);
  $("btnRedoInReport")?.addEventListener("click", () => {
    closeModal();
    openRedoModal(deck, chNum ? chapterDeckKey(deckBankId, chNum) : currentDeckKey, title, chNum, deckBankId);
  });
  $("btnDrillWrongInReport")?.addEventListener("click", () => {
    closeModal();
    startDeck(wrongQs, "wrong-sub-" + Date.now(), `${title} · 错题复盘`, 0);
  });
}

function fmtDateTime(ts) {
  const d = new Date(ts || Date.now());
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function openRedoModal(deck, deckKey, title, chNum = null, bankId = null) {
  const targetBankId = bankId || (deck[0] && deck[0].bankId) || (getActiveBank() || {}).id || "yanyu600";
  let done = 0, ok = 0, sec = 0, drawCnt = 0;
  const wrongIds = [];
  for (const q of deck) {
    const a = state.answers[q.id];
    if (a) {
      done++;
      if (a === q.answer) ok++;
      else wrongIds.push(q.id);
    }
    sec += (state.qTimes[q.id] || 0);
    if ((state.drawings[String(q.id)] || []).length > 0) drawCnt++;
  }
  const acc = done ? Math.round((ok / done) * 100) : 0;

  const body = `
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.7;">
        <div><b>${escapeHtml(title)}</b> 当前进度：已答 <b>${done}/${deck.length}</b> 题，正确率 <b>${acc}%</b>，耗时 <b>${fmtTime(sec)}</b></div>
        ${chNum && done > 0 ? `<div style="color:var(--green);font-size:12.5px;margin-top:4px;">✓ 本次成绩将自动归档至「历次刷题记录」，方便二刷/三刷对比进步！</div>` : ""}
      </div>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;">
        <input type="checkbox" checked disabled />
        <span>清空本套题作答选项与计时，重新开始刷题</span>
      </label>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;">
        <input type="checkbox" id="chkRedoClearDraw" />
        <span>同时清空本套题的自由涂改画笔${drawCnt ? `（当前有 ${drawCnt} 题含涂改）` : ""}</span>
      </label>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;">
        <input type="checkbox" id="chkRedoClearNote" />
        <span>同时清空本套题的个人笔记</span>
      </label>
    </div>
  `;
  openModal(`↺ 重做确认 · ${title}`, body, `
    <button class="btn" id="btnCancelRedo">取消</button>
    <button class="btn btn-primary" id="btnConfirmRedo">确认归档并重做</button>
  `);
  $("btnCancelRedo").addEventListener("click", closeModal);
  $("btnConfirmRedo").addEventListener("click", () => {
    const clearDraw = $("chkRedoClearDraw").checked;
    const clearNote = $("chkRedoClearNote").checked;

    if (chNum && done > 0) {
      if (!state.chapterHistory) state.chapterHistory = {};
      const hk = chapterHistKey(targetBankId, chNum);
      if (!state.chapterHistory[hk]) state.chapterHistory[hk] = [];
      state.chapterHistory[hk].push({
        at: fmtDateTime(Date.now()),
        ok, done, total: deck.length, acc, sec, wrongIds
      });
    }

    const passageIds = new Set();
    deck.forEach(q => {
      delete state.answers[q.id];
      delete state.eliminated[q.id];
      state.qTimes[q.id] = 0;
      if (clearDraw) {
        delete state.drawings[String(q.id)];
        if (q.passageId) passageIds.add(q.passageId);
      }
      if (clearNote) delete state.notes[q.id];
    });
    if (clearDraw) {
      passageIds.forEach(pid => delete state.drawings[pid]);
    }
    if (deckKey) delete state.chapterSubmitted[deckKey];
    saveState();
    closeModal();

    if (isQuizView && currentDeckKey === deckKey) {
      deckSubmitted = false;
      sessionElapsedSec = 0;
      renderFullFeed();
      renderAnswerSheet();
      setActiveIdx(0, true);
      updateTimerDisplay();
    } else {
      startDeck(deck, deckKey || (chNum ? chapterDeckKey(targetBankId, chNum) : "redo"), title, 0);
    }
    showToast(chNum && done > 0 ? "已归档上一轮成绩，开始新一轮重做！" : "已清空作答记录，开始重做！");
  });
}

// ================= CROSS-DEVICE SYNC & BACKUP =================
async function compressStateToCode(obj) {
  const jsonBytes = new TextEncoder().encode(JSON.stringify(obj));
  if (typeof CompressionStream !== "undefined") {
    const cs = new CompressionStream("gzip");
    const writer = cs.writable.getWriter();
    writer.write(jsonBytes);
    writer.close();
    const buf = await new Response(cs.readable).arrayBuffer();
    let bin = "";
    const arr = new Uint8Array(buf);
    for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
    return "FBGZ1:" + btoa(bin);
  }
  let bin = "";
  for (let i = 0; i < jsonBytes.length; i++) bin += String.fromCharCode(jsonBytes[i]);
  return "FBRAW1:" + btoa(bin);
}

async function decompressCodeToState(code) {
  const trimmed = String(code || "").trim();
  if (trimmed.startsWith("FBGZ1:")) {
    const bin = atob(trimmed.slice(6));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const ds = new DecompressionStream("gzip");
    const writer = ds.writable.getWriter();
    writer.write(bytes);
    writer.close();
    const txt = await new Response(ds.readable).text();
    return JSON.parse(txt);
  }
  if (trimmed.startsWith("FBRAW1:")) {
    const bin = atob(trimmed.slice(7));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  // Fallback: direct JSON paste
  return JSON.parse(trimmed);
}

function exportSelfContainedHtmlWithState() {
  // Bake current state directly into a fresh copy of this standalone HTML file!
  const baked = JSON.stringify(state).replace(/<\//g, "<\\/");
  const docHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const markerRe = /\/\*__EMBEDDED_STATE_START__\*\/[\s\S]*?\/\*__EMBEDDED_STATE_END__\*\//;
  const newHtml = docHtml.replace(markerRe, `/*__EMBEDDED_STATE_START__*/${baked}/*__EMBEDDED_STATE_END__*/`);
  const blob = new Blob([newHtml], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const d = new Date();
  const tag = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
  a.download = `言语理解600题_含进度_${tag}.html`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast("已导出带全部进度与涂改的独立 HTML，传到任何设备打开即续刷！");
}

function exportJsonBackup() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const d = new Date();
  a.download = `言语600题刷题记录_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast("已导出 JSON 备份文件");
}

function applyImportedState(obj, sourceLabel = "导入") {
  state = Object.assign(structuredClone(DEFAULT_STATE), obj);
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  applyThemeAndFont();
  if (isQuizView) {
    renderFullFeed();
    renderAnswerSheet();
    updateTimerDisplay();
  } else {
    renderDashboard();
  }
  showToast(`✓ ${sourceLabel}成功！已同步作答、计时、历史轮次、笔记与涂改`);
}

async function pushToGitHubGist(silent = false) {
  if (!syncCfg.token) {
    if (!silent) showToast("请先填写 GitHub Token");
    return false;
  }
  try {
    const payload = {
      description: "粉笔风格刷题同步数据 - 言语理解与表达600题",
      public: false,
      files: {
        "fenbi_yanyu600_state.json": {
          content: JSON.stringify(state)
        }
      }
    };
    const isUpdate = Boolean(syncCfg.gistId);
    const url = isUpdate ? `https://api.github.com/gists/${syncCfg.gistId}` : "https://api.github.com/gists";
    const resp = await fetch(url, {
      method: isUpdate ? "PATCH" : "POST",
      headers: {
        "Authorization": `Bearer ${syncCfg.token}`,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    if (!syncCfg.gistId && data.id) syncCfg.gistId = data.id;
    syncCfg.lastSyncAt = Date.now();
    saveSyncCfg();
    if (!silent) showToast("☁️ 已成功上传同步到 GitHub Gist 云端！");
    return true;
  } catch (err) {
    if (!silent) showToast(`云端上传失败：${err.message}（请检查网络或 Token 是否有 gist 权限）`);
    return false;
  }
}

async function pullFromGitHubGist(silent = false, onlyIfNewer = false) {
  if (!syncCfg.token || !syncCfg.gistId) {
    if (!silent) showToast("请先填写 GitHub Token 与 Gist ID");
    return false;
  }
  try {
    const resp = await fetch(`https://api.github.com/gists/${syncCfg.gistId}`, {
      headers: {
        "Authorization": `Bearer ${syncCfg.token}`,
        "Accept": "application/vnd.github+json"
      },
      cache: "no-store"
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    const file = data.files && data.files["fenbi_yanyu600_state.json"];
    if (!file) throw new Error("未在 Gist 中找到同步文件");
    let content = file.content;
    if (file.truncated && file.raw_url) {
      const r2 = await fetch(file.raw_url, { cache: "no-store" });
      content = await r2.text();
    }
    const remoteObj = JSON.parse(content);
    const remoteTs = remoteObj.updatedAt || 0;
    const localTs = state.updatedAt || 0;

    if (onlyIfNewer) {
      if (remoteTs > localTs) {
        syncCfg.lastSyncAt = Date.now();
        saveSyncCfg();
        applyImportedState(remoteObj, "自动拉取云端最新进度");
        return true;
      } else if (localTs > remoteTs) {
        await pushToGitHubGist(true);
      }
      return true;
    }

    syncCfg.lastSyncAt = Date.now();
    saveSyncCfg();
    applyImportedState(remoteObj, "从云端拉取同步");
    return true;
  } catch (err) {
    if (!silent) showToast(`云端拉取失败：${err.message}`);
    return false;
  }
}

function handlePairingHashOnLoad() {
  const hash = location.hash || "";
  if (!hash.startsWith("#pair=")) return false;
  try {
    const data = JSON.parse(atob(decodeURIComponent(hash.slice(6))));
    if (data && data.t && data.g) {
      syncCfg.token = data.t;
      syncCfg.gistId = data.g;
      syncCfg.autoSync = true;
      saveSyncCfg();
      // Immediately clear sensitive hash from address bar & history
      history.replaceState(null, "", location.pathname + location.search);
      showToast("🔗 已完成本设备云同步配对，正在拉取云端进度…");
      pullFromGitHubGist(false, false);
      return true;
    }
  } catch (e) {}
  return false;
}

function autoCheckCloudOnLoad() {
  if (handlePairingHashOnLoad()) return;
  if (syncCfg.autoSync && syncCfg.token && syncCfg.gistId) {
    pullFromGitHubGist(true, true);
  }
}

$("questionFeed").addEventListener("click", (e) => {
  // Option eliminate button
  const elimBtn = e.target.closest("[data-elim-q]");
  if (elimBtn) {
    e.stopPropagation();
    toggleEliminate(elimBtn.dataset.elimQ, Number(elimBtn.dataset.elimIdx), elimBtn.dataset.letter);
    return;
  }
  // Option click
  const optEl = e.target.closest("[data-opt-q]");
  if (optEl) {
    selectOptionForQuestion(optEl.dataset.optQ, Number(optEl.dataset.optIdx), optEl.dataset.letter);
    return;
  }
  // Star button
  const starBtn = e.target.closest("[data-star-q]");
  if (starBtn) {
    const qId = starBtn.dataset.starQ, idx = Number(starBtn.dataset.idx);
    state.starred[qId] = !state.starred[qId];
    if (!state.starred[qId]) delete state.starred[qId];
    saveState();
    refreshSingleQuestionCard(idx);
    return;
  }
  // Mark doubt button
  const markBtn = e.target.closest("[data-mark-q]");
  if (markBtn) {
    const qId = markBtn.dataset.markQ, idx = Number(markBtn.dataset.idx);
    state.marked[qId] = !state.marked[qId];
    if (!state.marked[qId]) delete state.marked[qId];
    saveState();
    refreshSingleQuestionCard(idx);
    renderAnswerSheet();
    return;
  }
  // Reset single question
  const resetBtn = e.target.closest("[data-reset-q]");
  if (resetBtn) {
    const qId = resetBtn.dataset.resetQ, idx = Number(resetBtn.dataset.idx);
    delete state.answers[qId];
    delete state.eliminated[qId];
    saveState();
    refreshSingleQuestionCard(idx);
    renderAnswerSheet();
    showToast("已重置本题作答");
    return;
  }
  // Toggle note box
  const noteBtn = e.target.closest("[data-note-toggle]");
  if (noteBtn) {
    const qId = noteBtn.dataset.noteToggle;
    const panel = $(`ans-panel-${qId}`);
    const nw = $(`notewrap-${qId}`);
    if (panel && nw) {
      const opening = nw.classList.contains("hidden");
      panel.classList.remove("hidden");
      nw.classList.toggle("hidden", !opening);
      if (opening) nw.querySelector("textarea")?.focus();
    }
    return;
  }
  // Clear drawings on a specific question or passage
  const clrBtn = e.target.closest("[data-clear-draw]");
  if (clrBtn) {
    const key = clrBtn.dataset.clearDraw;
    state.drawings[key] = [];
    redoStacks.set(key, []);
    saveState();
    redrawSingleCanvas(key);
    updateClearBtnVisibility(key);
    renderAnswerSheet();
    showToast("已清空该处涂改");
    return;
  }
  // Collapse/expand shared passage
  const pTog = e.target.closest("[data-toggle-passage]");
  if (pTog) {
    const pid = pTog.dataset.togglePassage;
    const body = $(`pbody-${pid}`);
    if (body) {
      const collapsed = body.classList.toggle("collapsed");
      pTog.textContent = collapsed ? "展开全文" : "收起材料";
      requestAnimationFrame(() => { resizeSingleCanvas(pid); redrawSingleCanvas(pid); });
    }
    return;
  }
  // Clicking anywhere on a question card focuses it for per-question timer
  const wrap = e.target.closest(".q-wrapper");
  if (wrap) {
    const idx = Number(wrap.dataset.qIdx);
    if (idx !== activeIdx) setActiveIdx(idx, false);
  }
});

function parseImportedBankPayload(rawObj, fallbackName = "", fallbackIcon = "📚") {
  let rawQs = null;
  let meta = {};
  if (Array.isArray(rawObj)) {
    rawQs = rawObj;
  } else if (rawObj && Array.isArray(rawObj.questions)) {
    rawQs = rawObj.questions;
    meta = rawObj;
  }
  if (!rawQs || !rawQs.length) {
    throw new Error("未找到有效的 questions 题目数组");
  }
  const cleanName = String(fallbackName || meta.name || `自定义题库_${new Date().toISOString().slice(5, 10)}`).trim();
  const safeIdBase = String(meta.id || "").replace(/[^A-Za-z0-9_-]/g, "");
  const bankId = (safeIdBase && safeIdBase !== "yanyu600" && safeIdBase !== "panduan600")
    ? safeIdBase
    : `custom_${Date.now().toString(36)}`;
  return {
    id: bankId,
    name: cleanName,
    shortName: String(meta.shortName || cleanName).slice(0, 10),
    subtitle: String(meta.subtitle || `自定义导入题库 · ${rawQs.length}题`),
    icon: String(fallbackIcon || meta.icon || "📚"),
    chapterPrefix: String(meta.chapterPrefix || "练习题"),
    createdAt: Date.now(),
    questions: rawQs
  };
}

async function importCustomBankObject(rawObj, overrideName = "", overrideIcon = "") {
  const rec = parseImportedBankPayload(rawObj, overrideName, overrideIcon);
  await saveCustomBankToDB(rec);
  registerBankEntry({
    id: rec.id,
    name: rec.name,
    shortName: rec.shortName,
    subtitle: rec.subtitle,
    icon: rec.icon,
    chapterPrefix: rec.chapterPrefix,
    builtin: false,
    createdAt: rec.createdAt
  }, rec.questions);
  state.activeBankId = rec.id;
  saveState(true);
  renderDashboard();
  showToast(`🎉 已成功导入题库「${rec.name}」（共 ${rec.questions.length} 题）！`);
}

$("btnResetDeck").addEventListener("click", () => {
  const sameBankAndCh = currentDeck.length > 0 && currentDeck.every(q => q.chapter === currentDeck[0].chapter && q.bankId === currentDeck[0].bankId);
  const deckBankId = sameBankAndCh ? currentDeck[0].bankId : (getActiveBank() || {}).id;
  const fullChCount = sameBankAndCh ? ((BANK_REGISTRY.get(deckBankId)?.questions || []).filter(q => q.chapter === currentDeck[0].chapter).length) : 0;
  const chNum = (sameBankAndCh && currentDeck.length === fullChCount) ? currentDeck[0].chapter : null;
  openRedoModal(currentDeck, currentDeckKey, currentDeckTitle, chNum, deckBankId);
});

$("btnSheetMobile").addEventListener("click", () => {
  $("sheetSidebar").classList.toggle("open");
  $("sheetBackdrop").classList.toggle("show");
});
$("sheetBackdrop").addEventListener("click", closeMobileSheet);

// Toolbar Events (clicking an active drawing tool toggles it OFF!)
$("drawToolbar").addEventListener("click", (e) => {
  const toolBtn = e.target.closest("[data-tool]");
  if (toolBtn) {
    toggleOrSetDrawTool(toolBtn.dataset.tool);
    return;
  }
  const sw = e.target.closest("[data-swatch]");
  if (sw) {
    if (activeTool === "highlighter") hlColor = sw.dataset.swatch;
    else {
      penColor = sw.dataset.swatch;
      if (activeTool === "cursor" || activeTool === "eraser") setDrawTool("pen", false);
    }
    updateDrawCursor();
    applyToolbarVisibility();
    renderDrawToolbar();
    return;
  }
  const sz = e.target.closest("[data-size]");
  if (sz) {
    if (activeTool === "highlighter") hlWidth = Number(sz.dataset.size);
    else penWidth = Number(sz.dataset.size);
    updateDrawCursor();
    renderDrawToolbar();
  }
});
function toggleToolbarHidden() {
  state.toolbarHidden = !state.toolbarHidden;
  saveState();
  applyToolbarVisibility();
}
$("btnHideToolbar").addEventListener("click", toggleToolbarHidden);
$("btnToggleToolbarTop").addEventListener("click", toggleToolbarHidden);
$("btnExitDraw").addEventListener("click", () => setDrawTool("cursor", true));
$("btnUndo").addEventListener("click", () => {
  const key = getTargetDrawKeyForUndo();
  if (!key) return;
  const arr = state.drawings[key] || [];
  if (!arr.length) return;
  if (!redoStacks.has(key)) redoStacks.set(key, []);
  redoStacks.get(key).push(arr.pop());
  saveState(); redrawSingleCanvas(key); updateClearBtnVisibility(key); renderAnswerSheet();
});
$("btnRedo").addEventListener("click", () => {
  const key = getTargetDrawKeyForUndo();
  if (!key) return;
  const st = redoStacks.get(key) || [];
  if (!st.length) return;
  if (!state.drawings[key]) state.drawings[key] = [];
  state.drawings[key].push(st.pop());
  saveState(); redrawSingleCanvas(key); updateClearBtnVisibility(key); renderAnswerSheet();
});
$("btnToggleStrokes").addEventListener("click", () => {
  strokesHidden = !strokesHidden;
  renderDrawToolbar();
  redrawAllCanvases();
});

$("modalClose").addEventListener("click", closeModal);
$("modalBackdrop").addEventListener("click", (e) => {
  if (e.target === $("modalBackdrop")) closeModal();
});

// Keyboard shortcuts — SAME KEY toggles drawing tools ON/OFF!
document.addEventListener("keydown", (e) => {
  if (!isQuizView) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
    e.preventDefault(); $("btnUndo").click(); return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") {
    e.preventDefault(); $("btnRedo").click(); return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  const k = e.key.toLowerCase();
  if (k === "t") { e.preventDefault(); toggleToolbarHidden(); }
  else if (k === "p") { e.preventDefault(); toggleOrSetDrawTool("pen"); }
  else if (k === "h") { e.preventDefault(); toggleOrSetDrawTool("highlighter"); }
  else if (k === "l") { e.preventDefault(); toggleOrSetDrawTool("line"); }
  else if (k === "e") { e.preventDefault(); toggleOrSetDrawTool("eraser"); }
  else if (k === "v" || k === "escape") { if (activeTool !== "cursor") setDrawTool("cursor", true); }
  else if (k === "arrowleft") { e.preventDefault(); setActiveIdx(Math.max(0, activeIdx - 1), true); }
  else if (k === "arrowright") { e.preventDefault(); setActiveIdx(Math.min(currentDeck.length - 1, activeIdx + 1), true); }
  else if (k === "a" || k === "1") { const q = currentDeck[activeIdx]; if (q) selectOptionForQuestion(q.id, activeIdx, "A"); }
  else if (k === "b" || k === "2") { const q = currentDeck[activeIdx]; if (q) selectOptionForQuestion(q.id, activeIdx, "B"); }
  else if (k === "c" || k === "3") { const q = currentDeck[activeIdx]; if (q) selectOptionForQuestion(q.id, activeIdx, "C"); }
  else if (k === "d" || k === "4") { const q = currentDeck[activeIdx]; if (q) selectOptionForQuestion(q.id, activeIdx, "D"); }
});

// Init
applyThemeAndFont();
renderDashboard();
(async () => {
  await loadCustomBanksFromDB();
  const targetId = state.activeBankId || "yanyu600";
  if (BANK_REGISTRY.has(targetId) && !BANK_REGISTRY.get(targetId).loaded) {
    await ensureBankLoaded(targetId);
  }
  if (!isQuizView) renderDashboard();
  autoCheckCloudOnLoad();
})();
</script>
