":"填入画横线部分最恰当的一项是：","options":{"A":"此消彼长","B":"遥相呼应","C":"一唱一和","D":"取长补短"},"answer":"B","page":159},{"id":500,"chapter":13,"num":20,"source":"2024事业联考","type":"逻辑填空","stem":"当下，专业媒体、美术院校、美术机构等纷纷入驻云端“________”，在网络平台开设官方账号，展开美术理论研究与现象探讨、个体创作评点，成为网络美术评论的________，相较于传统媒体发表的美术评论时效滞后、作品欣赏与评论难以同步、自选性差等问题，网络美术评论补上了这些短板，满足了读者的________需求。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"独占鳌头   弄潮儿   个性化","B":"大显身手   排头兵   场景化","C":"小试牛刀   引领者   专业化","D":"开疆拓土   主力军   多元化"},"answer":"D","page":159},{"id":501,"chapter":13,"num":21,"source":"2021事业联考","type":"中心理解","stem":"“非物质文化遗产”概念兴起的最初几年，群众对它的理解大多为“跟主流、大众不一样”“已经没用了”。然而，非遗不是“物”，今天“用不上”，偏离大众的非遗，恰是过去百姓最“有用”的日常生活，是历史中由普通民众以“物”与“用”为根本需求构建起的精神体系：以人为主体，以物质为媒介，以口传心授为途径，将世代积淀的思想、观念和方法论，传导到社会生态链的各个序列。在近代特定历史和社会背景下，它长期呈现为“无用”的状态，却具有固定且持续变化的价值——其塑造了整个民族的审美和人格，赋予了个体独特的生活情趣。","prompt":"这段文字意在说明：","options":{"A":"大众对非遗的认知和理解有失偏颇","B":"应该结合非遗所属的历史时期来评价它的价值","C":"非遗看似“无用”却对塑造民族性格有重要价值","D":"对于非遗的理解会影响整个社会生态链的各个环节"},"answer":"C","page":159},{"id":502,"chapter":13,"num":22,"source":"2021广东选调","type":"中心理解","stem":"科学家对200 纳米至3纳米的金属镍进行了高压下的形变对比研究，发现金属镍的压缩强度随着晶粒尺寸的减小而持续增加，3纳米镍样品的强度可达到传统镍强度的10倍之多。进一步的研究表明，20 纳米以下的样品中出现的偏位错以及高压对晶界塑性形变的极大抑制是小尺寸样品强化的关键,科学家在金和钯中也观测到了类似的细晶强化现象。对此，科学家认为，压缩是一种获得高强度纳米金属材料的普适途径。","prompt":"这段文字主要说明了：","options":{"A":"金属细晶的强化现象","B":"获得高强度金属的新途径","C":"金属高压形变的实验过程","D":"小尺寸金属样品强化的关键"},"answer":"B","page":160},{"id":503,"chapter":13,"num":23,"source":"2026重庆事业","type":"中心理解","stem":"改革开放以来，故宫以其独特的历史价值与文化象征地位，迅速成为中国最重要的旅游目的地之一。1987年被列入联合国教科文组织《世界遗产名录》后，其旅游景区功能远超博物馆的展览职能。尤其是 2010 年以来，故宫年均游客量突破1700万人次，2019年超过1900万人次，游客承载压力极大，不得不优先应对。文物安全、游客安全与遗产保护，观众承载力管理、客流动线设计成为院方管理重点，这种景区化主导的运营模式，客观上挤压了博物馆展览、学术、观众服务等功能。","prompt":"这段文字意在说明：","options":{"A":"景区化运营模式导致的功能失衡","B":"故宫大客流量制约其博物馆功能","C":"故宫博物院面临发展与保护的挑战","D":"景区化运营对博物馆功能产生肘"},"answer":"D","page":160},{"id":504,"chapter":13,"num":24,"source":"2022事业联考","type":"中心理解","stem":"树木年轮是气候学研究里最重要的代用指标，其定年方法准确可靠，气候敏感性与分辨率较高，被国际气候学研究广泛应用。干旱区与半干旱区是树木年轮研究工作的重点区域，我国在阿勒泰区域已经开展了大量的树木年轮研究工作，不过采样样本较少，气象数据年份较短，数据处理的精度存在问题，因此有必要开展新的树木年轮采样工作。随着全球气候变暖，阿勒泰区域的气候条件变化深刻，研究西伯利亚落叶松在气候变化下的生长情况，对于研究西利亚落叶松在应对全球变暖背景下如何发展和变化具有重要意义，对森林生长环境保护具有重要的借鉴和指导作用。","prompt":"这段文字的关键词是：","options":{"A":"树木年轮   气候学研究   全球变暖","B":"生态环境   气象数据   气候敏感性","C":"气候学代用指标   年轮研究   气候条件","D":"年轮采样   阿勒泰区域   西伯利亚落叶松"},"answer":"D","page":161},{"id":505,"chapter":13,"num":25,"source":"2026福建事业","type":"中心理解","stem":"灯产生于人们对于照明的需求。早在先秦时期，人们用布料包裹草木，内外涂抹蜂蜜，点燃之后便可照明，即文献中所说的“庭燎”。直至战国时期，人们发现可以将提炼出来的动物油脂盛放于盏中做小巧的油灯用来照明,灯盏外套上灯罩能够有效稳定火苗、防风挡雨，也便于挪动。古代动物油脂昂贵，如若添加香料于其中，非王宫富贵之家不能用。随着物质的丰富和技术的进步，人们对灯具的外形有了更高的审美需要，宫廷用灯制作得越来越华美。","prompt":"对上述语段理解准确的是：","options":{"A":"先秦时期宫廷开始使用油灯","B":"战国时期宫灯华美技艺精湛","C":"战国时宫廷用灯燃料成本高","D":"宫廷用灯具有极高审美价值"},"answer":"C","page":161},{"id":506,"chapter":13,"num":26,"source":"2023北京事业","type":"细节判断","stem":"在数字经济迅猛发展之后，产业数字化将成为数字经济发展新的着力点。数字化具有一切皆可编程、万物均要互联、大数据驱动业务三个特征，其本质是用软件重新定义整个世界，这也就意味着数字化带来的安全挑战也前所未有，亟须用数字化思维重塑网络安全。就是用体系化思维为指导，融合安全体系和数字体系。","prompt":"文段没有提及的是：","options":{"A":"数字经济新的着力点","B":"数字化的基本特征","C":"重塑网络安全的思路","D":"数字化的教育模式"},"answer":"D","page":161},{"id":507,"chapter":13,"num":27,"source":"2023 福建事业","type":"细节判断","stem":"玻璃属于一种化学惰性材料，不仅对环境无害，而且寿命期长达100万年。玻璃具有100%可回收和无限期循环使用的属性，是最具可持续性的材料之一，有望成为塑料的替代品。在碳中和的背景下，做好废玻璃的回收利用是构建循环经济的重要一环。每回收1吨废玻璃，可以节约1吨以上的自然资源。在制造过程中，利用废玻璃可以替代95%的原材料。每使用6吨废玻璃，就能减少1吨的二氧化碳排放量。","prompt":"下列说法不符合文意的是：","options":{"A":"玻璃作为塑料替代品材料，最具可持续性","B":"在碳中和的背景下，废玻璃比塑料更环保","C":"做好废玻璃的回收利用可提升资源利用效率","D":"做好废玻璃的回收利用可减少温室气体排放"},"answer":"A","page":162},{"id":508,"chapter":13,"num":28,"source":"2024国考","type":"标题填入","stem":"隋唐盛世的形成主要得益于制度创新。东晋南朝以来，世家大族把持朝政，皇权极不稳定。隋文帝取代北周后，为防止关陇集团等势力过分强大，威胁大一统的中央集权，废除了察举制这一士族赖以维系的选举工具，打破了以门第和军功为主的选拔标准，通过考核治理国家的专门知识，选拔人才参与新政权的管理，实现了贵族官僚政治向文官政治的转变，为成就隋唐盛世打下了坚实基础，奠定了后世王朝选官的基本格局，在中国选举制史上具有重大意义。","prompt":"这是一篇文章的引言，文章标题应该是：","options":{"A":"科举制度在唐代政治中的利与弊","B":"贵族官僚政治瓦解的制度原因探析","C":"中国古代选官制度的变迁及启示","D":"科举制度创建对选官制度变革的影响"},"answer":"D","page":162},{"id":509,"chapter":13,"num":29,"source":"2022安徽事业","type":"标题填入","stem":"面对老城区面积大、老龄人口多的“两老”问题，某市经过近10年的创新探索，走出了一条全领域、全局性、成体系、成规模的“睦邻家园”建设之路。目前，该市内已建成60个睦邻中心，形成了“1510”睦邻服务圈：居民步行15分钟就能到达一个睦邻中心，每个睦邻中心至少有10个以上服务项目。用党建联盟“大联动”，打造“大睦邻”社区格局，使高档社区和老旧小区之间的门打开了，为居民共享公共设施提供了新思路。","prompt":"最适合做这段文字标题的是：","options":{"A":"睦邻建设，老城区更有新服务","B":"创新建设，覆盖大面积老城区","C":"幸福养老，社区公共设施再上新","D":"打通门户，社区家园实现“大联动”"},"answer":"A","page":162},{"id":510,"chapter":13,"num":30,"source":"2026 天津事业","type":"中心理解","stem":"日常生活中，不少人表现出不相信常识，却热衷于相信奇迹的认知误区，同样也能够反映出我们科学文化认知不足的一面。尊重常识，说穿了就是对一般科学规律有着足够的认知，并尊重科学精神，而过于相信奇迹，恰恰与科学精神相悖，它与对玄学、怪力乱神、大师的追捧，其实有原因上的同构。只不过，大师不是人人能遇到，但伪科技广告如今却几乎无孔不入，很容易让人上当。","prompt":"这段文字主要想表达的意思是：","options":{"A":"伪科技广告无孔不人，其带来的危害比“大师”还要大","B":"科学精神的欠缺是造成当前很多人被伪科学欺骗的重要原因","C":"科学文化知识不足会造成很多人不相信常识，却热衷于相信奇迹","D":"只有提高科学文化知识，尊重科学精神，才能让伪科学的东西失去生存土壤"},"answer":"D","page":163},{"id":511,"chapter":13,"num":31,"source":"2026 河南事业","type":"中心理解","stem":"晕血或晕针的现象主要与血管迷走神经性晕厥有关，本质是身体对特定刺激（如血液、尖锐物）的过度应激反应，引发心率、血压骤降和脑部供血不足，导致头晕甚至昏厥。心理因素（如恐惧）和生理机制共同作用，不同个体的敏感度差异较大。迷走神经过度兴奋会发生什么？它就像一个错误的指令，当看到血液或针头时，部分人的迷走神经会被异常激活，释放信号让心率减慢、血管扩张，特别是下肢血管扩张、淤血。这会直接导致血压下降，大脑供血不足出现短暂缺氧，从而引发眩晕、冷汗、面色苍白等症状，严重时可能昏厥。这一反应属于自主神经系统的“误判”，将视觉或疼痛刺激误认为威胁，触发了类似休克的保护机制。","prompt":"文中所述的“误判”一词，对其内涵概括最准确的是：","options":{"A":"自主神经系统将非致命性刺激错误识别为致命威胁，从而触发不适当的保护性休克反射","B":"迷走神经在无实质性危险的情况下被异常激活，引发心率减慢与血管扩张的连锁反应","C":"个体因心理恐惧而触发的生理应激反应，其本质是对特定刺激的过度敏感与适应性失调","D":"大脑将视觉或疼痛信号错误归类为危及生命的紧急事件，导致血压骤降与脑部供血不足"},"answer":"A","page":163},{"id":512,"chapter":13,"num":32,"source":"2019 四川选调","type":"中心理解","stem":"中国接入国际互联网以来，互联网信息技术得到迅猛发展，在网络技术、移动芯片、智能终端、云计算、大数据、卫星导航等多个领域实现了重大突破，取得了一批显著的成就，网络技术自主创新能力显著增强、智能终端制造业加快赶超、不断培育新技术新应用形成新业态。但应该看到，与世界先进水平相比，我们还存在一定差距。目前世界局势波诡云，中国必须掌握核心技术，在新时代才能避免受制于人，掌握我国互联网发展的主动权。","prompt":"这段文字意在说明：","options":{"A":"核心技术突破才是一个国家科技实力的彰显","B":"我们与世界先进水平之间依然存在一定差距","C":"互联网发展的主动权应掌握在我们自己手里","D":"新时代更需突破互联网核心技术这个“命门”"},"answer":"D","page":164},{"id":513,"chapter":13,"num":33,"source":"2020江苏","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①显而易见，一个专业人士在一年之内进行多次重复实验\n②但欧洲在改良并且推广印刷术之后，开始建立科学实验的制度，偶然的作用开始让位于必然\n③有经济学家认为，古代中国在技术上一直领先，是因为古代中国人口规模庞大，偶然性的发明远远多于人口稀少的欧洲\n④所获得的知识和发现，肯定要比一个工匠一辈子因为偶然和随机所获得的发现和成果多\n⑤在印刷术发明之前，人类社会科技的进步主要靠大众在生产实践中的偶然发现\n⑥无论在东方社会，还是西方社会，情况都是相似的","prompt":"","options":{"A":"⑤⑥③②①④","B":"③⑥⑤②①④","C":"⑤⑥②①④③","D":"③⑤⑥①④②"},"answer":"A","page":164},{"id":514,"chapter":13,"num":34,"source":"2020 新疆","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①这是当今全球城市智能化的必要性和可能性\n②若对上述关系处理不当，就会产生各种各样的“城市病”，如交通拥堵、环境污染等\n③城市里的人类社会活动与组织也越来越复杂，如基建、服务、交通、物流、能源、通信等诸多子系统，彼此构成错综复杂的共生、促进或制约关系\n④社会科学、自然科学和工程技术从这些关系中已形成大量学术成果，但由于学科区分，综合性分析研究较为稀缺\n⑤随着城市不断变得更大、更复杂，在城市物理空间中，人造物开始打破与自然物的平衡关系，如建筑、街道、车辆、包装物、垃圾、污水、雾霾，使土壤、江河、大气等面临严峻考验\n⑥近年来，互联网、传感器网、大数据、云平台崛起，城市中错综复杂的关系已通过数字化映射到信息空间，对它们的学习、分析、综合变得可能","prompt":"","options":{"A":"⑤③②④⑥①","B":"⑥①③⑤②④","C":"⑥①④⑤③②","D":"⑤③④②⑥①"},"answer":"A","page":164},{"id":515,"chapter":13,"num":35,"source":"2020联考","type":"语句填空","stem":"数字经济的重要意义不仅体现在对总量的贡献上，更重要的是________，一方面表现为数字技术赋能传统产业，另一方面表现为数字技术催生新产业。数字技术赋能传统产业，通常也被称为产业数字化，即利用数字技术对传统行业的业务进行升级，进而提升生产数量和效率。从生产流程角度看，数字技术可以通过对企业生产过程中产生的数据进行分析，将程序性业务交给计算机处理，从而降低了操作失误率。同时，企业通过数据分析，能够对业务流程进行全面而系统的监督，及时发现经营过程中的异常和隐患，大大降低风险。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"及时降低企业经营过程中的损耗与风险","B":"将数字化的知识和信息转化为生产要素","C":"对产业结构优化升级所起到的推动作用","D":"不断发掘与推动产业经济的新增长点"},"answer":"C","page":165},{"id":516,"chapter":13,"num":36,"source":"2020江苏","type":"中心理解","stem":"空气污染物对大脑造成严重影响的罪魁祸首是细颗粒物，即直径小于2.5微米的空气污染物。一旦被吸入体内，它们就能抵达肺部深处，进入血流，并随之进入大脑。细颗粒物直径极小，足够穿越为阻隔大型毒物分子而存在的血脑屏障。若细颗粒物由鼻子吸入，还可以通过鼻腔中的嗅觉神经进入大脑。这些颗粒物可能会激发炎症反应，导致严重的脑部疾病，影响认知能力。","prompt":"这段文字意在说明：","options":{"A":"空气污染物中细颗粒物进入大脑的危害","B":"空气污染物是造成大脑疾病的罪魁祸首","C":"空气污染物中的细颗粒物如何进入大脑","D":"空气污染物中的细颗粒物危害人体健康"},"answer":"A","page":165},{"id":517,"chapter":13,"num":37,"source":"2025 海南三支","type":"中心理解","stem":"行政执法既包括对人民群众舌尖安全的守护和市场运行的规范，以及对被处罚人的说服教育和对公众的有效普法，在经济下行环境下对小商小贩的人性关照，罚款行政案件大多属于“小案”，但是对于当事人而言都是一座山。执法者如果只做具体法条的“搬运工”，考虑不周全，处理不恰当，就可能使一个家庭陷入生计困窘，造成舆论撕裂，影响社会和谐。捍卫法律尊严其实考验的是执法者的执法水平、人文关怀，才能体现坚持法治为了人民、依靠人民、造福人民、保护人民的初心。","prompt":"这段文字意在强调：","options":{"A":"行政执法应当避免引发负面舆论","B":"行政执法关系到社会的和谐稳定","C":"执法过程应当综合考虑各种因素","D":"执法过程中要更加注重人文关怀"},"answer":"D","page":166},{"id":518,"chapter":13,"num":38,"source":"2021事业联考","type":"语句填空","stem":"我们这个国家的未来，取决于正在茁壮成长的青年、少年、孩童。因为科技与商业的进步需要一代又一代人的创新与坚守，创新的源泉是好奇心、想象力和批判性思维；坚守的力量则来自内心的定力与意志。________。从这个意义上说，是那些与他们朝夕相伴的老师，决定了这个国家未来的样貌，他们不仅是知识的传递者，更是灵魂的塑成者。越幼小的孩子，越需要优秀教育者的陪伴，因为他们正处于品格构建的关键时期，可见吸引最优秀的人走进教师队伍是多么重要。","prompt":"填入文中横线处最恰当的一项是：","options":{"A":"优质的老师是优质教育的保障","B":"这些品质的养成，是教育的使命","C":"唯有发展教育，中国才有核心竞争力","D":"好老师能以面向未来的精神去教育孩子"},"answer":"B","page":166},{"id":519,"chapter":13,"num":39,"source":"2018贵州选调","type":"接语选择","stem":"人的身高是生物学性状之一。一直以来，人们认为身高主要是遗传、饮食和环境因素综合决定的。但是，在人类认识了基因的作用后，开始认为基因在决定身高中占主要作用，于是在人类基因组计划完成后，开始寻找与身高相关的基因，并获得其与健康、疾病等有关的信息和知识。","prompt":"接下来最可能讲述的是：","options":{"A":"身高差距大的人在外貌、健康状态上差异也大","B":"饮食、环境及个人健康状况对基因有影响","C":"寻找与身高基因有关的数据并实证分析","D":"决定身高的基因还影响着健康、疾病等"},"answer":"C","page":166},{"id":520,"chapter":13,"num":40,"source":"2024国考","type":"标题填入","stem":"隋唐盛世的形成主要得益于制度创新。东晋南朝以来，世家大族把持朝政，皇权极不稳定。隋文帝取代北周后，为防止关陇集团等势力过分强大，威胁大一统的中央集权，废除了察举制这一士族赖以维系的选举工具，打破了以门第和军功为主的选拔标准，通过考核治理国家的专门知识，选拔人才参与新政权的管理，实现了贵族官僚政治向文官政治的转变，为成就隋唐盛世打下了坚实基础，奠定了后世王朝选官的基本格局，在中国选举制史上具有重大意义。","prompt":"这是一篇文章的引言，文章标题应该是：","options":{"A":"科举制度在唐代政治中的利与弊","B":"贵族官僚政治瓦解的制度原因探析","C":"中国古代选官制度的变迁及启示","D":"科举制度创建对选官制度变革的影响"},"answer":"D","page":167},{"id":521,"chapter":14,"num":1,"source":"2026河南事业","type":"逻辑填空","stem":"步入金龙峡谷，翠屏峰西侧崖壁腰间，三层古楼阁静静________。斗拱飞檐仿佛是从崖壁中“生长”而出，只有碗口粗的一排木柱凌空支撑，上载危岩、下临深谷。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"屹立","B":"伫立","C":"挺立","D":"矗立"},"answer":"B","page":168},{"id":522,"chapter":14,"num":2,"source":"2021国考","type":"逻辑填空","stem":"每个民族都有自己独特的民俗文化，然而，一些人分不清具体的民族文化和民俗文化，加之有人为了在短时间内推出本民族民俗文化，盲目迎合当下的流行需要，反而使自己的民俗文化变得________，出现“雷同化”传播现象，使大众对不同区域的特色民俗文化认知较为________，影响大众对民俗文化的了解和兴趣，进而在一定程度上影响少数民族地区的经济发展。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"支离破碎   肤浅","B":"不伦不类   模糊","C":"名存实亡   混乱","D":"面目全非   狭隘"},"answer":"B","page":168},{"id":523,"chapter":14,"num":3,"source":"2022事业联考","type":"逻辑填空","stem":"公共场所彰显以人为本的情怀，亦需以文明的形象来守护这良好氛围，“蹭凉”须有度，“蹭凉族”应________“公地”与“私域”的边界，遵循最起码的文明规范，这既是对提供纳凉场所的尊重，也是对自身文明素养的一种________，切莫因“蹭凉”而丢了文明。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"恪守   检视","B":"谨记   鞭策","C":"明晰   提升","D":"遵从   砥砺"},"answer":"A","page":168},{"id":524,"chapter":14,"num":4,"source":"2026联考","type":"逻辑填空","stem":"“敬”指的是对事物发自内心的尊重与崇尚，“畏”则包含戒惧和省思之意,敬与畏是一体的。倘若有敬无畏,就容易表面崇敬、内心无惧,进而萌生私心，做事________，假作为、乱作为;反之,如果有畏无敬,就可能举棋不定、优柔寡断,难免抵触厌战,做事________，不敢为、不作为。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"心猿意马   畏首畏尾","B":"竭泽而渔   拈轻怕重","C":"急功近利   瞻前顾后","D":"唯利是图   舍本逐末"},"answer":"C","page":168},{"id":525,"chapter":14,"num":5,"source":"2021联考","type":"逻辑填空","stem":"文物看似没有生命、没有声音，但是它们________了历史的风云，寄托着先人的情怀，充满了生命的活力。在博物馆，我们通过对文物的瞻仰，与先人的生命接续了起来，在________中实现了与历史的对话、与先人的情感交流，这也是博物馆所追求的文化目标。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"经历   凝重","B":"浸透   宁静","C":"蕴含   平淡","D":"折射   沧桑"},"answer":"B","page":169},{"id":526,"chapter":14,"num":6,"source":"2020联考","type":"逻辑填空","stem":"向民众________科学知识，________科学精神，是科学家义不容辞的责任。但是科学家首先要致力于科研，他究竟能花多少时间来做科普，显然无法一概而论。通常，一线科学家很难花费太多的时间和精力直接参与一波又一波的科普活动。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"传输   传递","B":"传递   传播","C":"传导   传扬","D":"传达   传承"},"answer":"B","page":169},{"id":527,"chapter":14,"num":7,"source":"2026陕西事业","type":"逻辑填空","stem":"如今，随着居民收人水平稳步提升，年货承载的情感价值与文化内涵越发凸显，“物质为基，精神为核”成为现代消费新导向。________，江苏苏州丝马年生肖挂饰将传统织造技艺与现代审美相融，单价300元仍供不应求；故宫文创“马上同心”红围巾借鉴馆藏文物纹饰，以匠心设计传递团圆寓意，悄然成为新春爆款。年味不再局限于衣食层面，更延伸为可感可触的文化体验，这正是消费升级最生动的________。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"譬如   缩影","B":"例如   注脚","C":"比如   烙印","D":"犹如   诠释"},"answer":"B","page":169},{"id":528,"chapter":14,"num":8,"source":"2026河南事业","type":"逻辑填空","stem":"2025年中国电影最令人瞩目的现象之一，是动画片的________。截至12月31日，全年动画电影票房已突破 250亿元，占据了电影总票房的半壁江山。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"异军突起","B":"一往无前","C":"势不可挡","D":"一骑绝尘"},"answer":"D","page":169},{"id":529,"chapter":14,"num":9,"source":"2025海南三支","type":"逻辑填空","stem":"全面深化改革需要加强顶层设计和整体谋划，要在基本确定主要改革举措的基础上，深入研究各领域改革关联性和各项改革举措的________，深入论证改革举措的可行性，把握好全面深化改革的重大关系，使各项改革举措在实施过程中相互促进、在实际成效上________o","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"协同性   众望所归","B":"差异性   循序渐进","C":"耦合性   相得益彰","D":"针对性   取长补短"},"answer":"C","page":169},{"id":530,"chapter":14,"num":10,"source":"2022事业联考","type":"逻辑填空","stem":"在日益复杂且动态变化的社会发展和教育变革背景下，面对学生负担过重问题，单一的政策实施、理论指导或实践探索难以________，只有在政策、实践和理论探究之间建立起相互________、动态生成的良性循环，才可能标本兼治、持之以恒。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"推进   弥补","B":"奏效   支撑","C":"深入   配合","D":"长远   促进"},"answer":"B","page":170},{"id":531,"chapter":14,"num":11,"source":"2025海南三支","type":"逻辑填空","stem":"没有新漆，没有新瓦，没有被现代审美改造过，山西的古建筑有时显得过于________，区区一处木头搭建的藻井，古人绘以丹青，饰以琉璃，就成就一片璀璨宇宙。千百年后，这些低调的古建筑会冷不丁释放一种审美暴击，让不经意抬头的游人________，就算是现代建筑大师到了山西，也要默默献上自己的膝盖。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"平庸   过目难忘","B":"保守   目不暇接","C":"刻板   心驰神往","D":"朴素   心悦诚服"},"answer":"D","page":170},{"id":532,"chapter":14,"num":12,"source":"2021联考","type":"逻辑填空","stem":"野草属于乡间大地。在城市里被水泥丛林挤得难有_________的野草，即便得到了点滴瘠薄的土地，也生长得________，茎叶上积满了灰尘，一副失魂落魄的样子。那些生长在乡间大地上的野草，则________地在风中低语，在雨中吟唱。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"一席之地   没精打采   肆意","B":"弹丸之地   垂头丧气   适意","C":"一隅之地   奄奄一息   恣意","D":"栖身之地   萎靡不振   惬意"},"answer":"D","page":170},{"id":533,"chapter":14,"num":13,"source":"2026山东事业","type":"逻辑填空","stem":"随着新一代人工智能的兴起，对人工智能的监管变得更加紧迫。不论是在现有法律基础上“打补丁”，还是“________”，推进 AI监管的立法进程都应该跑在技术前面，法律的________才能抵御技术的风险性。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"重整旗鼓   规范性","B":"未雨绸缪   引领性","C":"改弦更张   强制性","D":"另起炉灶   前瞻性"},"answer":"D","page":170},{"id":534,"chapter":14,"num":14,"source":"2023内蒙古事业","type":"逻辑填空","stem":"信息技术________，深刻改变了人们的生产生活，带来诸多便利。不过，互联网是把“双刃剑”。网络空间的内容________，信息纷繁复杂，再加上老年人网络安全素养不足、信息辨别能力差，致使他们畅游“网海”时常常遇到“暗礁”与“险滩”。这样的例子________。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"波云诡   玉石不分   数不胜数","B":"风起云涌   良不齐   不胜枚举","C":"欣欣向荣   目迷五色   不一而足","D":"异军突起   泥沙俱下   擢发难数"},"answer":"B","page":171},{"id":535,"chapter":14,"num":15,"source":"2024陕西事业","type":"逻辑填空","stem":"成功的改编既有，________演绎名著内容的，也有立足于新时代解构名著而对传统文化形成________关系的，这两方面都留下过较出色的佳作，前者如1987年问世的电视剧《红楼梦》，后者如鲁迅的《故事新编》。所以，新版电影《红楼梦》另辟蹊径，从九十多万字的皇皇巨著中，选择一部分情节，比如以金玉良缘和木石前盟的对峙来贯穿电影的始终，本________。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"天马行空   解释   无需多言","B":"千篇一律   对立   无可指摘","C":"亦步亦趋   对话   无可厚非","D":"惟妙惟肖   依附   多此一举"},"answer":"C","page":171},{"id":536,"chapter":14,"num":16,"source":"2025 福建事业","type":"逻辑填空","stem":"先植绿、后建城，这座城市________在生态空间中，人与自然和谐共生；现实城市与“云上城市”李生共建，智慧城市________。走进这座城市，先进的规划设计理念，高标准、高质量的建设场景，创新应用________0","prompt":"依次填入画横线处最恰当的是：","options":{"A":"装饰   无所不在   不胜枚举","B":"点缀   随处可见   触目皆是","C":"嵌入   随遇而安   天马行空","D":"镶嵌   无处不在   俯拾皆是"},"answer":"D","page":171},{"id":537,"chapter":14,"num":17,"source":"2023 联考","type":"逻辑填空","stem":"语言是社会生活的一面镜子，流行语则给这面镜子打上了时代的________，让这面镜子________出与时代俱进的镜像。“强国有我”“双减”“YYDS”“破防”“内卷”·…让我们看到了语言的________，也让我们对流行语发布和研究涉及的具体问题有了许多思考。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"标记   映照   包罗万象","B":"标识   投映   五彩缤纷","C":"标签   折射   丰富多彩","D":"标注   投射   形形色色"},"answer":"C","page":171},{"id":538,"chapter":14,"num":18,"source":"2025 湖南三支","type":"逻辑填空","stem":"游泳时被淹死的往往不是完全不会游泳的人，而是那些刚学会一点但又游的一般的人。因为，________所以不加思考，轻易的做出了决策，就会导致风险出现。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"一知半解","B":"不求甚解","C":"图文并茂","D":"意气用事"},"answer":"A","page":172},{"id":539,"chapter":14,"num":19,"source":"2024事业联考","type":"逻辑填空","stem":"假冒伪劣商品之所以在农村地区大行其道，________是一大原因，出现问题难以找到责任主体。对此，农村地区应加快建立包括集中收集、追溯、跟踪等制度在内的食品监管体系，对于所有流入农村市场的商品，尽快建立溯源机制，明确生产、流通责任，对全链条规范运营起到有效________作用。","prompt":"依次填入画横线部分最恰当的一项：","options":{"A":"真伪难辨   监督","B":"来路不明   约束","C":"鱼龙混杂   震慑","D":"遁名匿迹   引导"},"answer":"B","page":172},{"id":540,"chapter":14,"num":20,"source":"2022陕西事业","type":"逻辑填空","stem":"不建议给花粉过敏的人送花，因为花粉在空气中飘散时，________被人吸进呼吸道内，对花粉过敏的人体质比较特殊，吸入花粉后________出现呼吸障碍，引发哮喘等疾病，部分病人________还会出现皮疹，引起皮肤病。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"容易   可能   往往","B":"容易   往往   可能","C":"可能   往往   容易","D":"可能   容易   往往"},"answer":"B","page":172},{"id":541,"chapter":14,"num":21,"source":"2020 四川","type":"中心理解","stem":"古籍修复是一项实践性很强的工作，如果无法接触到古籍，即使学习了相关知识也很难提高实践能力。古籍修复虽然可以看作一门技艺，但需要文学、目录学，乃至材料、化学等理工科目的背景知识才能更好地工作，对文化水平要求较高。图书馆、博物馆等招聘单位对于古籍修复工作应聘者的学历要求通常较高，需要本科及以上学历，但是目前我国古籍修复专业的学历教育却以高职专科教育为主。这就使得文博机构的人才需求无法得到满足，而具有一些实际操作能力的人又无用武之地。","prompt":"这段文字意在说明：","options":{"A":"古籍修复人才应具备多方面的专业知识","B":"招聘古籍修复人才时应轻学历、重能力","C":"文博机构应为古籍修复人员提供实践机会","D":"古籍修复人才的培养与现实需求严重脱节"},"answer":"D","page":172},{"id":542,"chapter":14,"num":22,"source":"2023河北事业","type":"中心理解","stem":"这些年来，书店一直被当作买书的地方，其直接价值与深层意义，或多或少地被忽略了，尤其是在社会功能方面，实体书店承载的丰富内容，并没有得到充分利用。实体书店是一个图书的集合与分发地，一间书店可以活跃周边的社会文化氛围，制造一种文化活力，带给覆盖区域的人群一种文化影响。尤其是对少年儿童来说，高频次的实体书店的阅读时光，必将让他们更加了解书店的内涵，并构成精神成长的营养。","prompt":"这段话作者意在强调：","options":{"A":"应丰富实体书店承载的社会功能","B":"实体书店构成青少年精神成长的营养","C":"应深入挖掘实体书店的隐藏价值","D":"实体书店自身的文化氛围和文化活力"},"answer":"C","page":173},{"id":543,"chapter":14,"num":23,"source":"2025湖南三支","type":"中心理解","stem":"扩大古籍资源的开放共享，只是第一步，让古籍里的知识、故事、思想被深刻地理解并传承下去，是更艰巨的任务。我国古籍浩如烟海，无论是保护修复，还是整理研究，都需要巨大投入。要善于发挥数字化技术的长处，在保护的基础上做好系统性研究，提高利用效率。比如，运用人工智能技术进行文字识别和数据分析，不仅能以很高的准确度给古籍加标点，对人名、地名、官职等进行标记，还能对古籍内容进行深度处理和知识提取。这有助于提升研究效率，为后续利用、传播创造条件。","prompt":"这段文字意在说明：","options":{"A":"古籍资源的开放共享是一项复杂的系统工程","B":"数字化技术在古籍整理和利用中有重要作用","C":"人工智能技术有助于提升古籍整理利用效率","D":"古籍资源的整理、研究需耗费大量物力人力"},"answer":"B","page":173},{"id":544,"chapter":14,"num":24,"source":"2023内蒙古事业","type":"中心理解","stem":"扎实的知识功底、勤勉的教学态度、科学的教学方法是教师的基本素质。如果教师知识不扎实，教学中必然会捉襟见肘，更谈不上游刃有余。我国自古以来就有“学高为师”的古训，指的是教师应在学识上高人一筹，这鲜明体现了深厚学识是好老师的必备素质之一。面对当前的信息化时代，经济快速发展，社会日益多元，各种新知识不断涌现，做一名好老师，必须具备扎实的学识，努力提升自身的学识魅力，这样才能满足学生强烈的求知欲，促进学生的学习发展。","prompt":"以下选项与文段表达意思最相符的是：","options":{"A":"叠叶与高节，俱从毫末生","B":"吾生也有涯，而知也无涯","C":"学而不思则罔，思而不学则殆","D":"水之积也不厚，则其负大舟也无力"},"answer":"D","page":173},{"id":545,"chapter":14,"num":25,"source":"2022四川事业","type":"中心理解","stem":"利用身体免疫系统来对抗癌症是最有潜力的治疗方法之一。免疫系统是身体内一套由细胞、组织和器官组成的网络，是人的健康保镖，保护人免于疾病的威胁。自然，这套免疫系统也会像雷达一样，时时刻刻监视着是否有癌细胞出现，科学家们很早已经认识到，这套免疫系统在预防癌症方面也起着关键的作用。有丰富的证据可以说明这一点。而且，那些免疫系统受到抑制的病人比别的病人更容易罹患癌症更是让这一点不言自明。","prompt":"关于这段文字，下列理解准确的是:","options":{"A":"人体可以利用自身的免疫系统治愈癌症","B":"免疫受到抑制的人很可能罹患癌症","C":"免疫系统一旦发现癌细胞就会向大脑传递信息","D":"未来的抗癌技术可能产生于对免疫系统的研究"},"answer":"D","page":174},{"id":546,"chapter":14,"num":26,"source":"2024浙江事业","type":"细节判断","stem":"从外观来看，毕尔巴鄂当代文化中心是一座相当普通的大型老建筑，仅有亮点是四座古朴塔楼和正面的弧形墙面。它原本是一座建于1909 年的葡萄酒仓库，1994年，毕尔巴鄂当地政府决定将其兴建为文化中心。主持项目改造的是法国设计师菲利普·斯塔克，项目于 2010 年完成。在建筑外面可以见到顶端有玻璃幕墙，走进去才发现奇妙之处：建筑师保留了旧建筑的外立面，但内部则变成中空状态，连屋顶都被拆掉，建起了一座玻璃幕墙围绕的透明游泳池，既吸收光线，又有奇妙视觉效果。内部建起了三个有趣的红色立方体，立方体实际上是单独的一栋楼，一层层一间间各有用途。","prompt":"这段文字没有提及毕尔巴鄂当代文化中心的：","options":{"A":"主要用途","B":"外墙结构","C":"峻工时间","D":"内部设计"},"answer":"A","page":174},{"id":547,"chapter":14,"num":27,"source":"2023 福建事业","type":"细节判断","stem":"已经证实的是，大脑存在左右半球机能偏侧化优势。左脑擅长逻辑，支配语言和复杂的自主运动；右脑偏重整体、表征和空间。不过，左右脑的差异不是绝对的，两个半球相辅相成，协同活动，在一侧受损后，另一侧有代偿作用。一般来讲，左手是受右脑控制的，左利手们的右脑应该更发达。可事实上，左撇子名人们来自各个领域，有的擅长艺术，有的擅长逻辑。","prompt":"从这段文字我们可以推出：","options":{"A":"左利手者的左右脑开发得更加充分","B":"左利手者比普通人更聪明更有成就","C":"相比常人，左利手者更适合当作家","D":"右脑可能承担左脑受伤区域的功能"},"answer":"D","page":174},{"id":548,"chapter":14,"num":28,"source":"2022 浙江","type":"标题填入","stem":"制造与服务融合是智能制造的重要内容之一，服务要素渗透到制造各个环节中形成了生产性服务与制造服务化。本文从工业互联网的商业视角、使用视角、功能视角、实现视角建立了制造与服务融合中虚拟逻辑与实体活动交互的技术体系，有针对性地提出了生态位驱动、供应链驱动、大数据驱动、物联网驱动的制造与服务融合方法。本文构建的制造与服务融合技术体系，深化了工业互联网在制造业与服务业中的应用，为数字经济中制造服务产业的技术创新奠定了基础。","prompt":"如果这是一篇论文的摘要，那么这篇论文的标题最有可能是：","options":{"A":"数字经济中制造与服务融合的协同机制","B":"四轮驱动下的制造与服务融合技术体系","C":"工业互联网在智能制造中的体系化应用","D":"基于工业互联网的制造与服务融合技术"},"answer":"D","page":175},{"id":549,"chapter":14,"num":29,"source":"2023 河北事业","type":"标题填入","stem":"无人经济的发展能够为客户提供更高质量的产品，提升生产要素的配置效率，推动产业结构的优化升级。尽管无人经济发展前景好，但在生产、流通、消费、售后服务等环节也出现了一些新情况，针对无人经济新产业、新业态、新模式的监管还不明确。为推进无人经济持续健康发展，需要围绕“大市场、大质量、大监管”，持续探索和创新针对无人经济的监管方式方法和政策，切实推进无人经济监管体系完善和效能提升。","prompt":"最适合作这段文字标题的是：","options":{"A":"无人经济的“喜”与“忧”","B":"推动无人经济高质量发展","C":"无人经济需要“有人”监管","D":"无人经济发展出现了新情况"},"answer":"C","page":175},{"id":550,"chapter":14,"num":30,"source":"2020事业联考","type":"中心理解","stem":"当下的家庭教育中，“教育超量”与教育不足同时存在。有些家长唯恐自己的孩子“输在起跑线上”，为孩子报了多个辅导班、兴趣班，给孩子造成很重的负担。也有家长认为孩子还小，不必学什么，让孩子自由成长就行。这种自然教育的观念，与西方教育思想的影响有关。卢梭在《爱弥儿》中就讲，“要放任无为，才能一切有为”“你开头什么都不教，结果反而会创造一切教育奇迹”，卢梭的这些说法有一定的启发性，但其片面性也是显而易见的。事实上，卢梭本人也不是“按照”他的教育观念成长的。","prompt":"这段文字意在说明：","options":{"A":"家庭教育不应偏信、执着于某一具体理论","B":"如何把握家庭教育的尺度始终是一道难题","C":"片面强调教育“超量”   “减量”都不可取","D":"“教育超量”与教育不足都有其生存的土壤"},"answer":"C","page":175},{"id":551,"chapter":14,"num":31,"source":"2025 四川三支","type":"中心理解","stem":"围绕毕业去向这个话题，被讨论最多的便是本科毕业后选择继续读研深造，还是直接进入相关领域就业。选择读研深造的毕业生，倾向于在研究生阶段接触和积累更多学术资源及研究经验，获得更加专精的学术积淀。借此，他们能在就业市场上获得后发优势，在学术领域也能进行更深层的研究工作。选择直接进入相关领域就业的毕业生，则更倾向于通过直接的工作经历来积累职场的实践经验，提升职业技能和相关软实力，同时在入职时间上获得相对优势，为后续发展提供更大空间。在这个问题上，中外顶尖名校的毕业生存在着很大的差异。","prompt":"这段文字最后一句中的“这个问题”指的是：","options":{"A":"职场中的软实力","B":"本科毕业后的去向","C":"就业市场中的竞争力","D":"直接就业学生所占比例"},"answer":"B","page":176},{"id":552,"chapter":14,"num":32,"source":"2026事业联考","type":"中心理解","stem":"近年来，我国立法、执法、司法等公权力机关通过发布英文白皮书和涉外典型案例，在提升涉外法治话语国际传播效能方面发挥了重要作用。但从传播学视角看，单向度的官方主导型传播模式在当前国际传播场域中面临双重挑战：一方面，官方涉外法治话语多面向外国政府、国际组织及专业机构，难以实现扩散式传播：另一方面，涉外法治话语的规范化表达缺乏叙事张力与情感共鸣，跨文化环境中的受众更倾向于以固有认知解读信息，易产生“接受折扣”甚至“反向解读”。","prompt":"下列做法中，最有助于破解“涉外法治话语传播效果有限”困境的是：","options":{"A":"发挥多元主体协同作用","B":"增强涉外法治教育教学","C":"推动不同法治文明的交流与互鉴","D":"提升涉外法治话语的文化适应性"},"answer":"A","page":176},{"id":553,"chapter":14,"num":33,"source":"2023安徽三支","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①尽管我们今天早已走出了经学时代，但要想继承和激活这份宝贵的历史资产，或者在新的眼界下重启对经学的研究，返回儒家的经典当中去，都需要认真体悟和辩证\n②经学是围绕儒家经典的注释考证与思想阐发而展开的，以经典诠释为中心，形成了积蕴丰厚、内容复杂而形式多样的系统\n③发达的解经传统造就了儒家经典体系的复杂性和厚重感，又使得在这种历史延续中逐层累加起来的内容变得无比丰富和精微\n④对于传承儒家的优良传统、发扬儒学的真精神而言，只有回到其经典系统，才能真正领悟为什么儒家思想是历久弥新的\n⑤在历史上，对这些经典的解释构成了儒家思想延续和发展的基本方式，而作为具有悠久历史传统的中华文明，它的成长和扩展也正是在一代代人对于经典的把握和传承之中才得以实现的\n⑥经学一直在中国文化的发展过程中扮演着十分重要的角色","prompt":"","options":{"A":"⑥②⑤③①④","B":"②⑤④③⑥①","C":"③⑤⑥④②①","D":"①③②④⑤⑥"},"answer":"A","page":177},{"id":554,"chapter":14,"num":34,"source":"2021四川","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①压力面前，一些人声称理想很丰满、现实很骨感\n②在他们看来，只有为个人利益而活着才是最现实和最有意义的\n③还有一些人在理想与现实反差的所谓痛苦中不能自拔，迷茫和沉沦\n④一些人甚至开始奚落崇高、嘲笑理想\n⑤正因如此，那些真正为理想而活着的人，才显得格外难能可贵\n⑥岁月的淘洗中，坚守理想并不是一件容易的事","prompt":"","options":{"A":"①④③②⑥⑤","B":"⑥①④②③⑤","C":"①④②③⑤⑥","D":"⑥①②③⑤④"},"answer":"B","page":177},{"id":555,"chapter":14,"num":35,"source":"2024山西纪委","type":"语句填空","stem":"移动互联网时代，植入广告、流量变现成为许多应用程序盈利的手段。在利益驱使下，有的商家不免心存侥幸、而走险。这也是长期以来，为何一些手机 APP广告关不掉、退不出的一个重要原因。同时，手机 APP种类繁多，其广告发布的主体和方式不尽相同，也给治理增加了难度。可见，________。一方面，应加大制度供给，严格规范手机 APP广告，提升违法成本。另一方面，也应善用技术，破解难题，强化监管的针对性。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"让手机 APP清爽起来，需要监管机构把好“内容关”","B":"加大手机 APP广告监管力度，是赢得用户的关键所在","C":"手机 APP广告治理成效值得肯定，治理仍需持之以恒","D":"治理手机 APP广告是一项长期工作，还需要久久为功"},"answer":"D","page":177},{"id":556,"chapter":14,"num":36,"source":"2025 湖南三支","type":"中心理解","stem":"作为文化产业发展的内生动力，文化消费近年来增速加快，对文化及相关产业的贡献日益凸显，文化消费占文化及其相关产业增加值的比重逐年增加。与此同时，虽然文化消费占经济支出的比重逐年提升，但从结构上来看，传统文化产品的供给比重较大，新兴文化产业消费还有待培育。而数字经济所依托的数字技术正是新兴文化产业和文化消费的技术载体，有利于培育新供给，实现产业数字化、传播网络化、消费个性化，释放数字经济在文化领域的动能，培育新的文化消费增长点。","prompt":"这段文字意在强调：","options":{"A":"新兴文化产业消费市场有待培育","B":"文化产业的数字化变革势在必行","C":"数字技术对于促进文化消费有重要价值","D":"数字经济是当下文化产业发展的新动能"},"answer":"C","page":178},{"id":557,"chapter":14,"num":37,"source":"2026重庆事业","type":"中心理解","stem":"随着人工智能与大数据时代的发展，传统电子技术因逼近性能极限，“功耗墙”成为制约技术发展的关键瓶颈。为此，科学家聚焦自旋电子学这一前沿领域。区别于传统电子学仅用电子电荷属性，自旋电子学还利用其“自旋”特性---电子如持续旋转的“微型磁铁”，磁矩方向可稳定表示二进制信息。电学方法能快速调控其指向存储信息，无需持续供电即可长期保存，理论上具备高速、非易失优势，被视为突破“功耗墙”的潜力技术。但其大规模应用面临拨动“微型磁铁”电流与功耗过高的挑战，关键在于提升“自旋流”产生效率。","prompt":"这段文字意在:","options":{"A":"呼吁学术界要加大对自旋电子学基础研究的投入力度","B":"批判传统电子技术无法适应人工智能时代的市场需求","C":"揭示自旋电子学在技术潜力与工程实现间的现实张力","D":"论证自旋电子学是解决“功耗墙”问题唯一可行方案"},"answer":"C","page":178},{"id":558,"chapter":14,"num":38,"source":"2020事业联考","type":"语句填空","stem":"翻译工作，是一种成果供他人消费的智力劳动，作为劳动者的翻译工作者必须同一切劳动者一样，具备严谨的工匠精神，力求一丝不苟、精益求精，由于市场需要和数字技术发展，当今翻译市场上出现了快餐式翻译和人工智能翻译。这是翻译在传播领域中出现的新事物，有它的特点和特定环境的需要。市场既有需要，就应允许存在，让不同要求的翻译各行其道，由消费者各取所需。但这种翻译新形态，绝不能替代严谨的学术翻译，尤其是替代不了富含艺术想象力的文艺翻译。所以________。","prompt":"填入画横线处最恰当的句子是:","options":{"A":"学术和文艺翻译仍然是翻译工作的灵魂","B":"市场和技术发展有将翻译工作带入歧途的风险","C":"在翻译界倡导工匠精神仍然是十分必要的","D":"不同类型的翻译产品满足了市场的不同需求"},"answer":"C","page":179},{"id":559,"chapter":14,"num":39,"source":"2020联考","type":"接语选择","stem":"在现实中，农民工维权时往往面临证据不足、难以取证的问题。B市某法院审理的案件统计数据显示，在农民工讨薪案件中，约有80%的败诉是农民工没有相关证据而导致的。虽然劳动合同、工资卡、工资条、银行转账记录、考勤表、工作证等资料证明都可以作为农民工被欠薪的证据，但很多农民工跟着包工头干活仅以现金结账，而没有留存证据。再加上部分农民工缺乏证据意识，也可能导致被欠薪后拿不出足够证据来维权。","prompt":"这段文字接下来最可能讲述的是：","options":{"A":"用法规来解决农民工被欠薪之后证据不足的问题","B":"用法规来强制用工单位解决农民工被欠薪问题","C":"培训农民工学会用法规维护自己合法权益","D":"农民工在讨薪过程中遇到的法规问题"},"answer":"A","page":179},{"id":560,"chapter":14,"num":40,"source":"2021事业联考","type":"接语选择","stem":"我国自古以农业为立国之本，历代都有许多诗人喜爱田园生活，热衷务农，甚至躬耕自资。东晋诗人陶渊明，厌恶为五斗米折腰的官宦生活，回归农村田园，在《归园田居》中写出了“种豆南山下，草盛豆苗稀。晨兴理荒秽，带月荷锄归”的名句。在诗人的笔下，不仅有反映社会政治文化的诗词，还有许多咏及农村、农民、农业、农事的诗词，这些诗词或诗句，为我们提供了研究古代农村形态、生产模式、农学思想、农业科技的宝贵资料。","prompt":"这段文字接下来最可能讲的是:","options":{"A":"常写农村生活场景的诗人","B":"古代诗词中体现出的农学","C":"我国古代农业技术的发展","D":"古诗词对现代农业的启发"},"answer":"B","page":179},{"id":561,"chapter":15,"num":1,"source":"2021 江苏","type":"篇章阅读","passageId":"ch15-p1","passage":"索引以及一切检索工具，本质上都是揭示人类知识内在关联的认知方式，而且完全符合人类的认识习惯。我们通过研究索引的________，可以获得极大的启示。索引揭示的知识规则，是构建新媒体时代人类知识体系的基础，也是实现知识发现新方案的基础。索引具有三种功能：学术进阶的工具、知识发现的手段和学术评价的标准。传统的检索工具，其实是人类认知思维的外在表现。\n索引有两种形态，分别代表了人类的两种认知形式，即知识扩展和模式识别。知识扩展又分为两种形式，其一是单向度的知识扩展模型，就是在同一个文献内部提出某些关键词制成索引，当读者在一个段落中发现其中一个关键词，可以经由索引扩展到本书其他段落、篇章中的同一词，这是个闭合循环的知识扩展模型；其二是开放性的知识扩展，就是读者在书中发现一个关键词，通过综合索引跳转至多种文献中与之相关的关键词，从而不断向外扩展。在这个模型之上，如果把多个知识关联序列进行叠加，我们便掌握了一种新的认知形式，就是模式识别。不是说通过一个已知的关键词去找它在文献中出现的位置，而是根据某些边际条件探索某个关键词集，即获取位于一个相关知识序列中的知识集合。比如说，我们综合利用唐代的士族世系表、科举年表、职官年表，可以探索士族出身的文士通过科举途径入仕和此后的升迁途径中较之寒门子弟有何优势，甚至可以结合士族郡望表进一步细致分析不同地域士族的升降与科举之间的关系。模式识别是学术研究更高级的思维过程。免费学习资料库加微信：Sasm19\n知识扩展和模式识别都依赖于知识系统的有序性和关联性，由此形成的知识图谱，是有关联的、有序的知识集合。这个知识集合中，所有知识点都在一个相互关联的网络体系中，不是单个的珠子，而是固定在一串项链上，我们可以知道它的定位，知道它跟其他知识之间的关联。\n知识图谱正是用以实现模式识别思维功能的方案，它由多个知识本体库和多个知识模型组成，把这些知识模型进行叠加以实现模式识别功能。知识图谱的综合架构有点像生物分子模型，任何一个知识点都能够在它的分子链上找到，而每个分子链跟其他的分子链之间还有一种关联，那么我们可以通过它的颜色、大小、方向来定位它到底是哪个具体的知识。我们看单独的知识点，它是海量知识中一个不确定的点，但当我们把不同来源的知识进行拼合的时候，其实它就变成了一个某种七巧板拼成的固定形状，每一个单块都是不可移动的，是互相关联从而互相限定的。那么，以往所有的问题、错误，包括误解，其实都可以在这个体系中再认识。\n这种知识管理方案能够让我们把传统媒体中的经验、知识和智慧，平滑地移入新媒体中，实现基于规则的方案和基于统计的方案的结合，也就是基于计算机技术的和基于专业领域知识的知识管理方案的完美结合，进而辅助人类更广阔、深入地认识主观世界和客观世界。","stem":"","prompt":"填入文中画横线处最恰当的是：","options":{"A":"原理和特性","B":"产生与发展","C":"运用与前景","D":"方法和用途"},"answer":"A","page":182},{"id":562,"chapter":15,"num":2,"source":"2021 江苏","type":"篇章阅读","passageId":"ch15-p1","passage":"索引以及一切检索工具，本质上都是揭示人类知识内在关联的认知方式，而且完全符合人类的认识习惯。我们通过研究索引的________，可以获得极大的启示。索引揭示的知识规则，是构建新媒体时代人类知识体系的基础，也是实现知识发现新方案的基础。索引具有三种功能：学术进阶的工具、知识发现的手段和学术评价的标准。传统的检索工具，其实是人类认知思维的外在表现。\n索引有两种形态，分别代表了人类的两种认知形式，即知识扩展和模式识别。知识扩展又分为两种形式，其一是单向度的知识扩展模型，就是在同一个文献内部提出某些关键词制成索引，当读者在一个段落中发现其中一个关键词，可以经由索引扩展到本书其他段落、篇章中的同一词，这是个闭合循环的知识扩展模型；其二是开放性的知识扩展，就是读者在书中发现一个关键词，通过综合索引跳转至多种文献中与之相关的关键词，从而不断向外扩展。在这个模型之上，如果把多个知识关联序列进行叠加，我们便掌握了一种新的认知形式，就是模式识别。不是说通过一个已知的关键词去找它在文献中出现的位置，而是根据某些边际条件探索某个关键词集，即获取位于一个相关知识序列中的知识集合。比如说，我们综合利用唐代的士族世系表、科举年表、职官年表，可以探索士族出身的文士通过科举途径入仕和此后的升迁途径中较之寒门子弟有何优势，甚至可以结合士族郡望表进一步细致分析不同地域士族的升降与科举之间的关系。模式识别是学术研究更高级的思维过程。免费学习资料库加微信：Sasm19\n知识扩展和模式识别都依赖于知识系统的有序性和关联性，由此形成的知识图谱，是有关联的、有序的知识集合。这个知识集合中，所有知识点都在一个相互关联的网络体系中，不是单个的珠子，而是固定在一串项链上，我们可以知道它的定位，知道它跟其他知识之间的关联。\n知识图谱正是用以实现模式识别思维功能的方案，它由多个知识本体库和多个知识模型组成，把这些知识模型进行叠加以实现模式识别功能。知识图谱的综合架构有点像生物分子模型，任何一个知识点都能够在它的分子链上找到，而每个分子链跟其他的分子链之间还有一种关联，那么我们可以通过它的颜色、大小、方向来定位它到底是哪个具体的知识。我们看单独的知识点，它是海量知识中一个不确定的点，但当我们把不同来源的知识进行拼合的时候，其实它就变成了一个某种七巧板拼成的固定形状，每一个单块都是不可移动的，是互相关联从而互相限定的。那么，以往所有的问题、错误，包括误解，其实都可以在这个体系中再认识。\n这种知识管理方案能够让我们把传统媒体中的经验、知识和智慧，平滑地移入新媒体中，实现基于规则的方案和基于统计的方案的结合，也就是基于计算机技术的和基于专业领域知识的知识管理方案的完美结合，进而辅助人类更广阔、深入地认识主观世界和客观世界。","stem":"","prompt":"作者认为检索工具产生的根本原因在于：","options":{"A":"学者需要将其作为学术研究的工具","B":"学者需要将其作为学术评价的标准","C":"人们需要这样一种构建庞大知识体系的基本规则","D":"人们需要这样一种揭示知识内在关联的认知方式"},"answer":"D","page":182},{"id":563,"chapter":15,"num":3,"source":"2021 江苏","type":"篇章阅读","passageId":"ch15-p1","passage":"索引以及一切检索工具，本质上都是揭示人类知识内在关联的认知方式，而且完全符合人类的认识习惯。我们通过研究索引的________，可以获得极大的启示。索引揭示的知识规则，是构建新媒体时代人类知识体系的基础，也是实现知识发现新方案的基础。索引具有三种功能：学术进阶的工具、知识发现的手段和学术评价的标准。传统的检索工具，其实是人类认知思维的外在表现。\n索引有两种形态，分别代表了人类的两种认知形式，即知识扩展和模式识别。知识扩展又分为两种形式，其一是单向度的知识扩展模型，就是在同一个文献内部提出某些关键词制成索引，当读者在一个段落中发现其中一个关键词，可以经由索引扩展到本书其他段落、篇章中的同一词，这是个闭合循环的知识扩展模型；其二是开放性的知识扩展，就是读者在书中发现一个 的。比如当老鼠感染一种名叫刚地弓形虫的寄生虫的时候。1908 年，细菌学家查尔斯·尼科尔在突尼斯的刚地疏趾鼠体内发现了这种只有几个微米大小的细胞内寄生原虫。随着研究深入，人们发现，弓形虫只在家猫和虎、狮等猫科动物体内进行有性生殖，其无性繁殖则可以发生在几乎所有温血动物（比如老鼠）的有核细胞中。\n④值得一提的是，弓形虫的感染通常比较温和。在免疫力正常的动物体内，弓形虫以一种叫做组织包囊的形式存在于动物大脑或肌肉中，呈慢性感染。只有当动物免疫力低下时，弓形虫感染才会引起严重的临床后果，比如脑炎、视网膜脉络膜炎等。\n⑤慢性感染并不表示弓形虫对动物没有影响，何况它感染的部位是大脑。早在 2014 年，分子与细胞生物学教授迈克·艾森团队就发现，慢性感染弓形虫的小鼠对猫尿液的畏惧程度降低了。研究人员将小鼠体内的弓形虫完全清除后，这种变化并没有发生反转。通俗地讲，老鼠胆子变大了，不再害怕猫留下的痕迹和气味，而且“一时感染，终生受用”。\n⑥2020 年1月，日内瓦大学医学院多米尼克·索达提一—法威尔教授团队发表论文称，慢性感染弓形虫的小鼠，不只是针对猫的胆子变大，面对其他捕食者时胆子也会变大。\n⑦“我们发现感染弓形虫的小鼠的恐惧感丧失不仅仅是针对猫的，”科研人员表示，“这些小鼠思维活跃，四处游走探索。”在该研究中，研究人员建立了弓形虫慢性感染的小鼠模型，惊奇地发现，在慢性感染状态下，小鼠的焦虑水平降低了，更喜欢探索未知的东西。\n⑧难道小鼠的胆子真的变大了？研究人员检测了小鼠对不同动物尿液的恐惧程度，发现弓形虫慢性感染的小鼠对猫尿液的恐惧程度明显降低，也不惧怕狐狸和豚鼠的尿液。就算附近放置的是处于麻醉状态的活的大鼠，小鼠依然来去自如。这和未感染组小鼠的小心翼翼形成鲜明对比。\n⑨研究人员进而发现，弓形虫感染的小鼠，其行为变化程度与其脑组织中的包囊数量呈一定的相关性，弓形虫感染量越大，小鼠的探索性行为就越明显。通过转录组学分析，研究人员发现弓形虫慢性感染的小鼠，脑组织中炎性因子的转录水平发生了明显变化，并且与脑组织中包囊的数量和行为的变化程度具有相关性。科研人员推测，弓形虫慢性感染会引起动物脑组织持续性的炎症反应，炎性因子的释放会影响神经细胞的功能，最终导致动物的“勇敢”行为。\n⑩安徽医科大学一位病原生物学教授说，弓形虫感染引起动物行为的变化可以拉近猎物和捕食者之间的空间距离，有利于虫体的扩散传播；老鼠不怕猫则更有助于弓形虫在猫体内的有性生殖，促进弓形虫的进化以及对环境的适应。动物实验研究有助于揭示人体“慢性无症状感染”相关神经精神障碍性疾病的发病机制。","stem":"有人不禁要问，既然老鼠感染弓形虫后连猫都不怕，那么它对其他捕食者或威胁的恐惧感有没有变化呢？","prompt":"下面这段文字最适合放在文章的哪个位置？","options":{"A":"②和③之间","B":"③和④之间","C":"⑤和⑥之间","D":"⑦和⑧之间"},"answer":"C","page":184},{"id":567,"chapter":15,"num":7,"source":"2022 国考副省级","type":"篇章阅读","passageId":"ch15-p2","passage":"①老鼠生性胆小机警，我们常用“胆小如鼠”来形容一个人懦弱怕事。老鼠怕猫更被认为是天经地义的事情。这对冤家也常被搬上屏幕，例如《猫和老鼠》和《黑猫警长》。\n②那么，老鼠有没有不怕猫的时候呢？\n③答案是肯定的。比如当老鼠感染一种名叫刚地弓形虫的寄生虫的时候。1908 年，细菌学家查尔斯·尼科尔在突尼斯的刚地疏趾鼠体内发现了这种只有几个微米大小的细胞内寄生原虫。随着研究深入，人们发现，弓形虫只在家猫和虎、狮等猫科动物体内进行有性生殖，其无性繁殖则可以发生在几乎所有温血动物（比如老鼠）的有核细胞中。\n④值得一提的是，弓形虫的感染通常比较温和。在免疫力正常的动物体内，弓形虫以一种叫做组织包囊的形式存在于动物大脑或肌肉中，呈慢性感染。只有当动物免疫力低下时，弓形虫感染才会引起严重的临床后果，比如脑炎、视网膜脉络膜炎等。\n⑤慢性感染并不表示弓形虫对动物没有影响，何况它感染的部位是大脑。早在 2014 年，分子与细胞生物学教授迈克·艾森团队就发现，慢性感染弓形虫的小鼠对猫尿液的畏惧程度降低了。研究人员将小鼠体内的弓形虫完全清除后，这种变化并没有发生反转。通俗地讲，老鼠胆子变大了，不再害怕猫留下的痕迹和气味，而且“一时感染，终生受用”。\n⑥2020 年1月，日内瓦大学医学院多米尼克·索达提一—法威尔教授团队发表论文称，慢性感染弓形虫的小鼠，不只是针对猫的胆子变大，面对其他捕食者时胆子也会变大。\n⑦“我们发现感染弓形虫的小鼠的恐惧感丧失不仅仅是针对猫的，” 言，定量遥感是从地物反射或发射的电磁辐射里，来推演得到地物某些特征定量化描述的手段。通俗地说，就是在遥感获取的各项电磁辐射信号的基础上，通过数字的或者物理的模型，将遥感信息与观测地表目标联系起来，定量地反演或推算目标的各种自然属性信息。\n我们以全球气候变化研究为例。在全球气候变化研究中，定量的遥感数据产品起着至关重要的作用。它们不仅能够作为输入参数集来驱动数值过程模型运行、评价和验证其模拟结果，还可以通过适时地输入更新结合数据同化的方法确定过程模型的某些状态变量或者参数，以提高不同时空尺度的碳、水、氮通量等模拟精度并进行预测。在行业部门的各种业务应用中，各种评估对量化指标的旺盛需求，也对遥感的定量化提出了更高要求。","stem":"","prompt":"填入文章第一段画横线处最恰当的一项是:","options":{"A":"覆盖","B":"涵盖","C":"囊括","D":"包含"},"answer":"B","page":186},{"id":572,"chapter":15,"num":12,"source":"2023 江苏","type":"篇章阅读","passageId":"ch15-p3","passage":"人类的信息需求有 80%与地理空间位置有关，而在全球普遍面临日益严重的资源环境问题的形势下，遥感宏观、动态、精确等特点，在国民经济、社会发展和国防安全中起着越来越重要的作用。地球观测组织（GEO）确定的遥感9大应用领域，________了灾害、卫生、能源、气候、水、天气、生态系统、农业、生物多样性等，更是涉及了人类生活的方方面面。\n人们对事物的认知，总是先看到表面，然后涉及实质，尤其是对自然科学研究而言，观察一总结一归纳一演绎推理一实证是通用的研究逻辑。研究者更注重用数学建立起自然世界的研究对象之间的映射关系，以便用数学方法解释自然规律并进一步预测规律。因此相较于定性的描述，定量的刻画和应用更是自然科学的关键所在。自然科学的分析、对规律现象的确定性描述，这都离不开“数据”或者“量化”这一研究基础。\n20 世纪 70 年代以来，卫星遥感主要采取垂直观测方式，以获得地表二维信息，对获取的数据则基于地面目标漫反射的假定，作一些简单校正后利用地面目标的光谱特性作地表分类或经验判读。早期遥感的应用，更多的是基于定性描述，也就是通过可视的地物颜色、纹理、形状、大小等要素来对地物的各种属性进行推断并进行运用。但是，随着需求的发展，定性遥感越来越难以满足科研和应用的需求。\n例如，卫星遥感通过云图可以很直观地显示各种气团的运动趋势，但中、长期天气预报的准确性仍不令人满意。其主要原因之一就是在大气动力学模型中，需要知道影响地面和大气温度的大气下垫面反照率和影响气流运动的粗糙度这些量化的信息，而定性的分析显然不能满足这个需求。\n很自然地，人们开始着眼于通过遥感的方式来获取地物更多量化信息的研究，并期望定量遥感能承载更多的应用需求。\n对应于定性遥感而言，定量遥感是从地物反射或发射的电磁辐射里，来推演得到地物某些特征定量化描述的手段。通俗地说，就是在遥感获取的各项电磁辐射信号的基础上，通过数字的或者物理的模型，将遥感信息与观测地表目标联系起来，定量地反演或推算目标的各种自然属性信息。\n我们以全球气候变化研究为例。在全球气候变化研究中，定量的遥感数据产品起着至关重要的作用。它们不仅能够作为输入参数集来驱动数值过程模型运行、评价和验证其模拟结果，还可以通过适时地输入更新结合数据同化的方法确定过程模型的某些状态变量或者参数，以提高不同时空尺度的碳、水、氮通量等模拟精度并进行预测。在行业部门的各种业务应用中，各种评估对量化指标的旺盛需求，也对遥感的定量化提出了更高要求。","stem":"","prompt":"根据文意，“定量的刻画和应用”的关键作用在于：","options":{"A":"用数学建立各研究对象之间的映射关系","B":"对事物的认识从表面进入到确定性描述","C":"是自然科学研究进入实证阶段的必要途径","D":"可以解释自然规律并进一步预测相关规律"},"answer":"D","page":186},{"id":573,"chapter":15,"num":13,"source":"2023 江苏","type":"篇章阅读","passageId":"ch15-p3","passage":"人类的信息需求有 80%与地理空间位置有关，而在全球普遍面临日益严重的资源环境问题的形势下，遥感宏观、动态、精确等特点，在国民经济、社会发展和国防安全中起着越来越重要的作用。地球观测组织（GEO）确定的遥感9大应用领域，________了灾害、卫生、能源、气候、水、天气、生态系统、农业、生物多样性等，更 旷日持久，为保障兵力增援和后勤供给，采纳此议，修建浮桥。\n长江自西南方向流经采石矶，采石矶江面稍窄而水急。①采石矶上游江面宽阔而水缓，近似喇叭形，因上游泥沙沉积，形成现在的江心洲，已伸展至采石矶的下游。但在宋时，江心洲或尚未出现，或尚未伸展到采石一带。②宋人陈造《采石渡》诗说：“大江碍崇山，突起作湍悍。采石天下险，揭厉谁敢玩。”③据现代水文资料，在枯水期和涨水期，采石一带江水流速为0.96～2.03 米/秒，江面宽度为5250～5900米，其中包括江心洲 2000米。因历代泥沙淤积，江面逐渐变窄，估计宋代采石矶一带江面，当比现代更宽。在如此宽阔、风浪险恶的江面上修建大浮桥，即使从现代技术条件看来，也并不简单，在一千余年前的古代，更是不可思议的奇迹。④这种奇迹毕竟出现了。开宝七年（974年）冬天，宋人利用枯水期，在采石矶建成浮桥。《续资治通鉴长编》中说，宋人按照樊若冰的计策，造好几千艘大舰和黄黑龙船，用大舰装载“巨竹”，用黄黑龙船在采石矶跨江建成浮桥。南唐君臣听说宋人试图造桥，认为载籍以来，无有此事，宋人儿戏，必造不成。他们对跨江建浮桥缺乏足够估计，铸成大错。\n宋军建成浮桥后，沿江东下。南唐出兵，企图焚烧浮梁，并未得手。开宝八年（975年）宋军攻破金陵，南唐后主李煜被迫辞别“凤阁龙楼”，充当降王。采石跨江大浮桥对这次军事胜利，无疑起了很大作用。在一年多的时间里，浮桥经历了各种气象与水文条件的考验，安然无恙，________。古代浮桥的构造，或在江河两岸以铁柱、石柱之类系几根牵缆，牵缆上缚工铺板，连接成桥，或以各船下锚为主，两岸系牵缆为辅。宋人造桥时记载的“巨竹”，应即浮桥的缆绳。然而在江阔水深的条件下，以粗竹绳系缆，强度毕竟有限，估计各船必须在江底下锭石，方能保证浮桥的牢固。宋时浮桥往往“治铁为琐，辫竹为缆”，使之稳固，采石浮桥应该不会只用竹缆而无铁锁之类的设备。\n依据现在采石的江面宽度，我们不妨估计宋代浮桥的长度约 6000 米上下。依1宋丈约为3.1米计，约合1935宋丈，须用船773～967艘。宋人记载中的“黄黑龙船数千艘”，当是构筑浮桥用的。\n这里不妨以南京长江大桥作比较。南京长江大桥江面正桥长1577米，连同两端引桥，铁路桥总长6772米，公路桥总长 4589 米。采石浮桥估计在 6000 米上下，其下所用黄黑龙船，少则七百，多则近千艘，十分壮观。在世界古代史上，建造如此长跨度的大浮桥，无疑是绝无仅有的。这是世界科技史上的一件大事，充分显示了中华民族的智慧和创造才能。","stem":"北宋初架设浮桥的记载，南宋前期关于采石水战的记载，证明采石一带尚无江心洲。","prompt":"下面这段文字最适合填入文中哪个位置？","options":{"A":"①处","B":"②处","C":"③处","D":"④处"},"answer":"B","page":188},{"id":577,"chapter":15,"num":17,"source":"2024 国考副省级","type":"篇章阅读","passageId":"ch15-p4","passage":"人们观瞻南京长江大桥，莫不为其雄伟赞叹不已。然而很少有人知道，宋代曾在南京长江大桥的西南，即今安徽当涂县境采石矶一带，建造过一座跨江大浮桥，这也是世界桥梁史上的创举。\n采石自古以来是长江的重要渡口。北宋初，江南人樊若冰举进士不中第，钓鱼采石江上，以小舟装载丝绳，测得长江宽度，之后诣阙上书，创议修建浮桥，以攻江南。当时南唐军力居南方割据政权第一，水师颇强，国都金陵城池深固，易守难攻。宋太祖估计战事可能旷日持久，为保障兵力增援和后勤供给，采纳此议，修建浮桥。\n长江自西南方向流经采石矶，采石矶江面稍窄而水急。①采石矶上游江面宽阔而水缓，近似喇叭形，因上游泥沙沉积，形成现在的江心洲，已伸展至采石矶的下游。但在宋时，江心洲或尚未出现，或尚未伸展到采石一带。②宋人陈造《采石渡》诗说：“大江碍崇山，突起作湍悍。采石天下险，揭厉谁敢玩。”③据现代水文资料，在枯水期和涨水期，采石一带江水流速为0.96～2.03 米/秒，江面宽度为5250～5900米，其中包括江心洲 2000米。因历代泥沙淤积，江面逐渐变窄，估计宋代采石矶一带江面，当比现代更宽。在如此宽阔、风浪险恶的江面上修建大浮桥，即使从现代技术条件看来，也并不简单，在一千余年前的古代，更是不可思议的奇迹。④这种奇迹毕竟出现了。开宝七年（974年）冬天，宋人利用枯水期，在采石矶建成浮桥。《续资治通鉴长编》中说，宋人按照樊若冰的计策，造好几千艘大舰和黄黑龙船，用大舰装载“巨竹”，用黄黑龙船在采石矶跨江建成浮桥。南唐君臣听说宋人试图造桥，认为载籍以来，无有此事，宋人儿戏，必造不成。他们对跨江建浮桥缺乏足够估计，铸成大 发出大约11次声响，受伤状态下发出大约15次声响。水分充足、未经修剪的植物基本保持安静，每小时只发出1次声响。④\n在记录下这些植物的声音后，研究人员训练了一种可以根据发出的声音，识别植物种类与状态的机器学习算法。这种机器学习模型能够区分番茄与烟草、识别植物的脱水与受损程度，准确率高达 70%。目前研究人员尚未明确这些声音的产生机制，但是认为可能是由植物维管系统中气泡的形成和破裂造成的。并非只有番茄和烟草这两种植物会“说话”。此前，该研究团队在进行初步调查时，曾经发现玉米、小麦、葡萄和仙人掌等许多植物，在压力状态下都会发出声音。这些声音是超声波，频率约在 20～100千赫兹范围内，音调很高，通常超出人的听觉范围。不过，有些动物可能可以听到，比如蝙蝠、老鼠和飞蛾等，可能就生活在一个充满植物声音的世界里。\n那么，这些声音是植物“有意”发出的吗？这是研究人员想要了解的另一个问题。目前，他们尚不清楚植物发出这些声音是否是为了与其他生物进行交流，但是认为这些声音的存在，具有重大的生态和进化意义。无论植物是否有意发声，检测到植物的声音，都有可能助力农业发展。比如，________。人们通过接收来自农田或温室的某种特定声音，就可以判断作物是不是缺水了。\n目前，研究人员正在研究其他动物和植物对这些声音的反应，也在探索我们在自然环境中识别与解读这些声音的能力。","stem":"这意味着，那些人类无法听到的声音，实际上是携带信息的。","prompt":"下面这段文字最适合填入文中哪个位置?","options":{"A":"①处","B":"②处","C":"③处","D":"④处"},"answer":"D","page":190},{"id":582,"chapter":15,"num":22,"source":"2024 国考副省级","type":"篇章阅读","passageId":"ch15-p5","passage":"人们常说“万物有灵”，这里的“物”也包括植物。植物能与昆虫等生物进行各式各样的“互动”，有些互动似乎是通过声音来实现的。①\n近年来，科学家发现植物能对动物发出的声音做出反应。比如，当一些植物“听到”传粉昆虫发出的声音，就会增加花蜜中糖的浓度；有的植物会改变基因表达，从而对声音进行响应。与此同时，科学家还发现，一些植物会通过振动，发出超声波。比如，有研究人员通过连接在松树切片上的传感器，探测到松树切片发出的声音。②\n此前还发现植物缺水或受伤时，颜色、气味、形状等表型会发生变化，尚未研究过的问题是：压力状态下的植物，能发出在空中传播的声音吗？为了回答这个问题，生物学家利拉赫·韩达尼及其团队利用超声波传声器，记录了番茄和烟草这两种植物在健康与压力状态下发出的声音，对比发现，处于压力状态下的植物并不沉默，它们会发出气泡膜破裂般的声音，频率很高，超出人耳的听觉范围。这一研究成果最近发表在《细胞》杂志上。\n研究人员在安静的地下环境中创建了一个吸声室，采用两种方法，使植物处于压力状态：一是几天不浇水，使之缺水；一是剪断它们的茎部，使之受伤。在吸声室里，他们捕捉到植物发出类似气泡膜破裂的短促声响，音量与正常人的谈话相当，只是频率很高，人类无法直接听见。③\n研究表明，缺水的番茄植株，每小时发出大约35次声响；受伤的番茄植株稍微安静，发出大约 25 次声响。烟草植株总体上要比番茄植株安静，在缺水情况下每小时发出大约11次声响，受伤状态下发出大约15次声响。水分充足、未经修剪的植物基本保持安静，每小时只发出1次声响。④\n在记录下这些植物的声音后，研究人员训练了一种可以根据发出的声音，识别植物种类与状态的机器学习算法。这种机器学习模型能够区分番茄与烟草、识别植物的脱水与受损程度，准确率高达 70%。目前研究人员尚未明确这些声音的产生机制，但是认为可能是由植物维管系统中气泡的形成和破裂造成的。并非只有番茄和烟草这两种植物会“说话”。此前，该研究团队在进行初步调查时，曾经发现玉米、小麦、葡萄和仙人掌等许多植物，在压力状态下都会发出声音。这些声音是超声波，频率约在 20～100千赫兹范围内，音调很高，通常超出人的听觉范围。不过，有些动物可能可以听到，比如蝙蝠、老鼠和飞蛾等，可能就生活在一个充满植物声音的世界里。\n那么，这些声音是植物“有意”发出的吗？这是研究人员想要了解的另一个问题。目前，他们尚不清楚植物发出这些声音是否是为了与其他生物进行交流，但是认为这些声音的存在，具有重大的生态和进化意义。无论植物是否有意发声，检测到植物的声音，都有可能助力农业发展。比如，________。人们通过接收来自农田或温室的某种特定声音，就可以判断作物是不是缺水了。\n目前，研究人员正在研究其他动物和植物对这些声音的反应，也在探索我们在自然环境中识别与解读这些声音的能力。","stem":"","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"可以在农田安装能捕捉植物声音的机器","B":"植物能对包括声音在内的许多刺激做出反应","C":"研究证明植物发出的超声波能够在空气中传播","D":"这些声音能为监测植物体内水分状态提供新方法"},"answer":"D","page":190},{"id":583,"chapter":15,"num":23,"source":"2024 国考副省级","type":"篇章阅读","passageId":"ch15-p5","passage":"人们常说“万物有灵”，这里的“物”也包括植物。植物能与昆虫等生物进行各式各样的“互动”，有些互动似乎是通过声音来实现的。①\n近年来，科学家发现植物能对动物发出的声音做出反应。比如，当一些植物“听到”传粉昆虫发出的声音，就会增加花蜜中糖的浓度；有的植物会改变基因表达，从而对声音进行响应。与此同时，科学家还发现，一些植物会通过振动，发出超声波。比如，有研究人员通过连接在松树切片上的传感器，探测到松树切片发出的声音。②\n此前还发现植物缺水或受伤时，颜色、气味、形状等表型会发生变化，尚未研究过的问题是：压力状态下的植物，能发出在空中传播的声音吗？为了回答这个问题，生物学家利拉赫·韩达尼及其团队利用超声波传声器，记录了番茄和烟草这两种植物在健康与压力状态下发出的声音，对比发现，处于压力状态下的植物并不沉默，它们会发出气泡膜破裂般的声音，频率很高，超出人耳的听觉范围。这一研究成果最近发表在《细胞》杂志上。\n研究人员在安静的地下环境中创建了一个吸声室，采用两种方法，使植物处于压力状态：一是几天不浇水，使之缺水；一是剪断它们的茎部，使之受伤。在吸声室里，他们捕捉到植物发出类似气泡膜破裂的短促声响，音量与正常人的谈话相当，只是频率很高，人类无法直接听见。③\n研究表明，缺水的番茄植株，每小时发出大约35次声响；受伤的番茄植株稍微安静，发出大约 25 次声响。烟草植株总体上要比番茄植株安静，在缺水情况下每小时发出大约11次声响，受伤状态下发出大约15次声响。水分充足、未经修剪的植物基本保持安静，每小时只发出1次声响。④\n在记录下这些植物的声音后，研究人员训练了一种可以根据发出的声音，识别植物种类与状态的机器学习算法。这种机器学习模型能够区分番茄与烟草、识别植物的脱水与受损程度，准确率高达 70%。目前研究人员尚未明确这些声音的产生机制，但是认为可能是由植物维管系统中气泡的形成和破裂造成的。并非只有番茄和烟草这两种植物会“说话”。此前，该研究团队在进行初步调查时，曾经发现玉米、小麦、葡萄和仙人掌等许多植物，在压力状态下都会发出声音。这些声音是超声波，频率约在 20～100千赫兹范围内，音调很高，通常超出人的听觉范围。不过，有些动物可能可以听到，比如蝙蝠、老鼠和飞蛾等，可能就生活在一个充满植物声音的世界里。\n那么，这些声音是植物“有意”发出的吗？这是研究人员想要了解的另一个问题。目前，他们尚不清楚植物发出这些声音是否是为了与其他生物进行交流，但是认为这些声音的存在，具有重大的生态和进化意义。无论植物是否有意发声，检测到植物的声音，都有可能助力农业发展。比如，________。人们通过接收来自农田或温室的某种特定声音，就可以判断作物是不是缺水了。\n目前，研究人员正在研究其他动物和植物对这些声音的反应，也在探索我们在自然环境中识别与解读这些声音的能力。","stem":"","prompt":"关于利拉赫·韩达尼及其团队的研究，下列说法正确的是:","options":{"A":"构建了能够识别植物声音的机器模型","B":"建立了类似真空环境的吸声室","C":"对植物在压力下的发声机制作出解释","D":"发现蝙蝠能够听到植物的声音"},"answer":"C","page":190},{"id":584,"chapter":15,"num":24,"source":"2024 国考副省级","type":"篇章阅读","passageId":"ch15-p5","passage":"人们常说“万物有灵”，这里的“物”也包括植物。植物能与昆虫等生物进行各式各样的“互动”，有些互动似乎是通过声音来实现的。①\n近年来，科学家发现植物能对动物发出的声音做出反应。比如，当一些植物“听到”传粉昆虫发出的声音，就会增加花蜜中糖的浓度；有的植物会改变基因表达，从而对声音进行响应。与此同时，科学家还发现，一些植物会通过振动，发出超声波。比如，有研究人员通过连接在松树切片上的传感器，探测到松树切片发出的声音。②\n此前还发现植物缺水或受伤时，颜色、气味、形状等表型会发生变化 function normalizeBankQuestions(bankId, rawQs) {
  return (rawQs || []).map((q, idx) => {
    const rawId = q.origId ?? q.id ?? (idx + 1);
    const uid = bankId === "yanyu600" ? String(rawId) : `${bankId}__${rawId}`;
    let opts = q.options || {};
    if (Array.isArray(opts)) {
      opts = { A: opts[0] || "", B: opts[1] || "", C: opts[2] || "", D: opts[3] || "" };
    } else {
      opts = { A: opts.A || "", B: opts.B || "", C: opts.C || "", D: opts.D || "" };
    }
    const ch = Number(q.chapter) || (Math.floor(idx / 40) + 1);
    const num = Number(q.num) || ((idx % 40) + 1);
    const passageId = q.passageId
      ? (bankId === "yanyu600" ? String(q.passageId) : (String(q.passageId).startsWith(bankId) ? String(q.passageId) : `${bankId}__${q.passageId}`))
      : "";
    const out = {
      id: uid,
      origId: rawId,
      bankId,
      chapter: ch,
      num,
      source: String(q.source || ""),
      type: String(q.type || (bankId === "yanyu600" ? "言语理解" : "综合题")),
      stem: String(q.stem || ""),
      prompt: String(q.prompt || ""),
      options: opts,
      answer: String(q.answer || "A").trim().toUpperCase().slice(0, 1)
    };
    if (q.passage) { out.passage = String(q.passage); out.passageId = passageId || `${bankId}__p_${ch}_${num}`; }
    if (Array.isArray(q.stemImages) && q.stemImages.length) out.stemImages = q.stemImages;
    if (q.optionImages && typeof q.optionImages === "object" && Object.keys(q.optionImages).length) out.optionImages = q.optionImages;
    if (q.analysis) out.analysis = String(q.analysis);
    return out;
  });
}

function registerBankEntry(meta, questions = null) {
  const existing = BANK_REGISTRY.get(meta.id);

    entry.count = entry.questions.length;
    entry.loaded = true;
  }
  BANK_REGISTRY.set(entry.id, entry);
  if (!BANK_ORDER.includes(entry.id)) BANK_ORDER.push(entry.id);
  return entry;
}

window.__REGISTER_BANK__ = function(bankObj) {
  if (!bankObj || !bankObj.id) return;
  const entry = registerBankEntry({
    id: bankObj.id,
    name: bankObj.name || bankObj.id,
    shortName: bankObj.shortName || bankObj.name || bankObj.id,
    subtitle: bankObj.subtitle || "",
    icon: bankObj.icon || "📚",
    chapterPrefix: bankObj.chapterPrefix || "套",
    chapterNames: bankObj.chapterNames || null,
    builtin: true
  }, bankObj.questions || []);
  const res = pendingBankResolvers.get(bankObj.id);
  if (res) {
    pendingBankResolvers.delete(bankObj.id);
    res(entry);
  }
};

async function ensureBankLoaded(bankId) {
  const entry = BANK_REGISTRY.get(bankId);
  if (!entry) return null;
  if (entry.loaded && entry.questions && entry.questions.length) return entry;

  if (entry.scriptSrc) {
    try {
      await new Promise((resolve, reject) => {
        pendingBankResolvers.set(bankId, resolve);
        const s = document.createElement("script");
        s.src = entry.scriptSrc + (location.protocol.startsWith("http") ? `?v=${Date.now()}` : "");
        s.async = true;
        s.onerror = () => { pendingBankResolvers.delete(bankId); reject(new Error("script load failed")); };
        document.head.appendChild(s);
      });
      return BANK_REGISTRY.get(bankId);
    } catch (e) {}
  }
  if (entry.jsonSrc) {
    try {
      const resp = await fetch(entry.jsonSrc);
      if (resp.ok) {
        const obj = await resp.json();
        window.__REGISTER_BANK__(obj);
        return BANK_REGISTRY.get(bankId);
      }
    } catch (e) {}
  }
  return entry;
}

function openCustomBanksDB() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === "undefined") { reject(new Error("no indexedDB")); return; }
    const req = indexedDB.open(CUSTOM_BANKS_DB, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(CUSTOM_BANKS_STORE)) {
        db.createObjectStore(CUSTOM_BANKS_STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function loadCustomBanksFromDB() {
  try {
    const db = await openCustomBanksDB();
    const list = await new Promise((resolve, reject) => {
      const tx = db.transaction(CUSTOM_BANKS_STORE, "readonly");
      const req = tx.objectStore(CUSTOM_BANKS_STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
    list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    for (const b of list) {
      registerBankEntry({
        id: b.id,
        name: b.name,
        shortName: b.shortName || b.name,
        subtitle: b.subtitle || `自定义导入题库 · ${(b.questions || []).length}题`,
        icon: b.icon || "📚",
        chapterPrefix: b.chapterPrefix || "练习题",
        builtin: false,
        createdAt: b.createdAt || Date.now()
      }, b.questions || []);
    }
  } catch (e) {}
}

async function saveCustomBankToDB(bankRecord) {
  const db = await openCustomBanksDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(CUSTOM_BANKS_STORE, "readwrite");
    tx.objectStore(CUSTOM_BANKS_STORE).put(bankRecord);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

async function deleteCustomBankFromDB(bankId) {
  const db = await openCustomBanksDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(CUSTOM_BANKS_STORE, "readwrite");
    tx.objectStore(CUSTOM_BANKS_STORE).delete(bankId);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = n => String(n).padStart(2, "0");
  return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

function escapeHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

  for (const q of bankQs) {
    const a = state.answers[q.id];
    if (a) {
      answeredCnt++;
      if (a === q.answer) correctCnt++;
      else wrongCnt++;
    }
    totalTime += (state.qTimes[q.id] || 0);
    if (state.starred[q.id]) starCnt++;
    if ((state.drawings[String(q.id)] || []).length > 0 || (q.passageId && (state.drawings[q.passageId] || []).length > 0)) {
      drawCnt++;
    }

  const accPct = answeredCnt ? Math.round((correctCnt / answeredCnt) * 100) + "%" : "--";

    <div class="stat-pill"><div class="val">${answeredCnt}<span style="font-size:13px;opacity:.75;"> / ${bankQs.length}</span></div><div class="lbl">累计已刷</div></div>

  for (const ch of chapters) {
    const qs = bankQs.filter(q => q.chapter === ch);
    let done = 0, ok = 0, chSec = 0, draws = 0;
    let hasPassage = false, hasImgs = false;
    for (const q of qs) {
      if (state.answers[q.id]) {
        done++;
        if (state.answers[q.id] === q.answer) ok++;
      }
      chSec += (state.qTimes[q.id] || 0);
      if ((state.drawings[String(q.id)] || []).length > 0) draws++;
      if (q.passage) hasPassage = true;
      if (q.stemImages && q.stemImages.length) hasImgs = true;
    }
    const pct = qs.length ? Math.round((done / qs.length) * 100) : 0;
    const acc = done ? Math.round((ok / done) * 100) : null;
    const accCls = acc === null ? "" : (acc >= 80 ? "good" : acc >= 60 ? "mid" : "low");
    const accTxt = acc === null ? "未开始" : `正确率 ${acc}%`;
    const histCnt = getChapterHistoryList(bank.id, ch).length;

      tagHtml = `<span class="q-type-tag" style="font-size:11px;padding:1px 6px;">含图</span>`;
    }
    const btnLabel = done === 0 ? (histCnt > 0 ? `开始第${histCnt + 1}刷` : "开始刷题") : (done < qs.length ? "继续刷题" : "复盘");
    const chLabel = getChapterLabel(bank, ch);

    const card = document.createElement("div");
    card.className = "chapter-card";
    card.innerHTML = `
      <div class="ch-top">
        <div class="ch-name"><span class="ch-num">${ch}</span>${escapeHtml(chLabel)}${tagHtml}${roundBadge}</div>
        <span class="ch-acc ${accCls}">${accTxt}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="ch-meta">
        <span>进度 ${done}/${qs.length} 题${draws ? ` · 涂改${draws}题` : ""}${histCnt ? ` · 历史${histCnt}轮` : ""}</span>
        <span>⏱ ${fmtTime(chSec)}</span>
      </div>
      <div class="ch-actions">
        <button class="btn btn-primary btn-sm" data-open-ch="${ch}">${btnLabel}</button>
        ${(done > 0 || histCnt > 0) ? `<button class="btn btn-sm" data-report-ch="${ch}">报告</button>` : ""}
        ${done > 0 ? `<button class="btn btn-sm btn-danger" data-redo-ch="${ch}" title="归档本次成绩并重做本套题">重做</button>` : ""}
      </div>
    `;
    grid.appendChild(card);
  }
}

// ================= CONTINUOUS FEED QUIZ ENGINE =================
function cleanupObservers() {
  if (visibleCardObserver) { visibleCardObserver.disconnect(); visibleCardObserver = null; }
  if (cardResizeObserver) { cardResizeObserver.disconnect(); cardResizeObserver = null; }
  canvasControllers.clear();
}

function startDeck(deck, key, title, jumpIdx = null) {
  if (!deck.length) {
    showToast("该题单目前为空");
    return;
  }
  currentDeck = deck;
  currentDeckKey = key;
  currentDeckTitle = title;
  deckSubmitted = Boolean(isChapterDeckKey(key) && state.chapterSubmitted[key]);

  if (jumpIdx !== null) {
    activeIdx = Math.max(0, Math.min(deck.length - 1, jumpIdx));
  } else {
    const firstUnans = deck.findIndex(q => !state.answers[q.id]);
    activeIdx = firstUnans >= 0 ? firstUnans : 0;
  }

  sessionElapsedSec = deck.reduce((acc, q) => acc + (state.qTimes[q.id] || 0), 0);
  isQuizView = true;
  document.body.classList.add("in-quiz");
  timerPaused = false;

  $("dashboardView").classList.add("hidden");
  $("quizView").classList.remove("hidden");
  $("btnBackHome").classList.remove("hidden");
  $("navDeckTitle").classList.remove("hidden");
  const activeBank = getActiveBank();
  $("navDeckTitle").textContent = title.replace(` · ${activeBank.name}`, "");
  $("quizTopCenter").classList.remove("hidden");
  $("btnToggleToolbarTop").classList.remove("hidden");
  $("btnSheetMobile").classList.remove("hidden");
  $("btnSubmitTop").classList.remove("hidden");

  syncModeTabs();
  applyToolbarVisibility();
  renderDrawToolbar();
  renderFullFeed();
  renderAnswerSheet();
  setActiveIdx(activeIdx, activeIdx > 0);
  startTimer();
  if (activeIdx === 0) window.scrollTo({ top: 0, behavior: "instant" });
}

function syncModeTabs() {
  document.querySelectorAll("#modeTabs .seg-tab, #mobileModeTabs .seg-tab").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.mode === state.mode);
  });
}

function isRevealed(q) {
  if (state.mode === "study") return true;
  if (state.mode === "exam") return deckSubmitted;
  return Boolean(state.answers[q.id]);
}

function renderPassageHtml(text) {
  return String(text || "").split("\n").filter(Boolean).map(p => {
    let safe = escapeHtml(p);
    safe = safe.replace(/_{4,}/g, `<span class="blank-slot">&nbsp;</span>`);
    return `<p>${safe}</p>`;
  }).join("");
}

function renderStemHtml(q) {
  const paras = (q.stem || "").split("\n").filter(Boolean);
  return paras.map(p => {
    const isOrd = /^[①-⑨]/.test(p);
    let safe = escapeHtml(p);
    safe = safe.replace(/_{4,}/g, `<span class="blank-slot">&nbsp;</span>`);
    const mQuote = (q.prompt || "").match(/画横线的[“"]([^”"]{1,4})[”"]/);
    if (mQuote && mQuote[1]) {
      const target = escapeHtml(mQuote[1]);
      safe = safe.replace(target, `<u style="text-decoration-color:var(--primary);text-underline-offset:4px;text-decoration-thickness:2px;font-weight:700;">${target}</u>`);
    }
    return `<p class="${isOrd ? "ord-item" : ""}">${safe}</p>`;
  }).join("");
}

function renderFullFeed() {
  cleanupObservers();
  const feed = $("questionFeed");
  feed.innerHTML = "";

  cardResizeObserver = new ResizeObserver(entries => {
    for (const entry of entries) {
      const key = entry.target.dataset.drawKey;
      if (key) {
        resizeSingleCanvas(key);
        redrawSingleCanvas(key);
      }
    }
  });

  visibleCardObserver = new IntersectionObserver(entries => {
    // Pick the intersecting card closest to the upper-middle of viewport
    let bestIdx = null;
    let bestDist = Infinity;
    const targetY = window.innerHeight * 0.34;
    for (const entry of entries) {
      if (entry.isIntersecting) {
        const rect = entry.boundingClientRect;
        const dist = Math.abs(rect.top - targetY);
        if (dist < bestDist) {
          bestDist = dist;
          bestIdx = Number(entry.target.dataset.qIdx);
        }
      }
    }
    if (bestIdx !== null && bestIdx !== activeIdx) {
      setActiveIdx(bestIdx, false);
    }
  }, { rootMargin: "-15% 0px -55% 0px", threshold: 0.01 });

  let lastPassageId = null;

  currentDeck.forEach((q, idx) => {
    // Render shared passage card ONCE before its group of sub-questions
    if (q.passage && q.passageId !== lastPassageId) {
      lastPassageId = q.passageId;
      const groupQs = currentDeck.filter(item => item.passageId === q.passageId);
      const firstNo = currentDeck.indexOf(groupQs[0]) + 1;
      const lastNo = currentDeck.indexOf(groupQs[groupQs.length - 1]) + 1;
      const pStage = document.createElement("div");
      pStage.className = "passage-stage";
      pStage.dataset.drawKey = q.passageId;
      const pKindLabel = q.bankId === "yanyu600" ? "📖 篇章阅读材料" : ((q.bankId === "panduan600" || q.bankId === "zhenti304") ? "🧩 综合推理材料（一拖五）" : "📄 共用材料");
      pStage.innerHTML = `
        <canvas class="draw-canvas-hl"></canvas>
        <canvas class="draw-canvas-pen"></canvas>
        <div class="passage-inner">
          <div class="passage-head">
            <div class="passage-title">${pKindLabel}（第 ${firstNo}–${lastNo} 题共用${q.source ? " · " + escapeHtml(q.source) : ""}）</div>
            <div style="display:flex;gap:6px;">
              <button class="btn btn-sm" data-clear-draw="${escapeHtml(q.passageId)}">🗑 清空材料涂改</button>
              <button class="btn btn-sm" data-toggle-passage="${escapeHtml(q.passageId)}">收起材料</button>
            </div>
          </div>
          <div class="passage-body" id="pbody-${escapeHtml(q.passageId)}">${renderPassageHtml(q.passage)}</div>
        </div>
      `;
      feed.appendChild(pStage);
      bindCanvasStage(pStage, q.passageId, null);
    }

    const wrap = document.createElement("div");
    wrap.className = "q-wrapper";
    wrap.id = `q-card-${idx}`;
    wrap.dataset.qIdx = idx;
    wrap.dataset.qId = q.id;
    wrap.innerHTML = buildQuestionCardHtml(q, idx);
    feed.appendChild(wrap);

    const stage = wrap.querySelector(".question-stage");
    bindCanvasStage(stage, String(q.id), q.id);
    stage.querySelectorAll("img").forEach(img => {
      img.addEventListener("load", () => {
        resizeSingleCanvas(String(q.id));
        redrawSingleCanvas(String(q.id));
      });
    });
    visibleCardObserver.observe(wrap);
  });

  // Initial canvas sizing & drawing for all cards
  requestAnimationFrame(() => {
    for (const key of canvasControllers.keys()) {
      resizeSingleCanvas(key);
      redrawSingleCanvas(key);
    }
  });
}

function buildQuestionCardHtml(q, idx) {
  const userAns = state.answers[q.id] || null;
  const revealed = isRevealed(q);
  const elimMap = state.eliminated[q.id] || {};
  const isStar = Boolean(state.starred[q.id]);
  const isMark = Boolean(state.marked[q.id]);
  const hasDraw = (state.drawings[String(q.id)] || []).length > 0;
  const noteVal = state.notes[q.id] || "";
  const showAnsPanel = revealed || Boolean(noteVal);
  const bank = BANK_REGISTRY.get(q.bankId) || getActiveBank();
  const chLabel = getChapterLabel(bank, q.chapter);

  const hasOptImgs = Boolean(q.optionImages && Object.keys(q.optionImages).length > 0);
  const hasAnyOptText = ["A", "B", "C", "D"].some(l => Boolean((q.options[l] || "").trim()));
  const isCompactGrid4 = !hasOptImgs && !hasAnyOptText;
  const optListCls = hasOptImgs ? "options-list opt-grid-2" : (isCompactGrid4 ? "options-list opt-grid-4" : "options-list");

  const optsHtml = ["A", "B", "C", "D"].map(letter => {
    let cls = "option-item";
    if (elimMap[letter] && !revealed) cls += " eliminated";
    if (revealed) {
      if (letter === q.answer) cls += " correct";
      else if (userAns === letter && letter !== q.answer) cls += " wrong";
    } else if (userAns === letter) {
      cls += " selected";
    }
    const optImgSrc = hasOptImgs ? q.optionImages[letter] : "";
    const optBody = optImgSrc
      ? `<img class="opt-fig-img" src="${escapeHtml(optImgSrc)}" alt="选项${letter}" loading="lazy" />`
      : `<span class="opt-text">${escapeHtml(q.options[letter] || "")}</span>`;
    return `
      <div class="${cls}" data-opt-q="${escapeHtml(q.id)}" data-opt-idx="${idx}" data-letter="${letter}">
        <span class="opt-letter">${letter}</span>
        ${optBody}
        <button class="opt-elim-btn" data-elim-q="${escapeHtml(q.id)}" data-elim-idx="${idx}" data-letter="${letter}" title="排除/恢复此选项（也可右键选项）">${elimMap[letter] ? "恢复" : "排除"}</button>
      </div>
    `;
  }).join("");

  const stemImgsHtml = (q.stemImages && q.stemImages.length)
    ? `<div class="q-fig-wrap">${q.stemImages.map((src, i) => `<img class="q-fig-img" src="${escapeHtml(src)}" alt="题目图示${i + 1}" loading="lazy" />`).join("")}</div>`
    : "";

  const userDisp = userAns
    ? `<span class="${revealed ? (userAns === q.answer ? "ans-user-ok" : "ans-user-bad") : ""}">${userAns}${revealed ? (userAns === q.answer ? " ✓ 正确" : " ✕ 错误") : "（已选）"}</span>`
    : `<span>未作答</span>`;

  return `
    <div class="question-stage" data-draw-key="${escapeHtml(q.id)}">
      <canvas class="draw-canvas-hl"></canvas>
      <canvas class="draw-canvas-pen"></canvas>
      <div class="question-card-inner">
        <div class="q-header">
          <div class="q-badges">
            <span class="q-num-badge">第 ${idx + 1} 题 / ${currentDeck.length}</span>
            <span class="q-type-tag">${escapeHtml(q.type || "综合题")}</span>
            <span class="q-source-tag">${escapeHtml(chLabel)}·第${q.num}题${q.source ? " · " + escapeHtml(q.source) : ""}</span>
          </div>
          <div class="q-meta-right">
            <span class="q-timer-tag" id="qtimer-${escapeHtml(q.id)}">⏱ ${fmtTime(state.qTimes[q.id] || 0)}</span>
            <button class="flag-btn ${hasDraw ? "" : "hidden"}" id="btn-clear-q-${escapeHtml(q.id)}" data-clear-draw="${escapeHtml(q.id)}" title="清空本题涂改">🗑 清涂改</button>
            <button class="flag-btn ${isMark ? "marked" : ""}" data-mark-q="${escapeHtml(q.id)}" data-idx="${idx}">${isMark ? "🚩 已存疑" : "🚩 存疑"}</button>
            <button class="flag-btn ${isStar ? "starred" : ""}" data-star-q="${escapeHtml(q.id)}" data-idx="${idx}">${isStar ? "★ 已收藏" : "☆ 收藏"}</button>
            <button class="flag-btn" data-note-toggle="${escapeHtml(q.id)}">📝 笔记</button>
          </div>
        </div>
        ${q.stem ? `<div class="q-stem">${renderStemHtml(q)}</div>` : ""}
        ${q.prompt ? `<div class="q-prompt">${escapeHtml(q.prompt)}</div>` : ""}
        ${stemImgsHtml}
        <div class="${optListCls}">${optsHtml}</div>
      </div>
    </div>
    <div class="answer-panel ${showAnsPanel ? "" : "hidden"}" id="ans-panel-${escapeHtml(q.id)}">
      <div class="answer-summary-row">
        <div class="ans-pills">
          <span>官方答案：<span class="ans-key">${revealed ? q.answer : "（交卷后显示）"}</span></span>
          <span>你的选择：${userDisp}</span>
          <span style="color:var(--text-3);font-size:13px;">耗时：<b id="anstime-${escapeHtml(q.id)}">${fmtTime(state.qTimes[q.id] || 0)}</b></span>
        </div>
        <div style="display:flex;gap:8px;">
          ${userAns ? `<button class="btn btn-sm" data-reset-q="${escapeHtml(q.id)}" data-idx="${idx}">↺ 重做本题</button>` : ""}
        </div>
      </div>
      ${revealed && q.analysis ? `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);font-size:13.5px;line-height:1.7;color:var(--text-2);"><b>解析：</b>${escapeHtml(q.analysis)}</div>` : ""}
      <div class="note-box-wrap ${noteVal ? "" : "hidden"}" id="notewrap-${escapeHtml(q.id)}">
        <textarea class="note-textarea" data-note-q="${escapeHtml(q.id)}" placeholder="记下解题思路、图形规律、逻辑公式或错因总结（自动保存）...">${escapeHtml(noteVal)}</textarea>
      </div>
    </div>
  `;
}

function refreshSingleQuestionCard(idx) {
  const q = currentDeck[idx];
  const wrap = $(`q-card-${idx}`);
  if (!q || !wrap) return;
  const oldNoteEl = $(`notewrap-${q.id}`);
  const noteOpen = Boolean(oldNoteEl && !oldNoteEl.classList.contains("hidden"));

  const oldStage = wrap.querySelector(".question-stage");
  if (oldStage) cardResizeObserver?.unobserve(oldStage);
  wrap.innerHTML = buildQuestionCardHtml(q, idx);
  if (noteOpen) {
    $(`ans-panel-${q.id}`)?.classList.remove("hidden");
    $(`notewrap-${q.id}`)?.classList.remove("hidden");
  }
  const newStage = wrap.querySelector(".question-stage");
  bindCanvasStage(newStage, String(q.id), q.id);
  newStage.querySelectorAll("img").forEach(img => {
    img.addEventListener("load", () => {
      resizeSingleCanvas(String(q.id));
      redrawSingleCanvas(String(q.id));
    });
  });
  requestAnimationFrame(() => {
    resizeSingleCanvas(String(q.id));
    redrawSingleCanvas(String(q.id));
  });
}

function setActiveIdx(idx, scrollIntoView = false) {
  if (idx < 0 || idx >= currentDeck.length) return;
  activeIdx = idx;
  const q = currentDeck[activeIdx];
  $("activeQNumDisp").textContent = activeIdx + 1;
  $("qTimerDisp").textContent = fmtTime(state.qTimes[q.id] || 0);

  document.querySelectorAll(".q-wrapper.active-card").forEach(el => el.classList.remove("active-card"));
  const wrap = $(`q-card-${activeIdx}`);
  if (wrap) {
    wrap.classList.add("active-card");
    if (scrollIntoView) {
      wrap.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }
  updateSheetActive();
}

function selectOptionForQuestion(qId, idx, letter) {
  const q = currentDeck[idx];
  if (!q || String(q.id) !== String(qId)) return;
  setActiveIdx(idx, false);
  if (state.mode === "study") {
    showToast("当前为背题模式，切回「刷题/模考模式」即可作答");
    return;
  }
  if (state.mode === "practice" && state.answers[q.id]) {
    return;
  }
  state.answers[q.id] = letter;
  saveState();
  refreshSingleQuestionCard(idx);
  renderAnswerSheet();
}

function toggleEliminate(qId, idx, letter) {
  const key = String(qId);
  if (!state.eliminated[key]) state.eliminated[key] = {};
  state.eliminated[key][letter] = !state.eliminated[key][letter];
  saveState();
  refreshSingleQuestionCard(idx);
}

// ================= PER-CARD FREEHAND ANNOTATION ENGINE =================
function bindCanvasStage(stageEl, drawKey, qId) {
  const hlCanvas = stageEl.querySelector(".draw-canvas-hl");
  const penCanvas = stageEl.querySelector(".draw-canvas-pen");
  const ctrl = {
    stageEl,
    hlCanvas,
    penCanvas,
    hlCtx: hlCanvas.getContext("2d"),
    penCtx: penCanvas.getContext("2d"),
    qId
  };
  canvasControllers.set(drawKey, ctrl);
  cardResizeObserver?.observe(stageEl);

  // Block browser right-click menu & Windows middle-click autoscroll while in drawing mode
  penCanvas.addEventListener("contextmenu", (e) => {
    if (activeTool !== "cursor") { e.preventDefault(); e.stopPropagation(); }
  });
  penCanvas.addEventListener("mousedown", (e) => {
    if (activeTool !== "cursor" && (e.button === 1 || e.button === 2)) {
      e.preventDefault();
    }
  });
  penCanvas.addEventListener("auxclick", (e) => {
    if (activeTool !== "cursor" && e.button === 1) { e.preventDefault(); }
  });

  penCanvas.addEventListener("pointerdown", (e) => {
    if (activeTool === "cursor") return;

    // Right-click (button 2) or Middle-click (button 1): pick option directly WITHOUT leaving drawing mode!
    if (e.button === 1 || e.button === 2) {
      e.preventDefault();
      e.stopPropagation();
      const stack = document.elementsFromPoint(e.clientX, e.clientY);
      const elimBtn = stack.find(el => el.matches && el.matches("[data-elim-q]"));
      if (elimBtn) {
        toggleEliminate(elimBtn.dataset.elimQ, Number(elimBtn.dataset.elimIdx), elimBtn.dataset.letter);
        return;
      }
      const optEl = stack.find(el => el.matches && el.matches("[data-opt-q]"));
      if (optEl) {
        selectOptionForQuestion(optEl.dataset.optQ, Number(optEl.dataset.optIdx), optEl.dataset.letter);
        return;
      }
      // Also allow right/middle click on star/mark/note/clear/collapse buttons underneath
      const actionBtn = stack.find(el => el.matches && el.matches("[data-star-q], [data-mark-q], [data-note-toggle], [data-toggle-passage]"));
      if (actionBtn) actionBtn.click();
      return;
    }

    // Only left click / stylus / touch starts drawing
    if (e.button !== 0) return;
    e.preventDefault();
    penCanvas.setPointerCapture(e.pointerId);
    activePointerDrawKey = drawKey;
    lastEditedDrawKey = drawKey;
    strokesHidden = false;
    penCanvas._tapMeta = { x: e.clientX, y: e.clientY, t: Date.now(), ptype: e.pointerType, moved: false };
    if (qId !== null) {
      const idx = currentDeck.findIndex(item => item.id === qId);
      if (idx >= 0) setActiveIdx(idx, false);
    }

    const [rx, ry, W, H] = getRelPoint(stageEl, e);
    if (activeTool === "eraser") {
      eraserDirty = false;
      eraseAtPoint(drawKey, rx, ry, W, H);
      return;
    }

    currentStroke = {
      tool: activeTool,
      color: activeTool === "highlighter" ? hlColor : penColor,
      width: activeTool === "highlighter" ? hlWidth : penWidth,
      pts: [[rx, ry]]
    };
    redoStacks.set(drawKey, []);
    redrawSingleCanvas(drawKey);
  });

  penCanvas.addEventListener("pointermove", (e) => {
    if (activePointerDrawKey !== drawKey || activeTool === "cursor") return;
    e.preventDefault();
    if (penCanvas._tapMeta && Math.hypot(e.clientX - penCanvas._tapMeta.x, e.clientY - penCanvas._tapMeta.y) > 8) {
      penCanvas._tapMeta.moved = true;
    }
    const [rx, ry, W, H] = getRelPoint(stageEl, e);

    if (activeTool === "eraser") {
      eraseAtPoint(drawKey, rx, ry, W, H);
      return;
    }
    if (!currentStroke) return;

    if (currentStroke.tool === "line") {
      const start = currentStroke.pts[0];
      let ex = rx, ey = ry;
      const dx = Math.abs((ex - start[0]) * W);
      const dy = Math.abs((ey - start[1]) * H);
      if (dx > 20 && dy / dx < 0.12) ey = start[1];
      currentStroke.pts = [start, [ex, ey]];
    } else {
      const prev = currentStroke.pts[currentStroke.pts.length - 1];
      const dist = Math.hypot((rx - prev[0]) * W, (ry - prev[1]) * H);
      if (dist >= 2.2) currentStroke.pts.push([rx, ry]);
    }
    redrawSingleCanvas(drawKey);
  });

  const finishStroke = (e) => {
    if (activePointerDrawKey !== drawKey) return;
    activePointerDrawKey = null;
    const meta = penCanvas._tapMeta;
    penCanvas._tapMeta = null;

    if (activeTool === "eraser") {
      if (eraserDirty) {
        saveState();
        updateClearBtnVisibility(drawKey);
        renderAnswerSheet();
      }
      return;
    }

    // Touch convenience: quick tap (<8px, <260ms) on A/B/C/D circle OR compact image-option button selects option without leaving Pen mode!
    if (meta && meta.ptype === "touch" && !meta.moved && (Date.now() - meta.t) < 260 && e) {
      const stack = document.elementsFromPoint(e.clientX, e.clientY);
      const badge = stack.find(el => el.matches && el.matches(".opt-letter, .opt-grid-4 .option-item"));
      const optEl = badge && badge.closest("[data-opt-q]");
      if (optEl) {
        currentStroke = null;
        redrawSingleCanvas(drawKey);
        selectOptionForQuestion(optEl.dataset.optQ, Number(optEl.dataset.optIdx), optEl.dataset.letter);
        return;
      }
    }

    if (currentStroke) {
      if (!state.drawings[drawKey]) state.drawings[drawKey] = [];
      state.drawings[drawKey].push(currentStroke);
      currentStroke = null;
      saveState();
      redrawSingleCanvas(drawKey);
      updateClearBtnVisibility(drawKey);
      renderAnswerSheet();
    }
  };
  penCanvas.addEventListener("pointerup", finishStroke);
  penCanvas.addEventListener("pointercancel", finishStroke);
}

function updateClearBtnVisibility(drawKey) {
  const btn = $(`btn-clear-q-${drawKey}`);
  if (btn) {
    btn.classList.toggle("hidden", (state.drawings[drawKey] || []).length === 0);
  }
}

function resizeSingleCanvas(drawKey) {
  const ctrl = canvasControllers.get(drawKey);
  if (!ctrl) return;
  const rect = ctrl.stageEl.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const tw = Math.round(rect.width * dpr);
  const th = Math.round(rect.height * dpr);
  [ctrl.hlCanvas, ctrl.penCanvas].forEach(c => {
    if (c.width !== tw || c.height !== th) {
      c.width = tw;
      c.height = th;
    }
  });
}

function drawSingleStroke(ctx, st, W, H, dpr) {
  if (!st.pts || st.pts.length === 0) return;
  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = st.color;
  ctx.lineWidth = st.width;
  ctx.lineCap = st.tool === "highlighter" ? "butt" : "round";
  ctx.lineJoin = "round";
  ctx.globalAlpha = st.tool === "highlighter" ? 0.42 : 0.94;

  const pts = st.pts;
  ctx.beginPath();
  if (pts.length === 1) {
    const x = pts[0][0] * W, y = pts[0][1] * H;
    ctx.arc(x, y, st.width / 2, 0, Math.PI * 2);
    ctx.fillStyle = st.color;
    ctx.fill();
  } else if (st.tool === "line") {
    ctx.moveTo(pts[0][0] * W, pts[0][1] * H);
    ctx.lineTo(pts[pts.length - 1][0] * W, pts[pts.length - 1][1] * H);
    ctx.stroke();
  } else {
    ctx.moveTo(pts[0][0] * W, pts[0][1] * H);
    for (let i = 1; i < pts.length - 1; i++) {
      const cx = pts[i][0] * W, cy = pts[i][1] * H;
      const nx = (pts[i][0] + pts[i + 1][0]) * 0.5 * W;
      const ny = (pts[i][1] + pts[i + 1][1]) * 0.5 * H;
      ctx.quadraticCurveTo(cx, cy, nx, ny);
    }
    const last = pts[pts.length - 1];
    ctx.lineTo(last[0] * W, last[1] * H);
    ctx.stroke();
  }
  ctx.restore();
}

function redrawSingleCanvas(drawKey) {
  const ctrl = canvasControllers.get(drawKey);
  if (!ctrl) return;
  const rect = ctrl.stageEl.getBoundingClientRect();
  const W = rect.width, H = rect.height;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  ctrl.hlCtx.clearRect(0, 0, ctrl.hlCanvas.width, ctrl.hlCanvas.height);
  ctrl.penCtx.clearRect(0, 0, ctrl.penCanvas.width, ctrl.penCanvas.height);
  if (strokesHidden || !W || !H) return;

  const strokes = state.drawings[drawKey] || [];
  for (const st of strokes) {
    drawSingleStroke(st.tool === "highlighter" ? ctrl.hlCtx : ctrl.penCtx, st, W, H, dpr);
  }
  if (activePointerDrawKey === drawKey && currentStroke) {
    drawSingleStroke(currentStroke.tool === "highlighter" ? ctrl.hlCtx : ctrl.penCtx, currentStroke, W, H, dpr);
  }
}

function redrawAllCanvases() {
  for (const key of canvasControllers.keys()) {
    resizeSingleCanvas(key);
    redrawSingleCanvas(key);
  }
}

function getRelPoint(stageEl, e) {
  const rect = stageEl.getBoundingClientRect();
  const x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
  const y = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
  return [+(x / rect.width).toFixed(4), +(y / rect.height).toFixed(4), rect.width, rect.height];
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  if (len2 === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function eraseAtPoint(drawKey, rx, ry, W, H) {
  const strokes = state.drawings[drawKey] || [];
  const px = rx * W, py = ry * H;
  let removed = false;
  for (let i = strokes.length - 1; i >= 0; i--) {
    const st = strokes[i];
    const thresh = Math.max(14, st.width * 0.75);
    const pts = st.pts;
    let hit = false;
    if (pts.length === 1) {
      if (Math.hypot(px - pts[0][0] * W, py - pts[0][1] * H) <= thresh) hit = true;
    } else if (st.tool === "line") {
      const a = pts[0], b = pts[pts.length - 1];
      if (distToSegment(px, py, a[0] * W, a[1] * H, b[0] * W, b[1] * H) <= thresh) hit = true;
    } else {
      for (let j = 0; j < pts.length - 1; j++) {
        if (distToSegment(px, py, pts[j][0] * W, pts[j][1] * H, pts[j + 1][0] * W, pts[j + 1][1] * H) <= thresh) {
          hit = true; break;
        }
      }
    }
    if (hit) {
      const [del] = strokes.splice(i, 1);
      if (!redoStacks.has(drawKey)) redoStacks.set(drawKey, []);
      redoStacks.get(drawKey).push(del);
      removed = true;
    }
  }
  if (removed) {
    eraserDirty = true;
    redrawSingleCanvas(drawKey);
  }
}

function buildSvgCursor(svgBody, hx, hy, size = 28) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${svgBody}</svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}") ${hx} ${hy}, crosshair`;
}

function updateDrawCursor() {
  const root = document.documentElement;
  if (activeTool === "pen") {
    const r = Math.max(4, Math.min(8, penWidth + 2));
    const c = penColor;
    // High-contrast colored dot with thick black outer halo + crisp white ring + precision cross ticks
    const svg = `
      <line x1="14" y1="1" x2="14" y2="7" stroke="#000" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="14" y1="21" x2="14" y2="27" stroke="#000" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="1" y1="14" x2="7" y2="14" stroke="#000" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="21" y1="14" x2="27" y2="14" stroke="#000" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="14" cy="14" r="${r + 2.2}" fill="#000"/>
      <circle cx="14" cy="14" r="${r + 1}" fill="#FFF"/>
      <circle cx="14" cy="14" r="${r}" fill="${c}"/>
    `;
    root.style.setProperty("--draw-cursor", buildSvgCursor(svg, 14, 14, 28));
  } else if (activeTool === "highlighter") {
    const c = hlColor;
    // Bold high-contrast highlighter chisel marker with dark outline
    const svg = `
      <rect x="6" y="3" width="16" height="22" rx="4" fill="${c}" fill-opacity="0.82" stroke="#111" stroke-width="2.2"/>
      <line x1="9" y1="14" x2="19" y2="14" stroke="#111" stroke-width="2" stroke-linecap="round"/>
      <circle cx="14" cy="14" r="2.2" fill="#111"/>
    `;
    root.style.setProperty("--draw-cursor", buildSvgCursor(svg, 14, 14, 28));
  } else if (activeTool === "line") {
    const c = penColor;
    // Bold black-outlined colored crosshair (impossible to miss on white or dark!)
    const svg = `
      <line x1="14" y1="2" x2="14" y2="26" stroke="#000" stroke-width="4" stroke-linecap="round"/>
      <line x1="2" y1="14" x2="26" y2="14" stroke="#000" stroke-width="4" stroke-linecap="round"/>
      <line x1="14" y1="3" x2="14" y2="25" stroke="${c}" stroke-width="2" stroke-linecap="round"/>
      <line x1="3" y1="14" x2="25" y2="14" stroke="${c}" stroke-width="2" stroke-linecap="round"/>
      <circle cx="14" cy="14" r="2.5" fill="#FFF" stroke="#000" stroke-width="1.2"/>
    `;
    root.style.setProperty("--draw-cursor", buildSvgCursor(svg, 14, 14, 28));
  } else if (activeTool === "eraser") {
    const svg = `
      <circle cx="14" cy="14" r="10" fill="#FFF" fill-opacity="0.88" stroke="#111" stroke-width="2.2"/>
      <line x1="10" y1="10" x2="18" y2="18" stroke="#E53935" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="18" y1="10" x2="10" y2="18" stroke="#E53935" stroke-width="2.2" stroke-linecap="round"/>
    `;
    root.style.setProperty("--draw-cursor", buildSvgCursor(svg, 14, 14, 28));
  } else {
    root.style.removeProperty("--draw-cursor");
  }
}

// ================= ANSWER SHEET =================
function renderAnswerSheet() {
  const grid = $("sheetGrid");
  grid.innerHTML = "";
  let done = 0;
  currentDeck.forEach((q, idx) => {
    const a = state.answers[q.id];
    if (a) done++;
    const btn = document.createElement("button");
    btn.className = "sheet-cell";
    btn.dataset.idx = idx;
    if (idx === activeIdx) btn.classList.add("current");
    const rev = isRevealed(q);
    if (a) {
      if (rev) btn.classList.add(a === q.answer ? "correct" : "wrong");
      else btn.classList.add("answered");
    }
    btn.textContent = idx + 1;
    if (state.marked[q.id]) {
      const d = document.createElement("span");
      d.className = "dot-flag";
      btn.appendChild(d);
    }
    if ((state.drawings[String(q.id)] || []).length > 0) {
      const d = document.createElement("span");
      d.className = "dot-draw";
      btn.appendChild(d);
    }
    btn.addEventListener("click", () => {
      setActiveIdx(idx, true);
      closeMobileSheet();
    });
    grid.appendChild(btn);
  });
  $("sheetProg").textContent = `${done}/${currentDeck.length}`;
  $("feedFooterSub").textContent = `当前已完成 ${done} / ${currentDeck.length} 题 · 点击下方交卷查看完整正确率、题型拆解与耗时报告`;
}

function updateSheetActive() {
  document.querySelectorAll("#sheetGrid .sheet-cell").forEach(el => {
    el.classList.toggle("current", Number(el.dataset.idx) === activeIdx);
  });
}

// ================= TIMER =================
function startTimer() {
  stopTimer();
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    if (!isQuizView || timerPaused) return;
    const q = currentDeck[activeIdx];
    if (!q) return;
    sessionElapsedSec++;
    state.qTimes[q.id] = (state.qTimes[q.id] || 0) + 1;
    updateTimerDisplay();
    if (sessionElapsedSec % 5 === 0) saveState();
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function updateTimerDisplay() {
  const q = currentDeck[activeIdx];
  const qSec = q ? (state.qTimes[q.id] || 0) : 0;
  $("activeQNumDisp").textContent = activeIdx + 1;
  $("qTimerDisp").textContent = fmtTime(qSec);
  if (q) {
    const badge = $(`qtimer-${q.id}`);
    if (badge) badge.textContent = `⏱ ${fmtTime(qSec)}`;
    const at = $(`anstime-${q.id}`);
    if (at) at.textContent = fmtTime(qSec);
  }

  const box = $("timerBox");
  box.classList.toggle("paused", timerPaused);
  box.classList.remove("warn", "danger");

  if (state.timerMode === "down") {
    const rem = state.countdownTargetSec - sessionElapsedSec;
    if (rem <= 0) {
      $("totalTimerDisp").textContent = "00:00";
      box.classList.add("danger");
      if (rem === 0) showToast("⏰ 设定倒计时已到！");
    } else {
      $("totalTimerDisp").textContent = fmtTime(rem);
      if (rem <= 60) box.classList.add("danger");
      else if (rem <= 300) box.classList.add("warn");
    }
  } else {
    $("totalTimerDisp").textContent = fmtTime(sessionElapsedSec);
  }
  $("btnTimerToggle").textContent = timerPaused ? "▶" : "⏸";
}

function togglePause(forcePause = null) {
  timerPaused = forcePause !== null ? forcePause : !timerPaused;
  $("pauseOverlay").classList.toggle("show", timerPaused);
  updateTimerDisplay();
}
