"D":"盲目扩张   方向"},"answer":"A","page":107},{"id":334,"chapter":9,"num":14,"source":"2024 浙江事业","type":"逻辑填空","stem":"网络探店为消费者提供了新奇的消费体验，在促消费方面有积极作用，消费者可以________，避免“踩雷”。但是，探店行业内也充斥着水平不高的“创作者”，他们分享着________的构图、摆拍、滤镜，以及相差无几的文案、体验感受，既扰乱了市场秩序，也欺骗了消费者。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"追本溯源   大同小异","B":"按图索骥   千篇一律","C":"顺藤摸瓜   如法炮制","D":"亦步亦趋   如出一辙"},"answer":"B","page":107},{"id":335,"chapter":9,"num":15,"source":"2024辽宁事业","type":"逻辑填空","stem":"各地要因地制宜，发挥自身__________优势，打造地标产业，或者优势特色产业，在区域内通过资源要素、科技、人才、企业的________，把相关产业打造成周边、全国乃至世界上最有竞争力的产业，形成优质的产业生态。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"独特   凝练","B":"绝对   会合","C":"相对   累积","D":"比较   汇聚"},"answer":"D","page":107},{"id":336,"chapter":9,"num":16,"source":"2019 河南选调","type":"逻辑填空","stem":"音乐教育疏导，是指在通过音乐对大学生进行心理健康教育的过程中，既强调________、发扬民主，又注重________、科学引导。加强音乐教育疏导是大学生思想、心理以及行为活动规律的客观要求。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"百家争鸣   循循善诱","B":"广开言路   以理服人","C":"畅所欲言   诲人不倦","D":"求同存异   集思广益"},"answer":"B","page":107},{"id":337,"chapter":9,"num":17,"source":"2018 四川三支","type":"逻辑填空","stem":"在当代漆画创作中，仅仅拥有对材料实验的冒险精神是不够的，对待漆艺传统的沉潜钻研________。对创作者而言，传统漆艺的美学精神和社会价值是否已经________，漆艺家能否掌握漆的自身语言去创作具有生命力的独特艺术作品，这些都给漆艺家提出了新挑战。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"不可偏废   了然于胸","B":"迫在眉睫   与时俱进","C":"不可或缺   内化于心","D":"势在必行   融为一体"},"answer":"C","page":108},{"id":338,"chapter":9,"num":18,"source":"2021江苏","type":"逻辑填空","stem":"城市是人类进入文明时代的关键标志，是文明成果的________之地，城市不仅仅是非农人口与产业的空间集聚，也________了适应时代变化的经济社会文化生活，从古至今都是经济文化的“高地”。","prompt":"依次填入画横线处最恰当的一项是：","options":{"A":"汇聚   培育","B":"积淀   滋养","C":"荟萃   孕育","D":"展示   滋生"},"answer":"C","page":108},{"id":339,"chapter":9,"num":19,"source":"2026山东事业","type":"逻辑填空","stem":"如今逛文创商店，已成为年轻人心中博物馆之旅的重要目的。当厚重的历史变得________，当小众爱好逐渐成为大众潮流，人们对传统文化的追寻和热爱，也让一个新职业________-一—文创产品策划运营师。这个新潮的职业让古老文化变得“________”。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"有形   生机盎然   活灵活现","B":"具体   活色生香   信手拈来","C":"轻盈   应运而生   触手可及","D":"直观   难以捉摸   焕然一新"},"answer":"C","page":108},{"id":340,"chapter":9,"num":20,"source":"2025 湖南三支","type":"逻辑填空","stem":"一些新兴美术馆坐拥看得见风景的位置，邀请大牌建筑师设计。一开馆便成为城中焦点，媒体争相报道、公众蜂拥而至，形成了巨大的客流。然而，当建筑成为持续的话题，难免________，美术馆的空间为的是呈现艺术作品。美术馆的主角是藏品、展览、公教。如果只是停留在找一位知名建筑师造一栋标志性的房子，则成为了旅游景点。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"徒有其表","B":"弄巧成拙","C":"本末倒置","D":"名不符实"},"answer":"C","page":108},{"id":341,"chapter":9,"num":21,"source":"2022 事业联考","type":"中心理解","stem":"纵观历史，各个政治清明的朝代无不将立法视为治国之要务、理政之圭泉；放眼世界，但凡社会治理相对较好的国家和地区，都拥有比较完备的法律体系和很强的依法执政意识。立法的目的是维护社会秩序和伸张社会正义，最终达到人民幸福、国家强盛和民族复兴。但如果法只存留于字面，没有真正落地，显然就很难起到这种作用。所以在治理国家时，制定法律规则固然重要，但更重要的，是要看有多少真正得到了贯彻。","prompt":"这段文字意在说明：","options":{"A":"法与时转则治，治与世宜则有功","B":"奉法者强则国强，奉法者弱则国弱","C":"盖天下之事，不难于立法，而难于法之必行","D":"立善法于天下，则天下治；立善法于一国，则一国治"},"answer":"C","page":108},{"id":342,"chapter":9,"num":22,"source":"2022广东","type":"中心理解","stem":"对互联网金融加强监管，不是为了制约互联网企业，而是鼓励和保护真正有价值的金融创新，促进互联网金融规范有序健康发展。广大互联网企业只有正确认识行业监管与自身发展的关系，将监管要求内化到企业经营管理中，才能更好地走上规范健康发展的轨道。","prompt":"上述文段主要讲了：","options":{"A":"推进互联网金融监管创新的价值","B":"当前互联网企业面临的机遇和挑战","C":"制约互联网企业健康发展的客观因素","D":"互联网金融监管对企业发展的重要性"},"answer":"D","page":109},{"id":343,"chapter":9,"num":23,"source":"2021四川事业","type":"中心理解","stem":"从中国 5G 发展的历程来看，无论是前期的标准制定，还是试验网建设阶段，中国都积极参与全球产业界合作。2013年，中国成立了5G推进组，爱立信、诺基亚、高通、英特尔、罗德与施瓦茨等国外企业都是推进组成员单位。基于推进组的平台，国内外企业积极开展合作，共同推进我国 5G技术研究、技术规范制定、技术和产品验证，并取得了丰硕成果。例如中国移动与爱立信合作完成了首个5G预商用核心网、中国移动与英特尔和爱立信合作完成了首个符合 3GPP SA 标准的异厂商 5G 新空口互通。中国联通还与西班牙、德国、日本、法国、英国、美国等国家的8家电信运营商建立了 5G 国际合作联盟，共同推进5G 发展。","prompt":"这段文字主旨是:","options":{"A":"中国 5G为世界数字经济发展作出了积极的贡献","B":"中国 5G是全球企业合作发展的产物","C":"发展5G需要世界各国的共同努力","D":"中国发展5G是国内经济社会发展的客观要求"},"answer":"B","page":109},{"id":344,"chapter":9,"num":24,"source":"2022安徽三支","type":"中心理解","stem":"根据世界银行的数据，当今世界仍有 2.62亿儿童和青年未能入学。6.17亿儿童与少年无法阅读和解决基本数学问题。撒哈拉以南非洲地区只有不足 40%的女孩完成了初中学业，1/3 的儿童未完成小学学业，近半数的青少年未完成中学教育。在低收入和中等收入国家，由于在中小学未能获得应有的知识和技能，青少年面临成年后丧失发展机会和低工资的命运。","prompt":"这段文字意在说明：","options":{"A":"教育对个体发展的影响巨大","B":"青少年失学的原因多种多样","C":"当今全球教育现状不容乐观","D":"经济状况决定教育发展水平"},"answer":"C","page":110},{"id":345,"chapter":9,"num":25,"source":"2023重庆选调","type":"细节判断","stem":"“河”在很长一段时间内都专指黄河，就如同泾、渭、洛，淮一样，是不同河流的一个名称。“黄河”一词，最早出现在东汉班固所著的《汉书·地理志》当中，因常年呈现明显的黄色而得名。黄河水患严重，而黄河的每一次改道，都会侵夺其他河道，对于被其侵夺河流的称呼便会出现问题。汉武帝元光三年（公元前132年），黄河夺泗水河道，经泗水入淮水，经淮水入海。原来的泗水、淮水现在变成了河水，因而形成“泗河”“淮河”的说法，即“泗（淮）水河道上的河水”。黄河的频繁改道，使得这一地区的河流渐渐又从“某水”变成“某河”，河的称呼也在北方地区开始扩散。","prompt":"根据这段文字，可以推出：","options":{"A":"泗河、淮河曾是黄河的支流","B":"黄河曾是中国最古老的河流","C":"被黄河夺道的河流才称为河","D":"“河水”是黄河以前的名称"},"answer":"D","page":110},{"id":346,"chapter":9,"num":26,"source":"2023深圳","type":"细节判断","stem":"“梅瓶”一词，最早见于宋代，多是当时文人对瓶中插梅审美意象的吟咏，与今人习称的“梅瓶”无关。宿白先生指出，今人所称的宋代“梅瓶”，宋人称“经瓶”，并称这种长腹瓶为“经瓶”的原因，重在用“经”道出其深细长腹的特点。故宋人又称其为“长瓶”。明人并无“梅瓶”称谓，所谓明代“梅瓶”，实为明人流行的盛酒之具，明人多以酒樽、酒瓶名之。今人“梅瓶”之称谓，多援引清末许之衡《饮流斋说瓷》中“梅瓶···口径之小仅与梅之瘦骨相称，故名曰梅瓶也”的说法。不过，“梅瓶”插花在晚明已成风尚，而且，从文献来看，今人“梅瓶”之概念，至迟在清康熙年间已形成。","prompt":"对这段文字理解正确的是：","options":{"A":"今人所称的“梅瓶”最早为宋代文人吟咏插梅之物","B":"宋人称“经瓶”为“长瓶”是据其深细长腹的特点","C":"明代多用于盛酒的‘梅瓶”到清代始为插花的器皿","D":"清康熙以前“梅瓶”的外形和功用一直处于发展中"},"answer":"B","page":110},{"id":347,"chapter":9,"num":27,"source":"2024 四川事业","type":"细节判断","stem":"人们一般都喜欢追逐日出或日落景观，但绝大部分人可能没意识到，其实在与太阳相反一侧的天空，也隐藏着鲜为人知的景观，比如说人们能看到的两种大尺度影子景观—“山影”和“地影”。日出或日落前后，在太阳照射下，高大山峰投射出巨大阴影。此时站在该山峰的观测者观察这个阴影，阴影看起来像金字塔，这就是山影，除了登山家或摄影师，几乎很少有人注意到山影和地影，并将它们作为一种景观来欣赏。","prompt":"对这段文字理解正确的是：","options":{"A":"大多数人不喜欢欣赏“山影”   “地影”景观","B":"人们不把“山影”   “地影”作为景观来欣赏","C":"“山影”和“地影”是鲜为人知的山上景观","D":"只有极少数人能发现和欣赏“山影”和“地影”"},"answer":"D","page":111},{"id":348,"chapter":9,"num":28,"source":"2022事业联考","type":"标题填入","stem":"长江被誉为黄金水道，但滞留船舶压载水加大了海洋外来生物入侵的风险，作为我国入侵物中危害最大的两种水生植物，凤眼莲喜旱莲子草在长江流域大爆发，形成内陆水体荒漠化，对长江流域水生物多样性安全和生态系统健康造成灾难性影响。船舶噪音、船舶灯光、船舶排污、船舶冲撞和螺旋桨绞杀也是造成长江水生生物多样性丧失的重要因素。据长江海事局统计：从1988 年至 2009 年，长江通航水道发生重大船舶污染事故 23件，船舶污染成为长江通航水道水生物多样性损害的主要诱因之一。","prompt":"最适合做这段文字标题的是：","options":{"A":"水生植物与内陆水体荒漠化","B":"长江流域的海洋外来生物入侵","C":"长江船舶对水生生物多样性的影响","D":"黄金水道面临船舶污染的严重威胁"},"answer":"C","page":111},{"id":349,"chapter":9,"num":29,"source":"2024江苏事业","type":"标题填入","stem":"近年来，影视作品与城市之间的联系越发紧密。电视剧《繁花》播出后，上海黄河路成为剧迷们追捧的热门景点。最近热播的电视剧《我的阿勒泰》又将新疆北部城市阿勒泰展现于公众视野。越来越多的城市意识到影视作品对城市形象和文化推广的重要性，纷纷加大对影视创作的支持力度。","prompt":"最符合本段文意的标题是：","options":{"A":"“双向奔赴”看影视作品与城市双向赋能","B":"“一部剧带火一座城”打造心中诗与远方","C":"“天然摄影栅”透过镜头让更多人爱上文旅","D":"“故事为王”建设城市一流影视制作基地"},"answer":"A","page":111},{"id":350,"chapter":9,"num":30,"source":"2018福建选调","type":"中心理解","stem":"经典作品中的美食，是一道耐人寻味的存在。比如在《白鹿原》中，为什么新娘会做一手好面条，是给娘家“长脸”必需的本领？又比如《京华烟云》中，经历了那么多社会动荡和家庭变故的姚木兰，为什么还会有心思慢条斯理地花费一下午的时间，料理一道焖鸡榨菜蒸笋？对于中国人来说，吃饭不仅是为了果腹，也是一种生活方式，体现着生活智慧和生命尊严。而《中国味道》试图寻找一个崭新的充满烟火气息的温暖角度，感受经典作品字里行间透露出的优雅和从容，领略千百年的寻常日子里，一茶一饭的生动气韵，在日用饮食之间带给人们强有力的文化归属感。","prompt":"这段文字表达的主要意思是：","options":{"A":"《中国味道》从新的角度感受经典作品中的饮食文化","B":"《中国味道》中折射出寻常日子的饮食文化归属感","C":"经典作品中耐人寻味的美食","D":"经典作品中体现的生活智慧"},"answer":"A","page":112},{"id":351,"chapter":9,"num":31,"source":"2023浙江事业","type":"中心理解","stem":"自古文以载道，而今“影亦载道”，当代历史记忆存续于影像这种“视觉共同体”中，某些影像也成为历史证据的表象，是当代社会书写历史的重要来源。但近年来部分作品对历史的追思怀旧出现了影像重构，产生了“滤镜认知”，银幕上“伪史”的诱导容易影响受众的历史认知，颠覆“隔代”特别是新生代的历史记忆。这种“影像伪史”的指向性谬误影响甚远，需要引起警惕并加以批驳。典型代表就是日本右翼通过电影美化侵略战争，部分欧美拍摄的二战题材电影削弱乃至抹杀东方战场对反法西斯战争的贡献等。","prompt":"对这段文字中的“滤镜认知”理解最准确的是：","options":{"A":"选择性的影像重构，让“影像伪史”大行其道","B":"“软性意识形态”植入，误导入们的历史认知","C":"影像记录的历史证据，因滤镜存在而不被采信","D":"违背历史事实的艺术虚构，导致历史记录失真"},"answer":"B","page":112},{"id":352,"chapter":9,"num":32,"source":"2021江苏","type":"中心理解","stem":"严格规范公正文明执法，提高司法公信力，是维护民法典权威的有效手段。在贯彻落实民法典的过程中，政府部门尤其要注重把民法典作为行政决策、行政管理、行政监督的重要标尺，不得违背法律法规随意作出减损公民、法人和其他组织合法权益或增加其义务的决定。要规范行政许可、行政处罚、行政强制、行政征收、行政收费、行政检查、行政裁决等活动，提高依法行政能力和水平，依法严肃处理侵犯群众合法权益的行为和人员。","prompt":"这段文字着重强调：","options":{"A":"实施民法典能够切实保障广大群众的合法权益","B":"实施民法典可以规范执法行为提高司法公信力","C":"实施民法典将为政府部门各类执法行为制定实施细则","D":"实施民法典将为政府部门依法行政提供相关法律依据"},"answer":"D","page":113},{"id":353,"chapter":9,"num":33,"source":"2026国考","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①在这种条件下点火并稳定燃烧，好比在 12 级狂风中点燃一根火柴\n②在高超声速飞行器穿越云霄的征途中，动力推进技术就是打开高速大门的金钥匙\n③当燃烧室内气流流速超过声速时，会形成复杂的激波系，激波前后气流状态会产生突变\n④目前，超燃冲压发动机是这一领域的明星，它可以在大气中有效获取氧气，并且在高超声速条件下稳定燃烧\n⑤想象一下，让一个重达数吨的飞行器在空气稀薄的高空中以数倍声速疾驰，需要多么强大的发动机提供足够的推力\n⑥此时，常规的发动机技术完全不能适用，只有超燃冲压发动机才能在极短时间内将大量燃料转化为推力，并让飞行器加速稳定在高超声速","prompt":"","options":{"A":"②⑥③①④⑤","B":"②⑤④③①⑥","C":"⑤④①⑥③②","D":"⑤③②④⑥①"},"answer":"B","page":113},{"id":354,"chapter":9,"num":34,"source":"2024山西纪委","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①这一有利因素使得临近空间有着无法比拟的军事战略价值，也一直吸引着各国科研机构的目光\n②其下是传统航空器的主要活动空间，而它的上面就是我们平常说的“太空”，是航天器的运行空间\n③临近空间安全且广阔的工作环境是其他空域难以比拟的\n④临近空间是对海拔 20千米到100 千米空间范围的一个通用性称谓\n⑤直到今天，这仍是一片尚未被科学家完全认知的空间，也一直被视为是传统航空器的“禁区”\n⑥临近空间雷暴闪电较少，也没有云、雨和大气湍流现象，在这里运行的飞行器自由且安全","prompt":"","options":{"A":"③④⑤②①⑥","B":"④②⑤③⑥①","C":"③⑤①④⑥②","D":"④③②①⑥⑤"},"answer":"B","page":114},{"id":355,"chapter":9,"num":35,"source":"2023山东","type":"语句填空","stem":"众所周知，南朝是一个皇权重新集中、士庶升降变化剧烈的时代。皇帝为了削弱和限制高门士族，必定要扶持次等士族和寒门。后两者为了政治进身也必然依附皇权。在南朝，文学才能是衡量世族的一条重要标准，出身寒门庶族的帝王为全方位强化权威形象而努力身文人行列，同时拔擢与其门第身份相近的次等士族和寒门文士。正是在这样的背景下，________。彭城刘氏、兰陵萧氏、彭城到氏、吴兴沈氏、吴兴陈氏等家族，他们在通过武力夺取政权或靠积累军功获取了足够的政治资源后，都表现出生活方式“士大夫化”的倾向。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"皇权重振加速了次等士族的迅速兴起","B":"寒门庶族大都参与到激烈的权力争斗","C":"提升文化修养成了所有寒门庶族的共同追求","D":"庶族不满足于对门阀大族手中政治权力的分享"},"answer":"C","page":114},{"id":356,"chapter":9,"num":36,"source":"2025 河南事业","type":"中心理解","stem":"不可否认，无论是专家学者，还是人工智能机器人写的诗、画的画、作的曲是艺术品。因为艺术被认为是创作者对客观世界的认识，是其主观情感的呈现，艺术活动更多是一种创造的过程，艺术最大的特征就是情感化。而人工智能是理性的，它的整套艺术生产逻辑基于数据，即便人工智能的文艺创作开始加入情感激发和随机化模块，但创作的内容由分解、组合而成，这种重组方式不能称为情感化的艺术创作。国外也有学者认为，人工智能目前没有可能创造与人类智力相当的作品，因为极具个人色彩的创造性活动是无法复制的。","prompt":"这段文字意在强调：","options":{"A":"艺术活动是充满感性色彩的创造过程","B":"情感化是人类艺术创造的最主要特征","C":"人工智能的文艺创作离人类的水平仍有差距","D":"人工智能的文艺创作可加入情感激发和随机化模块"},"answer":"C","page":114},{"id":357,"chapter":9,"num":37,"source":"2020联考","type":"中心理解","stem":"如果说，人类已知的“明知识”（即可以用文字、公式、程序、语言表达出来的知识）是冰山的一小角，那么“暗知识”（人类不可感受又不可表达的新知识，即今天正被新机器“发现”的新一类知识）就是冰山下面最大的那块。暗知识会是未来统治和占领整个知识空间最大量的一种知识。我们要做好心理准备。人类知识的权威现在刚刚开始被动摇。未来，机器能掌握和发现的知识会越来越多。慢慢地，我们可能成为小岛一般的存在，被暗知识这个海洋淹没。","prompt":"这段文字意在说明：","options":{"A":"人类将会被暗知识孤立起来","B":"暗知识将主宰未来知识领域","C":"人类的知识权威正逐渐丧失","D":"人工智能是暗知识的创造者"},"answer":"B","page":115},{"id":358,"chapter":9,"num":38,"source":"2022事业联考","type":"语句填空","stem":"浪漫的古人，常借助一些动植物来表达爱情，常见的有鸳鸯、凤凰、大雁、红豆、梧桐等。为什么梧桐会成为爱情的象征呢？可能原因有二，一是梧桐雌雄异株，其中“梧”为雄株，“桐”为雌株，因此古人看见梧桐树，便联想到比翼双飞的爱情。另外一个原因，梧桐树高大茂密，常引来一些鸟儿共筑爱巢，________0","prompt":"填入横线部分最恰当的一项是:","options":{"A":"由此可见，古人很早就有了对爱情的浪漫追求","B":"由此可见，爱情是人类永恒的主题","C":"这就是梧桐成为爱情象征的主要原因","D":"这就是常说的“栽下梧桐树，引来金凤凰”"},"answer":"D","page":115},{"id":359,"chapter":9,"num":39,"source":"2025 深圳","type":"接语选择","stem":"近几年，海洋碳汇已成为海洋领域研究的新热点。国际社会日益认识到海洋碳汇的价值与潜力，将海洋碳汇纳入国际气候变化治理体系的趋势也愈发明显。我国具有广阔的海域、丰富的生物多样性与扎实的科研条件，这些为海洋碳汇的发展奠定了坚实基础。随着“碳达峰”“碳中和”目标的提出，沿海各省份纷纷在加快海洋碳汇发展、推进海洋碳汇核算、开展海洋碳汇交易试点等方面进行积极探索。然而，由于海洋碳汇交易工作起步较晚，与之相关的规章制度、行业规范及技术标准缺乏，即使放眼国际，目前也尚无被广泛认可的海洋碳汇标准，一个活跃的海洋碳汇交易市场远未形成。这对我国既是挑战，更是机遇。","prompt":"这段文字接下来最可能续写的内容是：","options":{"A":"我国海洋碳汇相关制度规范标准现状","B":"我国海洋碳汇交易标准体系建设路径","C":"对国际海洋碳汇交易市场的远景展望","D":"沿海各省份探索海洋碳汇的具体实践"},"answer":"B","page":116},{"id":360,"chapter":9,"num":40,"source":"2024山西纪委","type":"接语选择","stem":"开展无痛分娩的技术难度不大，但在国内普及率较低。一些人认为无痛分娩的麻醉技术会影响胎儿身体及智力发育，这造成一些产妇特别是家属的心理抗拒。另一方面，麻醉师短缺、定价政策滞后等现实原因，造成许多医院没有无痛分娩的医疗服务可供选择。近年来，人们对无痛分娩技术安全性的信任度已大大提高，但在包括东部一线城市在内的许多三级医院甚至都无法提供无痛分娩医疗服务，中西部医疗资源匮乏的地区情况可想而知。","prompt":"这段文字接下来最可能介绍：","options":{"A":"无痛分娩技术在我国推广的过程","B":"西方国家推广无痛分娩的成功经验","C":"无痛分娩在我国难以普及的具体困难","D":"公众对无痛分娩态度发生转变的原因"},"answer":"C","page":116},{"id":361,"chapter":10,"num":1,"source":"2025江苏","type":"逻辑填空","stem":"古往今来，在技术的不断更迭中，无数产业在________中被淘汰。出版业却始终屹立不倒，从纸质介质到电子介质，从印刷术到激光照排技术，再到人工智能的广泛应用与数字产品的研发推广，出版社不断________，被人们看作是“永不凋落”的朝阳产业。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"大浪淘沙   推陈出新","B":"百争流   独辟蹊径","C":"白衣苍狗   励精图治","D":"波云诡   精益求精"},"answer":"A","page":117},{"id":362,"chapter":10,"num":2,"source":"2019联考","type":"逻辑填空","stem":"纪录片《苏东坡》以苏东坡贬谪黄州四年的生活为横切面，________其一生的心路历程，从文学、艺术、美食、情感等维度进行透视，多角度地________其生命感悟、精神变和艺术升华的过程，以及对中国传统文化产生的深远影响。同时，辅之以当今最新的研究成果，再现了一个最丰富、最接近本真的苏东坡形象。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"关照   阐释","B":"记载   解说","C":"记录   阐述","D":"观照   解读"},"answer":"D","page":117},{"id":363,"chapter":10,"num":3,"source":"2026辽宁事业","type":"逻辑填空","stem":"在今年的地方两会上，“悦已消费”进入了地方政府工作报告和政策表述，成为观察消费结构变化的重要________。前不久，“爱你老己”在社交平台上引发持续讨论，也让这一概念从网络热词走向更广泛的公共视野。有人为一杯咖啡买单，有人奔赴一场演出，也有人投入运动康养或兴趣课程。看似分散的个体选择，正________为一股不容忽视的消费潮流。","prompt":"依次填入横线部分最恰当的一项是：","options":{"A":"视角   汇合","B":"窗口   汇聚","C":"渠道   凝结","D":"参照   汇集"},"answer":"B","page":117},{"id":364,"chapter":10,"num":4,"source":"2020事业联考","type":"逻辑填空","stem":"当金融体系发生一些特定情况，并有可能触发系统性风险的时候，必要的行政手段是必须的。但________使用行政命令去解决金融体系中的问题，固然可以化解________的金融风险，但最终可能造成新的金融风险。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"贸然   突发","B":"机械   持续","C":"过度   一时","D":"反复   潜在"},"answer":"C","page":117},{"id":365,"chapter":10,"num":5,"source":"2022事业联考","type":"逻辑填空","stem":"古代在一些交通不便、文化闭塞的地方，盐促进了当地的商品流通以及商业发展，并因此________出一条条盐道。在西南地区，隐藏着众多古时的盐道，这些道路因盐而兴起，也因盐而________。它们影响着巴蜀地区的社会与经济格局，间接催生了民族间文化与商业的________。虽然没有茶叶的芬芳，没有丝绸的华丽，但其历史意义却丝毫不亚于茶马古道和丝绸之路，因此被很多学者称为“中国西南的陆上大运河”。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"开辟   湮灭   转换","B":"孕育   衰落   沟通","C":"衍生   繁盛   交融","D":"涌现   发达   互动"},"answer":"C","page":118},{"id":366,"chapter":10,"num":6,"source":"2024安徽三支","type":"逻辑填空","stem":"长期以来，我们倾向于认为，审美是一项人类特有的高级精神活动，是社会和文化的产物。虽然不同的社会群体常常对美的标准________，但在人类的美感中，确实有许多共性的东西，它们与种族、地域和文化无关。比如人类对音乐、舞蹈、色彩、人体、景观和食物等，都体现出了高度一致的审美。这些共同的审美是怎么产生的？或者说，为什么我们会觉得它们是美的？","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"无所适从","B":"莫衷一是","C":"众口难调","D":"众说纷坛"},"answer":"B","page":118},{"id":367,"chapter":10,"num":7,"source":"2020 江苏","type":"逻辑填空","stem":"回顾我国科技事业的发展,正是一代代航天人________、顽强拼搏,________了一系列关键核心技术，才有了中国航天大国的地位；正是因为________了深海装备的关键核心技术，才能使“蛟龙”“潜龙”“海龙”遨游深海，独立自主地进行科学考察，使中国在世界深海科学事业上拥有了发言权。","prompt":"依次填入画横线处最恰当的一项是：","options":{"A":"路蓝缕   攻克   突破","B":"锲而不舍   钻研   掌控","C":"披坚执锐   解决   攻陷","D":"身先士卒   破解   控制"},"answer":"A","page":118},{"id":368,"chapter":10,"num":8,"source":"2023内蒙古事业","type":"逻辑填空","stem":"国际投资贸易洽谈会（下称“投洽会”）向来是国际资本与项目的“相亲角”。投资推介、产业对接和招商洽谈同步推进，“引进来”与“走出去”双向交流，无不________投洽会的“专业化”特质。当前，百年未有之大变局加速演进，全球资本的“活水”将流向何处？投资中国将迎来怎样的机遇？作为中国对外投资和引进外资的________，投洽会传递的声音备受关注。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"突出   发动机","B":"展露   指挥棒","C":"凸显   风向标","D":"显露   晴雨表"},"answer":"C","page":118},{"id":369,"chapter":10,"num":9,"source":"2026 天津事业","type":"逻辑填空","stem":"对节俭和浪费的态度，既能_________出一个国家、一个民族的价值标准和文明程度，也能________这个国家和民族的发展前景。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"影射   暗示","B":"反射   揭示","C":"折射   昭示","D":"映射   彰显"},"answer":"C","page":119},{"id":370,"chapter":10,"num":10,"source":"2022 联考","type":"逻辑填空","stem":"从艺术创作实践到艺术理论，需要以问题为________。正是在回答艺术创作实践提出的一个又一个挑战性问题过程中，艺术理论得到发展和完善。这就要求艺术理论工作者在关注实践的过程中有自觉的问题意识，能够敏锐捕捉、准确接住创作现实抛出的新问题。从艺术现场破题，从问题症结处________，锐意创新。免费学习资料库加微信：Sasm19","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"中介   迎难而上","B":"向导   大显身手","C":"根源   激流勇进","D":"媒介   百折不回"},"answer":"A","page":119},{"id":371,"chapter":10,"num":11,"source":"2023事业联考","type":"逻辑填空","stem":"加大力度推动职业教育更高质量发展，意味着针对技能人才的激励配套政策将要“尺度”更大，意味着技术人才报酬待遇将进一步提高，意味着在就医、住房、子女教育等方面，向技术人员倾斜力度更大···有了职业教育发展环境的不断________，职业教育的发展动力就会愈加澎湃，与之相对应的，职业发展的渠道将会更加________，发展的机会更多、空间更大。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"改造   稳固","B":"提升   多元","C":"优化   畅通","D":"创新   宽阔"},"answer":"C","page":119},{"id":372,"chapter":10,"num":12,"source":"2026广东事业","type":"逻辑填空","stem":"人的自主性既是人类认识技术、使用技术、发展技术的智力前提，也是________人工智能技术的根本保障。人工智能治理要实现技术创新与风险防控的________，就要坚持发挥人类独特的能动性，以人的主体性对抗算法日益膨胀的“自主性”。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"控制   统筹","B":"驾驭   平衡","C":"把控   协调","D":"掌握   兼容"},"answer":"B","page":119},{"id":373,"chapter":10,"num":13,"source":"2020四川","type":"逻辑填空","stem":"行书一身兼众体，包容天下字，行书处在楷、草之间，最有________空间。正楷严肃认真，影响了书写速度，行书既书写快，又看得懂，因而大受欢迎。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"伸缩","B":"改造","C":"想象","D":"创作"},"answer":"A","page":120},{"id":374,"chapter":10,"num":14,"source":"2019山东选调","type":"逻辑填空","stem":"我们党领导入民干革命、搞建设、抓改革，从来都是为了解决中国的现实问题。如果对矛盾________，甚至回避、掩饰矛盾，在矛盾面前畏缩不前，坐看矛盾恶性转化，那就会________，最后势必造成无法弥补的损失。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"置若罔闻   亡羊补牢","B":"视而不见   尾大不掉","C":"闭目塞听   覆水难收","D":"熟视无睹   积重难返"},"answer":"D","page":120},{"id":375,"chapter":10,"num":15,"source":"2026联考","type":"逻辑填空","stem":"中国传统山水画通过________的手法营造出万千意境。苏绣艺术家深谱这一理念，在山水题材创作中巧妙利用绣地绢帛本色的“空白”与丝线绣制的“形象”，营造出“超以象外”的空间意境，打破了传统刺绣的密集形态，提升了画面的艺术表现力。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"虚实相生","B":"天人合一","C":"刚柔兼济","D":"举重若轻"},"answer":"A","page":120},{"id":376,"chapter":10,"num":16,"source":"2023事业联考","type":"逻辑填空","stem":"在现实世界中，日常事象和重要事件的________往往被混乱无序的生活表象掩盖。要想挖掘生活细节的真实、生活逻辑的真实、生活本质的真实，既需要电影创作者通过语言文字符号系统和视听隐喻形象系统________这些生活场景，也需要通过艺术家对生活现象进行主观判断、能动选择、叙事材料的确认与创造。因此，电影很难达成艺术表现与客观现实的________0","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"规律   模拟   统一","B":"真理   反映   平衡","C":"价值   复制   融合","D":"本质   呈现   同构"},"answer":"D","page":120},{"id":377,"chapter":10,"num":17,"source":"2025四川三支","type":"逻辑填空","stem":"大约在4.65亿年前的奥陶纪，早期脊椎鱼类全身________着坚硬的铠甲。这些甲胄上布满微小的凸起结构，内部含有类似牙本质的组织。科学家推测，这些结构能感知周围水流的压力、温度的变化，甚至能________到靠近的掠食者，就像一套“水下雷达系统”。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"包裹   捕获","B":"覆盖   探测","C":"分布   感应","D":"装备   察觉"},"answer":"B","page":120},{"id":378,"chapter":10,"num":18,"source":"2022事业联考","type":"逻辑填空","stem":"暗物质可以通过湮灭产生极高能的光子、正负电子、正反质子或者中微子。如果我们能在众多天文信号中________出这些暗物质相关的信号，也许就能找到暗物质存在的________。我国发射的“悟空”号暗物质粒子探测卫星正是致力于此。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"剥离   蛛丝马迹","B":"选择   真凭实据","C":"识别   细枝末节","D":"推测   一鳞半爪"},"answer":"A","page":121},{"id":379,"chapter":10,"num":19,"source":"2025 重庆事业","type":"逻辑填空","stem":"文化建设中要始终坚持正确导向，传达正确立场观点；同时提高舆论引导和舆情风险________能力，针对舆论场上层出不穷的热点问题，及时发声、敢于表态，有效引领舆论走向，起到“________”“风向标”作用。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"防范   预警机","B":"管制   检验网","C":"管控   定音鼓","D":"抵御   过滤器"},"answer":"C","page":121},{"id":380,"chapter":10,"num":20,"source":"2024联考","type":"逻辑填空","stem":"20世纪80年代，伴随乡村民俗及观念的日益________，写实风格绘画也在快速地构建新的民间审美意趣，反映社会生活、农村新貌的作品取代原来的民俗题材成为年画主体，年画艺术与“年”的关系________，木版年画的雕版套印技术，以及由此形成的传统审美趣味至此走到了________的边缘。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"弱化   形同陌路   式微","B":"淡化   渐行渐远   没落","C":"淡出   今非昔比   衰亡","D":"遗失   每况愈下   消弹"},"answer":"B","page":121},{"id":381,"chapter":10,"num":21,"source":"2025 浙江事业","type":"中心理解","stem":"构建现代化产业体系是发展新质生产力的重要着力点，也是实现生产力现代化的必然要求。如果没有产业的发展进步，就不会有新质生产力的高质量发展。因此，发展新质生产力要积极“改造提升传统产业，培育壮大新兴产业，布局建设未来产业，完善现代化产业体系”。","prompt":"这段文字意在强调：","options":{"A":"传统产业升级的具体路径","B":"新兴产业与未来产业的布局策略","C":"新质生产力与生产力现代化的关系","D":"一体化产业体系对发展新质生产力的重要性"},"answer":"D","page":121},{"id":382,"chapter":10,"num":22,"source":"2022 联考","type":"中心理解","stem":"近年，中国部分科幻电影在国际票房收入方面获得了巨大的成功。中国科幻电影的发展表现了人们对科技和人文主义的考量，从更深层次的生态文化视角考虑科技和人类的关系。在科幻电影的亚类型创作上，中国具有广阔的开发空间。中国文化经验和记忆的融入为科幻片的进一步发展壮大或者细化成文化亚类型提供了可能性。相较于具有民族性限制的中国魔幻、玄幻电影作品，科幻电影具有国际通约性，因此借助科幻题材，表达人类社会共同议题，将促使中国科幻电影成为中国文化走向世界的重要沟通载体。","prompt":"这段文字意在强调：","options":{"A":"中国科幻电影的成功发展助力中国文化走向世界","B":"科幻电影表现了人们对于科技与人文主义的考量","C":"中国在科幻电影的亚类型创作方面具有广阔空间","D":"中国科幻电影在国际票房收入上获得了巨大成功"},"answer":"A","page":122},{"id":383,"chapter":10,"num":23,"source":"2019 黑龙江紧缺","type":"中心理解","stem":"目前许多农业电子商务网站的前身是农业信息服务网站，本身并不具备商业目的性，因而在转变为电子商务网站之初，将首要目标定位在吸引更多人关注和增加网站流量而非如何发挥商业价值上。在这种思路指导下，大多数农业电子商务网站往往重视网站的“新、全、奇”特点，打出“中国最大”“全国第一”的口号，以期获得更多的点击率和流量，但这并不能让市场和网民对这些网站有全面的了解，因此其中大量的信息资源并不被人所知，其商业价值也无法发挥出来。","prompt":"这段文字的主要意思是：","options":{"A":"农业电子商务网站过多地侧重信息服务功能","B":"农业电子商务网站在实现商业目的上做得不够","C":"农业电子商务网站成功地获得网站流量和关注","D":"农业电子商务网站应注重宣传的真实性和创新性"},"answer":"B","page":122},{"id":384,"chapter":10,"num":24,"source":"2025江苏","type":"中心理解","stem":"有关数据显示：2024年1—7月，高端装备制造业销售收入同比增长8.3%，占制造业总销售收入的比重为16.5%，较上年同期提高0.5个百分点；智能设备制造业销售收入同比增长 12.4%；高耗能制造业销售收入占制造业比重为 30.7%，较上年同期下降0.8个百分点，节能降耗工作有序推进；制造业企业采购环境治理服务金额同比增长6.2%，增速较 2023年加快2.4个百分点，治污投入不断加大。","prompt":"这段文字重在说明：","options":{"A":"制造业持续不断在国民经济发展中起领跑作用","B":"经济发展亮点频现呈现出持续向好的发展态势","C":"制造业正向高端化智能化绿色化发展扎实推进","D":"经济发展与生态治理齐头并进为实现双赢努力"},"answer":"C","page":122},{"id":385,"chapter":10,"num":25,"source":"2025事业联考","type":"细节判断","stem":"大运河宿迁段在近千年的发展历程中，不但用于运输粮和商货，而且促进了沿线城镇的崛起、商业的繁荣与文化的交流，更是留下了丰富的物质和非物质运河文化景观。随着时间推移，先人遗留下来的这些文化景观会面临衰败或流失的威胁。而今，数字化技术日渐成熟，为运河文化景观保护和传承提供了更多技术层面的选择。通过综合运用音频、视频、动画、文字等技术，全方位记录、保存、展示宿迁大运河水利工程、重要文物、历史故事、民间技艺、传统戏剧等文化景观，再现其鲜活的形态，可以更好地保护和传承运河文化遗产。","prompt":"关于大运河宿迁段，这段文字没有提及：","options":{"A":"非物质文化景观的主要类型","B":"历史上曾经发挥的作用与影响","C":"用数字技术保护文化景观的优势","D":"物质文化景观所面临的具体威胁"},"answer":"D","page":123},{"id":386,"chapter":10,"num":26,"source":"2024江苏","type":"细节判断","stem":"陶瓷是陶器和瓷器的总称。早在公元前8000 年前的新石器时代，我们的祖先就发明了陶器。到了距今约 2000 年的东汉时期，成熟的瓷器也登上了历史舞台，进入百姓生活中。现如今，随着科学技术的迅猛发展，更多新型陶瓷以其高韧性、高抗弯强度和高耐磨性等优点被广泛用于各行各业。目前，科研人员还在研发更多超轻、耐用、耐高温、耐腐蚀的陶瓷材料，有望用于未来航天器的隔热保护。","prompt":"下列说法与文意不符的是：","options":{"A":"陶器的出现比瓷器的发明要早六千年","B":"东汉时期陶器已经进入百姓生活之中","C":"新型陶瓷材料以其特殊物理性质应用广泛","D":"新型陶瓷材料未来有用于航天的发展前景"},"answer":"A","page":123},{"id":387,"chapter":10,"num":27,"source":"2025浙江事业","type":"中心理解","stem":"俗话里形容一个人有能耐时会说“真有两把刷子”，相传这“两把刷子”就源于宣纸的晒纸工序。古法宣纸的制作需要经过108 道工序，仅晒纸工人需要做的就有捻、盘、浇、鞭、做、晒、收7个流程，每个步骤力度不同，稍有偏差，纸就破了。宣纸纸张的平整度则要靠晒纸时用松针刷刷出来，刷重了有刷痕，刷轻了又贴不上墙。","prompt":"如果这段文字是某个短视频的解说词，那么这个短视频的主题最不可能是：","options":{"A":"介绍宣纸制作工艺","B":"弘扬传统宣纸文化","C":"闲话俗语“两把刷子”","D":"记录宣纸工匠的生平"},"answer":"D","page":124},{"id":388,"chapter":10,"num":28,"source":"2023辽宁事业","type":"标题填入","stem":"近年来，踏足荒野、悠然自得的露营生活受到追捧，这种原本是“驴友”热衷的小众户外方式，如雨后春笋般席卷朋友圈，成了当下许多人热衷的户外项目。其中露营过程中的一些不文明现象，也引发了大家的关注，一些资深的户外爱好者呼吁，要文明出游，露营结束后应把垃圾带走，做到“无痕露营”。","prompt":"最适合做这段文字标题的是：","options":{"A":"游客出游请带上文明的行囊","B":"莫给自然环境再添“负担”","C":"践行“无痕露营”，做环保达人","D":"“无痕露营”，当成文明出游标配"},"answer":"D","page":124},{"id":389,"chapter":10,"num":29,"source":"2026天津事业","type":"中心理解","stem":"物质主义是一种价值观，强调物质占有对个人的重要性。研究发现，对自己能力和价值感的不确定导致了物质主义的产生。许多孩子进入青春期时会经历自尊的下降，这促使他们关注物质产品，将其作为一种自我提升的手段。如果让其收到来自同伴的正向反馈，他们的自尊水平就会提高，物质主义得分随之下降。有学者从内隐自尊的角度得出了类似的结论，研究者通过阈下内隐实验增加被试的内隐自尊，发现被试的物质主义水平显著降低。","prompt":"上述这段文字表明了：","options":{"A":"物质产品具有补偿和提升自尊的作用","B":"高自尊是降低物质主义的关键因素","C":"物质主义对低自尊具有补偿作用","D":"物质主义是个体对自我价值的不确定感"},"answer":"B","page":124},{"id":390,"chapter":10,"num":30,"source":"2018辽宁三支","type":"中心理解","stem":"文学走进互联网，获得了一个崭新的平民化开放视野；网络上自由、兼容和共享的虚拟空间，打破了精英写作对文学话语权的垄断，为愿意上网创作的网民提供了“人人都能当作家”的机会。这种“新民间文学”，标志着文学话语权向民间回归。尽管如此，网络写作仍然不能与“人民写作”相提并论，因为文学的“人民写作”并不取决于传媒的公共性和参与的广泛性，而取决于这种文学的人民性价值取向和为广大民众喜闻乐见的审美品格。","prompt":"这段文字主要说的是：","options":{"A":"大众化是未来文学发展的趋势","B":"文学创作应坚持人民性的价值取向","C":"网络写作为普通人提供了平等的话语权","D":"平民化的网络文学不能等同于“人民写作”"},"answer":"D","page":124},{"id":391,"chapter":10,"num":31,"source":"2022 四川事业","type":"中心理解","stem":"2014年李雪健参加了文艺座谈会，并在会上发言。“一名演员能够参与其中，是我一生最大的荣幸，参加座谈会等于在我头顶罩上一个光环，也戴上了一个紧箍咒，这是比文联副主席、影协主席更重的光环，是更紧的‘紧箍咒’。”从《渴望》中的“好人”宋大成到现在的德艺双馨艺术家，李雪健在影视艺术的创新之路上，树立了一个艺术家的标杆。“不忘初心，才能始终”。艺术创新的每一步，都在叩问自己的内心世界，都要经受一番艰辛的“文化苦旅”。“心灵要美，才会有美的作品。”李雪健这番话是对“紧箍咒”的最好诠释。","prompt":"根据文段内容，“紧箍咒”指的是：","options":{"A":"一种道德性的自我约束","B":"明星光环","C":"媒体和舆论的监督","D":"追求更高艺术造诣的执念"},"answer":"A","page":125},{"id":392,"chapter":10,"num":32,"source":"2024国考","type":"标题填入","stem":"最高人民法院对近年来生效裁判进行系统化、常态化梳理，深入总结提炼在审理过程中形成的价值理念、司法经验和裁判规则，推动形成体系完备、门类齐全、科学权威、便捷适用的裁判要旨提炼编撰体系。最高人民法院还出台了法律适用分歧解决机制的实施办法和统一法律适用工作实施办法，有效解决生效裁判之间存在的法律适用分歧问题，创新“点对点”法律适用分歧解决机制，推动法律适用分歧解决机制运行更加精准有效、灵活快捷，切实防止司法正义因地域、城乡、行业差异而打折扣。","prompt":"最适合做这段文字标题的是：","options":{"A":"统一裁判尺度，维护社会公平","B":"以法律适用统一提升执法水平","C":"用良法善治夯实法治之基","D":"消除“同案不同判”迫在眉睫"},"answer":"A","page":125},{"id":393,"chapter":10,"num":33,"source":"2026联考","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①没有超导材料、没有经验可循、没有标准可依，超大电流、超强磁场、超高真空成为“卡脖子”难题，让人看不清前路\n②没有路，就用自己的脚印走成路\n③造“太阳”的第一步，是造一个强大的容器，能够承载超高温和超低温，受得了“一米之外，冰火两重天”，让等离子体稳态运行并产生核反应\n④造“太阳”这条无人之路的开端，就荆棘遍布\n⑤这份炙热，源自数十年的科研热情、四代人的薪火相传\n619 年超过15万次放电，如今的全超导托卡马克核聚变实验装置（EAST）能够在1亿摄氏度实现1066 秒稳态运行，比太阳更炙热","prompt":"","options":{"A":"③④①②⑥⑤","B":"④①②③⑤⑥","C":"⑤④①②③⑥","D":"①②③⑥④⑤"},"answer":"A","page":126},{"id":394,"chapter":10,"num":34,"source":"2024联考","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①科学家们希望设计出具有如蜻蜓大脑般快速、高效而轻巧的人造神经网络，以用于无人驾驶设备与反弹道导弹\n②蜻蜓神经系统非凡的超级计算能力，使其能快速预判猎物的运动速度和方向，并适时调整翅膀扑扇的力度与速度\n③蜻蜓的头部虽然不大，但大脑运算速度极快，只需约 50 毫秒就能对猎物的机动动作做出反应\n④蜻蜓大脑的反应与拥有复杂神经系统的灵长类动物非常相似\n⑤捕猎时，蜻蜓每次只锁定一个目标，并对目标移动的路径进行精准评估，然后迅速调整自己的飞行路线，在最合适的时候进行拦截与捕获\n⑥其中，眼睛侦察到猎物并将信息传递给大脑约耗时 10 毫秒，神经冲动传导引起肌肉收缩只需耗时约 5 毫秒","prompt":"","options":{"A":"②③⑥⑤④①","B":"④①⑥③②⑤","C":"②④⑥③①⑤","D":"④③⑥②⑤①"},"answer":"D","page":126},{"id":395,"chapter":10,"num":35,"source":"2022事业联考","type":"中心理解","stem":"在科研领域，人们也喜欢庆祝大新闻，比如证实了黑洞的存在、发明了编辑 DNA 的方法等。与之相比，一些耗时多年、极其艰辛的研究却鲜为人知，因为它们没有带来决定性的结果，似乎不能为解决科学问题提供任何证据，尽管它们能让我们离答案更近一步。这些没有得到预期结果的研究被称为“零结果”，它们驱使我们前进，让我们避免重复同样的错误，为未来的研究指引方向。如果没有它们，科学的发展可能放缓甚至受阻。我们可以从中学到很多东西，然而它们通常不会被发表。这不仅会导致科研效率低下，也显示当前的科学出版流程可能存在很大问题。","prompt":"这段文字意在:","options":{"A":"揭示“零结果”的价值","B":"指出科研领域存在的偏见","C":"反思忽视“零结果”的问题","D":"说明科研发展过程中的复杂性"},"answer":"C","page":126},{"id":396,"chapter":10,"num":36,"source":"2020四川","type":"中心理解","stem":"或许是深受农业文明影响的缘故，中国古典艺术始终缠绕着一种对花草植物的敏感。林徽因说:“惜花、解花太东方，亲昵自然，含着人性的细致是东方传统的情绪。”我们都会背：“兼葭苍苍，白露为霜。所谓伊人，在水一方。”但未必所有人都知道，所谓“葭”，就是我们熟悉的芦苇。《诗经》里的世界，其实并不遥远。“参差菜”“南有乔木”“桃之天天”“彼黍离离”，这先秦时代的民歌，几乎首首离不开植物，一风一雨、一稼一，遍布着草木的声息，以至于《诗经》里的植物花卉，也成为一门学问，吸引一代代的学人研究考证。","prompt":"对这段文字概括最恰当的是：","options":{"A":"中国古典艺术深受农业文明的影响","B":"花草植物是中国古典艺术的重要元素","C":"先秦民歌以花草植物为最主要的描写对象","D":"《诗经》为古代学人的研究提供了丰富素材"},"answer":"B","page":127},{"id":397,"chapter":10,"num":37,"source":"2024四川","type":"语句填空","stem":"信息化深入发展，使社会交往范围扩大，________。传统的社会交往主要局限于相对狭小的熟人范围，人们之所以遵守伦理道德很大程度上是因为相对狭小的熟人圈子中无所不在的外在监督。现代社会交往基于强大信息技术的互联网，进一步打破传统交往的时空限制，成为普遍性的社会交往。这就要求人们具备更高程度的道德自律、更高程度的宽容与尊重，从而促进形成以普遍的诚实、守信为价值基础的现代社会公德。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"与传统社会交往相对单一的熟人社会有较大区别","B":"只有守信的人才能在社会交往中赢得他人的尊重","C":"这对社会交往中的人提出了更高的伦理道德要求","D":"形成了以普遍的诚实守信为价值基础的社会公德"},"answer":"C","page":127},{"id":398,"chapter":10,"num":38,"source":"2026重庆事业","type":"语句填空","stem":"青藏高原位于欧亚大陆中南部，历史上一直处于东亚、南亚、中亚文明的“十字交汇口”。西藏，是青藏高原的主体部分。________。史前时代的遗存越来越多地被发现，几乎遍及西藏不同海拔、不同生态环境的地理单元。许多遗址中发现来自高原之外的粟、黍、滑石珠、青铜器、红玉髓和费昂斯珠饰等产品，证明史前时代高原上就存在广泛而通畅的流通网络，极大拓展和延伸了“史前全球化”的时间和空间尺度。","prompt":"填入画横线部分最合适的一项是：","options":{"A":"这里从来就不是“孤岛”一座","B":"高原上的人群来源不是单一的","C":"自古以来这里就是贸易集散地","D":"多数人认为这里是“不毛之地”"},"answer":"A","page":128},{"id":399,"chapter":10,"num":39,"source":"2024联考","type":"中心理解","stem":"转眼间，《舌尖上的中国》播出已过去多年。多年来，作为纪录片从业者和美食研究者，我们见证了食物从满足温饱到追求风味享受的飞跃；见证了餐饮业从规模扩张到精细化经营的转型；见证了中国人从吃饱到吃好，从讲求质量到开始关注食物背后的情感与文化。其中折射的，不仅是美食的发展与演变，更是经济与社会的进步和变迁。这期间，人们的口味也发生了巨大的改变，涌现出许多新的饮食风尚。最显著的一个变化，恐怕要属“辣”了。","prompt":"紧承这段文字最可能谈论的内容是:","options":{"A":"“辣”味成为饮食新风尚的原因","B":"人们对“辣”味的口味偏好之变","C":"“辣”在传统饮食文化中的地位","D":"不同群体对‘辣”味的不同偏好"},"answer":"A","page":128},{"id":400,"chapter":10,"num":40,"source":"2024黑龙江专项","type":"接语选择","stem":"主权平等的关键在于国家不分大小、强弱、贫富，主权和尊严必须得到尊重，内政不容干涉，国家有权自主选择社会制度和发展道路。坚持主权平等，才能进一步推动各国权利平等、机会平等、规则平等。联合国宪章确认主权平等原则，反对任意干涉别国内政，对于保证国际关系正常发展、促进国际和平与合作，特别是保护广大发展中国家的正当权益具有重要意义。","prompt":"这段文字接下来最有可能说的是：","options":{"A":"重要作用","B":"理念渊源","C":"实现条件","D":"概念内涵"},"answer":"C","page":128},{"id":401,"chapter":11,"num":1,"source":"2025重庆事业","type":"逻辑填空","stem":"不以人的意志为转移的原生沙漠，需要我们以科学精神承认其存在价值，了解其强大与________并存的特性，给予必要的敬畏，并________地积极适应它。如果做到了，不仅是保护了沙漠，还将更多彰显沙漠生态系统有益的一面。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"弱小   顺其自然","B":"脆弱   扬长避短","C":"荒凉   因势利导","D":"贫瘠   无为而治"},"answer":"B","page":129},{"id":402,"chapter":11,"num":2,"source":"2022 联考","type":"逻辑填空","stem":"走进榆阳乡村，田成方、树成行,渠成网、路相通，一幢幢农家院落,________，一个个乡村旅游景点别具特色，一张张笑脸幸福满满，蓝天白云与阡陌纵横的农田交相辉映，诗意盎然的田园画卷________0","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"鳞次栉比   美轮美奂","B":"错落有致   美不胜收","C":"风格迥异   赏心悦目","D":"星罗棋布   尽收眼底"},"answer":"B","page":129},{"id":403,"chapter":11,"num":3,"source":"2026联考","type":"逻辑填空","stem":"如果说“小将”心态是心中燃烧的火，点燃干事创业的激情，赋予我们突破桔的魄力；那么“大将”风范，则是以深厚的定力和耐心，让这团火燃得更久，烧得更旺。二者________。没有前者，容易因循守旧、畏缩不前；缺乏后者，则可能浅尝辄止、急功近利。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"互为表里","B":"遥相呼应","C":"相得益彰","D":"相辅相成"},"answer":"D","page":129},{"id":404,"chapter":11,"num":4,"source":"2023天津事业","type":"逻辑填空","stem":"家风的建设，离不开对家训、家规、家书等文本资料的挖掘整理，并进行科学的梳理与________，做到去粗取精、去伪存真。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"鉴别","B":"判别","C":"识别","D":"甄别"},"answer":"D","page":129},{"id":405,"chapter":11,"num":5,"source":"2022事业联考","type":"逻辑填空","stem":"大栅栏地区是戏班剧社云集之地，先后涌现了众多培养后继人才的“科班”演出场所和“戏院”。在大栅栏这片沃土上，剧种、行当________，乐师、编剧等名家层出不穷，诸多梨园世家________，为戏曲事业的繁荣与发展做出了应有的贡献。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"丰富多彩   争奇斗艳","B":"异彩纷呈   人才辈出","C":"摇曳生姿   人才济济","D":"卓尔不群   百花齐放"},"answer":"B","page":129},{"id":406,"chapter":11,"num":6,"source":"2025 四川三支","type":"逻辑填空","stem":"十几年间冒出这么多古城镇，结果可想而知，就是旅游资源过度供给，可全国游客不够用了，这样一来，注定有的古城镇会落得________的结局。更劝退游客的是，大量古城镇在建设和运营上都出现同质化的问题。中国旅游研究院的数据显示，51.3%的受访者觉得全国各处的古镇有些相似，38.5%的受访者认为非常相似。这种相似既体现在售卖的商品和服务上，也体现在________的建筑风格上。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"门庭冷落   毫无二致","B":"惨淡经营   大同小异","C":"人迹罕至   如出一辙","D":"无人问津   千篇一律"},"answer":"D","page":130},{"id":407,"chapter":11,"num":7,"source":"2020江苏","type":"逻辑填空","stem":"解决气候变化不是一个零和博弈，而是需要多种方案________。我们的确需要保护和更有效地管理森林，但对森林碳汇能力也不能________，需要更加严谨的考证计算。归根到底，科学有效地制定并执行减排政策，才是解决气候变化问题的真正灵药。","prompt":"依次填入画横线处最恰当的一项是：","options":{"A":"博采众长   夸大其辞","B":"集思广益   过度依赖","C":"统筹兼顾   无所作为","D":"齐头并进   盲目乐观"},"answer":"D","page":130},{"id":408,"chapter":11,"num":8,"source":"2021浙江","type":"逻辑填空","stem":"从全世界范围看，论文依然是学术成果主流呈现方式，仍是学术界的“________”。问题的关键在于一个“唯”字，即论文成了学术评价的唯一依据，学术评价________成了计算论文篇数、比拼刊物级别。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"必修课   蜕变","B":"硬通货   异化","C":"敲门砖   演绎","D":"磨刀石   沦落"},"answer":"B","page":130},{"id":409,"chapter":11,"num":9,"source":"2019联考","type":"逻辑填空","stem":"当前，正值‘“互联网+”政务服务逐渐________之际，深化“放管服”改革不是多挂一条标语或横幅，而是要把“马上办”“网上办”“一次办”这些________群众期待的好措施认真办好、加快落实。因此，各地在________政务服务信息化建设的同时，应该下大力气提升工作人员的责任心与服务意识，把好事办好，把小事办牢。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"兴起   满足   监督","B":"升级   注重   聚焦","C":"推行   顺应   强化","D":"普及   迎合   保障"},"answer":"C","page":130},{"id":410,"chapter":11,"num":10,"source":"2019 河北","type":"逻辑填空","stem":"生命，是来自上天的馈赠。在父母________的期盼中，我们呱呱坠地。因而，生命承载了太多希冀的目光和绵绵情谊。沐浴着老师________般的教诲，我们逐渐成长。在生命的旅途中，尽管会遭逢坎坷或失败，但同时，我们收获更多的却是愉悦与成功。因此，我们应该善待自己的生命，要以自信、乐观、积极的人生态度来珍爱这________的礼物。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"望穿秋水   和声细语   贵重","B":"令人神往   润物无声   厚实","C":"望眼欲穿   春风化雨   厚重","D":"百感交集   耳提面命   独特"},"answer":"C","page":131},{"id":411,"chapter":11,"num":11,"source":"2026天津事业","type":"逻辑填空","stem":"你有没有这样的经历？和朋友一起在户外野营，明明站在同一个草地上，别人________，而你却已经被蚊子咬得满腿红肿、奇痒难耐。更让人________的是，哪怕大家都被咬了，有的人只留下一点淡红印记，有的人却要连抓好几天，还可能引发大面积过敏反应。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"安然无恙   惊讶","B":"若无其事   费解","C":"镇定自若   痛苦","D":"谈笑风生   不平"},"answer":"B","page":131},{"id":412,"chapter":11,"num":12,"source":"2020 浙江","type":"逻辑填空","stem":"传统的银行信贷模式是依赖担保和抵押。互联网、大数据等技术的快速________，催生了金融的变革和创新。借助大数据的应用，以科技金融的方式________传统小微业务，可以提升金融服务的质量和效率，做到真正意义上的普惠金融。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"崛起   打造","B":"更新   推动","C":"启动   重构","D":"迭代   介入"},"answer":"D","page":131},{"id":413,"chapter":11,"num":13,"source":"2026山东事业","type":"逻辑填空","stem":"当我们开车驶上立交桥时，桥面本身、高大的桥墩以及周边的密集建筑会形成“城市峡谷”，物理遮挡了手机接收来自北斗等导航卫星的直射信号。手机在瞬间只能接收到少量卫星的反射信号或微弱信号，导致它无法计算出精确的位置。其次，在立交桥区域，北斗信号可能会在桥面、护栏和车辆之间发生多次反射。这些“走了弯路”的反射信号与直射信号________，会“________”手机，让它误判位置，造成定位在桥上桥下漂移或滞后。随着地面接收机算法的________，这种情况会逐步解决。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"冲突   误导   纠正","B":"相扰   迷惑   完善","C":"叠加   欺骗   优化","D":"交叉   干扰   重算"},"answer":"C","page":131},{"id":414,"chapter":11,"num":14,"source":"2026浙江事业","type":"逻辑填空","stem":"“春日经济”的火热，再一次________了以文旅为代表的服务业在拉动消费上的巨大增量作用。以往分散的赏花、踏青、美食、住宿等需求，现在正通过旅游产品的________，串联成为城市深度旅游的线路图，而这种城市观赏线路IP 的形成，也有助于季节性的“流量”________为城市文旅经济的长期“留量”","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"凸显   包装   沉淀","B":"强化   融合   迭代","C":"展现   集约   蜕变","D":"放大   赋能   重塑"},"answer":"A","page":132},{"id":415,"chapter":11,"num":15,"source":"2026广东","type":"逻辑填空","stem":"树立正确的政绩观，既要以“立说立行”的锐气抢抓机遇，又要以“久久为功”的韧劲夯实发展根基。“立说立行”强调机遇________的紧迫感，“久久为功”则注重________的战略定力，二者看似矛盾，实则统一于高质量发展的实践逻辑中。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"白驹过隙   稳扎稳打","B":"稍纵即逝   持之以恒","C":"千载难逢   坚如磐石","D":"时不我待   安之若素"},"answer":"B","page":132},{"id":416,"chapter":11,"num":16,"source":"2026事业联考","type":"逻辑填空","stem":"智育是德育的知识载体，德育是智育的价值内核，二者构成“知识习得”与“价值引领”的________系统。但现实中，一些地区和学校仍存在“重智轻德”现象。究其根源，是因为在应试教育惯性_________下，部分教师固守知识本位的思维________，既未充分理解“德育为智育铸魂”的价值逻辑，更未把握“智育为德育筑基”的知识关联，使得“教书”与“育人”割裂开来。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"闭环   操控   枱","B":"交互   刺激   模式","C":"协调   裹挟   倾向","D":"共生   驱动   窠臼"},"answer":"D","page":132},{"id":417,"chapter":11,"num":17,"source":"2022事业联考","type":"逻辑填空","stem":"随着年轻人不断搬至新城，古城的活力日减，如何用新鲜血液激活________的古城？恐怕没有比组织年轻人徒步“走读”更好的方式了，通过开展一系列活动来激发年轻一代的主人翁意识，是________古城的重要一步。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"濒危   还原","B":"衰颓   挽救","C":"退化   重启","D":"落寞   复苏"},"answer":"D","page":133},{"id":418,"chapter":11,"num":18,"source":"2026事业联考","type":"逻辑填空","stem":"整治形式主义，要通过科学管理明确工作责任、确定任务量。减负，不是去掉原本该干的事，而是理顺流程、明确责任，________、提高效率。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"删繁就简","B":"各司其职","C":"按部就班","D":"抽丝剥茧"},"answer":"A","page":133},{"id":419,"chapter":11,"num":19,"source":"2019 四川","type":"逻辑填空","stem":"我们喜欢向他人分享目标，好像寻求某种认可和鼓励，然而分享会给人一种________的满足感，将空谈错认为________。记下你的目标，制定可行的计划，才更可能成功。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"想象   目的","B":"即时   结果","C":"暂时   事实","D":"虚假   实践"},"answer":"D","page":133},{"id":420,"chapter":11,"num":20,"source":"2025 河南事业","type":"逻辑填空","stem":"青少年是祖国和家的希望，每个孩子都是家长的掌中宝，校园应是安全的港湾。查堵校园欺凌的根源，防堵产生新的痛点，需要家长尽责、学校教育、平台管控、法律________和社会合力。治理校园欺凌，要重视预防，也要重视处置，真正让全社会都能________到危害和后果，共同为孩子们撑起安全成长的天空。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"限制   认知","B":"震慑   感悟","C":"规范   认识","D":"制约   了解"},"answer":"C","page":133},{"id":421,"chapter":11,"num":21,"source":"2018广西选调","type":"中心理解","stem":"了解钞票制作过程的人都知道，随处可见的纸币有着艺术品般的制作过程。首先需要艺术家们设计出图稿，或手绘或剪贴，这些手稿需要经过有关部门详细地审查才能获得通过。印刷之前的选纸工作也十分考究，纸张最基本的特征是耐磨、耐折、耐腐蚀、耐酸碱性等。防伪技术也是钞票重点关注的内容，这需要大量的高新技术，安全线、彩色线、蓝纤维等技术的完美融合，才能最大限度地与伪钞做区分。此外，数字、花卉等图案需要具有一定的艺术性，因为钱币代表着一个国家的形象，至少让人看着舒畅，且兼具“收藏”的潜力。","prompt":"这段文字意在说明：","options":{"A":"钞票制作的流程繁琐而复杂","B":"钞票是多种高新技术的融合","C":"钞票蕴含着丰富的艺术价值","D":"钞票对各项工艺流程要求严格"},"answer":"D","page":133},{"id":422,"chapter":11,"num":22,"source":"2025河北三支","type":"中心理解","stem":"理论是抽象的，营造恰切的承载场景，通过视听符号的多模态表达，可感可触的具身体验，有助于加深青年群体的理论感知。如探索将新技术应用于理论传播，打造剧本杀、沉浸式剧场、互动游戏，情景剧场等青年人欢迎的新场景；借用一张全家福、一封封家书作为理论传播的媒介，构建青年感知先辈践行理论精神的情感场域。这些都有助于调动接收主体的能动性，并促进其理论认同。","prompt":"这段文字意在强调：","options":{"A":"理论传播应“场景化”","B":"理论传播要考虑青年群体的口味","C":"理论传播离不开新的技术手段","D":"理论传播应调动青年的能动性"},"answer":"A","page":134},{"id":423,"chapter":11,"num":23,"source":"2020山东","type":"中心理解","stem":"众所周知，美是有力量的，没有美育的教育是不完整的教育。两千多年前，孔子就提出“兴于诗，立于礼，成于乐”，强调审美教育对于人格培养的作用。或许有不少人认为，美又不能充饥，不懂审美也没什么大不了。但是，在物质供应日益丰沛、精神问题愈显突出的现代社会，审美能力将发挥越来越重要甚至是不可替代的作用。它关系到个人感受生活的能力。然而，如何在国民教育体系中赋予美育应有的位置，以更有力的抓手、更具体的评价机制，去培养和提升每一个公民的审美能力，长期以来却缺少行之有效的方法。","prompt":"这段文字意在强调：","options":{"A":"国人的审美能力亟待培养和提升","B":"审美能力的重要性日益凸显","C":"孔子的审美观念今天仍可借鉴","D":"国民教育体系应重视美育教育"},"answer":"D","page":134},{"id":424,"chapter":11,"num":24,"source":"2020事业联考","type":"中心理解","stem":"要素禀赋理论认为，不同国家之间商品相对价格的不同是发生贸易的基础，这个差价源于各国生产要素比率差异。在解释当代服务贸易时，这一理论有严格的假设条件，包括两国之间要素特别是劳动力不流动这个假设，这是理论的“核”。因为要素流动会改变贸易双方要素禀赋的差异，从而动摇贸易的基础。进入网络时代，虽然劳动力仍然不能大规模流动，但其提供的劳务却可以无障碍地大规模远距离提供，迅速缩小了不同国家的服务差价。","prompt":"这段文字意在说明：","options":{"A":"网络的无差别共享功能改变了当代服务贸易的基础","B":"要素禀赋理论在网络时代的服务贸易格局下面临挑战","C":"传统贸易理论过于严格的假设条件需要与时俱进地调整","D":"网络时代的服务全球化使不同国家消费者可享受同等服务"},"answer":"B","page":134},{"id":425,"chapter":11,"num":25,"source":"2023 深圳","type":"细节判断","stem":"宋体起源于宋代雕版印刷业兴盛时通行的一种印刷字体，在现代印刷中主要用于书刊或报纸的正文部分。宋体字特别工整，笔画横平竖直，横细竖粗，棱角分明，字形方正，结构严谨，整齐均匀，有极强的规律性，从而易认易读，让人在阅读时有一种舒适醒目的感觉。宋体字虽然很美观，但它因为均匀统一，加之带有装饰性在里面，还具有雕版印刷及木板刀刻的韵味，人们徒手用毛笔难以书写出来，无法表现个人的情感，所以，它不属于书法艺术的范畴。","prompt":"上文没有提及宋体字的：","options":{"A":"名称由来","B":"笔画特征","C":"应用范畴","D":"审美缺陷"},"answer":"A","page":135},{"id":426,"chapter":11,"num":26,"source":"2026 联考","type":"细节判断","stem":"近年来，一系列具有人文情怀的文化综艺类节目集体走红。在融媒体时代，文化综艺类节目如何创新成了摆在创作者面前的一道难题。创新要找到令年轻人感兴趣的点进行嫁接，但又不能丢掉主流媒体的审美、价值观和社会责任。文化综艺的创新，应该走文化传统和现代时尚相结合之路，不能脱离对传统经典文化的传承凭空打造所谓现代时尚，而是要把传统与时代精神相结合，走进入民群众最接地气的生活，在寓教于乐中让人受到启迪。","prompt":"下列选项与这段文字意思不符的是：","options":{"A":"文化综艺类节目的创新要扎根人民、扎根生活","B":"文化综艺类节目要以传承传统文化为首要目的","C":"文化综艺类节目不能流于说教而忽视其娱乐性","D":"文化综艺类节目创新要关注年轻人的精神需求"},"answer":"B","page":135},{"id":427,"chapter":11,"num":27,"source":"2026联考","type":"细节判断","stem":"顶端优势是指植物的顶芽优先生长，对侧芽萌发、侧枝生长的抑制作用，也包括对侧枝、叶子生长角度的影响。顶端优势强的植物，几乎不生分枝，如长日照植物向日葵，棉花等。番茄等植物顶端优势弱，能长出许多分枝。灌木顶端优势极弱，几乎没有主茎与分枝的区别。多数植物属中间类型，如稻、麦、泡桐等。顶端优势的强弱随植株年龄而变化，同时受营养和环境条件的影响，幼龄植物顶端优势强，老龄时减弱。顶端对侧芽的抑制程度，随距离增加而减弱，因此对下部侧芽的抑制比对上部侧芽的轻。许多树木因此形成宝塔形树冠。","prompt":"由此我们可以推出：","options":{"A":"距离根系越近，则顶端对侧芽的抑制程度会越高","B":"宝塔形树冠是顶端优势弱的植株的典型外部形态","C":"顶端优势现象的表现形式和程度因植物种类而异","D":"生存在恶劣环境下的植物，其顶端优势较为明显"},"answer":"C","page":135},{"id":428,"chapter":11,"num":28,"source":"2025河南事业","type":"标题填入","stem":"经济体制作为社会基本经济结构的具体表现形式具有多样性和可变性。在既定的生产力和生产关系发展状况下，各国究竟选择什么样的经济体制，往往由国家政权组织根据本国的具体国情选择决定。例如，新中国成立后在相当长一段时间内，实行的是计划经济体制。十一届三中全会以后，我国开始对传统的经济体制进行改革，逐步实行有计划的商品经济体制。党的十四大则正式提出了要建立社会主义市场经济体制。行政组织设计与选择具体的经济体制，实际上是巩固、发展与完善基本生产关系，促进生产力发展的重要环节。","prompt":"这段文字最适合的标题是：","options":{"A":"巩固、发展和完善社会基本经济结构","B":"努力创建有利于自身的良好经济环境","C":"审时度势不断改变经济体制促进发展","D":"建立、健全符合本国国情的经济体制"},"answer":"D","page":136},{"id":429,"chapter":11,"num":29,"source":"2025四川三支","type":"中心理解","stem":"有学者认为，工业革命为经济打造了一套肌肉系统，数字革命则为经济打造了一套神经系统。按照这一观点，如果将数字经济与实体经济分割对立，则无异于将人的肌肉骨骼与神经系统分离，这不仅是对数字经济内涵的误解，更不利于经济健康发展。工业革命构建的实体经济与数字革命催生的数字经济是不可分割的有机整体：数字技术为实体经济的发展拓展新空间、提供新生产要素；实体经济为数字技术提供更多应用场景，为数字经济发展提供新动能。实数融合在本质上就是实体经济蕴含的海量高价值场景与数字技术深度融合的创新过程。","prompt":"这段文字最可能出自下列哪篇文章？","options":{"A":"《实数融合焕新未来经济图景》","B":"《数字经济带来市场机制革命》","C":"《数字经济的内在逻辑与发展趋势》","D":"《实数融合助推智能制造走深向实》"},"answer":"A","page":136},{"id":430,"chapter":11,"num":30,"source":"2020 事业联考","type":"中心理解","stem":"重点国有景区门票降价，不但直接触及景区的经济利益，而且伤及一些景区长期形成的“门票依赖”发展模式，因此必然会遭遇各种阻力和障碍。根据相关规定，重点国有景区门票降价不得只降低淡季价格、不降低旺季价格；不得以经营管理者在政府指导价范围内自主下浮价格替代政府降价；不得通过不合理设置“园中园”门票，提高其他游览服务价格，将门票、相关游览服务项目强制捆绑销售等方式冲减降价实效，搞“明降暗升”等。这些规定明确指向此前景区门票降价中出现的种种“招数”，而只有这些“招数”彻底失灵失效了，景区门票价格形成机制、成本监审机制和外部监督机制才算真正建立。","prompt":"这段文字意在说明，重点国有景区门票降价：","options":{"A":"必须尽快建立与之相关的法律监督机制","B":"应从理念上摒弃“门票依赖”的发展模式","C":"有助于推动旅游业持续、稳定、健康地发展","D":"关键在于将景区门票降价的规定落在实处"},"answer":"D","page":137},{"id":431,"chapter":11,"num":31,"source":"2024天津事业","type":"中心理解","stem":"在历法还不完善的古代，人们通过对天象、物象和气象等的变化来盘算时令节气，指导生产，比如早在先秦时期，我国古人就已经把黄昏时分“大火”出现在正南方的天空作为夏至的标志。《诗经》中的“七月流火”，指农历七月，“大火”开始西沉，是天气开始变凉的信号。还有不少民俗专家认为，重阳节的原型之一是祭祀“大火”的仪式。这说明古人早已发现“大火”在季秋时节退隐，冬季即将到来。","prompt":"根据上述文字可以推断，“大火”可能是:","options":{"A":"一种候鸟的代称","B":"某颗星星的别称","C":"祭祀所用的贡品","D":"用来形容高温天气"},"answer":"B","page":137},{"id":432,"chapter":11,"num":32,"source":"2025 江苏","type":"中心理解","stem":"日常生活中，用来加工米饭、馒头等主食的原料，几乎都来自禾本科植物。在成为主食重要来源的过程中，禾本科植物经历了漫长的进化和选择阶段。在长期的物种进化中，野生种经过天然杂交、遗传物质自然加倍，以及异常气候及环境胁迫导致的自然选择，逐步形成了人类可以作为食物进行种植的禾本科植物类型。禾本科植物适应性强，易于推广种植，其籽粒便于储藏、加工，且营养丰富。禾本科植物分布范围广，抗逆性比较强，遗传多样性丰富，因此在不同类型环境中都能种植，并获得较理想的产量。","prompt":"这段文字重在说明：","options":{"A":"禾本科植物适应性强且便于种植","B":"禾本科植物成为主食主要原料的缘由","C":"禾本科植物籽粒的营养十分丰富","D":"禾本科植物经历的进化和选择的过程"},"answer":"B","page":137},{"id":433,"chapter":11,"num":33,"source":"2022联考","type":"语句排序","stem":"将以下5个句子重新排列，语序正确的一项是：\n①此外，在集成高铁强国先进成熟技术的基础上，中国建立了更加完善的创新体系和试验体系，因而新车型开发周期处于全球领先水平\n②速度是反映高铁综合技术水平最主要的指标\n③在衡量高铁速度水平的四个指标中，除最高线路试验速度由法国保持外，其余三项纪录均由中国创造\n④例如，时速 350 公里中国标准动车组5年就完成项目立项到实际上线运营，而西门子时速 280 公里高速动车组从技术招标到批量采购耗时近 10 年\n⑤高铁已经成为中国极少数能够比肩国际技术前沿，甚至在部分领域引领全球技术发展的高技术复杂度产业","prompt":"","options":{"A":"④②③①⑤","B":"②④③⑤①","C":"⑤②③①④","D":"③⑤①④②"},"answer":"C","page":138},{"id":434,"chapter":11,"num":34,"source":"2022重庆选调","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①“发射线”和“吸收线”的强度都取决于气体的密度\n②光子在穿过外流时，其中的一部分会被外流吸收\n③黑洞辐射的光子和黑洞外流都在远离黑洞运动\n④同样，外流气体向外运动的过程中也会辐射一定频率的光子，产生“发射线”\n⑤虽然黑洞外流产生在距离黑洞更远的地方，但由于其运动速度远小于光速，外流往往会被吸积流辐射的光子追上免费学习资料库加微信：Sasm19\n⑥因此，在黑洞的辐射光谱上会产生“吸收线”","prompt":"","options":{"A":"③⑤②⑥④①","B":"②③⑤④①⑥","C":"①⑤③⑥④②","D":"⑤②③①⑥④"},"answer":"A","page":138},{"id":435,"chapter":11,"num":35,"source":"2024黑龙江专项","type":"语句填空","stem":"比起线下，人们对自己在线上的言行更不加以控制。这种偏差被称作“线上去抑制化效应”。这个效应的理论基础是，人们在线下的日常生活中实际上是处在一种“抑制”状态，因为在社会化的过程中，人们逐渐学会去抑制一些不太合适的行为，比如隐藏情绪，不会暴露自己太多的脆弱，更不会暴露自己的攻击性。但在线上，这种抑制化现象会被削弱：人们会和陌生人分享最私密的事情、最脆弱的情绪，也会把最恶毒、最凶狠的一面释放出来。________，人们在线上可能表现得更有同情心、更乐于助人，也会出现对自己的恶意、恶行更不加以控制的情况。","prompt":"下列选项填入横线处最恰当的一项是：","options":{"A":"线上行为有别于线下真人互动","B":"去抑制本身其实没有好坏之分","C":"这其实是网络霸凌行为的根源","D":"线上与线下的人可能判若两人"},"answer":"B","page":138},{"id":436,"chapter":11,"num":36,"source":"2025河南事业","type":"中心理解","stem":"目前，益生菌科研创新和产业化之间的距离，也就是科研成果转化的时长在逐渐缩短。如何进一步推进两者结合？一方面，要推动“需求牵引的科研”，要去市场中寻找需求和限制产业发展的瓶颈，凝练相应的科学问题，围绕它们背后的基础理论缺失进行益生菌创新研究；另一方面，要注重“科研的产业化视角”，对于益生菌基础科学研究，不能为了做而做，要多思考该理论问题的解决，可以应用到产业的哪些方面，实现哪些转化。","prompt":"这段文字意在说明：","options":{"A":"益生菌科学研究要缩短成果转化的距离和时长","B":"益生菌科学研究要聚焦市场和产业导向","C":"益生菌科学研究要更多立足理论问题的解决","D":"益生菌科学研究和产业化在当下实现了较好结合"},"answer":"B","page":139},{"id":437,"chapter":11,"num":37,"source":"2018贵州选调","type":"中心理解","stem":"近年来，随着微博、微信等网络社交媒体的迅速发展，有关食品的谣言甚嚣尘上，给人们的日常生活带来很大困扰。在日前召开的中国食品辟谣论坛上，中国食品谣言智能预警处理平台正式上线，被寄予了破解食品谣言满天飞现状的厚望。健全和完善食品安全举报的平台和机制，把举报机制纳入食品谣言智能预警处理平台，从而对食品谣言治理进行闭环管理，才能真正建立消费者对食品安全的信心。","prompt":"这段文字意在强调：","options":{"A":"有关食品的谣言甚嚣尘上，辟谣预警平台应运而生","B":"食品安全谣言泛滥，建立举报机制已经刻不容缓","C":"治理食品安全谣言，不能仅仅依靠辟谣预警平台","D":"治理食品安全谣言，须先重视其举报平台及相应机制"},"answer":"D","page":139},{"id":438,"chapter":11,"num":38,"source":"2020 事业联考","type":"语句填空","stem":"文人权力与地位在北宋初年获得迅速提升，这是中国社会对中晚唐以来国家整体危机的结构性反应。自 755 年安史之乱爆发，到1063 年宋仁宗统治末期文官在行政与军事各领域都压过武人同僚，三百年中，统治精英所面对的同一个问题，那就是如何重建秩序，恢复一统，实现天下太平。在追溯这种较长时段的演变时，________。因为历史上的很多重大问题往往都被传统上以王朝为单位的研究方式所遮蔽了。“唐宋之际的文武关系”是这种精英力量调整最明显的表征。由此入手，可以窥见政治构造内部的变化，理解文官之治作为一项政治安排，一旦成形之后，何以竟能如此长寿。","prompt":"填入画横线处最恰当的一项是：","options":{"A":"打破朝代之间的区隔是必要的","B":"总会面对政治构造不同的现象","C":"必须关注文武关系这一重要的特征","D":"有必要理解制度深厚的内在逻辑"},"answer":"A","page":140},{"id":439,"chapter":11,"num":39,"source":"2026 联考","type":"接语选择","stem":"棉花花朵的子房包含着未来会发育成棉籽的胚珠。棉花开花授粉后，胚珠的表皮细胞开始分化，一部分向外突起、伸长，发育成棉纤维，胚珠本身受精后发育成种子（棉籽）。棉纤维是主产品，广泛应用于纺织工业；棉籽传统上被视为副产品，实则浑身是宝—棉籽仁可以榨油，残渣（棉籽粕）是优质的蛋白质饲料原料。棉纤维和种子的发育同时进行，共享母体植株供给的营养与能量。前期大量研究表明，许多影响纤维和种子最终表型的基因均在胚珠发育早期集中表达，此时代谢活动也极为旺盛，决定了后续纤维的产量、品质和种子的营养价值。","prompt":"这段文字接下来最可能讲的是:","options":{"A":"棉籽仁及棉籽粕的加工技术","B":"棉纤维以及棉籽的经济价值","C":"棉花种子的品质以及营养价值判断","D":"胚珠发育早期的基因表达与代谢调控机制"},"answer":"D","page":140},{"id":440,"chapter":11,"num":40,"source":"2024 浙江事业","type":"接语选择","stem":"破解分流焦虑，关键之处不在于分流与否，也不在于普职比的高低，而在于能否为中职生提供充满希望的上升通道。推动职教高考改革，使之成为高职招生主渠道，设立本科及以上教育层次的高等职业学校和普通高等学校，并不断扩大职业本科、应用型本科在职教高考中的招生计划，一系列改革都指向让中职生有更多机会上大专、上本科甚至接受更高层次的职业教育。如此，让社会看到一条畅通的多元成长成才道路，不再是“一朝分流定终身”，分流焦虑才能真正减轻。","prompt":"这段文字的上一段最可能说的是：","options":{"A":"介绍近年普职录取比例的变化趋势","B":"保障职教改革稳步落地的重点难点","C":"打通中职学生升学通道的具体举措","D":"社会对普职分流的普遍误解和担忧"},"answer":"D","page":140},{"id":441,"chapter":12,"num":1,"source":"2026重庆事业","type":"逻辑填空","stem":"在很多知名博物馆一票难求的同时，一些中小博物馆虽然馆藏丰富，但现在仍然________。这说明现在的“博物馆热”，可能在某种程度上建立在观众对某些明星文物的“追逐”之上，或者只是把参观博物馆当作一件时尚的事情。博物馆作为知识传播者的常态化功能和价值，没有得到真正的________0","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"门可罗雀   认识","B":"无人问津   赏识","C":"洛阳纸贵   体现","D":"鲜为人知   利用"},"answer":"A","page":142},{"id":442,"chapter":12,"num":2,"source":"2018 四川三支","type":"逻辑填空","stem":"一流学科建设是一个长期持久的过程，既要重视学科的学术逻辑，也要重视学科的社会需求逻辑，建设中还需要不断拓宽筹资渠道，使建设经费的来源更加________。如何建立产学研联动机制，使社会资本注入学科建设，在人才培养、科学研究和行业需求方面实现良性________，从而服务于国家发展和民族复兴大局，是值得深入思索和探讨的命题。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"多元   循环","B":"规范   互动","C":"合理   合作","D":"广泛   融合"},"answer":"A","page":142},{"id":443,"chapter":12,"num":3,"source":"2026陕西事业","type":"逻辑填空","stem":"当前，新一轮科技革命浪潮奔涌。以深度求索（DeepSeek）为代表的颠覆性创新成果________，不仅在实践中展示出强劲的推动力，更印证了新质生产力主导创新的核心地位。然而，发展新质生产力绝非一味“求高求新”或开展同质化竞争，而是必须坚持________，形成各具特色、优势互补的区域产业布局。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"脱颖而出   因势利导","B":"横空出世   因地制宜","C":"异军突起   因势利导","D":"崭露头角   因地制宜"},"answer":"B","page":142},{"id":444,"chapter":12,"num":4,"source":"2022江苏","type":"逻辑填空","stem":"疫情导致全球产业格局重塑，中国国内也面临严峻挑战，中国将_________内陆的新基建投资和消费转型构建稳定的国内循环，巩固脱贫攻坚成果与乡村振兴的有机________，进一步为深化中国自然资本增值和重塑区域经济提供新的方向。","prompt":"依次填入画横线处最恰当的一项是：","options":{"A":"提振   结合","B":"抓紧   协调","C":"依托   衔接","D":"力促   联系"},"answer":"C","page":142},{"id":445,"chapter":12,"num":5,"source":"2026事业联考","type":"逻辑填空","stem":"食品感官科学研究范畴中的“电子舌头”要想有广阔的市场，必须要“走人寻常百姓家”，如果________，便失去了存在的意义。在食品安全领域，“电子舌头”大有可为，可以让不应过量乃至禁止掺入的添加剂________；在网络购物领域，“电子舌头”则提供了一种更为直观、________了解食品味道的方式，减少试错的风险。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"顾影自怜   原形毕露   全面","B":"曲高和寡   无处遁形   精准","C":"孤芳自赏   难以为继   有效","D":"徒有其表   烟消云散   深入"},"answer":"B","page":143},{"id":446,"chapter":12,"num":6,"source":"2026山东事业","type":"逻辑填空","stem":"凭借制作周期短的优势，微短剧比传统影视剧更有条件快速呼应新闻事件与社会热点；史册记载的丰富历史事件，古典文学________的人物故事，也都是可供取材的富矿；新时代中国蒸蒸日上的发展、________的百姓生活，都值得被鲜活记录、生动讲述。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"精妙绝伦   其乐融融","B":"栩栩如生   丰衣足食","C":"发人深省   喜闻乐见","D":"浩如烟海   日新月异"},"answer":"D","page":143},{"id":447,"chapter":12,"num":7,"source":"2019 联考","type":"逻辑填空","stem":"啥是佩奇？这只其貌不扬的粉红小猪，本身就是家庭亲情的象征。父母、姐弟，简简单单、快快乐乐地生活在一起。这个“舶来品”的故事，________了中国老百姓“老婆孩子热炕头”的淳朴理想，也符合孩子们对童年、父母、家庭日常的真实感受。这是最基本的人伦感情，也是全世界通用的语言。","prompt":"填入画横线部分最恰当的一项是","options":{"A":"迎合","B":"暗合","C":"符合","D":"吻合"},"answer":"B","page":143},{"id":448,"chapter":12,"num":8,"source":"2025四川","type":"逻辑填空","stem":"大地震的冷酷在于，它将人们的生活连根拔起，________了人们的视觉和记忆的全部基础。震后，唐山人几乎失忆了，乃至一个美国人把他1972年途经唐山时拍的旧照送来展览时，________，很多老唐山人泣不成声。是啊，故乡是有容颜的，它需要视觉凭证，需要细节还原，哪怕只是蛛丝马迹。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"颠覆   望梅止渴","B":"摧毁   睹物思情","C":"扫荡   人非物换","D":"动摇   沧海桑田"},"answer":"B","page":143},{"id":449,"chapter":12,"num":9,"source":"2023重庆选调","type":"逻辑填空","stem":"着眼于口味或与文化结合的月饼创新是增强竞争力的手段。但盲目追求奢华包装或是借创新的名义乱搭乱售，有________之嫌，月饼创新回归食品品质、回归文化传承，才能为更加务实的市场所________o","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"哗众取宠   认可","B":"本末倒置   支持","C":"博人眼球   肯定","D":"喧宾夺主   接纳"},"answer":"D","page":144},{"id":450,"chapter":12,"num":10,"source":"2023江苏","type":"逻辑填空","stem":"不同时代的审美需求指向不同维度，在繁杂且快节奏的信息传递时代，设计需要概括、________且有视觉冲击力。像素风格的文字虽_________了繁杂的设计，但相较于普通的文字字体显得别具一格，因此能够快速抓住受众眼球。","prompt":"依次填入画横线处最恰当的一项是：","options":{"A":"直接   扬弃","B":"具体   舍弃","C":"直观   摒弃","D":"具象   放弃"},"answer":"C","page":144},{"id":451,"chapter":12,"num":11,"source":"2026事业联考","type":"逻辑填空","stem":"在横断山脉深处，一片_________百里的红色花海，如火焰般灼烧着高原的冷寂。这里是高山杜鹃的_________王国，占全球野生杜鹃种类 60%的杜鹃花在此生长，但很少有人真正到访过这里。中国华西亚高山植物园高山杜鹃的守护者们以近乎执的________，在四川都江堰的深山里，用三十年时间建起一座亚洲最大的杜鹃花基因库。","prompt":"依次填入横线处最恰当的一项是：","options":{"A":"笼罩   自由   追求","B":"铺展   奇妙   热爱","C":"遮蔽   独立   坚守","D":"绵延   隐秘   耐心"},"answer":"D","page":144},{"id":452,"chapter":12,"num":12,"source":"2024河北事业","type":"逻辑填空","stem":"评论家认为，余华在小说中表现出来的某种对待世界的态度，有时让人难以理解。该心旌摇荡的地方他偏偏平静如水，该掩鼻而过的地方他偏偏________地反复把玩。该悲悯的地方，他又偏偏________，把应该有的万千愁绪化为没心没肺的扑一笑。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"饶有兴致   忍俊不禁","B":"情有独钟   轻描淡写","C":"浓墨重彩   嬉皮笑脸","D":"翻来覆去   蜻蜓点水"},"answer":"A","page":144},{"id":453,"chapter":12,"num":13,"source":"2019 四川","type":"逻辑填空","stem":"最早对莫高窟进行保护的前辈们，大都是从事绘画、雕塑方面的艺术家，而非文物保护专家。面对破败凋的石窟、岌岌可危的壁画，他们意识到保护文物是_________的任务。当时国内还没有形成________的保护理念，而常书鸿等艺术家们从一开始就确立了原状保护的原则，这与西方的文物保护理念_________，之后的修工作都是在这一原则的指导下进行的。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"迫在眉睫   明晰   别无二致","B":"刻不容缓   先进   殊途同归","C":"举足轻重   系统   如出一辙","D":"首当其冲   成熟   不谋而合"},"answer":"A","page":145},{"id":454,"chapter":12,"num":14,"source":"2023 内蒙古事业","type":"逻辑填空","stem":"平价牙膏在线上、线下销售渠道呈现出________的市场前景。在电商平台，平价牙膏极其常见，在超市货架上却难觅踪迹。究其原因，一方面，在消费升级趋势下，市场主流产品价位已________至 10元到 30元区间；另一方面，由于平价牙膏利润微薄，负担不起线下超市等渠道的费用，部分平价牙膏生产企业经营遇到困境，有的只能________酒店洗漱用品批发市场，有的甚至走到了破产拍卖的境地。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"大相径庭   提拔   依附","B":"截然不同   抬升   屈居","C":"判若天渊   跃升   附着","D":"天差地别   跳跃   倚赖"},"answer":"B","page":145},{"id":455,"chapter":12,"num":15,"source":"2019江苏","type":"逻辑填空","stem":"中国传统文化中的“和而不同”与共享观念，________地成为“人类命运共同体”以及“民心相通”的价值观的注脚。中国向世界提出了“人类共同命运”的全球倡议，包含了对全球“普遍联结”与“价值关联”等发展特征的________概括，是中国特色全球传播的生动表述。","prompt":"依次填入画横线处最恰当的一项是","options":{"A":"恰逢其时   高度","B":"无可替代   简洁","C":"恰如其分   凝练","D":"正当其时   有力"},"answer":"C","page":145},{"id":456,"chapter":12,"num":16,"source":"2021联考","type":"逻辑填空","stem":"人体是一个庞大的共生体。人体皮肤表面、口腔、呼吸道、肠道________着大量微生物，它们的数量是人体本身细胞的数十倍，编码的基因是人体基因的100 倍。每个人的身体里都会有微生物留存的痕迹，而人体的健康会与体内的菌群________。人们将特定环境中包括微生物在内的总 DNA 称为宏基因组。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"寄生   同气连枝","B":"依附   表里相依","C":"潜伏   如影随形","D":"生存   休戚与共"},"answer":"D","page":145},{"id":457,"chapter":12,"num":17,"source":"2022 联考","type":"逻辑填空","stem":"我们用世界银行的最新数据，补充安格斯·麦迪森的历史数据，可以清晰地显示中国经济发展在数千年中的________。在公元1000至1600年之间，中国的人均收入大体上处于世界平均水平；经济规模（GDP总量）长时间保持世界首位，1820年时竟占到世界经济总量的1/3。不过，也正是在那个时刻，中国在世界经济“大分流”中落到了________的国家行列，无论是经济总量占世界的比重，还是与世界平均水平相比的相对人均收入都一路下跌，逐渐把中国推入________的境地。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"潮起潮落   滞后   一穷二白","B":"兴衰荣辱   停息   水深火热","C":"兴衰更替   停滞   积贫积弱","D":"大起大落   滞缓   万丈深渊"},"answer":"C","page":146},{"id":458,"chapter":12,"num":18,"source":"2026重庆事业","type":"逻辑填空","stem":"虽然微压力不会触发“战斗或逃跑”机制，但人体对微压力的反应与对更强烈压力的反应类似，包括心率加快、呼吸加速和皮质醇水平升高。这种类型的压力很常见，且表面上看起来________。但随着时间的推移积累起来，它会逐渐削弱我们的心理承受力，导致倦怠、焦虑和情绪疲劳。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"无伤大雅","B":"乏善可陈","C":"微不足道","D":"不值一提"},"answer":"C","page":146},{"id":459,"chapter":12,"num":19,"source":"2026河南事业","type":"逻辑填空","stem":"寒林山水题材经后来者的不断描摹，逐渐演变为传统山水画的经典母题，为历代画家所钟爱。其经数百年流变而________，不仅在于它有独特的审美价值，更在于它所蕴含的文化内涵和精神追求。这或许正是我国传统山水画与古为新、生生不息的例证。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"别出心裁","B":"标新立异","C":"独具匠心","D":"自成一格"},"answer":"D","page":146},{"id":460,"chapter":12,"num":20,"source":"2026辽宁事业","type":"逻辑填空","stem":"建设数字乡村必须根据中国乡村发展实际，深刻把握农业发展的客观规律，基于乡村信息基础设施建设，以信息化、数字化、网络化为重要载体，________，积极探索农业数字化转型和发展的新模式，_________乡村农业现代经济发展形态，打造农业发展的信息化新模式。为此，建设数字乡村，实现农业现代化需要从制度、科技和人才等方面加快改革创新，进一步________数字技术促进农业现代化发展的动能作用。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"因势利导   重塑   释放","B":"因地制宜   重构   发挥","C":"因时制宜   改造   激发","D":"因材施教   创新   挖掘"},"answer":"B","page":146},{"id":461,"chapter":12,"num":21,"source":"2026 重庆事业","type":"中心理解","stem":"头发的毛旋形成时间大约在胎儿10-16周之间，最晚不超过18周。在这一阶段，胎儿的大脑半球迅速发育、膨大，头皮因此被撑开，并在头顶后方形成一个圆顶状的张力区，而这一阶段也恰好是头皮毛囊向下生长的时期。当原始的毛囊在向头皮深处探入时，头皮恰好在像吹气球一样缓慢扩张，这样一来，头顶后方那圈张力最大的头皮上，本该垂直生长的毛囊就被扩张的头皮“带歪”了。毛囊顺着张力曲线形成了螺旋状的规律倒伏，而头发生长的方向也因此发生改变，变成了终生不会再变化的“发旋”。","prompt":"这段文字意在说明：","options":{"A":"发旋的产生机制","B":"发旋的形成时间","C":"为什么发旋终生不会变化","D":"为什么有人发底位置异常"},"answer":"A","page":147},{"id":462,"chapter":12,"num":22,"source":"2023河北事业","type":"中心理解","stem":"2021年，我国经济发达的东部地区与经济落后的西部地区 GDP及其人均收入，最低值与最高值相差近60倍。这种区域经济发展的不平衡，无疑在客观上拉开了东、西部地区居民收入的差距。除此之外，我国目前尚未完全破除的城乡二元结构体制也是影响全体人民实现共同富裕的一个客观制约因素。目前，我国城乡居民在收入以及医疗、养老、社会救助等社会福利方面仍存在一定的差距。","prompt":"这段文字意在说明：","options":{"A":"地理结构和城乡二元体制影响了我国居民收入","B":"我国现阶段地区和城乡之间居民收入存在差距","C":"制约我国全体人民实现共同富裕的客观因素","D":"发展不平衡现象是我国现阶段亟待解决的重大问题"},"answer":"C","page":147},{"id":463,"chapter":12,"num":23,"source":"2018江苏","type":"中心理解","stem":"精准扶贫不能仅仅专注个别事实，埋头解决个别问题，而不知道把个别贫困或特殊贫困同经济社会发展的宏观背景联系起来。应当明确地认识到，虽然各种特殊贫困都有特殊的因素，但特殊贫困也是在当下信息社会背景下存在的。信息化和网络化中蕴含了十分丰富的资源和能量，应当大力扶持贫困人口或贫困群体尽快了解和适应信息化与网络化的新形势，通过技术培训和典型示范，把远离信息化和网络化的贫困人口引入这个历史进程之中。","prompt":"这段文字中提取的关键词最恰当的是：","options":{"A":"精准扶贫   信息社会   技术培训","B":"精准扶贫   特殊贫困   典型示范","C":"贫困群体   宏观背景   信息社会","D":"贫困群体   特殊贫困   技术培训"},"answer":"A","page":147},{"id":464,"chapter":12,"num":24,"source":"2018吉林选调","type":"中心理解","stem":"中华五千年，诞生了数不清的灿烂文化，楚文化是其中一朵奇葩。从河姆渡文化开启的漆器历史中，楚漆器又是其中一座高峰。饰绝艳的漆器，展示出楚人精湛的造物技术和清奇的美学品格，传达出无与伦比的智慧和自由浪漫的精神。楚漆器的造型艺术和审美追求，是楚文化“巫、道、骚”三种思想相互交织的集中体现。","prompt":"这段文字意在说明：","options":{"A":"楚漆器有非凡的思想性艺术性","B":"漆文化堪称楚文化的金字塔尖","C":"楚漆器是漆文化中的典型代表","D":"楚文化究竟是怎样的一朵奇葩"},"answer":"A","page":148},{"id":465,"chapter":12,"num":25,"source":"2025天津事业","type":"细节判断","stem":"今天很多的套路艺术、模式艺术，属于跟商业有关的审美专制主义。艺术的生产、流通与消费，皆被市场和资本所主宰，看似丰富多彩，繁花似锦，实则内里贫乏，意蕴单一。任何时代都存在这个问题，但今天尤为严重。像好莱坞电影就是一种典型的被资本操控的模式，从故事情节到美学风格、明星制度、票房院线、周边产业衍生等，都有一整套系统而成熟的模式，背后是资本对艺术牢牢控制的那只“看不见的手”。中国当代艺术也有被国际资本操控的现象，如烜赫一时的中国当代艺术中某些所谓的“天王”，反反复复生产同一类型风格的绘画，缺乏了多样性、反思性与创新性，被识者讥评为完全迎合“国际资本口味”的艺术。","prompt":"以下哪项最符合文意?","options":{"A":"在商业资本的操控下，当下的艺术失去了原有内涵","B":"资本操控下的很多国内外艺术都被套路化和模式化","C":"国内艺术为迎合国际资本的喜好不惜放弃本国文化","D":"要摆脱资本操控，艺术市场必须独立、创新发展"},"answer":"B","page":148},{"id":466,"chapter":12,"num":26,"source":"2021重庆选调","type":"中心理解","stem":"迄今为止，基因治疗已经不断尝试了近三十年。其方法是将人为改变基因的细胞或是正常的基因输入人体内，用以治疗疾病。虽然这种方法并不是直接治疗出现问题的基因，但也有报道称，通过“补充”正常的基因使病情得到了快速改善。将这种基因治疗的概念再次发展延伸后，就是被称作终极治疗的基因组编辑治疗。基因组编辑是能够精确改写或替换某个特定基因的技术，通过灵活运用这一技术，就能对导致疾病的基因本身改写或替换，也就是通常所说的修复基因。这种治疗的操作方法类似口服药物或注射药物，而其得到的治疗效果与手术效果相近。","prompt":"能够从上述文字推断出的是:","options":{"A":"基因组编辑治疗与药物治疗都能在细胞中发挥作用","B":"基因组编辑治疗与手术治疗可谓旗鼓相当","C":"基因组编辑治疗的主要受益者是无法通过药物或手术治疗的先天疾病患者","D":"被称作终极治疗，意味着患者只需一次基因组编辑治疗就能彻底根治"},"answer":"B","page":149},{"id":467,"chapter":12,"num":27,"source":"2023 河北事业","type":"中心理解","stem":"现在的小学生都知道，同时发生的闪电和打雷，为什么先看到的是闪电而不是先听到雷声，不是因为我们的眼晴在前耳朵在后，而是因为光的传播速度比声音的传播速度快。虽然普通人不能，也不需要像科学家那样去理解光电现象，但无疑这是某种意义上的科学常识化的结果，科学的智慧可以丰富和深化我们的常识。科学不仅仅让我们生活在常识的世界中，也让我们有意识或无意识地生活在科学的世界中，并用科学的常识看问题。","prompt":"与这段文字的意思表述相符的是：","options":{"A":"科学的智慧更新和深化着常识","B":"科学和常识可以相互转化","C":"深刻的科学理论有时从常识出发","D":"科学的深刻与常识的平凡迥异"},"answer":"A","page":149},{"id":468,"chapter":12,"num":28,"source":"2024联考","type":"标题填入","stem":"神经科学领域已有研究揭示脑衰老的分子、细胞、器官、系统多层级多种生物学特征，它们相互依赖、彼此互为联系，共同构成脑衰老特征及其发生机制的复杂性。此外，该领域新技术和新方法的应用也使研究内容得到极大丰富与发展。在对抗衰老过程中维持脑健康及其功能，是一项挑战，运动可以通过改善脑衰老的生物学特征及生理功能，促进脑的可塑性。因此，临床实践中运动干预可作为补充策略，改善衰老人群及相关慢性疾病患者的脑健康。","prompt":"最适合做这段文字标题的是：","options":{"A":"运动促进脑生长：加强认知与记忆","B":"运动干预脑衰老：新进展与再认识","C":"运动改变脑结构：挑战性与安全性","D":"运动影响脑健康：运动疗法有前景"},"answer":"B","page":149},{"id":469,"chapter":12,"num":29,"source":"2022事业联考","type":"标题填入","stem":"数字技术最广泛的使用方式是通过从无数个数据主体那里获取数据，来得出适用于一定范围人口的行为模式。数据处理者从甲乙丙丁那里获取数据，并不是为了针对他们做些什么，而是为了找出他们的行为规律，从而针对与他们属于同一群体的一群人提供服务。在自动驾驶语境中，甲乙丙丁在多数情况下不是人而是车，数据处理者从特定车辆获得数据，训练算法，优化程序，从而使自动驾驶系统能够安全高效地行驶。这种横向关系是一种无法被吸收进现有法律关系的外部性，需要公权力介入来加以规制，以避免有损公共利益、个人权利等社会基础价值的事情发生。","prompt":"这段文字摘自某篇文章，文章标题应该是：","options":{"A":"汽车道路模拟算法研究","B":"自动驾驶中的数据法治","C":"数据安全保护的中国方案","D":"智能汽车驾驶的控制方法分析"},"answer":"B","page":150},{"id":470,"chapter":12,"num":30,"source":"2025 湖南三支","type":"中心理解","stem":"一个民族的文化是由它所属成员的个人精神世界构成的，离开了个人的精神境界，所谓民族文化不过是空洞的名词。但个人的精神又是在他所属的民族文化环境中形成的，人不能离开文化的大背景而有个人的境界，而文化总是有社会性的。每个人的精神境界之形成，既受自然条件的制约，更受文化环境的熏染和影响。","prompt":"这段文字主要介绍：","options":{"A":"个人精神与民族文化的关系","B":"制约个人精神发展的因素","C":"正确理解民族文化的前提","D":"民族文化社会性形成的因素"},"answer":"A","page":150},{"id":471,"chapter":12,"num":31,"source":"2023上海事业","type":"细节判断","stem":"如何建立以学为中心的课程质量持续提升机制？某大学从课程质量框架、评价体系、教学创新体系以及保障机制、平台建设、支持体系六个方面进行了重新定位。他们认为，现在大型企业用人更加强调沟通能力、跨文化能力、写作与管理能力等，根据反向设计原则，大学应该由此出发，确定教学目标，组织教学内容，选取教学策略，开展评价与反馈，关注课程中关键因素之间的互动关系，由此导向“以学为中心”的教学。","prompt":"下列对文中“反向设计原则”的理解，正确的是：","options":{"A":"对以教为中心的教学管理体制进行反思","B":"根据社会对人才的需求确定人才培养目标","C":"教学由“以教为中心”转向“以学为中心”","D":"根据评价及反馈来确定教学中的关键因素"},"answer":"B","page":150},{"id":472,"chapter":12,"num":32,"source":"2018 联考","type":"中心理解","stem":"文化的基本使命是立人，通过文化的教化和积淀，有效地协调人与自然、社会及自我的关系，培养健全的、充分发展的社会的人。文化对于人的塑造体现在人的自立、自强、自尊、自信等文化心态的确立以及人类社会人文氛围的形成上。在人类历史的长河中，文化以道德、宗教、艺术、教育等各种生活内容存在，并通过家庭启蒙、社会心理、社会舆论等多种手段向整个社会和民族传播和教化，使社会形成一种文化的氛围，并获得可持续发展的可能。","prompt":"这段文字主要阐述了文化具有：","options":{"A":"塑造功能","B":"濡化功能","C":"调节功能","D":"传播功能"},"answer":"B","page":151},{"id":473,"chapter":12,"num":33,"source":"2022北京","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①一方面，消费者可能不再只是消费食物本身，而是理念上的消费；另一方面，消费者可能持低价、重量不重质的消费观念\n②在这个过程中，消费者对食物的控制权、认知权会很少，这是现在一些大公司希望推动的食品体系\n③由于我国农耕方式的多样性，部分人会回归这种传统农业种植方式，或者寻求新型健康的有机农业发展方向\n④未来，我们将面临两种食物生产方式。一种朝向更工业化的生态体系，从生产加工到食品供应这一系列过程都由大公司操控\n⑤与此同时，消费者在食物上的消费水平以及消费理念也会出现两极分化现象\n⑥另一种是采用小规模、精致化的耕作方式","prompt":"","options":{"A":"④②⑥③⑤①","B":"③②⑤①④⑥","C":"④⑥⑤①③②","D":"③⑤④⑥②①"},"answer":"A","page":151},{"id":474,"chapter":12,"num":34,"source":"2023国考","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①例如位于我国四川的深地核天体物理实验室，其上覆盖的垂直岩石厚达 2400 米\n②因此，旨在直接探测暗物质的实验室通常会建于极深的地下或山里，尽最大可能屏蔽掉这些干扰\n③直接探测暗物质的方式类似于守株待兔\n④当然，这种能量波动极其微弱，而且宇宙中的各种射线同样也有机会与这个原子核来一场亲密的邂逅，从而对实验结果产生干扰\n⑤专家解释说，我们生活在一团暗物质云中，每秒钟可能有几百万甚至上千万的暗物质粒子穿过我们的身体\n⑥直接探测暗物质的方法之一，就是利用精密的仪器密切观察大量的原子核，如果足够幸运，某一时刻暗物质碰撞到某个原子核，会在原子核上留下残余能量","prompt":"","options":{"A":"⑥②①⑤③④","B":"⑥④⑤②③①","C":"③⑤⑥④②①","D":"③⑥②⑤①④"},"answer":"C","page":152},{"id":475,"chapter":12,"num":35,"source":"2019广东选调","type":"语句填空","stem":"由于基层政府普遍人手不足，承担的任务十分繁杂，很难完成上级部门制定的“创新事项”考核。一些地方为了达成“工作创新”，便忙着到处参观取经，将别人的方案“依葫芦画瓢”盲目照搬过来。殊不知，________。可以想见，这种“创新”会有什么样的结果。","prompt":"以下最适合填在划线处的是：","options":{"A":"种瓜得瓜，种豆得豆","B":"橘生淮南为橘，生于淮北则为枳","C":"一方水土养一方人，创新方案亦是如此","D":"这些形形色色的纸面创新往往并不符合实际"},"answer":"B","page":152},{"id":476,"chapter":12,"num":36,"source":"2020 国考","type":"中心理解","stem":"庞大的劳动力供给支撑了改革开放以来经济的快速发展，形成人口红利。不过，人口规模并不必然转化为人口红利，还需要基本的文化素质支撑。改革开放以来，我国将基础教育工作放到重要位置，制定了《中华人民共和国义务教育法》等法律法规，不断增加相关领域投入，从而保证了劳动力素质的提高。近年来，随着老龄化水平的不断提升，劳动力人口出现了规模缩减的迹象。为了在新的劳动力供给条件下实现经济可持续发展，需要实施职工素质建设工程，推动建设宏大的知识型、技术型、创新型劳动者大军，促进入口红利向人才红利的转变。","prompt":"这段文字主要说的是：","options":{"A":"当前形势对提高人口素质提出了新要求","B":"教育是当前实现经济可持续发展的关键","C":"当前的经济发展需要释放人口红利","D":"劳动力素质的提高需夯实基础教育"},"answer":"A","page":152},{"id":477,"chapter":12,"num":37,"source":"2018联考","type":"中心理解","stem":"作为新一代移动通信技术，5G网络主要用于满足 2020 年以后的通信需求，它使用户终端始终处于联网状态，可支持的设备远不止智能手机，而是会扩展到未来的智能家居、智能穿戴等设备。与当今 4G 网络使用率相比，5G技术提供密集而高效的网络支持，并且在使用限制上也比 4G网络大大减少，可以更方便地实现人与物的联通。","prompt":"这段文字意在表明：","options":{"A":"5G 移动通信技术比 4G 网速更快","B":"5G移动通信技术将改变人们的生活方式与生产方式","C":"5G 网络主要用于满足 2020 年以后的通信需求","D":"5G技术提供密集而高效的网络支持"},"answer":"B","page":153},{"id":478,"chapter":12,"num":38,"source":"2026重庆事业","type":"语句填空","stem":"近日，科学家发现一组保存完好的三维潜穴化石，将动物复杂行为的起源追溯到 5.5亿年前的埃迪卡拉纪。该发现________。此前，学界普遍认为当时的生物大多在海底表面留下简单爬痕或浅层水平潜穴，直到寒武纪才逐渐发展出垂直或斜向挖掘沉积物的能力。然而，科学家在属于埃迪卡拉纪的三峡地区“石板滩生物群”遗迹中发现，化石具有类型多样的三维复杂潜穴系统遗迹，首次展现出动物向沉积物内部“纵向探索”的能力。这些精心构造的地下通道网络，表明它们不再是海底的“表面过客”，而是能够构建三维栖居空间的生态系统“工程师”。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"提供了三维潜穴化石的完整证据链","B":"改变了学界对早期生命演化的认识","C":"证明了三峡地区是生命起源地之一","D":"展现了埃迪卡拉纪生态环境复杂性"},"answer":"B","page":153},{"id":479,"chapter":12,"num":39,"source":"2020 安徽定向","type":"接语选择","stem":"师生之间的对话应是教育场域中最普遍存在的互动方式，教师和学生作为两个具有独立人格的精神个体，都带有自身独一无二的经验、先见和背景，对话意味着让他们暂时走进一个共同的生活世界，体验对方的思想、情感与智慧，形成不同视域的交融。由于师生交流的终极意义是对学生认知边界的建构，我们把这种师生间的对话称为建构性对话。这种对话可以帮助学生建构知识体系，也可以促进教师专业发展，让教育的意义和价值在对话的世界中延伸。","prompt":"这段文字接下来最可能讲述的是：","options":{"A":"教育场域中各种常见的互动方式","B":"学生认知边界建构的意义和方法","C":"教师和学生独立人格建构的价值","D":"师生建构性对话成立的前提条件"},"answer":"D","page":154},{"id":480,"chapter":12,"num":40,"source":"2024甘肃事业","type":"接语选择","stem":"当前，医美行业乱象频出，在医院引流环节，诸如制造“容貌焦虑”、夸大医美效果，在咨询问诊环节诱导增加项目、淡化手术风险等引发大量消费纠纷，有的还酿成医疗事故。中消协数据显示，从 2015 年到 2020 年，全国消协组织每年收到的医美行业投诉从 483 件增长到7233件，增长近14倍，其中，夸大功效、制造焦虑、免费体验诱导消费等是突出问题。","prompt":"文段接下来最可能讲述的是：","options":{"A":"医美行业乱象的起因","B":"对消费纠纷的解决措施","C":"行业投诉倍增的危害","D":"如何整治医美行业乱象"},"answer":"D","page":154},{"id":481,"chapter":13,"num":1,"source":"2026辽宁事业","type":"逻辑填空","stem":"“快”的前提应是“稳”与“好”。稳了，快才能持续，才能出好的效果。因此，快必须遵循发展规律、恪守科学准则。倘若脱离实际，一味求快、急于求成，非但难以达成目标，反而可能________，轻则事倍功半，重则栽跟头、吃苦头。曾有地方为追求经济增速，盲目上马项目。有些企业为抢占市场先机，不惜偷工减料。这般________的“快”，跑得越急，离初心便越远。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"事与愿违   急如星火","B":"欲速不达   急功近利","C":"适得其反   舍本逐末","D":"得不偿失   好大喜功"},"answer":"C","page":155},{"id":482,"chapter":13,"num":2,"source":"2023联考","type":"逻辑填空","stem":"年度热词________大事小情，不仅反映国家大事、________时代主旋律,还有对老百姓日常生活的深切________，展现了过去一年的社会变迁和生活万象。而透过“内卷”“躺平”“鸡娃”“双减”“干饭人”等热词，我们还可________当下独特的社会景观。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"描绘   切合   感触   了解","B":"体现   把握   体验   感受","C":"勾勒   蕴含   体察   窥见","D":"叙写   贴近   关怀   透视"},"answer":"C","page":155},{"id":483,"chapter":13,"num":3,"source":"2024联考","type":"逻辑填空","stem":"载人登月除了需要研制新一代载人运载火箭，还需要研制新一代载人飞船。我国神舟飞船的可靠性和稳定性________，但对于载人登月来说，其服务舱提供的机动变轨能力较弱等因素，使得神舟飞船载人登月________，新一代载人飞船采用更简单的返回舱加服务舱两舱构型，适应月球探测、火星探测等多种类型的载人飞行任务，是________的“多用途载人飞船”。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"独领风骚   鞭长莫及   从心所欲","B":"举世无双   望洋兴叹   当之无愧","C":"交口称赞   爱莫能助   久经考验","D":"毋庸置疑   力不从心   名副其实"},"answer":"D","page":155},{"id":484,"chapter":13,"num":4,"source":"2019联考","type":"逻辑填空","stem":"所谓幼儿园“小学化”，指的是在幼儿园阶段提前教汉语拼音、识字、计算、英语等小学课程内容。这种现象近年来非常普遍，________，甚至传导至幼前阶段，也就是还没上幼儿园就开始教这些知识了。更有甚者，小孩还在幼儿园阶段就在上奥数班，至于学拼音、英语，更是________。上海的家长们为了给孩子报某个毫无资质的学前班，挤破了头不说，排队报名的黄牛号都涨到 5000 元，这事情也一度闹得________0","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"靡然成风   层见叠出   沸沸扬扬","B":"蔚然成风   层见叠出   沸反盈天","C":"靡然成风   司空见惯   沸沸扬扬","D":"蔚然成风   司空见惯   沸反盈天"},"answer":"C","page":155},{"id":485,"chapter":13,"num":5,"source":"2026天津事业","type":"逻辑填空","stem":"为了避免出现非遗继承人________的情况，当地修改了区级非遗传承人管理办法，将原本的从业资格 20 年改到了10 年，以此鼓励年轻人继续走好传承的道路。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"供不应求","B":"难以为继","C":"青黄不接","D":"捉襟见肘"},"answer":"C","page":156},{"id":486,"chapter":13,"num":6,"source":"2020广东","type":"逻辑填空","stem":"近几年，脱贫攻坚取得决定性成就的一个重要原因，就是通过派驻工作组、第一书记等驻村帮扶力量，为贫困农村带去了________的领导、________的思路、________的资源保障，破解了农村发展的人才之困。","prompt":"依次填入横线部分最恰当的一项是：","options":{"A":"强劲   开明   充分","B":"强硬   明晰   丰富","C":"坚强   开阔   有力","D":"坚毅   明确   充沛"},"answer":"C","page":156},{"id":487,"chapter":13,"num":7,"source":"2021联考","type":"逻辑填空","stem":"近年来在许多地方，“校闹”频发让学校疲于招架，让教师________：学生在校园遭遇安全事故要闹，对老师安排座位不满意要闹，孩子被罚抄课文还要闹··.：“校闹”现象干扰了正常教学秩序，破坏了良好教育生态，治理“校闹”，目前已有相关规定，却收效不大，需要进一步细化落实。","prompt":"填入画横线部分最恰当的一项是：","opt
