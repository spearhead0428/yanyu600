把事物的本质揭示出来，这是“源于生活，高于生活”的艺术创作原则。","prompt":"依次填入画横线处最恰当的一项是：","options":{"A":"显而易见   体验","B":"不言自明   把握","C":"有目共睹   认知","D":"不言而喻   感悟"},"answer":"D","page":70},{"id":220,"chapter":6,"num":20,"source":"2022广东","type":"逻辑填空","stem":"党的百年历史，就是党与群众水乳交融、________的历史。一条扁担、一张借据、半条棉被就是党与人民血肉相连、情深似海的________。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"唇齿相依   印记","B":"相濡以沫   记忆","C":"休戚与共   见证","D":"众志成城   证明"},"answer":"C","page":70},{"id":221,"chapter":6,"num":21,"source":"2019江西法检","type":"中心理解","stem":"当教育已经从传授知识、发明工具、认识和改造客观世界，拓展到人脑自身如何认知、如何再塑造的新阶段，人工智能对教育的挑战就不单是一个学科、一个专业的问题，而是本世纪全新、全方位、持久过程的挑战。本科生的智能课程体系设置和新形态教材的制定与开发是一项刻不容缓的巨大工程。目前人类还处在从信息时代走向智能时代的过渡区，各大学自主设置专业，为我国智能教育的课程和教材优化创造了百花齐放的勃勃生机，还要共同探索中国智能产业人才的培养体系、试验平台、成果转化方法等。","prompt":"这段文字意在强调：","options":{"A":"人工智能对传统教育有巨大冲击","B":"普及智能教育是时代的呼唤","C":"大学智能教育刻不容缓","D":"人工智能教育体系亟需完善"},"answer":"C","page":70},{"id":222,"chapter":6,"num":22,"source":"2018云南选调","type":"中心理解","stem":"虽然翻拍要比重新创作或“另起炉灶”显得容易些，但也不能因为翻拍就忽略了剧本的质量，胡编乱造更是行不通。创作是第一要务，是翻拍成败的基础，翻拍要是失败了，失掉的不仅是观众，还会带来对原来成功形象的瓦解和品牌贬值。","prompt":"上述文字，意在强调翻拍：","options":{"A":"并不一定比“新拍”容易","B":"不能胡编乱造，颠覆经典","C":"也需要进一步挖掘和创新","D":"如果失败会反噬原有口碑"},"answer":"C","page":71},{"id":223,"chapter":6,"num":23,"source":"2023安徽三支","type":"中心理解","stem":"20世纪 90 年代经济转机的主要模式，一种是激进式、休克式改革方案，即华盛顿共识，其核心是自由化、市场化、私有化以及财政政策稳定化。在一系列华盛顿共识实验失败后，世界的各方聚焦于经济高速增长的中国，与中欧、东欧的激进式改革不同，中国在坚持社会主义制度的前提下进行经济体制改革。中国的转轨方案是一种先易后难的渐进式增量改革，依据改革阻力越小越优先的原则安排各项经济改革的次序，从试点到推广、从农村到城市、从体制外到体制内，巩固了改革成果，降低了改革带来的不确定性。此外，中国的渐进式增量改革强化了改革在转轨中的作用，特别是地方政府推动了自下而上的制度创新。\n这段文字意在强调：免费学习资料库加微信：Sasm19","prompt":"","options":{"A":"经济转轨的两种模式的差异","B":"中国经济体制改革的制度基础","C":"中国经济高速增长引发了全球关注","D":"中国渐进式增量改革的实施原则"},"answer":"D","page":71},{"id":224,"chapter":6,"num":24,"source":"2021事业联考","type":"中心理解","stem":"谈及中国的历史，单说“魏”或“晋”时，似无出奇之处，但如果把“魏”和“晋”连在一起说出来，一个光照千古的神奇概念就骤然出现：魏晋风度。与汉朝的敦实厚重、三国的慷慨激荡、唐朝的盛大开放、宋朝的清丽婉约不同，魏晋人物以率性不羁、旷达玄远著称。这是当时整个社会的精神时尚和审美追求，魏晋也因此而成为中国历史上空前绝后和争议最大的时代。","prompt":"这是一篇文章的开头部分，据此推测，这篇文章谈论的重点应该是：","options":{"A":"魏晋时期的社会环境","B":"魏晋时期的文学成就","C":"魏晋人物及其精神风貌","D":"魏晋风度对后世的影响"},"answer":"C","page":71},{"id":225,"chapter":6,"num":25,"source":"2019联考","type":"中心理解","stem":"从人口的空间布局看，城镇化是农村人口向城镇转移，是农民向市民的转变。农民向市民的转变过程，是人的素质的现代化过程。而人的素质的现代化离不开接受现代化的教育。人的教育的现代化是城镇化的基础和支撑。城镇化还意味着人们的就业和生产从农业领域向工业和服务业的转移。人的生产方式的现代化，是城镇化的本质特征，更是人的现代化的本质体现。而支撑人的生产方式现代化的基础则是现代职业教育的普及。","prompt":"这段文字意在强调：","options":{"A":"城镇化是人的生产方式的现代化","B":"城镇化是人的素质教育的现代化","C":"城镇化时代的农民需要职业教育","D":"城镇化是进城农民身份的市民化"},"answer":"B","page":72},{"id":226,"chapter":6,"num":26,"source":"2022事业联考","type":"细节判断","stem":"鲁宣公三年，楚国的军队直抵洛阳周天子脚下。楚王就派人去打听，象征天子权威的九鼎到底有多重，由此留下来一个成语—问鼎中原。结果周天子派王孙满去跟楚庄王讲了一通大道理，说：“周德虽衰，天命未改，鼎之轻重，未可问也。”王孙满话说得漂亮。并且仿佛也可以看见，《左传》的作者记录这种情节的时候，也是写得眉飞色舞的。","prompt":"根据文意推断，下列理解正确的是：","options":{"A":"周天子认为周王室依然强大","B":"该文段作者认为楚国难以撼动周天子权威","C":"王孙满认为楚庄王不应当问鼎之轻重","D":"《左传》认为王孙满在说漂亮的大道理"},"answer":"C","page":72},{"id":227,"chapter":6,"num":27,"source":"2025 联考","type":"中心理解","stem":"垂花门是中国传统合院式建筑的内部之门。垂花门有独立柱担梁式、一殿一卷式、单卷棚式、廊罩式等多种。作为内宅与前院的分界线和重要通道，垂花门不仅保证了内宅的隐蔽性和私密性，同时丰富了院落的空间层次。垂花门的历史有两千余年，在漫长的发展历程中，它不仅折射出宅主的审美品位与文化修养，也展示出工匠们精湛的技艺。其中，雕刻和彩绘在垂花门的装饰中占据着重要地位，雕刻包括砖雕、石雕、木雕等，彩绘常见于木质构件之上，不仅可以美化建筑，还能起到保护构件不受风雨侵蚀的作用。","prompt":"这段文字没有提到垂花门的：","options":{"A":"不同形制","B":"重要构件","C":"建筑功能","D":"装饰工艺"},"answer":"B","page":72},{"id":228,"chapter":6,"num":28,"source":"2024江苏","type":"标题填入","stem":"我们常说，雨水会将空气中的污染物、颗粒物冲刷下来，变成近似污水的“初期雨水”。其实，只有降雨达到天气预报所说的“中雨”，才有这种效果。如果只是微微细雨,不足以将颗粒物沉降。空气湿度增大,颗粒物尤其细颗粒物的吸湿性会增长,就是说 PM2.5遇到湿气会膨胀，导致浓度不降反升。即使在强降雨时，前两个小时PM2.5 浓度也有可能出现不降反升的情况。另外，湿度大的时候，近地面大气一般比较稳定，扩散能力弱，许多污染物易溶于水并发生化学反应，产生新的污染物，导致空气更浑浊。","prompt":"最适合做这段文字标题的是：","options":{"A":"雨后的空气质量","B":"当 PM2.5 遇到雨水","C":"雨后空气就会清新吗","D":"为何雨后空气质量会变差"},"answer":"C","page":73},{"id":229,"chapter":6,"num":29,"source":"2022 事业联考","type":"标题填入","stem":"气候变化正在使海洋温度不断升高，这破坏了珊瑚及其共生光合藻类之间的关系，并导致珊瑚白化甚至死亡。为了验证改善微生物群是否可帮助增强珊瑚对高温的耐受性，研究人员进行了实验，将从珊瑚中分离出来的有益菌株相关混合物施用到珊瑚上，再改变珊瑚环境温度。结果显示，施用和未施用益生菌的珊瑚在峰值温度下都发生了白化。但当温度降低后，益生菌改善了珊瑚在热应激事件后的反应和恢复能力；对其基因的研究发现，恢复期凋亡和细胞重建相关基因表达降低，热应激保护基因表达增加。","prompt":"最适合做这段文字标题的是：","options":{"A":"气候变暖加快了珊瑚白化","B":"珊瑚为存活更换共生藻类","C":"基因研究可延缓珊瑚白化","D":"益生菌助力珊瑚高温存活"},"answer":"D","page":73},{"id":230,"chapter":6,"num":30,"source":"2022辽宁事业","type":"中心理解","stem":"失去对自然声音感悟的人是最可悲的，当有人说“风景美得像一幅画”时，境界便低了，因为画是静的，自然的风景是活的、动的；而除了目视，自然还提供了各种声音，这种双重的组合才使自然超拔出人所能创造的境界。世上有无数艺术家，全是从自然中吸取灵感，但再好的艺术家，总无法完全捕捉自然的魂魄，因为自然是有声音有画面的，还是活的，时刻都在变化的。","prompt":"这段文字意在说明：","options":{"A":"欣赏自然需要视觉、听觉的全方位体验","B":"大自然为艺术家提供了取之不尽的材料","C":"自然风景超出了人所能创造的境界","D":"取法自然才能创造出杰出的作品"},"answer":"A","page":73},{"id":231,"chapter":6,"num":31,"source":"2022四川","type":"中心理解","stem":"“数字乡村”战略是“数字中国”建设的重要方面，发展数字农业、推进农业数字化对于做好“三农”工作有着重要意义。由于城乡差距，我国农村的网络基础设施和网民数量均落后于城市，但是在“十三五”期间，尤其是2019年、2020年，农村网民规模和互联网普及率出现了非常显著的增长，远高于全国网民规模和互联网普及率的平均增速。这表明，我国城乡间互联网发展不均衡的现象已得到改善。","prompt":"这段文字最后一句中的“这”指的是：","options":{"A":"农村网络基础设施和网民数量均落后于城市","B":"我国城乡间互联网发展不均衡已经得到改善","C":"数字技术已持续渗透到社会经济的各个领域","D":"农村网民规模和互联网普及率获得大幅提升"},"answer":"D","page":74},{"id":232,"chapter":6,"num":32,"source":"2023辽宁","type":"中心理解","stem":"小时候，在湘江边放牛，常常看到蓝天白云之间，一行行大雁从头顶上匆匆飞过。有人告诉我，相传，大雁飞到衡阳，便不再南飞，“北雁南飞，至此歇翅停回”。后来，我渐渐知道，优越的地理位置、湿润的气候，是衡阳吸引大雁“歇翅停回”的天然优势。因此，衡阳又雅称“雁城”。","prompt":"这段文字描写的“主角”是：","options":{"A":"作者","B":"大雁","C":"衡阳","D":"湘江"},"answer":"C","page":74},{"id":233,"chapter":6,"num":33,"source":"2024事业联考","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①1884年，有科学家将硝化纤维溶解在乙醚和乙醇里，加入适量安定剂，制成了世界上第一种无烟火药\n②由于硝化纤维化学性质不稳定，多次引发爆炸事故，无烟火药的研制一直没有进展\n③试验证明，无烟火药的爆炸威力比黑火药大很多，可增加弹丸的射程且烟雾少，是枪炮理想的发射药\n④十九世纪硝化纤维的发现，引起许多人的注意，大家纷纷参与到无烟火药的研制中\n⑤无烟火药诞生的消息传遍了许多国家，各国开始纷纷启动无烟火药枪弹及新型枪械的研发工作\n⑥在当时，这种无烟火药只含一种高分子爆炸基剂，因此也称为“单基火药”","prompt":"","options":{"A":"①③⑤②④⑥","B":"①⑥②③④⑤","C":"④②①⑥③⑤","D":"④⑥②①⑤③"},"answer":"C","page":74},{"id":234,"chapter":6,"num":34,"source":"2025事业联考","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①但整体而言，这些定向能武器的技术成熟度仍不够高，例如激光武器功率偏低，对无人机持续照射数秒才能将其击落，难以应对大批无人机来袭\n②目前许多国家都在研制和装备新一代精确制导火箭弹，希望用这种成本相对较低的精确制导武器拦截飞行路线固定的无人机\n③其中枪支和速射炮射程与精度有限，对无人机的毁伤效果不好\n④激光和高功率微波武器发射时只消耗电力，成本最低，因此也受到各国青睐\n⑤防空导弹虽然命中率高，但成本过于昂贵，价格动辄数万甚至数十万美元，远远超过多旋翼无人机的价格\n⑥针对无人机的硬杀伤手段种类较多，从传统的枪支或防空速射炮，到防空导弹和精确制导火箭弹，再到激光或高功率微波等定向能武器，大都已经投入实战或进入测试阶段","prompt":"","options":{"A":"②④③①⑥⑤","B":"④②⑥③①⑤","C":"⑤③②④⑥①","D":"⑥③⑤②④①"},"answer":"D","page":75},{"id":235,"chapter":6,"num":35,"source":"2025河北三支","type":"逻辑填空","stem":"游泳素有“运动之王”的美称，这主要得益于它不仅能避免常规运动可能会对人体关节造成的损伤，而且________，是一项老少皆宜的理想运动。它能有效调动全身肌肉参与运动，无所谓发力、不发力肌群。它还能缓解压力，舒缓情绪。","prompt":"填入画横线处最恰当的一项是：","options":{"A":"有益于关节的保护","B":"能让紧张的神经松弛","C":"给身体带来诸多好处","D":"能让肌肉得到放松"},"answer":"C","page":75},{"id":236,"chapter":6,"num":36,"source":"2026 联考","type":"中心理解","stem":"科学启蒙是需要良器的。市面上能买到的儿童科学实验套装琳琅满目，但多数停留在“好玩”层面，对科学原理的通俗讲解相对较少。以科普、百科为旗号的立体书、翻翻书、洞洞书，也多停留在现象描绘、现实陈述层面。诸如悬索桥如何受力、电能如何产生、火箭为什么能冲出地球之类的“原理之问”，也有童书涉及，但数量占比就少得多了。科学启蒙光“好玩”还不够，还要“能懂”“好玩”可以更好激发科学好奇心，“能懂”则可以更好满足科学求知欲。好奇心爆棚、求知欲强烈，青少年才能从小打牢科学素养的根基。","prompt":"这段文字意在强调：","options":{"A":"科普读物的质量良莠不齐","B":"科普图书应注重原理讲解","C":"科学启蒙需要兼顾‘能懂”","D":"“好玩”激发科学好奇心"},"answer":"C","page":75},{"id":237,"chapter":6,"num":37,"source":"2022 国考","type":"中心理解","stem":"都察院是明代设立的重要监察机构，为风宪耳目之官，总负正风肃纪之责。明代对其所属监察御史的选用，要求明显不同于一般的官吏。除了普遍性的清正廉洁这一操守要求外，还十分看重其“介直”“骨”的个性。在任职资格上，明英宗正统年间，开始打破了新仕进士不得除授御史之职的规定。明中叶后，监察御史选用“多不得人”，管理御史的“宪规”“条约”成为空文，御史不断参与到朝廷的政争之中，使明代官僚体系的有效监督、净化能力不断削弱，这是明代政治日趋腐朽、不断走向衰败的重要原因。","prompt":"这是一篇论文的摘要，论文中最不可能论述哪项内容：","options":{"A":"监察御史选用资历的演化","B":"明代监察法规在后世的延续及价值分析","C":"监察成效对明代政治走向的影响","D":"都察院的设置及监察御史品秩的演化"},"answer":"B","page":76},{"id":238,"chapter":6,"num":38,"source":"2025 国考","type":"语句填空","stem":"与传统业态相比，新业态顺应多元化、多样化、个性化的产品或服务需求，实现产业与互联网、大数据、云计算、人工智能等新技术深度融合，通过采用新技术和新模式，为市场引入新元素、丰富新场景，促进新岗位、新就业形态不断涌现，创造更多就业机会。新业态既提供新的高技能岗位，扩大对高水平劳动力的需求，又通过带动传统产业转型升级，实现对传统职业和岗位的再造，释放新的就业需求。当前，我国有超2亿灵活就业人员，新就业形态________0","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"已经成为吸纳就业的重要“蓄水池”","B":"有助于促进区域间劳动资源的互补与共享","C":"为高技能劳动力流动提供充足机会","D":"是有效缓解重点群体就业压力的“缓冲器”"},"answer":"A","page":76},{"id":239,"chapter":6,"num":39,"source":"2026 事业联考","type":"中心理解","stem":"陕北说书是流行于陕北地区的口传艺术形式，由民间艺人手持三弦或琵琶，腿缚甩板独自坐唱，或者多人搭档表演，分布区域与陕北晋语方言区大致重合。从现存文献看，陕北说书最早的形式可追溯至宋代。随着古代说唱文学的分化和地方种类的出现，陕北说书在清初已发展成熟。20世纪 40 年代，著名陕北说书艺术家韩起祥通过“改造说书”，把陕北说书带上了延安文艺的舞台，掀开了陕北说书的崭新一页。陕北说书有着丰厚的语言文化内涵，既传承了明清说唱文学的传统，又彰显出鲜明的方言特色，蕴藏着丰富的地域文化，具有重要的语言文化价值。","prompt":"这段文字是一篇文章的引言，该文章最可能介绍的是:","options":{"A":"明清说唱文学的传统流派","B":"陕北说书的历史发展脉络","C":"陕北说书的语言文化特点","D":"传统口传艺术的活化利用"},"answer":"C","page":77},{"id":240,"chapter":6,"num":40,"source":"2022四川","type":"接语选择","stem":"乌鸦与人类在行为上有许多有趣的共同点：都喜欢玩耍，而且经常使用工具。我们知道，人类幼儿通过玩要来学习。当瞒学步的孩童推倒一堆积木时，他们的大脑里就在形成构建和测量物体的能力。问题在于，乌鸦的玩要是否也是为了同样的目的？在此前的研究中，科学家记录了野生新喀鸦使用各种各样工具的行为，比如它们会用有钩的木棍或特别准备的叶片，将躲在树干缝隙中的昆虫拖出来。然而，科学家也经常观察到乌鸦摆弄着各种古怪的东西，似乎只是单纯地因为好玩，而没有明确的目的。","prompt":"这段文字接下来最可能讲的是：","options":{"A":"关于人类玩耍的社会学解释","B":"乌鸦有哪些使用工具的具体行为","C":"关于乌鸦摆弄东西目的的最新研究","D":"乌鸦与人类在工具使用上的不同特点"},"answer":"C","page":77},{"id":241,"chapter":7,"num":1,"source":"2025联考","type":"逻辑填空","stem":"中消协发布的《2023全国消协组织受理投诉情况分析》显示，“十大消费投诉热点”的第一条就是“电商平台预售模式亟待规范”。作为一种销售方式，机关重重的预售，更像是一种请君人瓮式的把戏。商家沉酒于此，与平台_________不无关系。购物节不能沦为商家过“节”，消费者渡“劫”。“双11”不仅是一种营销活动，更是一种品牌建设，如果失去了消费者的信任，所谓购物节也就________0","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"迁就   日暮途穷","B":"纵容   难以为继","C":"推   步履维艰","D":"放任   后继无人"},"answer":"B","page":78},{"id":242,"chapter":7,"num":2,"source":"2023重庆三支","type":"逻辑填空","stem":"近年来，应用软件产业发展迅猛，为广大消费者提供了丰富多彩的互联网应用，便利了人民群众的生产生活。与此同时，预置应用软件过多且无法卸载等新情况，也令人________。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"不胜其烦","B":"不厌其烦","C":"聚敛无厌","D":"心力憔悴"},"answer":"A","page":78},{"id":243,"chapter":7,"num":3,"source":"2024甘肃事业","type":"逻辑填空","stem":"近年来，历史题材纪录片在注重大历史的同时，在叙述观上_________“微观视角切入叙述”，内容上以小见大，更多关注时代洪流中个人的命运起伏，创作者不是________地表达历史学界对该人物的各种评价，而是通过讲述人物经历的具体小事以及当时的所思所想，________起或豪迈或洒脱或执着的鲜明人物形象，帮助观众从人物的命运和言行中拼凑出对宏观历史的大致印象。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"凸显   照本宣科   支撑","B":"迎合   一成不变   树立","C":"呈现   生搬硬套   承载","D":"遵循   按部就班   构建"},"answer":"A","page":78},{"id":244,"chapter":7,"num":4,"source":"2022贵州事业","type":"逻辑填空","stem":"不同文化背景的人，由于观念和生活经验的________，在交往过程中常常存在信任和理解的________，因此跨文化传播是非常复杂且动态多变的活动，它要求人们在积极的活动中,通过象征性的行为,互通内心的境况,以达到彼此在行为和观念上的________0","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"差别   隔阎   共情","B":"差异   障碍   理解","C":"区别   阻隔   同化","D":"不同   制约   认同"},"answer":"B","page":78},{"id":245,"chapter":7,"num":5,"source":"2021国考","type":"逻辑填空","stem":"在芯片、操作系统等很多方面，我们需要下定决心，攻坚克难，自力更生。因为一旦核心技术受制于人，就有被人“________”的威胁。所以，我们要有“宝剑锋从磨砺出，梅花香自苦寒来”的定力，逐渐形成一批拥有自主知识产权的核心技术和产业，把发展的主动权牢牢掌握在自己手中。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"过河拆桥","B":"落井下石","C":"一网打尽","D":"釜底抽薪"},"answer":"D","page":79},{"id":246,"chapter":7,"num":6,"source":"2021江苏","type":"逻辑填空","stem":"购物车升级的背后是新消费的崛起。新消费的外生动力在于技术创新、业态升级和服务体验。当前消费者的消费需求不断升级，________生产端提升供给水平。需求和供给间已不再是________，而是通过互联网与制造业的深度融合，依托数字经济的发展，架起线上购物与实体生产间的桥梁，生产、流通、分配、消费各个环节的效率和服务质量都在不断提升。","prompt":"依次填入画横线处最恰当的一项是：","options":{"A":"促进   截然对立","B":"迫使   楚河汉界","C":"倒逼   泾渭分明","D":"激发   各自为政"},"answer":"C","page":79},{"id":247,"chapter":7,"num":7,"source":"2019 四川选调","type":"逻辑填空","stem":"如果初创企业一味盲目地追求产品开发和获取早期客户的速度，而忽略了产品质量的话，到时往往会________。虽然表面看来产品是出来了，但是支撑产品的代码或硬件可能会变得难以维护和扩展，就算公司短期内看上去获得了成功，但产品里面的技术债务却积少成多，隐患也随之倍增，到时可能就会________0","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"过犹不及   功亏一","B":"事与愿违   积重难返","C":"欲速不达   作茧自缚","D":"得不偿失   于事无补"},"answer":"B","page":79},{"id":248,"chapter":7,"num":8,"source":"2021事业联考","type":"逻辑填空","stem":"在历史上，“建小康”与“求大同”观念是如影随形、________的。中国思想家们既画了大同的终极理想，给人们勾勒了一幅“理想国”的圆满图景，也不忘规划小康的________目标，描绘可望可及的美好生活。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"相辅相成   现实","B":"并行不悖   远景","C":"如出一辙   发展","D":"不谋而合   切近"},"answer":"A","page":79},{"id":249,"chapter":7,"num":9,"source":"2022 联考","type":"逻辑填空","stem":"作为一门美丽的学问，宇宙微波背景辐射物理在过去的半个世纪里毫无疑问地向世人展现了她的魅力。“天生丽质难自弃”—作为未来几十年内CMB 研究的两大主要科学目标“原初引力波探测”和“CMB 透镜测量”，必定会再次用她纯净的美________人们的心灵。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"震撼","B":"涤荡","C":"震动","D":"激荡"},"answer":"A","page":80},{"id":250,"chapter":7,"num":10,"source":"2024山东","type":"逻辑填空","stem":"药品安全事关广大人民群众身体健康和生命安全。不筑牢药品的安全底线，安全根基不稳，再多的创新也是________。持续强化药品全生命周期质量监管，落实药品安全“四个最严”要求，才能有效________药品安全形势的总体稳定。药品安全是设计出来的，也是生产出来的，更是监管出来的。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"纸上谈兵   保障","B":"徒劳无功   提升","C":"空中楼阁   维护","D":"本末倒置   控制"},"answer":"C","page":80},{"id":251,"chapter":7,"num":11,"source":"2022 事业联考","type":"逻辑填空","stem":"影视营销，说到底要靠精彩的内容，以及对内容的准确解读。如果_________博眼球、抢关注、争流量，或者刻意触碰观众情感燃点，过度煽情，或许也能取得投机式的成功，却必然________，而且可能损伤影视发展生态。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"一味   无以为继","B":"肆意   雪上加霜","C":"妄想   得不偿失","D":"依赖   不尽人意"},"answer":"A","page":80},{"id":252,"chapter":7,"num":12,"source":"2025 四川三支","type":"逻辑填空","stem":"“电力指纹”只需替换传统的空气开关和插座，即能够在火灾发生前及时准确发现，并________危险用电设备、危险用电行为、危险电气事件，做到了一秒钟识别设备类型和隐患、一小时识别设备参数、一周识别用电行为。该技术在提升社会安全用电水平的同时，还能够自动识别并________设备的可调节能力，让每个家庭成为虚拟电厂，与电网深度互动，让促进新能源________成为可能。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"防备   变更   落地","B":"集成   分辨   领航","C":"控制   聚合   消纳","D":"提防   聚集   应用"},"answer":"C","page":80},{"id":253,"chapter":7,"num":13,"source":"2019 河南选调","type":"逻辑填空","stem":"应该如何正确开展批评和自我批评呢？要无私无畏，敢于揭露问题。少数党员领导干部由于“老好人思想”作怪，在专题民主生活会上，往往选择对上级放“礼炮”，对同级放“哑炮”，对自己放“空炮”。三言两语听上去________，实际上________、毫无价值，不但不能推动工作、维护党内团结，而且还会放任同志身上错误的滋长。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"春风化雨   无关痛痒","B":"和颜悦色   扬汤止沸","C":"和风细雨   隔靴搔痒","D":"洋洋盈耳   无足轻重"},"answer":"C","page":81},{"id":254,"chapter":7,"num":14,"source":"2024事业联考","type":"逻辑填空","stem":"在信息技术和智能技术使战争变得越来越透明的同时，我们必须看到机器与人有难以逾越的智力鸿沟，一旦涉及客观世界丰富的意义，涉及抽象的概念性事实，机器将变得“________”，再强的“算法”也有不能逾越的“可计算”边界。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"如履薄冰","B":"一筹莫展","C":"捉襟见肘","D":"百无一是"},"answer":"B","page":81},{"id":255,"chapter":7,"num":15,"source":"2025联考","type":"逻辑填空","stem":"我们要看到，如果对诱骗直播打赏不加遏制，一些主播会生出效仿之心，加剧网络直播的乱象，影响行业的长远发展。而被害人巨额打赏背后往往伴随网贷，个人生活很可能陷入________。因此，对诱骗直播打赏，需要认真思索刑法介入的可能性。唯其如此，直播行业的发展才可能________0","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"万劫不复   行稳致远","B":"债台高筑   繁荣昌盛","C":"左支右出   正本清源","D":"困境重重   拨乱反正"},"answer":"A","page":81},{"id":256,"chapter":7,"num":16,"source":"2021联考","type":"逻辑填空","stem":"无论是体长、体重或是综合进行考量，蓝鲸都无愧于现存最“大”的生物体。而生活在广的大洋中，蓝鲸不需要像陆生动物那样费力地支撑起自己沉重的身躯，可以自在地________。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"巡游","B":"洄游","C":"巡回","D":"逸巡"},"answer":"A","page":81},{"id":257,"chapter":7,"num":17,"source":"2019辽宁","type":"逻辑填空","stem":"包光潜在《温暖的橘子》中提到，那是十年前的秋天，我和朋友到西北旅游观光。由于路途遥远，精神________。大约过了几个隧道之后，豁然开朗，两边的山坡出现大片的橘林。刚刚成熟的橘子，在一片翠绿中________地泛着橘红色的光彩。到了一个小站，火车尚未停稳，月台上已经到处都是奔跑的橘子。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"萎靡不振   清晰可见","B":"萎靡不振   若隐若现","C":"一蹶不振   隐约可见","D":"一蹶不振   时隐时现"},"answer":"B","page":82},{"id":258,"chapter":7,"num":18,"source":"2019江西法检","type":"逻辑填空","stem":"日复一日，年复一年，杨树默默地孤守着一块养育自己的故土，高昂着不屈的头颅，坚挺着伟岸的身躯，________着沙漠瀚海，狂风恶浪。神情是那么的庄重威严，姿态是那么的动人浪漫，生命是那么的强大旺盛。真令人望而生敬，________0","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"雄视   叹为观止","B":"傲视   拍案叫绝","C":"凝视   望而生畏","D":"注视   高山仰止"},"answer":"A","page":82},{"id":259,"chapter":7,"num":19,"source":"2026山东事业","type":"逻辑填空","stem":"基层工作千头万绪，善用巧劲实现“四两拨千斤”，首先需要________、找准支点,善于抓“牛鼻子”，从而打开工作新局面。只有精准抓住重点和发力点,才能________，以重点突破带动全局发展。免费学习资料库加微信：Sasm19","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"切中肯繁   纲举目张","B":"实事求是   驾轻就熟","C":"见微知著   以逸待劳","D":"深知灼见   事半功倍"},"answer":"A","page":82},{"id":260,"chapter":7,"num":20,"source":"2026联考","type":"逻辑填空","stem":"党的纪律明确了不能触碰的底线和边界，莫说“五十步”，万钧之下，雷池禁区一步也不可________。以“错更小”来开脱，既是对法纪缺乏敬畏心的表现，也是对反腐败“无禁区、全覆盖、零容忍”态势的错判。在小事上打开缺口、________边界，看似微不足道的一包烟、一顿饭，就会化为沉沦的绳索，拉着人在失守变质的路上下坠。掩耳盗铃之举，终将贻害自己。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"跨越   泛化","B":"逾越   模糊","C":"越   漠视","D":"超越   混淆"},"answer":"B","page":82},{"id":261,"chapter":7,"num":21,"source":"2021事业联考","type":"中心理解","stem":"科学技术的迅猛发展带来日益突出的信息安全问题。信息安全事关国家安全和社会稳定。互联网核心技术是我们最大的“命门”，核心技术受制于人是我们最大的隐患。据海关数据显示，2018年全年我国进口芯片数量为4175.7亿件，进口金额达到3120.58亿美元。这一数字不仅超过原油这一战略物资，还超过了农产品、铁矿石、铜、铜矿石和医药品的总和。这充分说明，我们的芯片制造水平比世界先进水平还落后很多。而互联网企业即便规模再大、市值再高，如果核心元器件严重依赖外国，那么这个供应链的命门就掌握在别人手里。","prompt":"这段文字意在强调：","options":{"A":"当前我国信息安全问题日益严峻","B":"应该加快对互联网核心技术的掌握","C":"芯片技术受制于人将带来巨大隐患","D":"自研核心技术是我国企业的发展方向"},"answer":"B","page":83},{"id":262,"chapter":7,"num":22,"source":"2025湖南三支","type":"中心理解","stem":"西王母是传说中可以使人长生的女神，是两汉之际备受崇奉的神主，在汉画中多有表现。在这些西王母的画像中，捣药的玉兔如影随形。玉兔捣药的知识与图像由此流行开来，并进而演化为稳定的图式。这类画作往往表现玉兔举槌捣壶的场景，且将兔子塑造为人形，显示它并非一般的动物，而是具有人格的神明。两汉以降，随着娥信仰的流行，玉兔最终与嫦娥一同成为月亮的象征，玉兔捣药的形象也开始与月亮结合。此后，随着广寒宫、桂树、菊花等图像符号的不断加入，这一画面逐渐演变为中国美术史上的经典图像。","prompt":"这段文字主要介绍：","options":{"A":"西王母传说与玉兔捣药的关系","B":"玉兔捣药经典图像的形成过程","C":"嫦娥信仰取代西王母传说的背景","D":"玉兔在两汉之际被神格化的原因"},"answer":"B","page":83},{"id":263,"chapter":7,"num":23,"source":"2021联考","type":"中心理解","stem":"抽象的价值，存留在理论之中；具体的公正，则需体现在每一个人身上，不像喊喊口号那样简单。医疗改革既需协调利益魔方，更需面对海量刚需和分布不均的现实；收入分配改革“分好蛋糕”理论明确，具体调整却是复杂的系统工程。不存在一种简单的理论，可以立竿见影搞定所有中国式问题。","prompt":"这段文字强调的是改革中需解决好以下哪项关系？","options":{"A":"偏与全","B":"快与慢","C":"知与行","D":"难与易"},"answer":"C","page":83},{"id":264,"chapter":7,"num":24,"source":"2022 联考","type":"中心理解","stem":"在高空气球技术取得进展的同时，航空和航天技术也迎来了飞速发展时期。在大气层内，飞机是更便捷的飞行工具，而对于那些需要在大气层之上进行的科学研究，卫星提供了更加理想的环境。然而，高空气球这种历久弥新的工具却没有走出人们的视野，目前仍然是重要的科学研究工具。","prompt":"这段文字的核心观点是：","options":{"A":"高空气球在科学研究中有独特优势","B":"高空气球比飞机和卫星更重要","C":"古老的高空气球仍在不断发展","D":"高空气球可用作科学观测平台"},"answer":"A","page":84},{"id":265,"chapter":7,"num":25,"source":"2022天津","type":"细节判断","stem":"棕色脂肪组织是一种功能特化为产热的组织，低温时动物通过激活棕色脂肪组织和促进白色脂肪棕色化的方式增加产热，以维持体温。团队科研人员利用不同的抗生素配方处理小鼠以清除小鼠的肠道菌群，发现缺失肠道菌群的小鼠体温调控机制受到破坏，研究发现肠道菌群的缺失减弱了棕色脂肪组织中 UCP-1蛋白表达量的增加，降低了白色脂肪组织的棕色化水平。科研人员认为，产生这种作用的原因可能是在寒冷条件下，肠道菌群被破坏后，动物不能消化足够数量的食物，以满足寒冷条件下的热量需求。","prompt":"根据这段文字，下列说法正确的是：","options":{"A":"拥有肠道菌群的动物能够抵御寒冷","B":"小鼠的体温控制机制和人类类似","C":"动物只能依靠棕色脂肪组织维持体温","D":"UCP-1 蛋白的表达量与肠道菌群的数量成正比"},"answer":"A","page":84},{"id":266,"chapter":7,"num":26,"source":"2022联考","type":"细节判断","stem":"调性是判断古典音乐类型的基础。贝多芬在前人调性的规则下创建了一个风格系统，形成了新的范例。这些范例成为后世学习并归纳传承的经典。音乐由此可以承载哲学的思考，延伸至更辽远的天地。他探索音乐的过程是对音乐元素本质的发现。以他为原点，至勃拉姆斯、19世纪的瓦格纳、20 世纪的勋伯格，最终迎来调性的彻底瓦解——序列十二音的诞生，音乐中时间的结构由此被打破。这是音乐发展史上的重大转折，而贝多芬就是一位建立起创新路径的标志性作曲家。","prompt":"下列说法与原文不符的是：","options":{"A":"贝多芬创建的音乐风格系统成为后世学习的典范","B":"贝多芬形成的音乐新范例使音乐承载了哲学思考","C":"贝多芬开创的序列十二音打破了音乐的时间结构","D":"序列十二音的形成使传统音乐发生了重大的转折"},"answer":"C","page":84},{"id":267,"chapter":7,"num":27,"source":"2026重庆事业","type":"细节判断","stem":"鸟类的迁徙蕴含着生命进化亿万年的智慧，承载着精准的生物导航技巧、强大的体能储备策略和敏锐的环境感知能力。每一次飞翔，都是对生命极限的挑战；每一次抵达，都是演化与适应的胜利。鸟类比人类到达了这颗星球的更多领地。与千万里飞翔的鸟类相比，人类运动能力极其弱小，因此，古往今来，人类一直向往像鸟类一样自由飞翔。归去来兮，迁徙的鸟类被古人称为“候鸟”，其运动行为更加遵循天道，它们比人类也更“自然”。候鸟每年在固定的时间在某一地区出现，这种确定的迁徙运行规律，像气候一样指导着人类的农业活动。","prompt":"根据这段文字，下列说法不准确的是：","options":{"A":"候鸟的迁徙规律具有周期性，就像气候变化一样稳定可靠","B":"人类因自身运动能力的局限而产生对飞行自由的本能渴望","C":"所有鸟类都通过季节性迁徙来拓展生存空间和适应环境变化","D":"古人将遵循自然节律的迁徙鸟类视为“天道”的象征并予以观察记录"},"answer":"C","page":85},{"id":268,"chapter":7,"num":28,"source":"2024江苏事业","type":"标题填入","stem":"没有运行使用却仍连着电源，由此带来的电耗被称为待机能耗。与电器在使用中产生的有效能耗不同，待机能耗基本上是一种能源浪费，而且往往是一种不易被发现的“隐藏的浪费”。相关测算显示，将一户家庭的空调、洗衣机、电视、微波炉、电饭煲五种电器进行计算，待机功率在12W 到15W，待机能耗大约是3到5天一度电，即每天0.2 度到0.33 度电。即便按照每户日待机能耗0.2度电计算，一个500万人口的城市，全年待机能耗近1.39 亿度电。","prompt":"最适合做这段文字标题的是：","options":{"A":"关机不断电，也会造成浪费","B":"隐藏的浪费，看不见的浪费","C":"与运行使用比，待机更浪费","D":"切断电源，为你省下不少钱"},"answer":"A","page":85},{"id":269,"chapter":7,"num":29,"source":"2022重庆选调","type":"标题填入","stem":"目前，光纤网络、4G移动通信网络已经覆盖99.9%以上的行政村，农业信息化应用场景日趋丰富，数字技术被广泛应用于农业、牧业、林业、渔业等诸多领域，电子商务在农村不断发展，农村数字化治理程度不断提高。但是，由于不同地区的地理位置、地形地势等存在差异，部分行政村通信网络的覆盖范围、信号质量还有待进一步提升。要在加强乡村数字基础设施建设的同时，构建面向农业农村的综合信息服务体系，建立涉农信息普惠服务机制，推进乡村管理服务数字化。","prompt":"最适合做这段文字标题的是：","options":{"A":"大力推进数字乡村服务建设","B":"扩大农村通信网络覆盖范围","C":"加强农村数字基础设施建设","D":"建立涉农信息普惠服务机制"},"answer":"A","page":86},{"id":270,"chapter":7,"num":30,"source":"2023江苏","type":"中心理解","stem":"取消农业税后，国家开始向农村转移大量资源用于建设农村公共品，农民从农村公共品供给的主要提供者成为受益人。最近十多年某市借助城乡统筹试验区建设，以村庄为单位，由财政提供村庄公共服务资金，鼓励农民通过村民议事会分配资源，建设村庄公共品，形成具有地方特色的分配型民主。该市的试验为中国农村基层治理提供了有益的启示，具体来说，国家可以将部分惠农资源按人均转移到村庄，作为村庄可以自由使用的公共服务资金，再经由村民自治的民主程序进行资源分配。","prompt":"这段文字中提取的关键词最恰当的是：","options":{"A":"农村公共品   资源分配   分配型民主","B":"农村公共品   资源下乡   基层治理","C":"农村公共品   公共服务   分配型民主","D":"农村公共品   惠农经济   民主程序"},"answer":"A","page":86},{"id":271,"chapter":7,"num":31,"source":"2025浙江","type":"中心理解","stem":"市场化的志愿填报指导，说白了是利用“信息差”赚钱。学校、教育部门等联合“出手”，充分发挥各自优势，为考生提供专业、系统、免费的志愿填报指导，不为一场志愿填报服务的“供给侧改革”。“阳光志愿”这一权威选择，有利于帮助考生和家长“避坑”，缓解选择焦虑。高考志愿填报指导服务普惠化，也更契合高考公平的内在要求。毕竟，不是每个家庭都有条件去购买高价志愿填报指导服务。同时，更科学、靠谱的“官方”版志愿填报指导服务上线，也能倒逼相应的市场化服务规范发展，产生良币驱逐劣币的正向作用。","prompt":"根据这段文字，“阳光志愿”可能是：","options":{"A":"高校招生信息服务平台","B":"志愿填报指导服务系统","C":"高考志愿填报咨询公司","D":"高校毕业生就业指导机构"},"answer":"B","page":86},{"id":272,"chapter":7,"num":32,"source":"2020贵州事业","type":"中心理解","stem":"习近平总书记明确指出，“移民搬迁是脱贫攻坚的一种有效方式。要总结推广典型经验，把移民搬迁脱贫工作做好。”近年来，我国在实施移民搬迁工作中，既将新村建设同发展生产和促进就业结合起来、同完善基本公共服务结合起来，又将新村建设同保护民族、区域、文化特色及风貌结合起来，让更多的贫困人口迎来崭新生活。","prompt":"这段文字意在说明：","options":{"A":"移民搬迁与脱贫攻坚的关系","B":"树立移民搬迁典型，助力脱贫攻坚","C":"移民搬迁工程应因时制宜，因地制宜","D":"贫困人口因移民搬迁而迎来了新生活"},"answer":"B","page":87},{"id":273,"chapter":7,"num":33,"source":"2025天津","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①现代传播格局对参与文学创作、生产、传播的从业者提出了更高要求\n②新时代文学呈现出“破圈”与“跨界”的整体趋势\n③我们希望促进文学精品的生产、传播、转化、译介，尽己所能，让好作品在各个环节充分发挥能量，以开拓和延伸放大文学的价值，让文学的生命力与活力更好进发\n④酒香也怕巷子深\n⑤由此，更多人能够意识到，文学是不可或缺的力量，在现代人的精神生活中，始终存在文学的维度\n⑥“破圈”与“跨界”绝不是迎合媒介的变化，也不是与短视频、影视、游戏等抢夺注意力","prompt":"","options":{"A":"①②④⑤⑥③","B":"②④①⑥③⑤","C":"④③②⑥①⑤","D":"⑥④①②⑤③"},"answer":"B","page":87},{"id":274,"chapter":7,"num":34,"source":"2024联考","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①1979 年，波斯波利斯被列入联合国教科文组织世界文化遗产名录\n②波斯波利斯始建于公元前约 518年，主要建筑包括万国门、觐见厅、百柱宫、阿帕达纳宫、薛西斯宫殿、书房、金库等，整个宫殿建筑群历经3个朝代才得以完成\n③去伊朗一定要看看波斯波利斯古城遗址\n④联合国教科文组织评价说，波斯波利斯古城遗址提供了许多关于古代波斯文明的珍贵资料，具有重要考古价值\n⑤这座显赫一时、规模宏大的王城后来在马其顿王亚历山大东征时被烧毁\n⑥虽遭焚毁，又历经千年风雨侵蚀，但如今依然高柱林立、巨石横卧","prompt":"","options":{"A":"②③⑤①④⑥","B":"③②⑤⑥①④","C":"③①②④⑤⑥","D":"②①④⑤⑥③"},"answer":"B","page":87},{"id":275,"chapter":7,"num":35,"source":"2025 湖南三支","type":"语句填空","stem":"古代中国与海外的交通与经济文化交流,藉由陆上与海上“丝绸之路”，由来已久，且规模渐趋扩大。西域开拓者经营者张骞、班超，西行取经的法显、玄奘、义净，还有唐代鉴真和尚东渡日本传播佛法·····________，除此之外，在更加漫长而广大的时空中，曾经有过无数同样重要、却已被历史淹没的中外交流的人与物与事。常言说“往事如烟”，幸有华夏文物在，雪泥鸿爪，在有限的古代文献之外，为后世保存和记录了那些穿越广漠流沙、冲破惊涛骇浪的使者们，用生命谱写的富有传奇性的中外文化交流的历史篇章。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"中国在东亚历史进程中扮演了重要角色","B":"后世很多人的生活因为他们而发生了改变","C":"这些脍炙人口的人物故事早已为人们所熟知","D":"他们不同程度地促进了东西方文明的交流"},"answer":"C","page":88},{"id":276,"chapter":7,"num":36,"source":"2022 联考","type":"中心理解","stem":"在传统的文化消费中，无论是阅读书籍、聆听音乐还是欣赏影视作品，都是单向度的，创作与消费是两个独立的环节。在体验式文化消费中，消费者不仅参与创作，也是作品的组成部分，这让消费者的主观能动性得到更加充分地发挥。独一无二的作品背后，是独一无二的经历与体验。体验式文化消费因而具有唯一性、当下性与不可复制性。另外，体验式文化消费中的互动过程，综合利用包括VR、AR在内的多媒体数码技术，提供跨媒介的多感官体验一—如温度、质感、震动等在传统文化产品中很难体验到的综合感官效果，为叙事与审美提供了更多维度。","prompt":"这段文字意在说明：","options":{"A":"体验式文化消费会更受消费者青睐","B":"现代技术对体验式文化消费的促进作用","C":"体验式文化消费中消费者主动参与的重要性","D":"体验式文化消费带给消费者与众不同的体验感"},"answer":"D","page":88},{"id":277,"chapter":7,"num":37,"source":"2020 四川下","type":"中心理解","stem":"随着农村人口快速向城市转移，教育资源的供给并未随之增容，如调整中小学布局，扩建、新建学校，调配师资等。单纯靠挖掘潜力“加双筷子”的办法应对教育资源不足的问题，终究难以为继。人口城市化是不可逆的趋势，促进城乡教育均衡化，不是简单把农村学生留在农村，事实上也是留不住的，应顺应城市化发展的趋势，随人口流动来配置和供给教育资源。子女教育往往是农村进城人口的第一需求，解决好农民子女进城教育的问题，也是推动农村人口就地城市化的基础。","prompt":"这段文字针对的主要问题是：","options":{"A":"教育资源调配与现实需求严重脱节","B":"人口快速流动给城市发展造成压力","C":"农村转移人口在城市生活中遇到障碍","D":"城镇化背景下教育资源供给存在矛盾"},"answer":"D","page":88},{"id":278,"chapter":7,"num":38,"source":"2024 深圳","type":"语句填空","stem":"一年前，ChatGPT横空出世，5天内，这款聊天机器人随即揽下100万用户，2个月后，这个数字涨到了1亿。________，不少体验者是把ChatGPT当成升级版的谷歌搜索引擎来理解，但它俩其实完全不同。最大的区别在于，ChatGPT并没有在被提问时上网检索答案，抽取出个别网页，给你一个由他人编辑好的文本；而是像学生考试时努力回忆学到的知识点进行作答那样，回忆它阅读学习过的海量文本，再用自己的语言组织一个简洁的回答，实时生成给你看，替你节省点开链接、阅读理解的时间。不仅如此，它还要读懂你的追问、反驳乃至刁难，像接受论文答辩一样，跟你进行多个回合的灵活交谈，让你感觉对方是个普通人而不是机器。","prompt":"最适合填入上文横线处的语句是：","options":{"A":"但ChatGPT是一款用户体验并不友好的新产品","B":"理解ChatGPT，对于很多人来说都太过复杂","C":"成为大热门的 ChatGPT 自然成为了众矢之的","D":"ChatGPT会为许多风险隐患提供更为“深思熟虑”的方案"},"answer":"B","page":89},{"id":279,"chapter":7,"num":39,"source":"2025 浙江事业","type":"接语选择","stem":"对于城镇学校来说，如果农村生源大量涌入，而教育资源建设又跟不上学生流人速度，难免会在一定程度上影响教学质量。城镇学校教学资源和场地有限，生源大量扩容后会对教学管理提出新的要求，需要加强师资力量，而宿舍、食堂以及各类硬件教学设施都要随之改造提升。由此可见，“撤点并校”的关键不仅在于“撤”的过程，更在于“并”的建设。今年中央一号文件提出“办好必要的乡村小规模学校”，既回应了当前乡村教育的难点，也蕴含了对于“撤点并校”的要求，可以说正当其时。","prompt":"接下来最有可能谈论的是：","options":{"A":"解读今年中央一号文件提出的相关内容","B":"阐述乡村小规模学校“撤点并校”的必要性","C":"提出做好“撤点并校”中的“并”建设的建议","D":"如何落实“办好必要的乡村小规模学校”相关政策"},"answer":"D","page":89},{"id":280,"chapter":7,"num":40,"source":"2026 河南事业","type":"接语选择","stem":"文学作品的主要呈现载体是纸媒，包括报纸、杂志、书籍等。在电子媒介时代，小说改编为影视剧成为越来越普遍的现象，特别是一些通俗文学作品成为“一时之热”，如“琼瑶热”“金庸热”等。但在这样的媒介环境中，读者，观众聚焦的依然是作品作家的文字作品以及由其改编而来的影视作品，作家的热度只是顺带而来的。到了数字媒介时代，网络交流的互动性和即时性增强，作家在传媒世界中的“生存”状况似乎有了比较显著的变化。作家们不仅依靠学术演讲、人物访谈等传统形式抒发已见，还积极融入新兴媒体平台曝光度。","prompt":"接下来最有可能阐述的是：","options":{"A":"数字媒介时代作家融入现代传播格局的生动实践","B":"作家如何有效地与人民大众重新联结","C":"数字媒介时代作家的“生存”状况","D":"从作家破圈，走向作品破圈"},"answer":"A","page":90},{"id":281,"chapter":8,"num":1,"source":"2026 天津","type":"逻辑填空","stem":"近年来，《中华人民共和国网络安全法》《互联网信息服务深度合成管理规定》《生成式人工智能服务管理暂行办法》等法律法规的出台，为人工智能的有效监管奠定了基础。然而，技术发展日新月异，规则具有________。人工智能安全治理如何因时而变，避免“________”，值得深入探讨。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"静态性   胶柱鼓瑟","B":"长期性   按图索骥","C":"保守性   郑人买履","D":"滞后性   刻舟求剑"},"answer":"D","page":91},{"id":282,"chapter":8,"num":2,"source":"2021事业联考","type":"逻辑填空","stem":"冒险家们一次次越洋飞行，向企业家们证明了在世界范围内建立商业航线是完全可能的。于是各大航空公司开始尝试把自己的触角延伸到世界各大洲。到 20 世纪30 年代中期，一个世界性的航空网已经________0","prompt":"填入横线处的词语最恰当的一项是：","options":{"A":"崭露头角","B":"蓄势待发","C":"初见端倪","D":"若隐若现"},"answer":"C","page":91},{"id":283,"chapter":8,"num":3,"source":"2024重庆三支","type":"逻辑填空","stem":"脱贫攻坚伟大斗争，锻造形成了“上下同心、尽锐出战、精准务实、开拓创新、攻坚克难、不负人民”的脱贫攻坚精神。这是党的性质宗旨、中国人民意志品质、中华民族精神的________，是爱国主义、集体主义、社会主义思想的集中体现，是中国精神、中国价值、中国力量的充分________，传承了伟大民族精神和时代精神。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"生动写真   体现","B":"真实写照   发挥","C":"生动写照   彰显","D":"现实再现   标榜"},"answer":"C","page":91},{"id":284,"chapter":8,"num":4,"source":"2026 河南事业","type":"逻辑填空","stem":"青春的道路上常有泥泞，奋斗的征途不一定一帆风顺，总会遇到挫败沮丧，面对生活的________，时不时要经历迷茫与无奈。只不过，生活从不眷顾________、满足现状者，人生从不等待不思进取、坐享其成者，更多的机遇、无限的可能只属于奋斗者、搏击者、前行者。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"步步维艰   优柔寡断","B":"凹凸不平   因循守旧","C":"一波三折   犹豫不决","D":"徘徊歧路   食古不化"},"answer":"B","page":91},{"id":285,"chapter":8,"num":5,"source":"2020 浙江事业","type":"逻辑填空","stem":"与其他个人信息不同，作为个人隐私信息最重要的部分，个人金融信息具有财产权益的特性，通过它可以________用户的财力，还可以助力放贷业务风控。科技的________，极大挖掘了个人数据的价值，用户在享受个性化、贴心服务的同时，隐私安全问题也随之而来。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"窥探   介入","B":"预测   推动","C":"放大   利用","D":"透视   创新"},"answer":"A","page":92},{"id":286,"chapter":8,"num":6,"source":"2021联考","type":"逻辑填空","stem":"除了季节的变换导致夜的长短发生变化，黑夜本身并无变迁可言，昼夜交替是自然规律,________。夜的变迁发生在与人类的关系中，人类对黑夜的感情十分复杂，黑夜常常与________联系起来，令人产生长夜漫漫的感觉。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"一成不变   邪恶","B":"亘古不变   恐惧","C":"有条不紊   孤独","D":"一以贯之   寒冷"},"answer":"B","page":92},{"id":287,"chapter":8,"num":7,"source":"2025湖南三支","type":"逻辑填空","stem":"正是坚持_________的斗争精神，我们党团结带领人民开辟了伟大道路，建立了伟大功业，创造了中华民族发展史、人类社会进步史上令人________的奇迹，迎来了中华民族从站起来、富起来到强起来的伟大飞跃，实现中华民族伟大复兴进入了不可逆转的历史进程。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"一以贯之   刮目相看","B":"百折不回   过目难忘","C":"一往无前   心悦诚服","D":"奋不顾身   叹为观止"},"answer":"A","page":92},{"id":288,"chapter":8,"num":8,"source":"2021四川下","type":"逻辑填空","stem":"在一个新词汇层出不穷的时代，准确说出所思所想，比不假思索套用流行词汇更有________。很多时候，网络用语的风头正盛只是暂时的，真正拥有生命力的语言总会在时间的沉淀下大浪淘沙。只有直面内心感受的差异化表达，才能________，造就语言的经典。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"意义   一语中的","B":"难度   历久弥新","C":"价值   经久不衰","D":"个性   掷地有声"},"answer":"C","page":92},{"id":289,"chapter":8,"num":9,"source":"2024事业联考","type":"逻辑填空","stem":"在古代黄河流域，主要农作物粟和黍的产量均不及水稻的一半。而且黄土高原土壤黏土含量低，有机物容易流失，无法_________长期高强度的耕种，如果不施肥就需要休耕来恢复地力。产量低和休耕使北方的粟作农业社会面临粮食生产的________。新的考古研究发现，当时的人们将粟黍种植与家猪饲养结合以提高粮食产量，从而为粟作农业社会奠定了经济基础。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"承担   困境","B":"延续   中断","C":"维持   瓶颈","D":"支撑   衰落"},"answer":"C","page":93},{"id":290,"chapter":8,"num":10,"source":"2026联考","type":"逻辑填空","stem":"以往在医疗机构中出现过“我院节后手术量创新高”“开门大吉”等宣传标语，甚至有民营医院打出“手术室里全是钱”的横幅，都曾引发舆论关注和质疑。这并非公众敏感或者________，公共服务机构的宣传表达，本质是与公众的沟通对话，必须坚守“同理心”原则，每一句标语都应体现对患者的________与关怀。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"小题大做   尊重","B":"吹毛求疵   体谅","C":"捕风捉影   理解","D":"不依不饶   体恤"},"answer":"A","page":93},{"id":291,"chapter":8,"num":11,"source":"2022 湖北选调","type":"逻辑填空","stem":"近年来，国产精品剧________，主旋律作品“爆款”频出，一部《山海情》实现了电视遥控器在家庭的代际统一，我们今天的幸福生活就是《觉醒年代》的续集，观众的真心点赞和真切感慨，体现了优秀国产剧的深厚观众缘，也证明了好作品的强大________o","prompt":"依次填入画横线处的词语，最恰当的一项是：","options":{"A":"异军突起   感召力","B":"拨云见日   凝聚力","C":"数不胜数   创造力","D":"层出不穷   生命力"},"answer":"D","page":93},{"id":292,"chapter":8,"num":12,"source":"2019 联考","type":"逻辑填空","stem":"故宫利用原创、金融和亚文化三驾马车，开拓出传统文化IP活化的新________，揭示了优秀传统文化挖掘和________的巨大空间和可能性，也揭开传统文化市场开发庞大财富冰川的一角。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"途径   阐述","B":"途径   阐释","C":"路径   阐发","D":"路子   阐明"},"answer":"C","page":93},{"id":293,"chapter":8,"num":13,"source":"2021四川","type":"逻辑填空","stem":"中国的建筑风格从来都是________的，并不一味拒绝“洋建筑”，关键在于如何在借鉴的过程中，呈现出建筑的文化主体意识。而人们之所以________当下的一些西式建筑热，就在于其舍本逐末、生搬硬套，缺少了对历史的敬畏和对文化的理解。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"海纳百川   否定","B":"千姿百态   反感","C":"兼容并蓄   质疑","D":"独树一帜   排斥"},"answer":"C","page":94},{"id":294,"chapter":8,"num":14,"source":"2020事业联考","type":"逻辑填空","stem":"甲骨文发现后，学者们通过对殷墟甲骨文的研究，证明了《史记·殷本纪》的可信，证实了司马迁撰写的商代历史绝非________，从而极大地提高了《史记》中有关夏朝历史记载的可信度。考古学家和历史学家正以《史记·夏本纪》的记载为________，探寻夏代的历史文化，目前已取得了可观的成绩。因此，用出土文物去印证古代典籍，重建夏商周三代文明的可信历史，甲骨文起了举足轻重的作用。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"虚构   线索","B":"杜撰   蓝本","C":"捏造   佐证","D":"臆测   基础"},"answer":"A","page":94},{"id":295,"chapter":8,"num":15,"source":"2026 天津事业","type":"逻辑填空","stem":"近年来，乡村旅游发展迅速，但也存在一些问题。有些地方________开发，破坏了生态环境；而有些地方则________，旅游设施简陋，游客体验不佳。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"盲目   因陋就简","B":"无序   得过且过","C":"肆意   敷衍了事","D":"胡乱   粗制滥造"},"answer":"C","page":94},{"id":296,"chapter":8,"num":16,"source":"2023山东","type":"逻辑填空","stem":"大多数人读书识字是为了得到某些________的好处，比如说学会记账和预防在做生意时上当；但说到作为高贵精神活动的阅读，他们所知甚少，或者干脆________；然而唯有这种才是高级的阅读，真正的好书不会像奢侈品那样麻醉我们、让我们的思辨能力昏然睡去，而是需要我们起脚尖去,________，需要我们将最敏锐和清醒的辰光奉献给它。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"微不足道   一无所知   拜读","B":"微乎其微   一头雾水   涉猎","C":"微不可察   不得而知   阅读","D":"不值一提   不知所以   展读"},"answer":"A","page":94},{"id":297,"chapter":8,"num":17,"source":"2019 河南选调","type":"逻辑填空","stem":"最近几年，网红食品________。为了买到一杯奶茶、一块蛋糕，人们愿意花上几个小时排队，甚至出高价从“黄牛”手中拿货，拿到美食后，再拍照上传到社交平台“打卡”.·这已经成为时下许多年轻人的饮食新时尚。但必须注意的是，部分商家在追求利益的同时无视食品安全问题。一些网红食品借助网络平台隐蔽销售，________于监管体系之外，存在较大的安全隐患。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"方兴未艾   逃逸","B":"炙手可热   隐匿","C":"大行其道   游离","D":"异军突起   飘游"},"answer":"C","page":94},{"id":298,"chapter":8,"num":18,"source":"2020 联考","type":"逻辑填空","stem":"繁花盛开的季节，蜜蜂在紫嫣红之间辛勤劳作，如果你仔细观察一只蜜蜂的活动就会发现，蜜蜂对柑橘和咖啡的花朵仿佛着了魔一般，而对其他植物的花朵________，这是为什么呢？","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"旁若无人","B":"素不相识","C":"熟视无睹","D":"置若罔闻"},"answer":"C","page":95},{"id":299,"chapter":8,"num":19,"source":"2026事业联考","type":"逻辑填空","stem":"不论是城市发展还是产业转型，最关键的是要找对方向，先见之明和自知之明缺一不可。先见之明，见的是________，就是“要有战略眼光，看得远、想的深”。自知之明，知的是________，发展得建立在“家底”上。以先见之明“抢位”起跑，有自知之明“错位”发展，定能产生更多“一枝独秀”，形成“春色满园关不住”的生动局面。","prompt":"依次填入横线处的词语最恰当的一项是：","options":{"A":"远景   近景","B":"趋势   优势","C":"风口   蓝海","D":"眼界   边界"},"answer":"B","page":95},{"id":300,"chapter":8,"num":20,"source":"2021事业联考","type":"逻辑填空","stem":"年画于南方是细腻柔媚，在北方是粗犷豪放，呈现出很强的________0若是再仔细分辨的话，区别就更大了。比如，河南朱仙镇的年画，传承着中古时期的典雅与大气；苏州桃花坞的年画，汲取了江南文化的精秀细巧·.···这些个性鲜明、________的年画，只有在农家的墙壁上才彰显出活力，是乡村屋舍的画龙点晴之笔。","prompt":"依次填入横线处的词语最恰当的一项是：","options":{"A":"艺术性   美轮美奂","B":"独特性   栩栩如生","C":"差异性   五颜六色","D":"地域性   异彩纷呈"},"answer":"D","page":95},{"id":301,"chapter":8,"num":21,"source":"2025山东事业","type":"中心理解","stem":"根据特定产品的碳足迹种类规则标准，产品碳足迹核算和报告过程一般包括“系统边界确认”“数据采集”和“量值核算”。以常见的涤纶纺织产品为例，首先需要明确产品碳足迹核算的系统边界。其次，需要分阶段对生产涤纶产品的主要原材料，以及液化气、天然气、柴油等能源实际消耗数据进行采集，采集周期一般为一年。最后，计算各阶段温室气体排放量和清除量，并进行汇总累加，即得到涤纶纺织产品的碳足迹。","prompt":"本段文字意在说明：","options":{"A":"涤纶纺织产品碳足迹的数据采集","B":"涤纶纺织产品的碳足迹核算的方法","C":"特定产品碳足迹核算和报告过程","D":"特定产品的碳足迹种类规则标准"},"answer":"C","page":95},{"id":302,"chapter":8,"num":22,"source":"2018贵州选调","type":"中心理解","stem":"我国科普工作虽然取得了很大进步，可是科普读物，无论数量还是质量，与发达国家还有着数量级的差距。在一些社会关注的重大问题上，科学家更应该主动站出来讲话。要把科学语言转化为老百姓听得懂的语言，实事求是讲真话。如果连科学家都不愿意、不敢讲话，任由真相缺失、谣言扩散，那么势必会引起公众的恐慌和困惑。","prompt":"上述文字意在强调：","options":{"A":"科普工作应该通俗化，接地气","B":"我国科普读物数量少，质量差","C":"科学家负有做科普工作的义务","D":"科学家应坚持求真务实的原则"},"answer":"C","page":96},{"id":303,"chapter":8,"num":23,"source":"2022 事业联考","type":"中心理解","stem":"印刷史是一门技术史，研究技术和工艺的兴废变革，与单纯的文史研究比起来，其研究对象和论证依据更加丰富，既有实物，又有文献。实物包括印刷工具和印成品，文献则包括对技术工艺的说明和一般记载。但印刷术又是在生活中产生、使用的技术，人们对身边事物往往视而不见，对相关史料无心留存。从技术资料看，除了晚近的雕版和木活字，早期印刷工具基本失传，技术、工艺说明存世无多；从文献资料看，多数时候未留下详细、可靠的记载，今天的研究只能根据古人的只言片语来分析推断。","prompt":"这段文字旨在:","options":{"A":"分析印刷史研究所用资料的特点","B":"强调技术因素在印刷史中的价值","C":"说明印刷史与普通文史研究的差异","D":"介绍印刷技术研究资料的获取途径"},"answer":"A","page":96},{"id":304,"chapter":8,"num":24,"source":"2020 国考","type":"中心理解","stem":"食品药品安全追溯体系是依赖现代信息技术，对可能存在的食品药品安全隐患发出预警的一项制度。它之所以被一些国家广泛采用，是因为一方面能降低监管部门信息获取成本，提升监管效率；另一方面也能倒逼企业提高安全意识，主动进行风险控制。这项制度已引进我国多年，并体现在相关法律法规以及行动规划中。但在实践中，区域分割、部门分治等问题仍比较突出，没有形成高效的地方联动、部门合力，对解决食品药品安全问题缺少整体效果。","prompt":"这段文字意在强调：","options":{"A":"我国的食品药品安全追溯制度仍有待完善","B":"完善的食品药品安全追溯体系有重要价值","C":"相关部门应该加强对食品药品安全的监管","D":"多方合作是解决食品药品安全问题的关键"},"answer":"D","page":97},{"id":305,"chapter":8,"num":25,"source":"2023 重庆事业","type":"细节判断","stem":"清洗辐射颗粒是核辐射防护的相关措施之一，核爆炸以后，带有核辐射的颗粒会发生扩散，粘在人们的脸上，衣服上，如果不及时清洗，会对人体造成持续的电离辐射伤害，但是，电脑显示器辐射仅仅是电磁波，不会扩散出放射性物质，也就不会存在核辐射颗粒，所以，爱美的女士用完电脑后洗脸对防电防辐射不起作用。","prompt":"根据这段文字，下列说法正确的是：","options":{"A":"只有核辐射才能对人体造成伤害","B":"清洗可以有效防止电脑显示器辐射","C":"电脑的辐射颗粒不会对人造成伤害","D":"洗脸有助于防止辐射颗粒的持续伤害"},"answer":"D","page":97},{"id":306,"chapter":8,"num":26,"source":"2023 联考","type":"中心理解","stem":"传统观念中的夜经济更多是吃饭经济、购物经济，但夜经济发展并未止步于此。2022年春节假期，各地夜经济消费业态推陈出新，打造更丰富的消费场景，为人们带来了物质、精神的双重满足。从沉浸式演艺，到奇妙光影秀，再到夜间博物馆，夜经济与民俗、旅游、文娱、冬奥等充分融合，激发“夜间+”的无限可能。多样化、主题性、特色类产品既满足了人们的不同需求，也有望打造独特夜景、形成消费品牌，为城市增添人气与活力。","prompt":"根据这段文字，消费业态推陈出新的效果不包括：","options":{"A":"消费者拥有更多的夜消费选择","B":"多种业态在夜经济下充分融合","C":"形成夜经济消费品牌成为可能","D":"夜经济发展获得更充沛的动能"},"answer":"D","page":97},{"id":307,"chapter":8,"num":27,"source":"2021事业联考","type":"细节判断","stem":"巨石阵的石柱中藏着许多未解之谜，英国某一最新研究成果或许可以帮助解释巨石阵的功能。声学工程师参照考古研究，复原了共157块巨石的完整巨石阵（现存巨石阵仅有 63块巨石），在实验室中建立了一尺寸的巨石阵模型。通过对模型进行声学测试，发现尽管巨石阵没有屋顶且巨石之间存在间隙，仍然可以起到不错的混响作用，古代仪式中的人声和器乐效果都可以得到增强，而且巨石阵内外的声音可以被较好地互相隔绝。不过，科学家并不认为声学结构是古人在建造巨石阵时的主要考虑因素，天象等原因更有可能是灵感来源。","prompt":"关于这项研究，下列说法正确的是：","options":{"A":"发现了巨石阵声学结构的缺陷","B":"揭开了古人建造巨石阵的奥秘","C":"所建巨石阵模型与现存实物一致","D":"证实巨石阵具有卓越的音响效果"},"answer":"D","page":98},{"id":308,"chapter":8,"num":28,"source":"2026事业联考","type":"标题填入","stem":"根据恒星演化理论，在双星系统中，较大质量的恒星通常率先演化，最后坍缩成密度极高的致密星，比如中子星或黑洞。较小的伴星继续演化，但其物质会被致密星吸积，伴星会因为质量流失而体积膨胀，甚至膨胀到把致密星“揽入怀中”，共同在氢元素包层中继续演化。这类特殊的双星系统仅存在约一千万年，极为罕见。近日，科学家利用“中国天眼”发现一个罕见的毫秒脉冲星，与伴星相互绕转。据推测，该伴星的质量至少与太阳相当，远超一般掩食脉冲星的伴星，但狭小轨道根本无法容纳这样的恒星。根据多方面的限制推断，该伴星不是普通恒星，也不是演化后的致密伴星，而是经历过公共包层演化的氮星。该发现对恒星演化研究具有重要意义。","prompt":"最适合做这段文字标题的是：","options":{"A":"当“迷你”伴星遇见了黑洞","B":"这颗星星里藏着另一颗星星","C":"毫秒脉冲星与伴星的勿颈交","D":"“昙花一现”的毫秒脉冲星"},"answer":"C","page":98},{"id":309,"chapter":8,"num":29,"source":"2025深圳","type":"标题填入","stem":"作为公认的人类综合性竞技体育的最高殿堂，奥运会自19世纪末重启至今，已经与媒体深度融合，演化为一种全球规模的文化产品。随之而来的是，观众对内容的需求正在从赛事本身向上下游的整条“故事链”无限延展。奥运会的消费形式正在打破媒体传播的“单向度”，朝着更立体、更娱乐的“泛体育化”演变。不妨回忆一下，就在前几天，人们还在对“奥运会还有没有人看了”的话题争论不休，可真到了比赛开场，还是会情不自禁关注。这也再一次证明，奥运会早已超越单纯的体育范畴，成为全社会的焦点大事件。","prompt":"下列最适合作为上文标题的是：","options":{"A":"百年奥运，媒体重塑竞技生态","B":"消费至上，奥运破解流量密码","C":"破界拓维，奥运文化冲出赛场","D":"逐梦奥运，体育精神传递能量"},"answer":"C","page":98},{"id":310,"chapter":8,"num":30,"source":"2021江苏","type":"中心理解","stem":"在高等教育规模不断扩大的同时，竞争也在加剧。高等院校之间的竞争是永恒的主题，而最集中的竞争是生源的竞争。大学开设特色专业项目是竞争的战略，目前国内高校竞相开设丰富多样的主修、辅修专业和证书课程等。在此基础上，个性化专业设置作为一种极具特色的本科人才培养方式，为高校实现独特人才培养的目标开启了新通道，有效提升了学校的吸引力和竞争力。","prompt":"下列对文字的概括最恰当的一项是：","options":{"A":"高等教育竞争主要表现在如何帮助学生实现既定目标","B":"专业设置个性化是增强高校吸引力竞争力的有效途径","C":"个性化专业设置是高校之间生源竞争普遍采用的方式","D":"独特人才培养计划是各个高校竞争中的有力武器"},"answer":"B","page":99},{"id":311,"chapter":8,"num":31,"source":"2022 陕西事业","type":"中心理解","stem":"党的十八大以来，全民医疗保障制度改革持续推进，在破解看病难、看病贵问题上取得了突破性进展。2020 年2月印发的《中共中央 国务院关于深化医疗保障制度改革的意见》提出，探索罕见病用药保障机制。高值罕见病用药入医保，体现了医保在尽力而为、量力而行的前提下，尽最大努力补齐药品保障短板，也从一个侧面反映了我国医保制度正沿着精细化轨道不断前行。当然，高值罕见病用药大幅降价进入医保，背靠的是我国14亿多人口庞大的医疗健康市场需求，谈判桌前一次次砍价，得益于以销量换低价的底气。不少医药厂商正是看中这一点，才会“甘降身价”。未来，可以期待更多高值药品进入医保目录。","prompt":"文中“这一点”指的是：","options":{"A":"高值罕见病用药大幅降价进入医保","B":"我国医保制度正沿着精细化轨道不断前行","C":"我国14亿多人口庞大的医疗健康市场需求","D":"更多高值药品有望进入医保目录"},"answer":"C","page":99},{"id":312,"chapter":8,"num":32,"source":"2021广东","type":"中心理解","stem":"依托红色资源打造的旅游点，如何让游客真正“留下来”“再回来”？必须强化党组织的政治功能和服务功能，提升农村基层党组织的组织力。在党组织的领导下，让绿色产业和特色农家乐融合，增强游客体验感、参与感，走出一条“红色基因十绿色产业+特色旅游”的振兴之路。在此基础上，充分挖掘保护利用红色资源，推动形成基层党建、红色资源、新农村建设融合发展的新格局。","prompt":"这段文字主要分析了：","options":{"A":"发展红色旅游的路径","B":"发展红色旅游的意义","C":"基层党建新格局的内涵","D":"新农村建设融合发展的目标"},"answer":"A","page":100},{"id":313,"chapter":8,"num":33,"source":"2024山东","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①德国生物化学家康拉德·布洛赫在1994 年首次预测了这类分子的存在\n②但他的结论是，这些介于中间的原始分子永远不会被发现，因为它们无法在地质记录中存活下来\n③某权威杂志公开的一项研究报道了在古岩石中发现的一类新类固醇，并确认了复杂真核生物久远的史前史\n④新研究表明事实并非如此，原生类固醇的痕迹能在岩石中保留超过10亿年\n⑤他提出，在从羊毛固醇到胆固醇的漫长生物合成途径中，每个短暂存在的中间体在几亿年前都曾是完全适应的最终产物，而且这些产物的每一个都是在其前体基础上的演化进步\n⑥这片“失落的世界”的发现，也证实了诺贝尔奖得主康拉德·布洛赫关于存在原生类固醇分子的预测","prompt":"","options":{"A":"③⑥①⑤②④","B":"⑥⑤④③①②","C":"③①⑤④⑥②","D":"④③⑥①②⑤"},"answer":"A","page":100},{"id":314,"chapter":8,"num":34,"source":"2024联考","type":"语句排序","stem":"将以下6个句子重新排列，语序正确的一项是：\n①设施农业大有可为，要发展日光温室、植物工厂和集约化畜禽养殖，推进陆基和深远海养殖渔场建设，拓宽农业生产空间领域\n②要构建多元化食物供给体系，在保护好生态环境前提下，从耕地资源向整个国土资源拓展，从传统农作物和畜禽资源向更丰富的生物资源拓展\n③“吃饭”不仅仅是消费粮食，肉蛋奶、果菜鱼、菌菇笋等样样都是美食\n④向森林、草原、江河湖海要食物，向植物动物微生物要热量、要蛋白，多途径开发食物来源\n⑤耕地以外，我国还有 40多亿亩林地、近 40亿亩草地和大量的江河湖海等资源\n⑥解决吃饭问题，不能光盯着有限的耕地，要把思路打开，树立大食物观","prompt":"","options":{"A":"①⑥⑤③②④","B":"⑥①②④③⑤","C":"⑥③⑤②④①","D":"①⑥②④③⑤"},"answer":"C","page":100},{"id":315,"chapter":8,"num":35,"source":"2022重庆选调","type":"语句填空","stem":"前几年的讨论中，逃离北上广深的话题时而出现。一些人卖掉大城市的房子回小城市过安逸日子的故事，更是为不少人说道。但事实上，就整个人才的流动趋势看，________。中国人有句俗语叫“人往高处走”，不管是基于就业机会还是工资水平，人才，尤其是青年人才，自然会倾向于向更发达的地方流动。","prompt":"填入画横线部分最恰当的一项是：","options":{"A":"人才向中小城市流动是大趋势","B":"互联网给中小城市带来了机遇","C":"逃离一线城市其实是个伪命题","D":"一线城市对人才的吸引力更大"},"answer":"C","page":101},{"id":316,"chapter":8,"num":36,"source":"2021事业联考","type":"中心理解","stem":"新中国成立初期的 30 年间，中国在国际期刊上发表的论文主要研究方向大部分为基础性自然科学学科。1980年以来，众多学科快速发展，取得了举世瞩目的成就：材料科学论文产出总量位居全球第一；农业科学、化学、计算机科学、工程学、环境与生态学、地球科学、数学、物理学的论文产出位居全球第二；分子生物学与遗传学、药理学与毒理学的论文产出位居全球第三。数据同时表明，中国内地学科布局与发展逐步均衡、全面，各个学科的影响力持续增长，逐步接近全球领先水平。","prompt":"这段文字意在说明：","options":{"A":"中国基础科学的进步是综合国力提升的直观体现","B":"整体而言中国各学科的发展已居于全球领先水平","C":"论文产出数据表明中国在基础科研方面进步明显","D":"我国不同时期自然科学领域的学科布局差异显著"},"answer":"C","page":101},{"id":317,"chapter":8,"num":37,"source":"2025天津事业","type":"中心理解","stem":"人工替代濒危中药材需要找到一条解决之路。人工替代药材的疗效评价可分为血糖、血压、血脂等病理指标的改善和传统中医症候的改善两个方面，如果一种人工替代濒危中药材能在这两个方面均做到与天然药材接近，那么其替代就是成功的。但也有人质疑，中药不同于化学药，受环境、地域、生长时间等条件影响，每两批天然药材之间，其精确组成和具体疗效也不能保证完全一致，更何况人工替代品？但相关部门表示只要替代品达到来源明确、化学、活性相似等要求，就应该被视为满足了条件。","prompt":"上述文字主要表明：","options":{"A":"人工替代濒危中药材功效和选材既要严谨也需包容","B":"濒危中药材急需人工替代品来延续价值","C":"由于生长环境的复杂性以及功效的不确定性，中药材很难人工替代","D":"人工替代药材只要在合理的范围内达到功效要求就应该视作有效"},"answer":"A","page":101},{"id":318,"chapter":8,"num":38,"source":"2019 四川","type":"语句填空","stem":"文化产业是当今世界经济增长的重要动力，是一个国家文化竞争力的重要基础。当前，推动文化产业发展，需要突出“融合”这个关键词。从供给侧看，________，与多个产业存在天然的耦合关系，具有与其他产业融合发展的良好基础和广阔空间。通过突破产业边界、重组产业要素而融合形成的文化产业新业态，往往具有更高的附加值、具备更强的市场竞争力。","prompt":"填入文中画横线部分最恰当的一句是：","options":{"A":"文化产业融合的节奏快、势头猛","B":"文化产业是一个渗透性、关联性很强的产业","C":"文化产业是文化、经济、技术等相互融合的产物","D":"文化产业在世界产业融合发展潮流中扮演了先锋角色"},"answer":"B","page":102},{"id":319,"chapter":8,"num":39,"source":"2024 四川","type":"接语选择","stem":"作为新型生产要素，数据已成为数字化、网络化、智能化的基础性资源，并快速融入生产、分配、流通、消费和社会服务管理等各环节。通过数据，可以更好地理解自然和社会的运行规律，推动生产力发展，优化生产关系，促进国家和社会治理。但数据并非自在之物，而是人类协作与互动的结果。数据不仅承载着个人、市场主体与国家的大量信息，关系到公民个体人格权益、市场主体财产权益以及国家安全和社会公共利益，还呈现出不同于传统知识产权的全新特点。如何既鼓励数据的充分流通利用，又通过制度设计进行科学合理的权益配置和风险防控，就成为信息时代制度创新的重大课题。","prompt":"关于数据，接下来最不可能谈的是：","options":{"A":"与传统生产要素的区别","B":"流通中涉及的权益主体","C":"流通中风险产生的原因","D":"对相关制度创新的要求"},"answer":"A","page":102},{"id":320,"chapter":8,"num":40,"source":"2022重庆选调","type":"接语选择","stem":"随着人类影响的不断增强，地球上的荒野地快速消失，为应对生态危机，荒野保护行动在全球范围内兴起，国家公园与自然保护地体系建设方兴未艾，未来自然保护地体系将向着保护地球 30%甚至 50%区域的目标扩展。随着荒野保护行动日益扩大，人们逐渐认识到荒野应当是更大生态系统的一部分，并且除了保护仅存的高价值荒野地之外，还需要进一步恢复受损生态系统的原真性和完整性，增强荒野地和保护地体系的连通性。在此背景下，再野化概念应运而生。","prompt":"这段文字接下来最可能讲的是:","options":{"A":"再野化的意义","B":"再野化的定义","C":"再野化的实现","D":"再野化的背景"},"answer":"B","page":103},{"id":321,"chapter":9,"num":1,"source":"2026陕西事业","type":"逻辑填空","stem":"科技创新能够________新产业、新模式、新动能，是发展新质生产力的核心要素。这就要求我们加快实现高水平科技创新，特别是原创性、________科技创新，加快实现高水平科技自立自强。","prompt":"依此填入画横线部分正确的一项是：","options":{"A":"缔造   前沿性","B":"衍生   突破性","C":"创造   引领性","D":"催生   颠覆性"},"answer":"D","page":104},{"id":322,"chapter":9,"num":2,"source":"2023联考","type":"逻辑填空","stem":"少数民族传统技艺是中华民族文化重要的组成部分之一，是各族人民劳动与智慧创造的结晶，更是铸牢中华民族共同体意识的重要________。然而，随着经济社会的不断发展,尤其是现代生产生活方式,给少数民族文化传承保护和发展工作带来了不少的________，许多民间技艺面临着核心内容流失严重、技艺失传，民族特色减弱，传承人才断层等________0","prompt":"填入画横线部分最恰当的一组是：","options":{"A":"标识   遗憾   风险","B":"载体   冲击   挑战","C":"路径   牵绊   缺失","D":"媒介   疑惑   困扰"},"answer":"B","page":104},{"id":323,"chapter":9,"num":3,"source":"2020事业联考","type":"逻辑填空","stem":"除了‘设计最短路线”“避开交通拥堵”之外，部分提供导航服务的企业，在安排线路时还渗人了其他________，比如他们会让用户绕行一些企业暂时缺乏数据的路线，以________收集信息。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"理念   尝试","B":"想法   上报","C":"思路   补充","D":"考量   协助"},"answer":"D","page":104},{"id":324,"chapter":9,"num":4,"source":"2021联考","type":"逻辑填空","stem":"“我思故我在”“我劳故我在”，这种存在方式带给我两书柜的劳绩，好比几根火柴捆绑在一起，多少有了一点________。这种存在方式也带给我________的生活习性。活得实在、活得真实，在我看来是整个人生的真谛。我喜欢像罗丹的《思想者》那样，没有________、没有装点，通过自己的文字，赤膊面对这个世界。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"硬度   简朴   遮掩","B":"厚度   简单   掩饰","C":"亮度   简洁   遮挡","D":"温度   简练   修饰"},"answer":"A","page":104},{"id":325,"chapter":9,"num":5,"source":"2021天津三支","type":"逻辑填空","stem":"过度娱乐化肇始于人性的解放，它与现代性的生成存在着密切的内在关联。然而由于________，它却逐步偏离了最初方向，把人性解放推向了另一个极端。","prompt":"填入画横线处最恰当的一项是:","options":{"A":"落拓不羁","B":"矫枉过正","C":"南辕北辙","D":"听之任之"},"answer":"B","page":105},{"id":326,"chapter":9,"num":6,"source":"2019联考","type":"逻辑填空","stem":"关于培养创新人才，教育部最近提出的“新工科”教育非常重要。“新工科”最新公布的指标是“十、百、万”，即“十个专业方向，百种教材，一万名教师”。这是一次创新之举，不但要带来更多知识，更要搭建一个知识拓展的________，要培养造就一批多样化、创新型的工程科技人才，为我国产业发展提供________o","prompt":"依次填入画横线部分最恰当的一组是：","options":{"A":"空间   人才队伍","B":"平台   智力支持","C":"天地   人才保障","D":"舞台   智力保障"},"answer":"B","page":105},{"id":327,"chapter":9,"num":7,"source":"2024甘肃事业","type":"逻辑填空","stem":"中国山水画作为一种独特的艺术形式。以其高度的审美价值和哲学内涵，成为中华民族宝贵的文化遗产。早在南北朝，宗炳便以《画山水序》________了山水画的理念：以后历朝历代的画家创作了大量不朽名画，这些作品至今仍是艺术创作者________的灵感来源。","prompt":"依次填入画横线部分最恰当的一项是：","options":{"A":"创造   层出不穷","B":"植根   源源不断","C":"夯实   孜孜不倦","D":"奠定   取之不尽"},"answer":"D","page":105},{"id":328,"chapter":9,"num":8,"source":"2019 联考","type":"逻辑填空","stem":"以色
